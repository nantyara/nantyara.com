- date: 2014-01-26
  title: なんちゃらアイドル結成
  description: 新宿JAM（現在は閉店）で定期開催されていたイベント「なんちゃらキカク」から誕生。創設メンバーはリーダーのはるか（黄色担当）。以後、あみーびっく・あおはる・ぬる・御茶海マミらの加入と卒業を経て（歴代メンバーは10人超）、現在のあおはる・御茶海マミの2人体制となる。
  category: milestone

