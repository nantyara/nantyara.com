# EP001「今はなき新宿JAMというライブハウスから生まれた」
# EP002「一番最初は…まずはるかが入って、あみーくんっていう男の子が入って、私(あおはる)が入って、ぬるが入って、まみが入って」
# Wikipedia: 活動期間 2014年1月26日- / 旧メンバー: はるか（創設メンバー兼リーダー、黄色担当）、あみーびっく、ぬる
- date: 2014-01-26
  title: なんちゃらアイドル結成
  description: 新宿JAM（現在は閉店）で定期開催されていたイベント「なんちゃらキカク」から誕生。創設メンバーはリーダーのはるか（黄色担当）。以後、あみーびっく・あおはる・ぬる・御茶海マミらの加入と卒業を経て（歴代メンバーは10人超）、現在のあおはる・御茶海マミの2人体制となる。
  category: milestone

# X告知アーカイブ（mining/x-archive/2016-11.json）: ゲスト告知・Ivory song 緊急発売・完売の御礼まで一次ソースあり
# yancya の初観覧日でもある（当日ツイート https://x.com/yancya/status/796965531479748608 ）
- date: 2016-11-11
  title: 初の自主企画・主催ライブ「なんちゃらフェス vol.1」
  description: ホームの新宿JAMで初めての主催イベントを開催。ゲストは純情マゼラン・ハートにポチコン・小棚木もみじ。4thシングル「Ivory song」（赤盤・青盤 各20枚限定・¥500）を会場限定で緊急発売し、当日完売した。
  category: live

# yancya の直接証言（2026-07-06 再確認）: 2016-11-11 は はるか・御茶海マミ・あおはる の3人、
# 2016-12-28 は 御茶海マミ・あおはる・せいら の3人で出演。
# yancya の12/28当日ツイート https://x.com/yancya/status/814076128268648448 「解散ingアイドル、（元）なんちゃらアイドルだー！」
# X告知アーカイブ（mining/x-archive/2016-12.json）:
#   12/13 nantyaraidol「リーダー活休前ラストライブ（=12/24）」「マミ、あお、せいらでの初ライブ！（=12/28）」
#   12/13 samami27 系告知「リーダーは12/24で来春まで一旦お休み」/ 12/27 yokuwakan_nai「（12/28は）新体制では初のライブ」
#   12/28 samami27「（元）なんちゃらアイドル、今年最後のライブ〜今年最後に、新メンバー発表でした！」
# EP002「ぬるとはるかがいなくてセイラちゃんが入ったんだ」「2016年の12月29とかだったかな」(実際は12/28)
# EP002「セイラちゃん1回しかライブやってない」→ ライブ出演1回のみは yancya 証言とも一致
- date: 2016-12-24
  title: 創設メンバー・はるかが活動休止（のち脱退）
  description: 12月24日の新宿GOLDENEGGでのクリスマスイベントを最後に、創設メンバーでリーダーのはるかが活動休止（当時の告知は「来春まで一旦お休み」だったが、メンバーとしての復帰はなかった）。12月28日の新宿JAMでの年内最後のライブは御茶海マミ・あおはる・せいらの新体制お披露目となり「新メンバー発表」が行われたが、せいらのライブ出演はこの1回のみにとどまり、以後は現在まで続く御茶海マミ・あおはるの2人体制となった。なお脱退後も年1回程度、旧メンバーのはるか・ぬるが「旧メンバーコラボ」としてライブに出演することがある。
  category: milestone

