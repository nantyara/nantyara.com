    venues.ymlには既存の`ottanta`（name: 蒲田オッタンタ）が登録されているためsiteはこちらを
    採用した（汎用プレースホルダの`okfk-otaku-fukkokyokai`ではなく具体的会場名を優先）。

    ※Xの告知アーカイブから復元。開演時刻は本文からは特定できずtime_tbd。3/8-9のレコーディング
    曲のうち1曲がここで初披露（releases.yml裏取り候補参照）。
