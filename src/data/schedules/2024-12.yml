#   12/24横浜B.B.STREET OPEN18:30/START19:00、12/26下北沢ちょ美ひげ13:00〜、12/29中野
#   名曲堂13:00〜）は time_tbd を付けていない。開演時刻の記載が本文から確認できなかった
