    チケットはこちらから！」（nantyaraidol、2024-11-01）で正式タイトル・OPEN/START時刻・料金・出演を確認した（投稿前半の「■そのいち」はトリプルコラボシングル発売告知で、本イベントとは別件のため引用を割愛した）。本12月アーカイブでも「もうすぐ森山さんの味園ユニバースライブ！オープニングアクトで夢の舞台に立てる！森山さんの好意と運営の粘りのおかげです！みんな来てね！
