#
# アーカイブ件数: mining/x-archive/2024-12.json は230件（@nantyaraidol 133 / @samami27 72 /
#   @yokuwakan_nai 25）。全230件をJST変換した上で目視確認している。期間カバレッジは
#   2024-12-01 14:07 JST 〜 2024-12-31 20:51 JST（月頭〜月末までフルカバー）。
