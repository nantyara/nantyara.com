    味園ユニバース！森山さんのお祝い、精一杯、心を込めてかますぞー！」（samami27、12/11未明）で当日告知を確認し、「なんちゃらアイドルは18:15〜！！」（samami27、12/11）でなんちゃらアイドルの出番（OA枠）が18時15分頃だったことを確認した。既存venues.ymlに登録済みの味園紅鶴（大阪ミナミ・味園ビル2F）とは同じ味園ビル内の別テナントとみられ、味園ビルでの営業は2024年12月31日で終了していることから、この公演は味園ビル閉館直前の貴重な公演だったことがうかがえる。

