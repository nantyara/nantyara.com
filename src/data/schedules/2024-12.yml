- id: event-20241211-misono-universe-moriyama51
  slug: 20241211-misono-universe-moriyama51
  date: 2024-12-11 17:30:00 +0900
  title: 大阪 味園ユニバース「森山公一 51st Anniversary LIVE『森山51』」
  site: 味園ユニバース
  acts:
    - 浅田信一
    - 浦沢直樹
    - 坂本サトル
  content: |
    大阪・味園ユニバースでの森山公一 51st Anniversary LIVE『森山51（もりやまごういち）』に、なんちゃらアイドルがオープニングアクト（O.A）として出演。2024-11アーカイブに含まれる11/1付の告知（【拡散希望なんちゃら熱烈2大ニュース】として2件のニュースをまとめた投稿の後半部分）「■そのに

    2024年12月11日

    上記先行シングルを超先行発売！
    それにあたり、超念願でもあった、大阪味園ユニバースにてお披露目ライブをやらせていただくこととなりました！

    森山公一 51st Anniversary LIVE
    『森山51（もりやまごういち）』
    2024年12月11日(水)

    OPEN/17:30　START/18:30

    味園ユニバース
    全自由・一般(Dr別・整理番号付)
    ¥5,100

    O.A　なんちゃらアイドル
    guest　浅田信一 / 浦沢直樹 / 坂本サトル　その他

    平日の大阪ですが、是非来てもらいたいです。
