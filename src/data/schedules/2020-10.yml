    - https://x.com/nantyaraidol/status/1311991776996020225
    - https://x.com/samami27/status/1312045867524743169

- id: event-20201004-1000club
  slug: 20201004-1000club
  date: 2020-10-04 12:00:00 +0900
  time_tbd: true
  title: 横浜1000 CLUBライブ（3部制・トリ出演）
  site: 横浜1000 CLUB
  content: |
    横浜1000 CLUBでのライブ。前日告知「日曜日はこれ！横浜1000CLUBというかなり大きなとこ！
    しかもトリ！」（nantyaraidol、10/3）、「写真気持ち悪いネ。是非とも来て欲しいです。デカくて
    新しくてかっこいいライブハウス！」（yokuwakan_nai）。当日「今日は横浜1000club！3部目の
    最後にでます！間に合う？！間に合うんじゃない？！？！」（samami27）、「当日すべりこみ予約も
    お待ちしとりま！」（nantyaraidol）。終演後「横浜1000clubありがとうございました！でっかくて
    広かった…！観てくれた皆さんありがとうございます！」（samami27）、「横浜1000CLUBデカくて
    かっこよかったー！」（yokuwakan_nai）で有観客開催を確認。3部制の3部目トリ出演だが、
    イベント名・開始時刻・共演者はアーカイブ中の本文に見当たらない。

    ※Xの告知アーカイブから復元。開始時刻が本文から確認できないため time_tbd とした。
