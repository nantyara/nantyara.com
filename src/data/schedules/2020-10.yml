- id: event-20201002-attic
  slug: 20201002-attic
  date: 2020-10-02 20:20:00 +0900
  title: 川崎LIVE BAR A'TTICライブ
  site: 川崎LIVE BAR A'TTIC
  content: |
    川崎LIVE BAR A'TTICでのライブ。当日告知「なんちゃらは20:20〜歌います！ぴ！」（samami27、
    10/2 19:34 JST、フライヤー画像付き）。出番の時間帯には「ちょっとだけライブ配信する！」として
    ツイキャス配信も実施され（20:29 JST〜）、曲目実況から「平穏世代のホーリーキャッツ」
    （初配信と明言）「東京星へ、行こう」の披露が読める。終演後「川崎atticありがとうございました！
    自撮り忘れたので」（samami27）で有観客開催（配信併用）を確認。イベント名・共演者は
    アーカイブ中の本文に見当たらない。

    ※Xの告知アーカイブから復元。dateは告知記載のなんちゃらアイドルの出番時刻（20:20）。
  sources:
