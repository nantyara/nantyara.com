    - https://x.com/samami27/status/1312650530037002240
    - https://x.com/samami27/status/1312745815392231425

- id: event-20201008-livefreak
  slug: 20201008-livefreak
  date: 2020-10-08 12:00:00 +0900
  time_tbd: true
  title: 虹じゃむツーマン・そにちゃん卒業ライブ（新宿LIVE FREAK）
  site: 新宿LIVE FREAK
  acts:
    - 虹色じゃむ2020
  content: |
    新宿LIVE FREAKでの虹じゃむ（虹色じゃむ2020）とのツーマンライブ。そにちゃんの卒業公演。
    前日予告「8日はこれ！スペシャルステージわりとレア！それと、12月24日のクリスマスライブ
    チケットの前売りをこの日からはじめます！」（nantyaraidol、10/7）、当日「本日のライブは
    こちら！なんちゃら運営Qたろさんの弾き語りはなかなか見れないよ！マストカム！」（samami27）、
    「マスク着用必須で コールはOKとの事です！」（yokuwakan_nai）。出番の時間帯にはツイキャス
    配信も実施（21:03 JST〜「今日は声出しアリ！」）。終演後「ライブフリークありがとうございました！
    そにちゃん卒業ということで、めいっぱいお祝いの気持ちで歌いました！」（samami27）、
    「虹じゃむとのツーマンありがとうございました！そにちゃん卒業おめでとう〜〜〜」
    （yokuwakan_nai）で開催を確認。12/24クリスマスイブワンマンの前売り人形チケットの手売りも
    この日から開始された。

    ※Xの告知アーカイブから復元。開演・出番時刻が本文から確認できないため time_tbd とした。
    actsの表記は既存データに合わせ「虹色じゃむ2020」（本文表記は「虹じゃむ」）。
