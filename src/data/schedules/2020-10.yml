  site: 札幌ふぁーすて会場
  content: |
    札幌で開催されたアイドルイベント「ふぁーすて idol scramble」の1日目。初の北海道遠征。
    予告「次のライブは札幌ふぁーすて！土日とも、1部と2部に出演致します！」（yokuwakan_nai、
    10/22）、「24、25日とここでライブ！北海道遠征の様子は @travel03026585 こちらのアカウントにて
    熱烈実況！」（nantyaraidol）。当日「本日札幌ふぁーすてよろしくお願いします！なんちゃらは
    両日1,2部にいます！」（samami27）。「ふぁーすて2部目ありがとうございました！明日も1,2部
    出演いたしますー！」（samami27）、「今日札幌ライブとオフ会でした！ありがと！明日も1部2部
    出まーす」（yokuwakan_nai）で有観客開催を確認。初日夜には物販集合のオフ会（食事会）も
    開催（「初日の土曜日の夜にみんなでご飯食べたり強いお酒を飲んだりしたい！」）。「黒い森」
    作者の佐久間学氏（北海道在住）から会場に差し入れが届いたのもこの日（「来週なくなる
    ライブハウスに、佐久間さんの歌を名残らせてきます」）。

