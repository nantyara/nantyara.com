  date: 2020-10-16 19:30:00 +0900
  title: ちょ美ひげワンマンライブ【おれたちのカレーフェス】（下北沢ちょ美ひげ・カレー付き）
  site: 下北沢ちょ美ひげ
  acts:
    - 遠藤肇（スキップカウズ）
  content: |
    下北沢ちょ美ひげでの15人限定・カレー付きワンマンライブ。9/23の告知（下北沢カレーフェス
    ど真ん中の開催で「番長手作り、その名も、「ちょ美ひげのカレー」」・スペシャルゲスト遠藤肇）
    から9/24に即日完売（2020-09アーカイブ 1308724483465723904、1309046100385464320）。10/10に
    完売御礼の再掲「【完売御礼】2020年10月16日 ちょ美ひげワンマンライブ！場所 下北沢ちょ美ひげ
    料金 3000円（カレー付）ドリンク別 Special guest 遠藤肇（スキップカウズ）19時open 19時半start
    【おれたちのカレーフェス】遠藤さんとのSpecialコラボあり！カレーは強制ですのでお腹空かせて
    きてください！」（nantyaraidol）。あおはる・マミのソロライブコーナーもあり（動画のSNS
    アップは禁止・撮影は可）。当日はツイキャスで無料配信も実施（twitcasting.tv/en_boo、
    19:30放送開始）。終演後「下北沢ちょ美ひげにて、カレー付きワンマンライブでした。センキュウ！」
    （yokuwakan_nai）、「ちょ美ひげライブありがとうございました！久しぶりに弾き語りした！」
    （samami27）で開催を確認。この日の夜、アルバムの発売1週間延期（11/4→11/11）も発表された。

