  title: 「天才と珍獣の柱」（渋谷La.mama）
  site: 渋谷La.mama
  content: |
    渋谷La.mamaで開催されたイベント「天才と珍獣の柱」。前日「明日の渋谷La.mamaのライブ、正直
    めちゃくちゃ楽しみです。観に行きたいと思ったら出てたのでラッキーなんたら20:10から」
    （yokuwakan_nai）、当日「本日のライブは渋谷のラママ！前売り2500円、当日2800円＋ドリンク代！
    久しぶりに会える人が多いぞ〜！うれしい〜！ツイキャスプレミアム配信もございます！」
    （samami27）。終演後「渋谷ラママライブありがとうございました！」（samami27）、「ラママ
    楽しかった！ありがとうございました！｢天才と珍獣の柱｣ってイベントタイトルだったので、
    ｢どっち枠で呼んでもらったんだろね｣って話してたら、間髪入れずに｢珍獣！！｣って叫ばれたのが
    面白かった。」（yokuwakan_nai）で有観客開催（プレミアム配信¥1500併用・アーカイブ2週間）を
    確認。共演者は本文に見当たらない。

