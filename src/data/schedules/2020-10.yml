  content: |
    蒲田オッタンタでのOKFK（大田区蒲田復興協会）ハロウィン回。告知「10月30日 蒲田オッタンタにて
    ハロウィンライブします！（タイテなどは添付写真参照お願いします）この日のライブ、なんちゃら
    予約のかたにはもれなく「ハロウィン仕様限定チェキ」をさしあげます。…限定15人となります」
    （nantyaraidol、10/9）。翌日には「こちらソールドアウトいたしました！…最高なハロインにする！」
    と完売。前日にも「明日は蒲田オッタンタにて大田区蒲田復興協会！フコってくる！ありがたいことに、
    完売！」「明日はマミのカツラ初公開のライブでもある。」（nantyaraidol）。当日はキャンセル2枚→
    残1枚の呼びかけも。終演後「OKFK蒲田オッタンタありがとうございました。今日はかわいい女の子が
    ゲストの回だったので最高でした！」（yokuwakan_nai）で開催を確認。ゲスト名・タイムテーブルは
    本文に見当たらない（タイテは添付画像内のため転記対象外）。

    ※Xの告知アーカイブから復元。開始時刻が本文から確認できない（タイテが画像のみ）ため
    time_tbd とした。
