- id: event-20170501-jam
  slug: 20170501-jam
  date: 2017-05-01 12:00:00 +0900
  time_tbd: true
  title: JAM FES 1日目
  site: 新宿JAM
  content: |
    「JAM FES」1日目に出演。samami27「本日、JAMフェス1日目ありがとうございました！明日はナインスパイスにて11:20から！」との投稿あり。
    なんちゃらアイドル公式は「今日は早い時間からありがとうございました。明日はもっと早い…。しかも初のライブハウス…」と投稿しており、
    翌日（5/2）が「初のライブハウス」出演だったことから、この日はライブハウスではない野外・特設ステージでの出演だった可能性がある。

