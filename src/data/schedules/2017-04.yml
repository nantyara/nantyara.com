- id: event-20170429-goldenegg
  slug: 20170429-goldenegg
  date: 2017-04-29 21:00:00 +0900
  title: なんちゃらつまみ食いの日
  site: 新宿GOLDENEGG
  content: |
    なんちゃらアイドル主催ライブ「なんちゃらつまみ食いの日」。オープン19:00、スタート19:30、なんちゃらアイドルの出演は21:00くらいから。初めての方は無料。

    なお、出演予定だったハーリー木村氏は「国家権力に身柄の自由を奪われている」ため出演が叶わなくなった旨が公式より発表されたが、ライブ自体は開催された。

    ※Xの告知アーカイブから復元。なんちゃらアイドルの出番時刻は目安（「くらいから」との告知）
