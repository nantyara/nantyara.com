- id: event-20170426-akane
  slug: 20170426-akane
  date: 2017-04-26 19:00:00 +0900
  title: なんちゃらアイドルカバーシリーズ 公開レコーディング
  site: 早稲田あかね
  content: |
    西早稲田あかねにて、ファン参加型の公開レコーディングを実施。開始19:00、チャージ¥1,000。
    なんちゃらアイドルカバーシリーズ第一弾「夜の煙突」（カーネーション）と第二弾「星くず兄弟の伝説」（近田春夫）をレコーディング。
    サビの輪唱部分に来場したファンのコーラスを収録。「夜の煙突」のアレンジはエママウス氏。
    音源は今後随時販売・配布予定とアナウンス。

    ※Xの告知アーカイブから復元
