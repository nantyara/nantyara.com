  content: |
    新高円寺LOFT Xでの対バンイベント「3年P組ネコ八先生-第10005シリーズ-」。「明日は新高円寺LOFT Xにて
    『3年P組ネコ八先生-第10005シリーズ-』に出演いたします！よろしくお願いします！夕陽に向かって走ったりしよう。
    OPEN/18:20 START/18:40
    TICKET/￥1900 (+1D)
    https://t.co/wHa7WXFOdH」（samami27、8/1）で告知（開場18:20/開演18:40・料金を確認）。「ほんじつ新高円寺LOFT Ⅹ
    ᵔᢦᵔ」（yokuwakan_nai、8/2）で当日告知。「LOFT Xネコ八先生ありがとうございました！
    MCの方が10代の頃フォローしてましたって言ってくれて、大人になったねぇという気持ちになった！
    金八先生は第6,7シーズン観てたなぁ。」（samami27、8/2）で有観客開催を確認。

    ※Xの告知アーカイブから復元。
