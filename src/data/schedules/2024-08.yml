- id: event-20240830-lovetko-firstday
  slug: 20240830-lovetko-firstday
  date: 2024-08-30 23:59:00 +0900
  title: 東新宿LOVE TKO「なんちゃらinLoveTko」初日バーイベ
  site: 東新宿LOVE TKO
  content: |
    東新宿LOVE TKOでのバーイベント「なんちゃらinLoveTko」月例企画の初日。新宿無人島の閉業を受けた新たな漂流先での企画。「新宿無人島なき今、あらたな漂流先が決まりました！
    なんと！
    みんな大好き東新宿LOVETKO!駅から徒歩1分！
    スケジュールは以下！
    値段も前より安くできそうなので、是非遊びにきてください！
    スケジュールは以下！

    8月30日（金）
    18時～23時
    御茶海マミ、あおはる

    9月26日（木）
    18時～23時
    アイドル部

    9月30日（月）
    18時～23時
    御茶海マミ

    10月28日（月）
    24時～5時
    あおはる

    11月25日（月）
    24時～5時
    御茶海マミ

    11月28日（木）
    18時～23時
    アイドル部

    12月21日（土）
    18時～23時
    なんちゃらアイドル＆アイドル部」（nantyaraidol、8/3深夜2:06投稿。移行先・今後数ヶ月分のスケジュールを確認）で先出し予告（8/30の開始時刻をこの時点では18時としている）。「今月からはじまります、
    なんちゃらアイドルのmonthlybarイベント！
    なんちゃらinLoveTko!
    初日はなんと2人揃ってお出迎え！
    これから毎月頑張ります！
    歌ったり麻雀したりもしたいね！
    8月30日23時59分から29時59分まで！
    東新宿駅から徒歩1分！
    charge1000円、drink500円
    初日かっこつけさせてください待ってます！
    特典としてオリジナルウチワを全員にプレゼント！」（nantyaraidol、8/25深夜1:38投稿）で告知（開始時刻が23時59分に変更されたことを確認・料金・オリジナルウチワの特典を確認）。「本日蒲田でライブからの東新宿でバーイベです！夜は雨が強くなるかもなので、皆様無理はなさらずに！」（yokuwakan_nai、8/30）で当日、同日の蒲田オッタンタ「OKFK」（本ドラフトの別項目）後にこちらへ移動する旨を確認。「なんちゃらはこのあと東新宿LOVE TKOにて、00:00〜04:59までバーイベやります！フードはないので、来れる人は何か食べてきてね…！」（samami27、8/30）で開始時刻00:00〜04:59（8/25告知の「23時59分から29時59分まで」と同じ時間帯）を再確認。

    ※Xの告知アーカイブから復元。8/3の先出し予告では「18時～23時」、8/25の告知では「23時59分から29時59分まで」と開始時刻に差異があるため、より近接した8/25告知の23:59を採用した。深夜帯にまたがるイベントのため、8/30 23:59開始・8/31 04:59終了と解釈した。
