  title: OKFK 大田区蒲田復興協会 〜ゴジラに焼かれた町から〜 episode 44
  site: 蒲田オッタンタ
  time_tbd: true
  content: |
    蒲田オッタンタでのライブイベント「OKFK」（44回目）。「今日はOKFK！
    最近台風多いねぇ。夏ってこんな感じだったっけ」（samami27、8/30）で当日告知。「絶対に中止にはしませんー共演者誰も来れなくてもメンバーこれなくてもそしたら運営が徒歩で行って弾き語りワンマンやります。
    我々は無理しますがみなさまは無理なくよろしくお願い申し上げます。キャンセル大丈夫です。」（nantyaraidol、8/30）で台風接近下での開催継続方針を確認。「本日蒲田でライブからの東新宿でバーイベです！夜は雨が強くなるかもなので、皆様無理はなさらずに！」（yokuwakan_nai、8/30）で当日告知（同日夜の東新宿LOVE TKOバーイベ（本ドラフトの別項目）への移動も確認）。「蒲田オッタンタ、OKFKありがとうございました！
    今日で44回目！すごいな〜
    なんちゃらはこのあと東新宿LOVE TKOにて、00:00〜04:59までバーイベやります！フードはないので、来れる人は何か食べてきてね…！」（samami27、8/30）で有観客開催・通算44回目である旨を確認。

    ※Xの告知アーカイブから復元。開演時刻は本文からは判明せずtime_tbdとした。
