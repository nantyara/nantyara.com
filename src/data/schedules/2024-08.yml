- id: event-20240803-outbreak-yasudabomber
  slug: 20240803-outbreak-yasudabomber
  date: 2024-08-03 16:30:00 +0900
  title: 四谷アウトブレイク「安田ボンバーExplosion生誕」
  site: 四谷アウトブレイク
  acts:
    - 安田ボンバーExplosion
    - PINROTA
    - ウクレレ高円寺
    - SEVENDAYS WEEKEND
  content: |
    四谷アウトブレイクでの対バンイベント。「明日は安田ボンバーをお祝いしに四谷アウトブレイクへ！！！ボンバー！！！！！
    https://hor-outbreak.com/events/20986
    ボンバーしたあとは三軒茶屋ヘブンズドアでライブします！
    https://t.co/QupYr3aAxO
    土曜日なので2現場だーー！！！」（samami27、8/3深夜2:19投稿。投稿のJST日付は8/3で「明日」は文字通りには8/4を指すが、続く同日の当日告知・お礼投稿と合わせて考えると起きてから間もない深夜投稿で日付感覚がずれていたケースと判断し8/3として採用）で告知。本文には開演時刻の記載が無かったため、告知に含まれるhor-outbreak.com/events/20986のリンク先を実際に開いて確認したところ、開場/開演16:30・料金3000円+1drink代・出演（安田ボンバーExplosion、PINROTA、ウクレレ高円寺、SEVENDAYS WEEKEND、なんちゃらアイドル）が判明した。「今日はボンバーさんお祝いするぞー！」（samami27、8/3）で当日告知。「四谷アウトブレイクありがとうございましたボンバー！
    我々は謎を追って三軒茶屋ヘブンスドアに向かいます！
    半蔵門線セミプロ」（samami27、8/3）で有観客開催・同日に三軒茶屋HEAVEN'S DOORへ移動した旨を確認。

    ※Xの告知アーカイブから復元。dateはhor-outbreak.comのイベントページに記載の開演時刻（16:30）を採用。同日に三軒茶屋HEAVEN'S DOORでのライブも予定されている旨が本文にあり、これは別イベント（本ドラフトの8/3三軒茶屋HEAVEN'S DOOR項目）として転記した。
  sources:
