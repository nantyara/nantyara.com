    ハロプロトリビュート参加曲、
    LOVEマシーンを初披露いたします！
    お楽しみに！」（nantyaraidol、8/11）で先出し予告（水着回であること・S.B.Q.アイドル部との共演・ハロプロトリビュート参加曲「LOVEマシーン」の初披露を確認）。「今日は大人の文化祭！まじ待ってるー！」（samami27、8/13）で当日告知（「大人の文化祭」という名称を確認）。「大人の文化祭ライブありがとうございました！夏の水着回でした！今日こそ自撮りを忘れないぞー！って思ってたけど、勘のいい皆さんはお気づきだろうから、最後まで言いません！たくさんのご来場ありがとうございました！！！」（samami27、8/13）で有観客開催を確認。

