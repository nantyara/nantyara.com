- id: event-20171231-heavensdoor
  slug: 20171231-heavensdoor
  date: 2017-12-31 21:55:00 +0900
  title: 年越しカウントダウンライブ（1本目・三軒茶屋HEAVEN'S DOOR）
  site: 三軒茶屋HEAVEN'S DOOR
  content: |
    大晦日恒例のはしごライブの1本目。三軒茶屋HEAVEN'S DOORにて21:55より出演。この後
    「新宿JAM 24:20〜」（日付は年明け1月1日 0:20頃）、「早稲田あかねで朝くらいまで初詣」
    （1月1日）と続く年越し3連戦の告知があったが、この2本は日付が1月1日になるため
    2017-12のこのファイルには含めていない。1月ウィンドウ（/mine-x 2018年1月分）で
    扱うべき候補として別途申し送りする。

    ※Xの告知アーカイブから復元。時刻はsamami27の告知ツイートより
