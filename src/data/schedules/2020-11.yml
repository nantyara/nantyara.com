- id: event-20201101-cyclone
  slug: 20201101-cyclone
  date: 2020-11-01 18:30:00 +0900
  title: 渋谷サイクロン「バンド1号」ライブ
  site: 渋谷サイクロン
  acts:
    - パラノイアロマンス
  content: |
    渋谷サイクロンでの「なんちゃらアイドルバンド1号」ライブ。当日告知「本日！なんちゃらバンド
    ですー！きてねきてねきてね！18:30からかましますー！」（samami27）。終演後「渋谷サイクロンで
    なんちゃらアイドルバンド1号でした！とっても楽しかったね。パラノイアロマンスさん、お披露目
    おめでとうございました！」（yokuwakan_nai）で開催を確認。パラノイアロマンスのお披露目
    （デビュー）ライブと同日開催だったことが読める。他の共演者・イベント名はアーカイブ中の
    本文に見当たらない。

    ※Xの告知アーカイブから復元。dateは告知記載の開演時刻（18:30）。
  sources:
