- id: event-20201106-barbara
  slug: 20201106-barbara
  date: 2020-11-06 20:35:00 +0900
  title: なんちゃら主催「第一回 真・なんちゃら100人組手！～レコ発前夜祭GIG～」（代々木Barbara）
  site: 代々木バーバラ
  acts:
    - 太宰ちゃん
    - 遥ちよ美
    - PoPaOr
    - 佐伯憲陽
    - H.A.M.
  content: |
    代々木Barbaraでの、なんちゃらアイドル主催「第一回 真・なんちゃら100人組手！～レコ発前夜祭
    GIG～」。告知「第一回 真・なんちゃら100人組手！～レコ発前夜祭GIG～ 2011年11月6日（金）
    代々木Barbara 19時start charge2500円 なんちゃらアイドル、太宰ちゃん、遥ちよ美、PoPaOr、
    佐伯憲陽、H.A.M. 久しぶりのバーバラ主催！希望者全員になんちゃらライター、蛇酢シールを
    プレゼント！」（nantyaraidol）。当日「今日は主催ライブやで。なんたら20:35から！」
    （yokuwakan_nai）、「新曲やります！（雑な告知）」（nantyaraidol）。終演後「バーバラライブ
    ありがとうございました！」（samami27）、「本日は代々木Barbaraありがとうございました！
