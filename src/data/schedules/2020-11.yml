- id: event-20201104-alta-hmv
  slug: 20201104-alta-hmv
  date: 2020-11-04 19:00:00 +0900
  time_tbd: true
  title: 新宿アルタHMV インストアライブ（初アルバムフラゲ日）
  site: HMV record shop 新宿アルタ
  content: |
    新宿アルタHMVでのインストアライブ。初アルバム「さよならOdyssey」のフラゲ日（先行発売日）。
    前日告知「今日はアルバムがフラゲ出来るインストアライブです！とはいえアルバムを買わなくても
    入場は可能なのでふらりといらしてね、新宿アルタHMVで19時過ぎくらいから歌います。」
    （yokuwakan_nai）。終演後「なんちゃら初アルバムフラゲ日でした！この日を7年間待っていた！！
    駆けつけてくれてありがとう！！11月11日には全国でお買い求めいただけます！待っててねー！
    やったね会で肉食べてます」（samami27）、「アルバム出たわ〜。ほんとに出たわ〜。めっちゃ嬉しい
    な。インストアイベントでフラゲしてくれた人ありがとう。」（yokuwakan_nai）で有観客開催を確認。
    全国流通盤の正式発売日は11月11日（別途11/11エントリ参照）。

    ※Xの告知アーカイブから復元。開演時刻が「19時過ぎくらいから」と幅のある表現のため
    time_tbd とした（dateは19:00とした）。
  sources:
    - https://x.com/yokuwakan_nai/status/1323855922611937285
    - https://x.com/samami27/status/1323964342086217728
    - https://x.com/yokuwakan_nai/status/1323964418691006466

