  date: 2021-04-28 12:00:00 +0900
  time_tbd: true
  title: 高円寺ウーハ ライブ
  site: 高円寺ウーハ
  content: |
    高円寺ウーハでのライブ。当日告知「本日はひっさしぶりのライブ！…音楽はもちろん、トークも
    たっぷりやります！遠方の方、そしてちょっと今は外に出づらいという方、配信もありますので
    そちらもよろしくお願いいたします！」（nantyaraidol）、「久しぶりのライブがシャン姉と
    一緒なのは、とても幸せなことだなぁ…本日のライブは高円寺ウーハにて！」（samami27）。終演後
    「高円寺ウーハはりがとね〜シャン姉さんと写真撮ってもらうの忘れちったな…アーカイブ観れるので
    是非〜」（samami27）、「シャンソン姉さんのお部屋でした。はりがとね〜」（yokuwakan_nai）で
    有観客開催（配信併用）を確認。「シャン姉」（シャンソン歌手と思われる）との共演が読めるが、
    フルネーム・所属等の典拠が本文から確認できないため acts には追加しなかった。開演時刻は
    本文に見当たらない。

