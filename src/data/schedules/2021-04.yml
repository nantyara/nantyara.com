- id: event-20210411-crocodile
  slug: 20210411-crocodile
  date: 2021-04-11 12:00:00 +0900
  time_tbd: true
  title: 原宿クロコダイル ライブ（バンド編成）
  site: 原宿クロコダイル
  content: |
    原宿クロコダイルでのバンド編成ライブ。告知「11日はこれ！バンド編成でいきます！一色さんとも、
    和久井さんともコラボありの超スペシャルなライブになります！予約はリプでもメールでも！クロコは
    最高の環境なので応援よろしくお願い申し上げます！」（nantyaraidol）。終演後「原宿クロコダイル
    ライブありがとうございました！とても緊張したけれど、お客様に褒めていただいてうれしかった…！
    本日はなんちゃらパーティースタイルでした！」（samami27）で有観客開催を確認。後日「4月11日、
    原宿クロコダイルで行われたなんちゃらアイドルバンドのライブをフルバージョン高音質でお届け
    いたします！」（nantyaraidol、4/25投稿）とも再確認できる。開演時刻・共演者（一色さん・
    和久井さんの正式名義含む）は本文に見当たらない。

    ※Xの告知アーカイブから復元。開始時刻が本文から確認できないため time_tbd とした。
  sources:
    - https://x.com/nantyaraidol/status/1380758124848500738
    - https://x.com/samami27/status/1381248683564429314
    - https://x.com/nantyaraidol/status/1386310716110430208

- id: event-20210412-lamama-lunch
  slug: 20210412-lamama-lunch
  date: 2021-04-12 11:30:00 +0900
  end: 2021-04-12 14:30:00 +0900
  title: なんちゃランチ（渋谷La.mamaカレープロデュース）
  site: 渋谷La.mama
  content: |
    渋谷La.mamaでのカレープロデュース企画「なんちゃランチ」。告知「4月12日、なんちゃらアイドル、
    渋谷ラママでカレーをプロデュースします。…こちら、11時30分～14時30分となります。ライブとかは
    ないのですが、ステージ使って遊んでいいというので写真撮ったりあと爆音でめろん畑かけたり
    プロジェクターで動画とか観たい。」（nantyaraidol）。当日「なんちゃランチ始まった」
    （yokuwakan_nai）。終演後「なんちゃランチありがとうございました！たのしおいしかった！
    夜はモナレコード！」（samami27）、「渋谷ラママランチからの下北沢モナレコードありがとう
    ございました。」（yokuwakan_nai）で開催を確認。本文に明記の通りライブ演奏は無し。

    ※Xの告知アーカイブから復元。dateは告知記載の開催時間帯（11:30〜14:30）。
  sources:
    - https://x.com/nantyaraidol/status/1377984383827783683
    - https://x.com/samami27/status/1381492207341895685
    - https://x.com/yokuwakan_nai/status/1381584953566093319

