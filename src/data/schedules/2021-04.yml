- id: event-20210418-okfk-omori
  slug: 20210418-okfk-omori
  date: 2021-04-18 12:00:00 +0900
  time_tbd: true
  title: OKFK 大田区蒲田復興協会 〜ゴジラに焼かれた町から〜 episode 30
  site: 大森スポーツセンター
  content: |
    大田区蒲田復興協会（略称OKFK）シリーズの30回記念回。通常会場ではなく大森スポーツセンターで
    拡大開催。告知「明日の大田区蒲田復興協会略してOKFKは、30回目記念でどどんとでっかく大森
    スポーツセンターで行います！！まだまだ入れますので駆け込み予約是非！！」（yokuwakan_nai）、
    当日「本日快晴！OKFK第30回！当日券ちょっとだけあります！」（samami27）。終演後「OKFK vol.30
    ありがとうございました！30回もやってるんだなぁすごいな〜」（samami27）で有観客開催を確認。
    前々日の予告「今回は婦警さんのコスプレに挑戦！あとなんか鍋でラーメンとかつくってくれる
    とのこと。」（nantyaraidol、4/13）はこの回を指すと見られるが、その実施結果を明言する投稿は
    本文アーカイブ中に見当たらない（詳細は下記「未解決の宿題」参照）。開演時刻・共演者は本文に
    見当たらない。

    ※Xの告知アーカイブから復元。開始時刻が本文から確認できないため time_tbd とした。
