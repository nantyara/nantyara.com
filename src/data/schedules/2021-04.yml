- id: event-20210425-m3
  slug: 20210425-m3
  date: 2021-04-25 11:00:00 +0900
  end: 2021-04-25 14:30:00 +0900
  time_tbd: true
  title: M3（音楽同人即売会）「なんちゃらゆくゆく飯店」ブース出展
  site: 東京流通センター
  content: |
    東京流通センターで開催された音楽同人即売会「M3」に、なんちゃらアイドルが「なんちゃら
    ゆくゆく飯店」名義でブース出展（G-24）。告知「4月25日のM3についてです！…なんちゃらの2人は
    11時くらいにはブース(G-24)に着いてる予定です！」（yokuwakan_nai）。当日「今日、イベント
    自体が14:30までに変更とのことです！」「現在の情勢を踏まえ、本日は14:30で終了だそうです！」
    （samami27、4/25発令の緊急事態宣言を踏まえた措置とみられる）。終演後「本日はM3ありがとう
    ございました！無料配布CDもたくさんもらってもらえてうれしかった！」（nantyaraidol）で
    有観客開催を確認。物販ブース出展であり、ライブ演奏の言及は本文に見当たらない。無料配布CD
    （DJ政所氏トラック制作・遠藤肇氏レコーディングのファンコットカバーシングル）を配布。

    ※Xの告知アーカイブから復元。開始は「11時くらい」との幅のある表現のため time_tbd とした。
    endは当日の緊急事態宣言を踏まえた短縮終了時刻（14:30）。
  sources:
    - https://x.com/samami27/status/1386077257173594112
    - https://x.com/samami27/status/1386156803403042817
    - https://x.com/nantyaraidol/status/1386314298708819972

- id: event-20210426-mujinto
  slug: 20210426-mujinto
  date: 2021-04-26 18:00:00 +0900
  end: 2021-04-27 23:30:00 +0900
  title: なんちゃら運営Q太郎プレゼンツ「ネバーエンディング酒相撲〜30時間カレーもあるよ〜」（BAR無人島）
  site: BAR無人島
  content: |
    BAR無人島（新宿）での、なんちゃら運営Q太郎プレゼンツによるバーイベント「ネバーエンディング
    酒相撲〜30時間カレーもあるよ〜」。告知「4月26日〜27日 なんちゃら運営Q太郎プレゼンツ
    ネバーエンディング酒相撲〜30時間カレーもあるよ〜 START 26日18時 ending（仮）27日23時半
    飲み放題1時間1000円（charge無料） 場所　新宿無人島 最終日、30時間煮込んだカレーが無料開放
    されます！」（nantyaraidol）。途中経過「40時間バーイベ、ラスト5時間！」（nantyaraidol、
    4/27）とあり実際には表記上「40時間」営業になった様子。終演後「幻の島 新宿バー無人島
    40時間営業おつかれさまでした」（yokuwakan_nai）、「40時間煮込まれたカレー。というマクガフィン
    があればこそ駆け抜けることが出来ました。…次回は5月10日、また、無人島をジャックする予定です。」
    （nantyaraidol）で有観客開催を確認。

    ※Xの告知アーカイブから復元。dateは告知記載のスタート時刻（26日18:00）、endは告知記載の
    終了予定時刻（27日23:30、「（仮）」表記）。
  sources:
    - https://x.com/nantyaraidol/status/1386175823372177415
    - https://x.com/yokuwakan_nai/status/1387060044001267719
    - https://x.com/nantyaraidol/status/1387063335405850625

- id: event-20210428-uhher
