- id: event-20210420-barbara
  slug: 20210420-barbara
  date: 2021-04-20 19:00:00 +0900
  end: 2021-04-20 19:30:00 +0900
  title: 代々木バーバラ presents.「明けない夜はないんだって誰かが言ってたけど本当かな」
  site: 代々木バーバラ
  acts:
    - HiBiNo
    - 水城イヴ
    - 石川浩司
  content: |
    代々木バーバラでの対バンライブ「明けない夜はないんだって誰かが言ってたけど本当かな」。
    当初告知「2021/04/20(火) 代々木Barbara presents.「明けない夜はないんだって誰かが言ってた
    けど本当かな」 OPEN/START 17:45/18:15 ADV/DOOR 3,000/3,500(1D別600) ACT：HiBiNo/
    なんちゃらアイドル/市瀬美和/石川浩司」（nantyaraidol、4/8）に対し、前日の再告知
    「20日はこれ！楽しんできます！ 04/20代々木Barbara presents.「明けない夜はないんだって
    誰かが言ってたけど本当かな」 OPEN/START 16:45/17:15 ADV/DOOR 3,000/3,500(1D別600) ACT：
    HiBiNo/なんちゃらアイドル/水城イヴ/石川浩司 19:00-19:30なんちゃらアイドル」
    （nantyaraidol、4/19）で出演者（市瀬美和→水城イヴ）・開場開演時刻が更新されたため、
    こちらの内容を採用した。終演後「代々木バーバラライブたくさんのご来場ありがとうございました！」
    「Barbaraありがとうございました！平日の早い時間でも、こんだけきてもらえる。」
    （nantyaraidol）で有観客開催を確認。

    ※Xの告知アーカイブから復元。dateは前日再告知記載のなんちゃらアイドルの出番時刻（19:00〜19:30）。
