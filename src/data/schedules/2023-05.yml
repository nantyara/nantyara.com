    したいと思ってる」（yokuwakan_nai）で有観客開催・スリーマン（3組出演）形式を確認。
    「M.A.M」は御茶海マミ・あおはる・松田信男氏によるなんちゃら自身の特別編成（一色さん
    体調不良によりM.A.M.Iから一時的に変更）で、自ユニット名義のためactsからは除外。
    他の対バン相手の名前は本文からは確認できなかった。

