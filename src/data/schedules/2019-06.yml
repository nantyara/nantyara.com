- id: event-20190609-meguro-rokumeikan
  slug: 20190609-meguro-rokumeikan
  date: 2019-06-09 12:00:00 +0900
  time_tbd: true
  title: 対バンライブ（目黒鹿鳴館）
  site: 目黒鹿鳴館
  content: |
    目黒鹿鳴館への初出演となる対バンイベント（6/9=「ロックの日」の語呂にかけた告知あり）。
    事前告知「アイドルぽいイベント続きます！次はなんと鹿鳴館！アンチノック、ヘブンス、
    そしてアキバカラーズから鹿鳴館！なんちゃらは節操なくがんばる！」（nantyaraidol、6/7）
    「明日は目黒鹿鳴館！鹿鳴館ってことはみんなドレスなの？文明開化なの？（よくわかってない）
    兎にも角にも待ってます。」（samami27、6/8）。終演後は「ロックの日には鹿鳴館！ってこと
    ですか？？？そうですよ！！！！聞いてくれてありがとうございました！！！！めちゃ楽しかった！」
    （yokuwakan_nai）「登竜門！というイメージの鹿鳴館！出たかったライブハウスに出れるように
    なってきて本当に嬉しい。」（samami27）と感想。開演の具体的な時刻・対バン相手の具体名の
    言及は本文には見当たらない。

