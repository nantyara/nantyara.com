  title: 対バンライブ（三軒茶屋HEAVEN'S DOOR）
  site: 三軒茶屋HEAVEN'S DOOR
  content: |
    三軒茶屋HEAVEN'S DOORでの対バンイベント（6/6出演分とは別日程。あいちゃんとの再対バン）。
    事前告知「6月19日はヘブンスドア！21時40分からすなわち！あいちゃんとまた対バンできる
    嬉しい！」（nantyaraidol、6/18）「本日、三軒茶屋ヘブンズドアにてライブです！21:40から
