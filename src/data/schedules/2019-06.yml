- id: event-20190613-vespa
  slug: 20190613-vespa
  date: 2019-06-13 19:00:00 +0900
  title: 「Beat Happening！BESPAカラオケPANIC！」（中野BESPA）
  site: 中野BESPA
  content: |
    中野BESPAで開催された、あおはる・マミによる闇バザー＆カラオケ大会企画
    「Beat Happening！BESPAカラオケPANIC！」。事前告知「あおはる、マミによる闇バザーも
    あるよ！２０１９年６月１３日（木）Music bar BESPA（中野）Beat Happening！BESPAカラオケ
    PANIC！なんちゃらアイドル 19時00分〜 ￥1,500（ドリンクはキャッシュオンです！）」
    （nantyaraidol、6/12）「今日は中野にあるベスパにて闇バザーとカラオケ大会だす！不用品は
    捨てる派なので、またも過去の物販持ってきました！チェキもあるでよー！」（samami27）。
    終演後は「カラオケ&闇バザーありがとうございました！今回はそんなに酔っ払ってないでし！」
    （samami27）と感想。通常のライブ対バンではなく、なんちゃらメンバー主導のカラオケ・フリマ
    企画である点に留意。

    ※Xの告知アーカイブから復元。フライヤー記載の開始時刻(19:00)をdateに採用。フライヤー中
