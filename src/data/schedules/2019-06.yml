- id: event-20190607-akihabara-colors
  slug: 20190607-akihabara-colors
  date: 2019-06-07 20:00:00 +0900
  title: 「星屑アイドルの伝説〜STARDUST IDOLS〜 vol.1」（秋葉原カラーズ）
  site: 秋葉原カラーズ
  acts:
    - めろん畑a go go
  content: |
    秋葉原カラーズ（こけら落とし公演）で開催された、めろん畑a go goとのツーマンイベント
    「星屑アイドルの伝説〜STARDUST IDOLS〜 vol.1」。事前告知「安い！ツーマンなので時間も
    めちゃあるので普段やってない曲もやりますけんね〜。【星屑アイドルの伝説〜STARDUST
    IDOLS〜 vol.1】日時：2019年6月7日 会場：AKIBA COLORS ADV/DOOR：1000円(+1D)
    OP/ST：19:30/20:00(終演21:30) ［出演］なんちゃらアイドル めろん畑a go go」
    （nantyaraidol、6/3）。終演後は「星屑アイドルの伝説vol.1！めろんさんとツーマン
    楽しかった…！こけら落としに呼んでいただきました！」（samami27）「秋葉原COLORSにて、
    めろん畑a go goさんとのツーマンライブありがとうございました！...そんなめろん畑a go go、
    2019年10月17日にZepp Diver City Tokyoでワンマンライブを開催するとのことです。」
    （yokuwakan_nai）と感想。

    ※Xの告知アーカイブから復元。フライヤー記載の開演時刻(20:00)をdateに採用。会場表記は
