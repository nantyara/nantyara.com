- id: event-20190602-akita-loud-affection
  slug: 20190602-akita-loud-affection
  date: 2019-06-02 15:00:00 +0900
  title: 「AKITA IDOL PARK」（秋田LOUD AFFECTION）
  site: 秋田LOUD AFFECTION
  content: |
    秋田LOUD AFFECTION（告知本文中の表記は「秋田LOUD」）で開催された対バンイベント
    「AKITA IDOL PARK」（1部15:00〜／2部17:40〜の2部制、前日の弘前SHAKEに続く東北遠征
    2本目）。事前告知「本日は秋田LOUDさんにて、AKITA IDOL PARK！1部15:00〜 2部17:40〜
    なんちゃら歌います！」（samami27、当日朝）。当日は「アキタアイドルパーク1部ありがとう！
    もうすぐ2部が始まるよん！」（yokuwakan_nai）。終演後は「秋田LOUDライブ、両部ありがとう
    ございました！東北2デイズめっちゃ楽しかったです！」（samami27）「秋田青森遠征やりきったぞー。
    2日間4回のライブありがとうございました！みんなに暖かく迎えて頂けて本当に嬉しかったです。
    また来ます！」（yokuwakan_nai）と感想。対バン相手の具体名の言及は本文には見当たらない。

    ※Xの告知アーカイブから復元。1部の開始時刻(15:00)をdateに採用。会場は2018年12月申し送りの
    「LOUD AFFECTION」（venues.yml登録済みの秋田LOUD AFFECTION／id: akita-loud-affection）
    と同一と判断し、siteはvenues.yml側の正式表記に合わせた。告知本文中の略記「秋田LOUD」を
    aliasesへの追加候補として提示（下記コメント参照）
