- id: event-20190604-antiknock
  slug: 20190604-antiknock
  date: 2019-06-04 21:45:00 +0900
  title: 「Variant Survivors Ⅹ」（新宿ANTIKNOCK）
  site: 新宿ANTIKNOCK
  acts:
    - メトロンブーツ
    - AM.STAFF.
    - KYR
    - C.I.R.C.U.S.
    - 15GERM
  content: |
    新宿ANTIKNOCKへの初出演となる対バンイベント「Variant Survivors Ⅹ」。事前告知
    「2019.6/4(火) shinjuku ANTIKNOCK presents【Variant Survivors Ⅹ】●ACT：なんちゃら
    アイドル／メトロンブーツ／AM.STAFF./KYR/C.I.R.C.U.S./15GERM ●START18:30 ●ADV￥2,000
    21:45~22:10 なんちゃらアイドル」（nantyaraidol、6/3）。当日は「今日は新宿AntiKnockにて
    ライブです！やるぞー！...なんちゃらは21:45から歌います！」（samami27）「ほんじつ！
    なんたらは21:45から歌います！初antiknock、楽しみ！」（yokuwakan_nai）。終演後は
    「新宿ANTI KNOCKありがとうございました！...対バンも最高で最高！」（samami27）
    「antiknockありがとー！！！！！！久々の方や秋田の方(マジか)にも会えて超幸せハッピーでした。
    次は6日にヘブンスにてヒゲみそのみこちゃんBIRTHDAYです！」（yokuwakan_nai）と感想。

    ※Xの告知アーカイブから復元。フライヤー記載のなんちゃらアイドルの出番時刻(21:45)を
    dateに採用
