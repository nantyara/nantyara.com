    デイで楽しかったしなんたらも落ち着いた感じのセトリでした！」（yokuwakan_nai）
    「三軒茶屋ヘブンズドアライブありがとうござました！今日はしっとり静かにやりました！1 蛇酢と
    木綿と 2 海の家 3 聖母主義 4 夜明け宛の便箋 5 ivory song 6 なんちゃらアイドル旅講座
    来てくれて観てくれてありがとうございました！」（samami27）と感想。「あいちゃん」は
    フルネーム・所属バンド名の明記が本文に見当たらないため acts には含めていない。

