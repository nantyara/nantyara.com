- id: event-20190606-heavensdoor
  slug: 20190606-heavensdoor
  date: 2019-06-06 19:40:00 +0900
  title: ヒゲと味噌汁 みこ生誕祭（三軒茶屋HEAVEN'S DOOR）
  site: 三軒茶屋HEAVEN'S DOOR
  acts:
    - ヒゲと味噌汁
  content: |
    三軒茶屋HEAVEN'S DOORで開催された、ヒゲと味噌汁のみこ氏の生誕記念ライブへのゲスト出演。
    事前告知「明日はミコさんの生誕！！ヒゲ味噌メンバーからお酒飲もうね！って言われたけど、
    お酒以外飲んでることあるの？なんちゃらは2番手の19:40〜歌います！」（samami27、6/5）
    「明日は三軒茶屋にてミコちゃんの生誕祭です！」（yokuwakan_nai）。終演後は「ミコさんお誕生日
    おめでとうございます！お誕生日なのにマシュマロくれてありがとうございます！」（samami27）
    「ヒゲと味噌汁みこちゃん誕生日おめでとうございました！人間がダメになっていく瞬間のような
    ものをたくさん目撃できました。」（yokuwakan_nai）「今日はヒゲと味噌汁、みこちゃん生誕
    ギグでした。なんちゃらからはヒゲ味噌刻印入りゴルフボール12個セットをプレゼントしました。」
    （nantyaraidol）と感想。他の対バン相手の具体名の言及は本文には見当たらない。

    ※Xの告知アーカイブから復元。なんちゃらアイドルの出番時刻(2番手・19:40)をdateに採用
