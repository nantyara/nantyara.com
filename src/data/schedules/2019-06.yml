- id: event-20190601-hirosaki-shake
  slug: 20190601-hirosaki-shake
  date: 2019-06-01 15:00:00 +0900
  title: 「青森アイドルパーク」（弘前SHAKE）
  site: 弘前SHAKE
  content: |
    弘前SHAKEで開催された対バンイベント「青森アイドルパーク」（1部15:00〜／2部18:00〜の
    2部制、なんちゃらアイドル東北遠征1本目）。事前告知「青森SHAKE、なんちゃらは1部15:00〜、
    2部18:00〜歌います！」（samami27、当日朝）。到着報告「弘前SHAKE着きましたー！広くて
    綺麗でおしゃれー！！」（yokuwakan_nai）。終演後は「青森アイドルパークありがとうございました！
    超楽しかったー！盛り上がってくれてありがとうございました！明日は秋田アイドルパーク！」
    （samami27）「アオモリアイドルパーク2部ともありがとうございました！めちゃくちゃ楽しかった！
    明日はアキタアイドルパーク！やったるでー！！！」（yokuwakan_nai）と感想。対バン相手の
    具体名の言及は本文には見当たらない。

    ※Xの告知アーカイブから復元。1部の開始時刻(15:00)をdateに採用。弘前SHAKEはvenues.yml
    未登録のため新規候補として提示（下記コメント参照）
