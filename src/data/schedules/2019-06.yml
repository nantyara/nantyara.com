- id: event-20190616-gallery-hashimoto
  slug: 20190616-gallery-hashimoto
  date: 2019-06-16 15:30:00 +0900
  title: OKFK 大田区蒲田復興協会 〜ゴジラに焼かれた町から〜 episode 13（新曲初披露）
  site: ギャラリー橋本
  labels:
    - 主催ライブ
  content: |
    ギャラリー橋本で開催された「大田区蒲田復興協会（OKFK）」episode13。この日はなんちゃら
    運営作詞、香栄のコンポーザー・源田作編曲による新曲「さくらももこが生きていたなんて！」
    を初披露。事前告知「6月16日（日）は、大田区蒲田復興協会！この日はなんと、なんちゃら
    運営作詞、香栄のコンポーザー、源田作編曲による完全新曲、「さくらももこが生きていたなんて！」
    を初披露！もう今後やるかわからんし恋！ギャラリー橋本にて！」（nantyaraidol、6/15）。
    当日は「今日のOKFKは15時開場、15時30分開演なのでご注意を！」（samami27、当日朝）。
    終演後は「OKFKありがとうございました！今日は演者がすごく多くて祭りだった。観にきて
    くれてありがとう！超緊張した。」（samami27）「大田区蒲田復興協会episode13ありがとう
    ございました！今回は出演者最多の30名、そして出演者最年少が2歳というレア会でした！」
    （yokuwakan_nai）と感想。イベント全体の対バン相手の具体名（30名分）の言及は本文には
    見当たらないため acts には含めていない。

    ※Xの告知アーカイブから復元。イベント全体の開演時刻(15:30)をdateに採用。ギャラリー橋本は
