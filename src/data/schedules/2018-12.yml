    秋田遠征支援撮影会の、予約開始いたします！あおはる、マミ、共に、個撮各3枠1万円
    18時 19時 20時 21時から23時まで、クリスマスパーティ。撮影可。シャンペイン
    飲み放題、チキン、ケーキ食べ放題。5千円。定員6人。」（nantyaraidol、12/12）
    「個撮、パーティ共に1分完売しました！ありがとうございました！」（nantyaraidol、
    12/13）「25日は、なんちゃら運営自宅クリスマスオフ会！かつてこんなにカジュアル
    に住所を晒してきた運営がいただろうか。」（nantyaraidol、12/24）。当日は
    「本日の撮影会は、スタジオじゃないぶん、下着の面積が小さいです。はんぺんみたい
    なものだ。」（nantyaraidol）。終演後は「クリスマス撮影会＆オフ会たのしかった！
    ありがとう！！」（yokuwakan_nai）「秋田遠征支援撮影会ありがとうございました！
    サンタさんありがとう…来年もいい子で生きるね。」（samami27）。

    ※Xの告知アーカイブから復元。ライブ（歌唱）イベントではなく撮影会＋オフ会だが、
    予約制・有料（個撮各1万円、パーティ5千円）の公式企画のため転記した。個撮枠の
    最初の時間帯(18時)をdateに採用。会場は運営の自宅（プライベート開催のため
    住所非公開、venues.yml新規候補としてはイベント名で代用。下記コメント参照）。
    「クリスマス&秋田遠征支援撮影会」の「&」はtitleでは全角「＆」に変換した
