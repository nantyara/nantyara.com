- id: event-20181202-rokudemonai
  slug: 20181202-rokudemonai
  date: 2018-12-02 13:10:00 +0900
  title: 「東京チンポ」東京恋慕企画昼ライブ（下北沢ろくでもない夜）
  site: 下北沢ろくでもない夜
  acts:
    - 東京恋慕
  content: |
    下北沢ろくでもない夜での東京恋慕企画昼ライブ「東京チンポ」。事前告知
    「次のライブはこちらです下北沢ろくでもない夜にて。東京チンポてあーた、あおはるの
    父親も見てるツイッターでチンポて。メチャ楽しいろくでもない昼にしましょう〜東京恋慕は
    とってもかっこいいバンドです」（yokuwakan_nai、11/30）「明日はこれです！
    オープン11:30 スタート11:50 料金1500円+1ドリンク 13:10〜 なんちゃら歌います！
    よろしこです！」（samami27、12/1）。当日は「今日はろくでもない夜で東京恋慕さん
    企画の昼ライブ！ろくでもない夜でライブやりたい〜って言ってたら、結構すぐに決まった
    ので、やー言ってみるもんだなぁと思いました。」（samami27）「最高のろくでもない昼
    だった！東京チンポって企画名、親絶対呼べないわwって言ってたのにドクちゃんのご両親
    などが来ていらしたのでニコニコしちゃった」（yokuwakan_nai、対バン相手の東京恋慕
    メンバー「ドクちゃん」への言及）。終演後は「ろくでもない夜での昼ライブありがとう
    ございました！！出たかった箱でうれしかったぁ〜来てくれてありがとうございました！
    1.さよならOdyssey 2.トラブルメーカー 3.恋のバックドロップ 4. cool dynamo, right on
    5.なんちゃらアイドル旅講座 6. ivory song」（samami27、セットリスト報告）。

    ※Xの告知アーカイブから復元。なんちゃらアイドルの出番時刻(13:10)をdateに採用
  sources:
    - https://x.com/yokuwakan_nai/status/1068533874412515328
    - https://x.com/samami27/status/1068872821848166400
    - https://x.com/samami27/status/1069118722487418880
