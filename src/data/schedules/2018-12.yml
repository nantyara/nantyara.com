- id: event-20181231-heavensdoor
  slug: 20181231-heavensdoor
  date: 2018-12-31 18:00:00 +0900
  title: 2018年ライブ納め（三軒茶屋HEAVEN'S DOOR）
  site: 三軒茶屋HEAVEN'S DOOR
  content: |
    三軒茶屋HEAVEN'S DOORでの2018年最後のライブ（ライブ納め）。事前告知「明日は
    これ！なんちゃらは18時から！」（nantyaraidol、12/30）。当日は「ほんじつは
    なんと2018年最後のライブです！今年は130本近くライブをしたらしい。なんちゃら
    アイドルは18時ちょうどくらいから！きしぱんさんいるよ！からあげ！」
    （yokuwakan_nai）。終演後は「本年129本目のライブ終わりました！たくさん
    お目にかかる機会があり、多くの方に支えられた2018年でした。ありがとうございます。
    2019年は1月4日がライブ初めです。」（samami27、年間ライブ本数129本と2019年
    初出演予告）「ヘブンスありがとございました！ライブ納め完了！これからオフ会
    (御予約完売)ですので早めの離脱です！」（yokuwakan_nai）。対バン相手の具体名の
    言及は見当たらない（「きしぱんさんいるよ」は出演者かどうか断定できないため
    actsには含めなかった）。

    ※Xの告知アーカイブから復元。なんちゃらアイドルの出番時刻(18時ちょうどくらい)を
    dateに採用。2019年1月4日両国サンライズが年始一発目のライブとして先出し予告
    されている（2019年1月ウィンドウで裏取りすること）
