  title: コスホリックU-13,14（早乙女らぶブース来訪）
  site: コスホリック
  content: |
    コスプレ即売会イベント「コスホリック」のU-13,14ブースに出展。「12月30日の
    コスホリックで発売するROMを今作っております！リアルタイムのぬくもりを
    お届けの気持ち。U-13,14におります〜！よろしくお願いします！」（samami27、
    12/29）「明々後日のコスホリック！なんとなんちゃらブースに、早乙女らぶ降臨！
    あいに恋！」（nantyaraidol、12/27。ただし「明々後日」からの単純加算では
    12/29となり実際の開催日12/30とは1日ズレるため、この投稿単体の日付計算は
    信頼せず、12/29・12/30の直接的な「本日」「12月30日の」言及を優先した）。
    当日は「コスホリックU-13.14設営完了(？)！お待ちしてまーす！」（yokuwakan_nai）
    「コスホリ開場しました！U-13,14にてお待ちしてます〜！」（samami27）。終演後は
    「コスホリありがとうございました！お久しぶりの方も、初めましての方も、いつも
    来てくれる方にも会えて楽しかったし、脳が活性化しました！」（samami27）「早乙女
    らぶちゃんROM完売！なり！」（nantyaraidol）。

