# 2020年4月（/mine-x による X 告知アーカイブからの発掘。ソース: mining/x-archive/2020-04.json）
# ドラフト（未コミット・レビュー用）。新規会場候補1件あり（末尾コメント参照）。
# 今回の転記対象は514告知のうち2件のみ。
#
# ⚠️ 2020年4月は新型コロナウイルス流行拡大・緊急事態宣言（4/7発令）の直撃を受けた月で、
#   本文中で明確に「延期」「中止」と言及された告知が非常に多い。過去月と同じ運用（中止・延期に
#   なったイベントは転記しない）に厳密に従った結果、実際に開催が確認できたのは以下の2件のみ
#   （うち1件は物販あり有観客ライブ、1件は撮影会）。
#
# 日時はすべて post の time フィールド（UTC）を JST（+9h）に変換した上で「本日/今日/明日」等の
#   指し示す日付を確定している。
#
# 転記した2件:
#   - 4/5 新宿FATE「量産型って言わないで」お披露目ワンマンライブ オープニングアクト出演:
#     開催・会場・時刻とも本文で確認（前日告知2件: samami27「明日は新宿FATEでライブ！
#     10:30オープン 11:00スタート なんちゃらはトッパー11時から！」、yokuwakan_nai「明日、
#     量産型って言わないで さんのお披露目ワンマンライブのオープニングアクトでお昼の11時から
#     歌います。」、当日事後 samami27「本日は、量産型って言わないでさんのお披露目に呼んで
#     いただきました！」でアルコール消毒等のコロナ対策言及もあり実施を確認）。緊急事態宣言
#     （4/7発令）前の開催のため実施できたと判断
#   - 4/29 なんちゃらアイドル撮影会: 4/3付「あしたなんちゃら撮影会の予約開始するでよ。
#     4月29日です！」で予約開始告知、当日 samami27「今日は日暮里じゃなく下丸子なので
#     お気をつけてください！」（通常の会場「日暮里」から急遽「下丸子」＝運営の地元エリアへ
#     変更した旨の言及。具体的な施設名は本文からは確認できず）、事後 yokuwakan_nai
#     「撮影会おつかれりんこ ありがとう」で開催を確認。会場の具体的な施設名が本文から
#     特定できないため、2018-11ドラフトの「マミ個人撮影会」の先例に倣い、siteは企画名の
#     プレースホルダで代用し time_tbd とした
#
# 転記を見送ったもの（COVID-19関連の中止・延期。日付順）:
#   - 4/8 渋谷La.mama企画ライブ: 「4月8日のラママ企画ライブ、会場の判断により中止となりました。」
#   - 4/9 新大久保アースダム「ワタルさん生誕」: 「9日アースダムワタルさん生誕延期です！」
#   - 4/10 代々木バーバラ「カレーとカメラとアイドルと」（インモラリスターR・量産系って呼ばないでと対バン予定）:
#     4/4付で会場・時刻・出演者・カレー撮影会企画まで詳細告知されていたが、4/7付
#     「4月10日、代々木バーバラでのライブ、中止とのことです。」で中止確定
#   - 4/11 ライブ（会場不明）: 「4月11日のライブは延期となりました。」
#   - 4/17 ライブ（会場不明）: 「4月17日のライブが中止になりました。」
#   - 4/19 代々木バーバラ: 「4月19日 代々木バーバラ中止です！」
#   - 4/22 阿佐ヶ谷ドラム: 「22日あさがやドラム中止です！」（前日「22日のライブ中止になりました。」とも言及）
#   - 4/25 イベント（DJユッキーとのコラボ予定・会場不明）: 「25日のイベントは中止となりました。
#     DJユッキーとコラボを予定してたのですが、残念。」
#   - 4/25 コスホリック: 「25日コスホリ中止です！」「4月25日 コスホリ 中止」
#   - 4/26 大田区蒲田復興協会（OKFK、通称オッタンタ）: 当初有観客開催予定だったが3/26発表の
#     延期を経て、最終的に4/14付「26日に、無観客配信やります。これはいわゆる、ライブハウス
#     主導ではなく、大田区蒲田復興協会としてやります。」の通り無観客配信（YouTube配信）に
#     切り替えて実施（4/26当日実施、4/28事後投稿で確認）。有観客イベントとしては開催されて
#     いないため対象外とした。2020-03ドラフト申し送りの「4/28蒲田オッタンタで新曲先行視聴会
#     予定」も、この日程変更・無観客配信化により実現しなかったとみられる（4月ウィンドウの
#     本文からは4/28に該当する新曲先行視聴会の実施は確認できなかった）
#   - 4/28 ライブ（会場不明）: 「4/10.28日中止…いよいよやばい。」（4/7付言及）
#   - 5/7 新宿ANTIKNOCK: 「５月７日、アンチノック、延期です。」（5月ウィンドウで要再確認）
#
# 転記を見送ったもの（証拠不足・実体不明）:
#   - 4/14「今日のライブの後の物販中に...」（nantyaraidol）: 「今日のライブ」への言及があるが、
#     同ウィンドウ内に4/14の有観客ライブ開催を裏付ける他の告知・事後報告が一切見当たらず、
#     緊急事態宣言下（4/7発令後）で他の全予定が軒並み中止・延期されている状況とも矛盾する。
#     過去の出来事を回想した投稿である可能性が高いと判断し、日付・会場とも確定できないため
#     転記対象外とした
#   - 4/20-21 なんちゃらキャス（TwitCasting配信）、4/26以降の毎週配信企画: いずれも
#     ライブハウス等の実会場を伴わない配信イベントのため、schedules（実会場イベント）の
#     対象外とした
#
# releases.yml裏取り候補（編集は今回しない）:
#   - **「さよならOdyssey 2020」リミックス公開**: 4/20「スキップカウズ遠藤肇さんが、
#     なんちゃらのアンセム、「さよならオデッセイ」のリミックスを作ってくれました！ので、公開！」
#     （nantyaraidol/status/1252271449664012288）。2020-03ドラフトで発見した3/16の再録音
#     （nantyaraidol/status/1239232266556944385）の続報・完成版。ライブでの使用は「夏に！」と
#     予告のみで4月中の実演は無し
#   - **新曲「Baby a go go」「parallel line」サンプル公開**: 4/9「なんの予告もなく新曲の
#     サンプルを2曲だすね！どちらもスキップカウズ遠藤さんによる名曲！」
#     （nantyaraidol/status/1248206068381704192、SoundCloudサンプルリンクあり）。
#     2020-03ドラフト申し送りの「4/28蒲田オッタンタで先行視聴会予定」は上記の通りOKFKの
#     無観客配信化により実現せず、代わりにSoundCloudでのサンプル先行公開という形になった
#   - **「parallel line」なりすレコード・コンピレーション収録**: 4/13「なりすレコードからの
#     コンピに参加。なんちゃらからは、「parallel line」という可愛らしい完全新曲を提供させて
#     いただきました。」（nantyaraidol/status/1249642070898671616）。実店舗（試聴室）支援企画の
#     コンピレーションCDへの新曲提供
#   - 参考: 4/14「有頂天のカバー（新トラック！未発表バージョン！）」（「君はGANなのだ」、
#     スキップカウズ遠藤さんアレンジ）も無料公開されているが、既発カバー曲の新録音源で
#     あり新曲ではないため releases.yml 候補としては優先度低いと判断（一応記録のみ）
#
# venues.yml新規候補（編集は今回しない。下記1件）:
#   - 新宿FATE（東京都新宿区歌舞伎町2-28-16 ウィザードセブンB1F、2018年2月オープン、
#     キャパ150名。WebSearchで一次情報を確認: https://evecoco.net/livehouse/tokyo/shinjuku/shinjukufate/ 、
#     https://www.tokyo-club.net/fate/ ）
#
# history.ymlへの追記は今回はしない（判断のみ）:
#   - 4/25「もう6年目だしアイドルって感じでもないかな」（nantyaraidol）: 2020年4月時点で
#     活動6年目という自己言及があり、既存の「結成2014年頃」推定（2018-03ドラフト等より）と
#     整合する傍証。新規マイルストームではないため追記は見送り

- id: event-20200405-fate
  slug: 20200405-fate
  date: 2020-04-05 11:00:00 +0900
  title: 「量産型って言わないで」お披露目ワンマンライブ オープニングアクト出演
  site: 新宿FATE
  acts:
    - 量産型って言わないで
  content: |
    新宿FATEでの「量産型って言わないで」お披露目ワンマンライブに、なんちゃらアイドルが
    オープニングアクトとして出演。「明日は新宿FATEでライブ！10:30オープン 11:00スタート
    なんちゃらはトッパー11時から！よろぴです！」（samami27、前日）、「明日、量産型って
    言わないで さんのお披露目ワンマンライブのオープニングアクトでお昼の11時から歌います。
    その後のオフ会には参加しません〜何卒〜」（yokuwakan_nai、前日）。当日「本日は、量産型
    って言わないでさんのお披露目に呼んでいただきました！やっぱりお披露目っていいね…！
    門出を祝えてうれしかったです！来てくれたみんな、アルコール消毒ご協力いただきありがとう
    ございました…！手洗いうがいもしっかりに〜！」（samami27、事後）と新型コロナ対策への
    言及付きで開催を確認。緊急事態宣言（4/7発令）前の開催。

    ※Xの告知アーカイブから復元。
  sources:
    - https://x.com/samami27/status/1246428437633306625
    - https://x.com/yokuwakan_nai/status/1246425140528689152
    - https://x.com/samami27/status/1246673546912260097

