- id: event-20221112-mujinto-aoharu-bar
  slug: 20221112-mujinto-aoharu-bar
  date: 2022-11-12 00:00:00 +0900
  title: 新宿BAR無人島 あおはるバーイベ
  site: BAR無人島
  labels:
    - あおはるソロ
  content: |
    新宿BAR無人島でのあおはるバーイベント。「今週金曜日、24時からは、二か月ぶりになります
    なんちゃらアイドル「あおはる」のバーイベが無人島であります。飲み放題何時間いても3900円
    です。」（nantyaraidol、11/9告知）「11月11日、深夜。新宿無人島にてあおはるがバーイベ
    します！なんと、手作りフォーをふるまうそうです。あと、ポッキーの日なのでなんか細長い
    お菓子とかを用意いたします。何時間しても朝まで飲み放題3900円（charge込）となります。」
    （nantyaraidol、11/10告知）でフルスペック告知。本ウィンドウ内に明示的な事後
    「ありがとうございました」投稿は見当たらないが、日時・料金・内容まで詳細な事前告知が
    2件揃っており中止を示す投稿も見当たらないため有観客開催と判断。一人称の記述・あおはる
    単独のバー担当のためlabelsにあおはるソロを付与。

    ※Xの告知アーカイブから復元。「24時から」との記述から日付をまたぐ開催と判断し、既存の
    「24:00起点を翌日0:00とみなすルール」に準じてdateは2022-11-12 00:00とした。
