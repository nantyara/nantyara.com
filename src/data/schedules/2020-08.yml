- id: event-20200811-club-citta
  slug: 20200811-club-citta
  date: 2020-08-11 19:55:00 +0900
  title: 「UPSTART GIRLS FES」（CLUB CITTA'川崎）
  site: CLUB CITTA'川崎
  acts:
