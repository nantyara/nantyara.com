- id: event-20200822-mandala2
  slug: 20200822-mandala2
  date: 2020-08-22 19:00:00 +0900
  title: 「UNDERGROUND HEADLINERS Vol.3」（吉祥寺MANDA-LA2）
  site: 吉祥寺MANDA-LA2
  acts:
    - ISSIKI AT ALL
  content: |
    ISSIKI AT ALL（一色進/大田譲/澄田健/小関純匡）となんちゃらアイドルバンド1号のツーマン
    ライブ。告知「UNDERGROUND HEADLINERS Vol.3 8月22日@吉祥寺マンダラ2 ISSIKI AT ALL
    (一色進/大田譲/澄田健/小関純匡) なんちゃらアイドルバンド1号 開場18時30分 開演19時00分
    前売/当日とも4000円+ドリンク代(30名限定) この日はなんちゃらアイドルニューシングルの
    発売日となります！」（nantyaraidol、8/1）。この日発売のニューシングル＝佐久間学との
    コラボ作「黒い森」は「来てくれたかた全員に、この日発売するなんちゃらのニューシングルを
    プレゼントすることに今、決めました。もちろんなんちゃら目当てでなく来た人含め全員に」
    （nantyaraidol、8/6）と来場者全員に無料配布された。8/2には「佐久間学さんに作って
    もらったシングルの発売日に澄田健さんと対バン！わかるひとにはわかるだろうこの運命、
    巡り合わせよ！」とも。前日「明日、8/22(土)は吉祥寺マンダラ２でライブ！…無料でCD
    配ります！」（samami27）。終演後「なんちゃらアイドルバンドでライブでした！ISSIKI AT AL
    さんとのツーマンということでとても緊張しましたが、楽しく演奏出来ました」
    （yokuwakan_nai）、「吉祥寺MANDA-LA2ライブありがとうございました！なんちゃらバンド1号
    2周年迎えてました」（samami27）で開催を確認。アーカイブ配信チケット（TIGET・2,000円）も
    販売された。

    ※Xの告知アーカイブから復元。dateは告知記載の開演時刻（19:00）。ISSIKI AT ALLは一色進
