  title: 「Beat Happening！SUMMER DROPS！」（渋谷CHELSEA HOTEL）
  site: 渋谷チェルシーホテル
  content: |
    渋谷CHELSEA HOTELで開催されたビーハプ（Beat Happening！）シリーズのライブ。当日告知
    「８月６日（木）CHELSEA HOTEL Beat Happening！SUMMER DROPS！ １９：００ OPEN
    なんちゃらは２０：２５〜！！渋谷チェルシーホテルの出演は久しぶりだ〜！！」（samami27）。
    前日には「0806はこれ！」（nantyaraidol、フライヤー画像付き）。終演後「チェルシーホテル
    ライブありがとうございました！」（samami27）で開催を確認。共演者・料金は本文に
    見当たらない。

    ※Xの告知アーカイブから復元。dateは告知記載のなんちゃらアイドルの出番時刻（20:25）。
