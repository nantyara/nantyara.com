    - https://x.com/samami27/status/1291384279595798528

- id: event-20200808-mujinto-sbq
  slug: 20200808-mujinto-sbq
  date: 2020-08-08 00:00:00 +0900
  end: 2020-08-08 04:30:00 +0900
  title: 「BAR S.B.Q」第1回（ゲストバーテンダー：御茶海マミ）
  site: BAR無人島
  labels:
    - マミソロ
  content: |
    なんちゃらアイドル運営・Q太郎が週替わり店長を務める毎週金曜深夜のバーイベント
    「BAR S.B.Q」の第1回（8/7金曜深夜）。告知「BAR S.B.Q 新宿無人島 毎週金曜日24時～
    4時30分 charge1000円 食べ飲み吸い（シーシャ）放題 男性2900円 女性900円（！）…
    第一回、8月7日のゲストバーテンダーは、なんちゃらアイドル御茶海マミさんです」
    （nantyaraidol、8/3）。当日「本日の無人島BAR S.B.Qのお手伝いは、なんちゃらの小さいほう
    御茶海マミです！新宿で終電を逃し、行くあてのない子羊ちゃんになっちゃった方…マストカム
    です！そんな時間にやります」（samami27）、「本日からです！…本日の食べ放題は、ペヤング！
    （専用機で「焼き」ます）本日の吸い放題は「アイランドパパイヤ」！本日のゲストバーテンダーは
    「御茶海マミ」！よろしくお願いいたします。0時から～」（nantyaraidol）。明示的な事後報告は
    本文に見当たらないが、翌朝の「徹夜明けの新宿で聴く橘いずみは最高だなー！」（nantyaraidol、
    8/8 6:10）は朝までの営業と整合する。

    ※Xの告知アーカイブから復元。dateは告知の「8月7日（金）24時〜4時30分」をJSTの実日時
    （8/8 0:00〜4:30）に置いたもの。
  sources:
    - https://x.com/nantyaraidol/status/1290155225345482753
    - https://x.com/samami27/status/1291550335140470784
    - https://x.com/nantyaraidol/status/1291715253407895552

