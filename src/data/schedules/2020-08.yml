    おもしろいライブになると思うので遊びにきてください！時間も長くて10曲以上やります」
    （nantyaraidol）。当日「なんちゃらバスがいく。」（nantyaraidol）。終了後「ライブバス
    ありがとうございました！めっちゃくちゃ楽しかった〜！なんちゃらアイドル気になって
    もらえますように！」（samami27）、「バス乗って渋谷中を走りながら歌ってきた！渋谷ギャルが
    手を振ってくれて楽しかったです！」（yokuwakan_nai）で開催を確認。

