  title: 「大田区蒲田復興協会 in ゆ〜シティー」（OKFK）
  site: 蒲田ゆ〜シティー
  content: |
    蒲田・ゆ〜シティーの「お風呂の宴会場」で開催されたOKFK（大田区蒲田復興協会）。前日告知
    「明日はOKFK！蒲田のゆ〜シティーというお風呂の宴会場で歌います！お風呂入るもご飯
    食べるもビール飲むもぜーんぶ自由！心地良さの全てがあります！まだまだ人数入れますので
    是非！是非！お願い致します！」（yokuwakan_nai）、「ゆ〜シティーご予約お待ちして
    おります！」（nantyaraidol、原文ママ「ご予約お待ちしとります！」）。当日「ゆったり
    しちゃったりして〜！大田区蒲田復興協会スタートしてます！」（samami27、19:46）。終演後
    「ゆ〜シティーライブありがとうございました！アフィックス株式会社様からフェイスシールドを
    ご提供いただきました！」（samami27）、「大田区蒲田復興協会inゆ〜シティーありがとう
    ございました！アフィックス株式会社さまから限定フェイスガードを頂きました！食べて飲んで
    歌ってたのしかったー！」（yokuwakan_nai）で開催を確認。共演者・料金は本文に見当たらない。

    ※Xの告知アーカイブから復元。開始時刻の告知が本文に見当たらないため time_tbd とした
