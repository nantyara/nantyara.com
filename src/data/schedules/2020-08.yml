    千葉・新検見川のすたじおかとり〜ぬで開催されたリレーライブ。前日告知「8月8日 スタジオ
    かとりーぬPresents アルバム“KATORIDOG”参加者リレーライブ 隔月なんちゃライブ vol.2
    17:40 OPEN 19:30～20:10 なんちゃらアイドル Charge adv￥1,500(+order must)
    door ￥2,000 (+order must) 会場 すたじおかとり～ぬ 安くて楽しいライブを是非！」
    （nantyaraidol、8/7）。当日「ミーンミンミンミン 今日新検見川」（yokuwakan_nai）。
    終演後「すたじおかとり〜ぬライブありがとうございました！子供いて心が洗われた」
    （samami27）、「今日もありがとう！天ぷら職人の天ぷらをみんなに見せてあげる」
    （yokuwakan_nai）で開催を確認。リレーライブの他の参加者は本文に見当たらない。

