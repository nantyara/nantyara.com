    - ゆれかの～揺れるカノン～
  content: |
    川崎CLUB CITTA'で開催された「UPSTART GIRLS FES」に出演。告知「なんちゃらがチッタなんて
    最初で最後だと思うので観にきてクレヨン！「UPSTART GIRLS FES」2020年8月11日（火)
    CLUB CITTA'川崎 前売3500円/当日4000円（D別）OPEN15:00/START15:30 出演 チーム赤坂、
    日日是好日、なんちゃらアイドル、他」（nantyaraidol、8/10）。当日「本日川崎クラブチッタ
    です。チッタだってよ！嬉しい！」（yokuwakan_nai）、「このあとCITTA！19:55〜 バカほど
    キンチョーする！」（samami27）。終演後「チッタありがとうございました。どんなライブハウス
    でもありがたいが、チッタだもんそりゃチッタよ」（nantyaraidol）、「チッタに出ちった！
    緊張したけどやっぱり、広くて、楽しかったです」（yokuwakan_nai）、「川崎CLUB CITTA
    ありがとうございました！ハイパー緊張したけど、楽しくライブできました！」（samami27）で
    開催を確認。翌日には「チッタまた出たい。コロナじゃない時に、もっとたくさんのお客さんを
    呼べるようになった時に。今日きてくれたみんなの名前を忘れません」（nantyaraidol）とも。
    チケットページ（LivePocket・現存）には出演者としてチーム赤坂、日日是好日、ほーむたいがー、
    なんちゃらアイドル、1682、pretty☆monster、POP CANDY、ゆれかの～揺れるカノン～、
    and more!! が記載され、感染症対策（前売購入者のみ入場可・座席あり・マスク着用必須・
    サーモカメラ検温・ドリンク代600円別）を講じての開催だった。

