- id: event-20200829-livebus
  slug: 20200829-livebus
  date: 2020-08-29 12:00:00 +0900
  time_tbd: true
  title: ライブバス（渋谷周遊・先着10名）
  site: ライブバス（渋谷周遊）
  content: |
    バスに乗って渋谷中を走りながら歌うライブイベント。7/17の予告「緊急こくち！8月29日に、
    こんな面白げなイベントをやります！先着10名なので是非！たまにはコスプレします！限定
    グッズもプレゼントします！予約はDMにて！」（nantyaraidol。詳細はフライヤー画像とみられ
