- id: event-20200801-lamama
  slug: 20200801-lamama
  date: 2020-08-01 18:00:00 +0900
  title: 「DADAフェス Vol27～ライブを止めるな！」（渋谷La.mama）
  site: 渋谷La.mama
  content: |
    渋谷La.mamaで開催された「DADAフェス Vol27～ライブを止めるな！」に、なんちゃらバンド2号
    （バンド編成）で出演。前日告知「明日、8月1日は渋谷ラママライブ！ DADAフェス Vol27～
    ライブを止めるな！ 配信:1900円+手数料 来場チケット 1or2部2000円[+Ｄ] 通し3500円[+2Ｄ]
    【予約方法】yamadada.yu@gmail.com にメール予約」（samami27、7/31）。当日「今日は渋谷で
    18時 だだへす、ラママです。バンド2号でまいります」（yokuwakan_nai）。終演後「ラママ
    ライブありがとうございました！最高にカッコつけたけど、カッコついてたかな…！ライブ観て
    くれてありがとうございました！」（samami27）で有観客開催（来場チケットあり・配信併用）を
    確認。他の出演者は本文に見当たらない。7月末のリリース告知では、新曲「Baby a go!go!」を
    「8月1日のライブでバンドversionで演奏する予定」とされていた。

    ※Xの告知アーカイブから復元。dateは当日告知の「18時」に基づく（開演か出番かは本文から
    判別できない）。
  sources:
    - https://x.com/samami27/status/1289205670852489219
    - https://x.com/yokuwakan_nai/status/1289432803738697729
    - https://x.com/samami27/status/1289559173504491520

- id: event-20200806-chelsea-hotel
