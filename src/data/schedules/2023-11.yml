  content: |
    渋谷La.mamaでの「なんちゃらアイドル主催 大人の文化祭～大人のEROS祭！～」。
    「2023年11月27日（月）
    in渋谷ラママ
    なんちゃらアイドル主催
    大人の文化祭～大人のEROS祭！～
    18時半open　19時start
    2500円（1drink別）
    なんちゃらアイドル、S.B.Q.アイドル部、NEKO、元祖☆令嬢倶楽部、インモラリスターR、
    ０７２

    緊急開催！今回はEros特化！なんちゃらも新衣装公開いたします！

    あえて今回配信はしません！みんな好きに踊れ！」（nantyaraidol、11/2）でフルスペック
    告知（open/start時刻・料金・出演者）。七日間戦争終了直後「七日間戦争は無事に終戦を
    迎えましたが、明日もなんちゃらアイドル主催ライブがあります。配信は無いです。
    配信なんかできるかよ。」（yokuwakan_nai、11/27）「新曲ハツヒローします。」
    「御茶海出ますよろしく😀」（いずれもnantyaraidol、11/27）で当日開催・新曲初披露・
    御茶海マミ出演を予告。当日「今日新曲やる！」（samami27）で当日告知。venues.ymlには
    既存の`lamama`（name: 渋谷La.mama）が登録されているためsiteは正式名称を採用。

