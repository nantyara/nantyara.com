- id: event-20191016-rokudemonaiyoru
  slug: 20191016-rokudemonaiyoru
  date: 2019-10-16 12:00:00 +0900
  time_tbd: true
  title: 「カレーフェス」（下北沢ろくでもない夜）
  site: 下北沢ろくでもない夜
  content: |
    下北沢ろくでもない夜で開催された「カレーフェス」。なんちゃらアイドルはフード（カレー）
    出店で参加。事前告知「明日はろくでもない夜にてカレーを売ります！カレーフェス！」
    （nantyaraidol、10/15）「明日は下北沢ろくでもない夜でカレー作ります！」（samami27）
    「明日は下北沢ろくでもない夜でカレーを作ります！学生は1200円で入れるとのことなので、
    おじさん達は急いで入学して下さい！」（yokuwakan_nai）。当日は「フードでの参加！」
    （samami27）「ライブを見ないでカレー食べに来るだけだったらチケット代かからないそうなので
    よかったらふらりと遊びに来てください！カレーは500円！」（yokuwakan_nai）「ライブフロアに
    入らない場合（カレーのみ食べていく）は入場料フリーです！」（samami27）。終演後は「完売
    しました！...初めてのフード参加でしたが楽しかったです！」（samami27）「カレーもタンドリー
    チキンも完全に売り切れました！！！」（yokuwakan_nai）と感想。ライブ出演の有無・開演時刻の
    具体的な記載は本文には見当たらない（フード出店中心のイベントだった可能性がある）。

    ※Xの告知アーカイブから復元。開演の具体的な時刻の言及が本文に見当たらないため time_tbd
