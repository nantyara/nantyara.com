- id: event-20191014-musicshedyes
  slug: 20191014-musicshedyes
  date: 2019-10-14 12:00:00 +0900
  time_tbd: true
  title: 変態女子会（山村茜さん生誕・東中野music shed YES）
  site: 東中野music shed YES
  content: |
    東中野music shed YESで開催された、山村茜さんの生誕を祝う「変態女子会」（昼公演）。事前告知
    「OKFKありがとうございました！台風一過の晴天の下、素敵な会場でかわいい子供達と共に
    ライブできて大変気持ちが良かったです！！ さて明日、昼は東中野music shed yes!で変態女子会
    (山村茜さん生誕)、夜は三軒茶屋ヘブンスドアで酒クズ女子会(ワイン300円きしぱんさんもいるよ)
    でーす、治安」（yokuwakan_nai、10/13夜）「今日はガクンと寒くなりましたが、なんちゃらさんは
    めっぽうアツいライブをするそうですヨ！昼間は山村茜を祝い尽くす！」（samami27、10/14）。
    同日「先程ミュージックシードイエスが受取額を間違えたかのようなツイートをしましたが、
    調査の結果、お客様の勘違いだったそうです」（nantyaraidol）という物販関連のトラブル対応の
    ポストがあり、この日に東中野music shed YESでのイベントが実際に開催されたことを裏付ける。
    開演の具体的な時刻・対バン相手の具体名・終演後の感想ポストは本文には見当たらない。

