- id: event-20191013-ottanta
  slug: 20191013-ottanta
  date: 2019-10-13 12:00:00 +0900
  time_tbd: true
  title: OKFK 大田区蒲田復興協会 〜ゴジラに焼かれた町から〜
  site: 蒲田オッタンタ
  labels:
    - 主催ライブ
  content: |
    「大田区蒲田復興協会（OKFK）」の定例企画。台風19号接近のため一時開催が危ぶまれたが、事前
    告知「本日の大田区蒲田復興協会、予定通り開催します！」（yokuwakan_nai、10/13）「本日開催
    します 本日の『大田区蒲田復興協会』、予定通り開催致します 昨日までにキャンセルのご連絡も
    多く頂き、お席の方はかなり余裕がある状態です 当日券もご用意がございますので、台風明けの
    連休中日、是非遊びに来て下さいね」（nantyaraidol）で開催が確定した。当日は「今日の会場は
    飲み物持ち込み自由でーす！」（yokuwakan_nai）。終演後は「本日、OKFK！嵐が去った蒲田にて！
    南製作所、ちゃんと工場でわくわくしちゃった！来てくれた人、回してくれた人ありがとうござい
    ました！」（samami27）「OKFKありがとうございました！台風一過の晴天の下、素敵な会場で
    かわいい子供達と共にライブできて大変気持ちが良かったです！！」（yokuwakan_nai）と感想。
    「南製作所」の言及は工場見学的な要素を指すと見られるが、会場自体の変更を意味するのか
    本文だけでは断定できない。開演の具体的な時刻の言及は本文には見当たらない。運営主催の
    定例企画のためlabelsに「主催ライブ」を付した（過去月のOKFK関連イベントと同様の扱い）。

    ※Xの告知アーカイブから復元。開演の具体的な時刻の言及が本文に見当たらないため time_tbd
    とした
