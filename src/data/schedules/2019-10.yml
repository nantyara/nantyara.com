- id: event-20191022-ottanta
  slug: 20191022-ottanta
  date: 2019-10-22 12:00:00 +0900
  time_tbd: true
  title: ハロウィンDJイベント（蒲田オッタンタ）
  site: 蒲田オッタンタ
  content: |
    蒲田オッタンタで開催された、なんちゃらアイドル出演のハロウィンDJイベント。スペシャル
    ゲストに姫乃たまBNF・スカラベ氏。事前告知「10月22日はワンコイン（1ドリンク別）でなんちゃら
    と遊べる！なんちゃらは撮影自由！ハロウィンな装い！今回のスペシャルゲストは、姫乃たまBNF、
    スカラベさんを究極召喚！誰もが必ず姫乃たまを好きになってしまう魔法の30分を準備！」
    （nantyaraidol、10/21）。これは2019-09ドラフトで裏取り済みの「10月22日、なんちゃらアイドル
    がDJをやるイベント...スペシャルゲストに、すからべさんが決定」（9/13予告）に対応するイベント
    である。当日は「オッタンタでなんちゃらはハロウィンDJやるので恋」（nantyaraidol）
    「20時半から拳聖すからべさんのDJをフル配信します！」「姫乃たまBNFによる姫乃たまのみ30分」
    （いずれもnantyaraidol）。「20時半」はすからべ氏のDJ配信開始時刻であり、なんちゃらアイドル
    自身のDJ枠の開始時刻ではないため date には採用しなかった。終演後の感想ポストは本文には
    見当たらない。

    ※Xの告知アーカイブから復元。なんちゃらアイドル自身のDJ枠の開始時刻の言及が本文に見当たら
    ないため time_tbd とした
