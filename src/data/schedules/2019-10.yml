- id: event-20191018-chomihige
  slug: 20191018-chomihige
  date: 2019-10-18 12:00:00 +0900
  time_tbd: true
  title: なんちゃらアイドル主催 8thシングル「チョコ麦畑で捕まえて！」レコ発ワンマン withちょこ太郎（下北沢ちょ美ひげ）
  site: 下北沢ちょ美ひげ
  labels:
    - 主催ライブ
  content: |
    下北沢ちょ美ひげで開催された、なんちゃらアイドル主催の8thシングル「チョコ麦畑で捕まえて！」
    （ちょこ太郎とのコラボシングル）レコ発ワンマンライブ。ゲストにスキップカウズの遠藤肇氏。
    事前告知「10月18日は、下北沢ちょ美ひげでなんちゃらアイドルとちょこ太郎のコラボシングル、
    『ちょこ麦ばたけで捕まえて！』の、レコ発ワンマンライブ！ゲストにスキップカウズの遠藤肇
    さんも！弾き語りはもちろん、なんちゃらとのアコースティックコラボもあり！」（nantyaraidol、
    10/2）「2019年10月18日 なんちゃらアイドル主催 8thシングル、『チョコ麦畑で捕まえて！』
    レコ発ライブ！withちょこ太郎！場所は下北沢ちょ美ひげ！チケットなんと2000円！特典も
    もりだくさんです！」（nantyaraidol、10/16）。当日は「本日はあおマミどちらも未公開ソロ曲
    やります！お楽しみに！」（nantyaraidol）「今日はちょ美ひげでちょこ太郎と遊びます。」
    （yokuwakan_nai）「本日は下北沢ちょ美ひげにてライブ！弾き語っちゃうぞ〜！！」（samami27）。
    終演後は「下北沢ちょ美ひげライブありがとうございました！」（samami27）「ちょ美ひげで
    ちょこ太郎とたくさん遊びました！」（yokuwakan_nai）と感想。カバーセットリスト（Q太郎:
    それが僕はとても不思議だった／カスタネッツ、明日の行方／Smile、あおはる: 蛇酢と木綿と／
    セルフカバー、トカレフ／加持等、マミ: 空も飛べるはず／SPITZ、ピンクサロンで働くあの娘の
    話／チクシヒロキ）が公開されているが、これはカバー曲の演奏楽曲一覧であり開演時刻の記載
    ではない。「チョコ麦畑で捕まえて！」の表記は「ちょこ麦ばたけで捕まえて！」（10/2）とも
    揺れている。開演の具体的な時刻の言及は本文には見当たらない。

    ※Xの告知アーカイブから復元。開演の具体的な時刻の言及が本文に見当たらないため time_tbd
    とした。「なんちゃらアイドル主催」の明記がありlabelsに「主催ライブ」を付した。8thシングル
    「チョコ麦畑で捕まえて！」はreleases.yml裏取り候補（末尾コメント参照）
