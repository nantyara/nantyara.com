- id: event-20191027-asukayamapark
  slug: 20191027-asukayamapark
  date: 2019-10-27 14:40:00 +0900
  title: 「オレノオゴリ」無銭ライブ（王子飛鳥山公園）
  site: 王子飛鳥山公園
  content: |
    北区・王子飛鳥山公園の野外特設舞台で開催された、入場無料（無銭）の野外ライブ「オレノ
    オゴリ」。事前告知「明日は飛鳥山公園での無銭ライブ！サインとかできるしミッキーとかも
    きたらいい。15時くらいから30分くらいやりますよ！飲みましょう！」（nantyaraidol、10/26）
    「明日は王子、飛鳥山公園で野外無銭ライブでーす！雨大丈夫そうだね！多分なんか行政とかの
    事情で物販等はありませんが悪しからずご了承ください！なんちゃらは15時過ぎくらいからー！」
    （yokuwakan_nai、10/26）。当日は「本日オレノオゴリ！！飛鳥山公園で歌います！」
    （samami27）「本日、夕方から天気が崩れるかもとの事で、転換を5分に短縮することになりました
    ！それによって、なんちゃらアイドルの出演時間が25分ほど前倒しになります！」
    （yokuwakan_nai）「天気の影響で、転換10分から5分に変更になります！なんちゃらは14:40
    くらいから！」（samami27）と、天候悪化により出番が前倒しされた。終演後は「オレノオゴリ、
    飛鳥山公園ありがとうございました！観に来てくれた人が多くてうれしかった…！」（samami27）
    と感想。なお、当タスクの事前情報では「10/26-27の2日間」開催との報告があったが、本文を
    突合した限りでは10/27単日の開催のみ確認でき、10/26は別会場（新宿GOLDENEGG、上記
    event-20191026-goldenegg）だった。添付されたセットリスト・タイムテーブル画像の内容は
    本セッションで直接確認できていないため転記していない。

    ※Xの告知アーカイブから復元。天候による変更を反映した最終的な出番時刻(14:40)をdateに採用。
    王子飛鳥山公園はvenues.yml未登録のため新規候補として提示（末尾コメント参照）
