#   - 王子飛鳥山公園（北区・野外特設舞台。「オレノオゴリ」無銭ライブの会場。「行政とかの事情で
#     物販等はありません」との言及あり）
#   - 蒲田ニューエイト（蒲田のライブスペース。「外観はあれだが、中はスゲ〜！」との言及あり）
#
# history.ymlへの追記は今回はしない（判断のみ、全期間発掘完了後にまとめて棚卸しする方針）:
