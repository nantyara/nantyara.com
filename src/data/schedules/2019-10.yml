    - https://x.com/nantyaraidol/status/1186576103738986496
    - https://x.com/nantyaraidol/status/1186600985487003648
- id: event-20191023-akihabaracolors
  slug: 20191023-akihabaracolors
  date: 2019-10-23 12:00:00 +0900
  time_tbd: true
  title: なんちゃら他人の庭で好きなことやりまくる企画第二弾（アキバカラーズ・ワタルくん共同主催）
  site: 秋葉原カラーズ
  acts:
    - 桑原達也
    - serious barbarian
    - ヌルオthe部族
    - DJワタル
  content: |
    秋葉原カラーズで開催された、なんちゃらアイドル・ワタルくん共同主催のイベント。事前告知
    「10月23日はこれ！なんちゃらが他人の庭で好きなことやりまくる企画第二弾！今回は、日本一の
    （この世代ではガチで）バンジョニスト桑原達也と各地で話題のserious barbarian、ヌルオthe
    部族、そして我らが兄ィ、ワタルさん、なんちゃらの4組でふざけます！」（nantyaraidol、10/2）
    「今月のアキバカラーズ共同主催、なんちゃらにしか出来ないクソ尖がったキャスティングなので
    是非皆来て欲しい。」（nantyaraidol、10/1）「10月23日はアキバカラーズ！なんちゃらワタル
    くんにしかできないスペシャルブッキング！なんと1400円！ラッキーラッキー！」
    （nantyaraidol、10/22）。開演の具体的な時刻・終演後の感想ポストは本文には見当たらない。
    2019-09にあった「なんちゃらとワタルくんとvol.001」（アキバカラーズ）の後継企画と見られるが
    vol番号の明記は本文には見当たらない。

