# 2019年10月（/mine-x による X 告知アーカイブからの発掘。ソース: mining/x-archive/2019-10.json）
# ドラフト（未コミット・レビュー用）。新規会場候補3件あり（末尾コメント参照）。
# 今回の転記対象は276告知のうち日付・会場・（可能なら）時刻が本文から確認できる18件。
# ⚠️ 日時はすべて post の time フィールド（UTC）を JST（+9h）に変換した上で「本日/今日/明日/
#   日付変わって」の指し示す日付を確定させている（2019-08で日付境界の変換ミスが一度発生した
#   教訓を踏まえ、各イベントごとに announce/day-of/post-event の3点を突合してJST日付を確定した）。
#
# 証拠不足・方針により見送ったもの:
#   10/1「10月の予定」（samami27、画像添付の月間予定表）・10/13「なんちゃらアイドルあおはる
#   10月予定」（yokuwakan_nai、同種の画像添付月間予定表）はいずれも画像内容がテキスト本文から
#   確認できないため転記対象外（裏取りの一次情報としては有用だが、画像内容の推測は禁止のため
#   個別イベントとの突合のみに利用した）
#   10/12「代々木音楽祭2019」（通称よよおん、Zher the ZOO・代々木Barbara・LIVE labo YOYOGI
#   3会場サーキット）は「協議の結果、台風19号の影響により中止となります」（10/11
#   nantyaraidol）と明記されており開催されていないため転記対象外
#   10/17 めろん畑a go goのゼップダイバーシティ・ワンマンライブは、なんちゃらアイドル自身の
#   出演ではなく「応援しにいこう」という観覧・応援目的の呼びかけ（10/16 nantyaraidol）のため
#   転記対象外
#   10/29「なんたってアイドル」DJイベント（2019-08/09ドラフトで「次回10/29予告」として
#   申し送りされていたもの）は、本ウィンドウのアーカイブ全体を検索したが該当する告知・事後
#   報告とも見当たらなかった。一方、2019-09ドラフトで裏取り済みの「10月22日、なんちゃらアイドル
#   がDJをやるイベント...スペシャルゲストにすからべさんが決定」（9/13 nantyaraidol予告）は
#   10月アーカイブ中に「10月22日はワンコイン（1ドリンク別）でなんちゃらと遊べる！...今回の
#   スペシャルゲストは、姫乃たまBNF、スカラベさんを究極召喚！」（10/21 nantyaraidol）として
#   確認でき、これが本文で唯一裏取りできたDJイベント（下記 event-20191022-ottanta として転記）。
#   10/29告知が別途存在した可能性は否定できないが本文からは確認不可のため、「次回10/29予告」は
#   誤伝聞だった可能性がある旨をここに記録する
#   12月の先出し予告群（12/18なりすレコードよりアナログ1stシングル「夜の煙突」発売、12月前半の
#   カバー曲新録音シングル、12/24クリスマスイブポトレ、12/24無人島七面鳥食べる会、11月予定
#   まとめ投稿2件）はいずれも将来月のイベント・リリースであり10月ウィンドウの転記対象外
#   （releases.yml裏取り候補として下記コメントに記録）
#
# ⚠️ 「オレノオゴリ」野外イベントについて（本タスクの特記事項への回答）:
#   タスク冒頭で「オレノオゴリ 2日間の野外イベント（10/26-27、北区王子飛鳥山公園野外舞台）」との
#   事前情報があったが、本文を突合した結果、テキストで確認できる範囲では「オレノオゴリ」＝
#   飛鳥山公園での無銭ライブは 10/27 単日のみ（「本日オレノオゴリ！！飛鳥山公園で歌います！」
#   samami27 10/27、「オレノオゴリ、飛鳥山公園ありがとうございました！」samami27 10/27）。
#   10/26 は別会場（新宿GOLDENEGGでの昼の宴、下記 event-20191026-goldenegg）であり、飛鳥山公園に
#   ついては10/26に該当する告知・事後報告は見当たらなかった。よって「2日間」の一次資料は本文
#   からは確認できず、単日イベントとして転記した。添付画像のセットリスト・タイムテーブルの
#   内容についても、本セッションで直接確認できていないため転記していない（画像内容からの
#   推測は禁止のため）
#
# releases.yml裏取り候補（編集は今回しない）:
#   - 8thシングル「チョコ麦畑で捕まえて！」（ちょこ太郎とのコラボシングル、なんちゃらアイドル
#     主催レコ発ワンマン、10/18発売、下北沢ちょ美ひげ）。告知内での表記ゆれが複数あり
#     （「ちょこ麦ばたけで捕まえて！」10/2 nantyaraidol、「チョコ麦畑で捕まえて！」10/16/10/22
#     nantyaraidol）。正式表記の確定が必要
#   - 12月前半発売予定の「なんちゃらのアンセムになりつつある、あのアイドルの、あの曲のカバー、
#     新録音バージョン」（10/20 nantyaraidol予告、曲名不明）。12月ウィンドウで裏取りのこと
#   - 12月18日発売予定のアナログ1stシングル「夜の煙突」（なりすレコード、1500円、10/27
#     nantyaraidol予告）。12月ウィンドウで裏取りのこと
#
# venues.yml新規候補（編集は今回しない。下記3件）:
#   - スタジオアクト町田店（町田のレンタルスタジオ。なんちゃらバンドのドラム担当・林さんの
