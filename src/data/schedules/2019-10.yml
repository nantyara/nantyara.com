- id: event-20191031-heavensdoor
  slug: 20191031-heavensdoor
  date: 2019-10-31 12:00:00 +0900
  time_tbd: true
  title: ハロウィンライブ（三軒茶屋HEAVEN'S DOOR）
  site: 三軒茶屋HEAVEN'S DOOR
  content: |
    三軒茶屋HEAVEN'S DOORで開催されたハロウィン装飾下でのライブ（10/14出演分とは別日程）。
    事前の具体的な告知（会場・開始時刻）はアーカイブ中に見当たらず、終演後の「ヘブンスドア
    ライブありがとうございました！渋谷の人らよりはしゃいだ！来てくれた皆様ありがとう！
    あおはるとかにおだんごヘア似合うって言われて嬉しかった！！カンナさん（特攻服着てる）に
    チューしてもらってキスマークつけてもろた！！」「今日のヘブンス怖くて、酔っぱらうまで
    装飾にいちいち驚いていた…」（いずれもsamami27）から、ハロウィン装飾の三軒茶屋HEAVEN'S
    DOORでのライブがあったことが分かる。両ポストのUTCタイムスタンプをJST変換すると
    2019-11-01T00:00〜00:20頃となり、日付境界上の投稿だが、内容（ハロウィン装飾、10月末の
    文脈）から10/31開催と判断した。

    ※Xの告知アーカイブから復元。事前の告知投稿・開始時刻とも本文からは特定できないため
    time_tbd とした。投稿時刻がJST日付境界（10/31深夜〜11/1未明）にあるため、開催日は文脈
    判断（ハロウィン装飾の言及）による
