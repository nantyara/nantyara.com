- id: event-20170814-jam
  slug: 20170814-jam
  date: 2017-08-14 12:00:00 +0900
  time_tbd: true
  title: なんちゃらアイドル初のワンマンライブ
  site: 新宿JAM
  acts:
    - ザ・アイドルズ
  content: |
    新宿JAMにて、なんちゃらアイドル初のワンマンライブを開催。ザ・アイドルズがオープニングアクトとして出演。
    「持ち時間の長いライブのお誘いがあるまで温めていた」という6分超の新曲をこの日初披露。
    限定5個の「なんちゃらボランチア福袋」（3000円）や、なんちゃらオリジナルTシャツ・CD・DVDなどの
    物販も展開。ライブ映像はDVD化され、来場者には無料配布された。

    ※Xの告知アーカイブから復元。開催時刻の記録なし
