  content: |
    コスホリック44、QuinQブース（K24-25）にて、なんちゃらアイドル初の公式写真集ROM
    （Photo by COLORFUL×CAMERA）を頒布。写真集に加え動画も各2本、当日使用可能な撮影チケット付き。

