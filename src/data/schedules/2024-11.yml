- id: event-20241111-lamama-omedetabeamfes
  slug: 20241111-lamama-omedetabeamfes
  date: 2024-11-11 18:30:00 +0900
  title: 渋谷La.mama「大人の文化祭～３大おめでたビームフェス～」
  site: 渋谷La.mama
  acts:
    - S.B.Q.アイドル部
    - MCあんにゅ
    - フェッティーズ
  content: |
    渋谷La.mamaでの主催イベント「大人の文化祭～３大おめでたビームフェス～」。「11日はこれ！
    セカンドシングル発売日となる太宰さんは残念ながらキャンセルとなりました。シャバにおらんからねしょうがないね。
    なので太宰さんの持ち時間を使って、なんちゃら他有志が、大宰さんの新曲をカバーいたします。初披露がトリビュートなのオモロいですね。もちろん販売もいたします。奇遇な夜をよろしくお願いします！」（nantyaraidol、11/10）で前日告知（太宰ちゃんソロの出演キャンセルを確認）。「明日はソロ、なんちゃらアイドルで新曲発表の日なのでドキドキです！！
    シングル先行発売です！シングルめちゃくちゃ買ってください！

    明日のライブの詳細、配信はこちらから↓
    https://t.co/AZGnenD83k」（samami27、11/11深夜1:58投稿）のリンク先（lamama.net）で、イベント名「なんちゃらアイドル主催in渋谷ラママ 大人の文化祭～３大おめでたビームフェス～」、open18:30/start19:00、料金前売¥2,500＋drink（配信¥2,000）、出演: 御茶海マミソロ・S.B.Q.アイドル部・MCあんにゅ・フェッティーズ・なんちゃらアイドル（太宰ちゃんソロは「諸事情によりキャンセル」）を確認した。「今日だよー！新曲たくさんやる！ドキドキ！太宰ちゃんは残念ながらお休みなんですが、太宰ちゃんに憧れてもらえるようにがんばりますけんねー！
    レコ発ですのでね！シングルたくさん売れますように！神様お願い！！

