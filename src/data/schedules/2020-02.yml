# 2020年2月（/mine-x による X 告知アーカイブからの発掘。ソース: mining/x-archive/2020-02.json）
# ドラフト（未コミット・レビュー用）。新規会場候補6件あり（末尾コメント参照）。
# 今回の転記対象は301告知のうち日付・会場・（可能なら）時刻が本文から確認できる14件。
# ⚠️ 日時はすべて post の time フィールド（UTC）を JST（+9h）に変換した上で「本日/今日/明日」等の
#   指し示す日付を、announce/day-of/事後報告の3点を突合して確定している
#   （過去月で日付境界の変換ミスが発生した教訓を踏まえた運用）。
#   本ウィンドウで日付境界の罠に近いケースを1件確認: samami27の2/22投稿
#   （status/1230991802099830786、UTC 2020-02-21T23:04:50=JST 2020-02-22 08:04）は文中
#   「朝早くて吐きそう」だが、これは前日夜投稿の「今日だよー！」（yokuwakan_nai、
#   UTC 2020-02-21T23:03:36=JST 2020-02-22 08:03、「なんたらは13:40から歌うぞー」）と
#   同一の2/22早朝投稿群であり、指しているのは投稿と同一暦日の2/22（真昼の完全試合!!!
#   vol.003当日）で問題なし。もう1件、samami27の「明日は関内7th Avenue」告知
#   （status/1230987384952508417相当、UTC 2020-02-22T22:47:17前後→本文はstatus/1230991802099830786の
#   前段「明日は関内7th Avenueにてライブ！」UTC 2020-02-22T11:46:32=JST 2020-02-22 20:46）は
#   「明日」=2/23を指し、2/23当日投稿（status/1231459006834601985「今日、関内セブンスアベニュー
#   にて」）と突合して2/23開催と確定（2/22の真昼の完全試合とは別イベント、混同注意）。
#
# 特記事項（ユーザー提示の裏取り候補との照合結果）:
#   - 「2/4 御茶海マミ25歳最後・あおはる23歳最初の合同撮影会（都内スタジオ）」: 開催を確認
#     （samami27/status/1224662415985401856「撮影会ありがとうございました！もうすぐ天使に
#     近づく〜（不謹慎）」、yokuwakan_nai/status/1224663875338915840）。会場は本ウィンドウで
#     新たに判明: 「今日は蒲田のカプラというスタジオで撮影してきました。みんな蒲田たくさん
#     来てくれてありがたビーム」（nantyaraidol/status/1224694352510738433）→
#     「蒲田のスタジオ・カプラ」と確定・転記（新規会場候補、末尾参照）。25歳/23歳の年齢
#     言及自体は本ウィンドウの本文には見当たらないが、マミの誕生日が2/6であること
#     （本ウィンドウ内 nantyaraidol/status/1225334387216023553「マミはリアル誕生日なので
#     祝いに恋」で2/6が誕生日と確認）と整合するため、ユーザー候補の日付・趣旨と矛盾なし
#   - 「2/9 御茶海マミ生誕ライブ（下北沢MOSAiC、open18:00/start18:45）」: 開催・会場とも確認
#     （タイトル『朱夏より、青春に捧ぐ。』、出演:御茶海マミ、東京恋慕、姫乃たま、
#     ジョニー大蔵大臣、なんちゃらバンド2号）。会場は本ウィンドウの本文に直接の言及は
#     ないが、1月アーカイブの1/17下北沢MOSAiCライブ当日投稿
#     「本日は下北沢Mosaic！マミが2月9日に生誕ライブを開催するライブハウスです！！」
#     （yokuwakan_nai、2020-01-17付、schedules/2020-01.yml 収録済み）で確定済みのため
#     下北沢MOSAiCとして転記。ただし open18:00/start18:45 という具体的時刻は本ウィンドウ
#     ・1月ウィンドウのいずれの本文にも見当たらず**裏取りできなかった**ため time_tbd とした
#     （ユーザー提示の時刻情報の出典は本アーカイブ外と思われる）
#   - 「2/9生誕ライブ後のビーゴカフェ打ち上げ（まりなちゃんゲスト出演）」: 「ビーゴカフェ」
#     という店名の言及は本ウィンドウの本文に見当たらなかった。代わりに2/11に
#     「B5 IDOL CAFE御茶海生誕GIGアフターパーティー」（samami27/status/1227233650774663169）
#     という、生誕ライブから2日後の別日の打ち上げ企画を発見・転記した（新規会場候補、
#     末尾参照）。「ビーゴ」と「B5」は表記が大きく異なり同一店舗と断定できないため、
#     ユーザー候補の「ビーゴカフェ」は未確認のまま次ウィンドウ以降の宿題とする
#     （まりなちゃんゲスト出演の言及も本ウィンドウでは確認できず）
#   - 「2/29 穴ロバとの対バン打診（会場・確定未定）」: 「穴ロバ」という語・対バン打診の
#     言及は本ウィンドウの本文に見当たらなかった。2/29当日は蒲田スナックトントンでの
#     OKFK開催が確認できた（穴ロバとは無関係と思われる）ため、この候補は未確認のまま
#     転記対象外・次ウィンドウ以降の宿題とする
#
# 転記した14件の中で判断が難しかった点:
#   - 2/2 HMVインストア2本（コピス吉祥寺15時/新宿アルタ19時）: 同日・別会場のため
