- id: event-20200201-chobihige
  slug: 20200201-chobihige
  date: 2020-02-01 19:00:00 +0900
  title: 「下北沢一番街ラプソディ」（下北沢ちょ美ひげ）
  site: 下北沢ちょ美ひげ
  acts:
    - ニーネ
  content: |
    下北沢ちょ美ひげでのニーネとのツーマンライブ。事前告知「2020/2/1(土)下北沢ちょ美ひげ
    「下北沢一番街ラプソディ」出演:なんちゃらアイドル、ニーネ op18:30/st19:00
    料金￥2000 本日はニーネとのツーマン！コラボやこの日しかない企画や曲ももりだくさんに
    しこんでるので是非！」（nantyaraidol、当日）。終演後「ニーネ×なんちゃらアイドル in
    下北沢ちょ美ひげツーマンありがとうございました！」（samami27）、「ニーネさんとの
    ツーマンライブありがとうございました！！！エンドウさんとのアコースティックバージョン
    なんちゃら曲も、ニーネさんとのコラボ曲も、途中で壊れた手作りカホンも、美味しいご飯と
    お酒も、全て特別で楽しいイベントでした！」（yokuwakan_nai）。

    ※Xの告知アーカイブから復元。
  sources:
    - https://x.com/nantyaraidol/status/1223463564301586432
    - https://x.com/samami27/status/1223604732331118592
    - https://x.com/yokuwakan_nai/status/1223626435580923909

- id: event-20200202-hmv-kichijoji
  slug: 20200202-hmv-kichijoji
  date: 2020-02-02 15:00:00 +0900
  title: 「夜の煙突」発売記念インストアライブ（HMV record shop コピス吉祥寺）
  site: HMV record shop コピス吉祥寺
  content: |
    アナログシングル「夜の煙突」発売記念のインストアライブ。「本日はインストアライブ2本！
    HMV record shopコピス吉祥寺15時〜 HMV record shop新宿アルタ19時〜 ライブ観覧は無銭！
    特典会に参加する場合はレコード(夜の煙突)の購入が必要です！」（yokuwakan_nai、当日）。
    終演後「HMVレコードショップコピス吉祥寺店ありがとうございました！たくさんの人に
    聴いてもらえたし、HMVの人にも曲いいですねって褒められたよ！」（samami27）。

    ※Xの告知アーカイブから復元。同日19時からの新宿アルタ店インストアとは別イベントとして
    転記（venues.yml未登録のため新規候補、末尾参照）。
  sources:
    - https://x.com/yokuwakan_nai/status/1223801151558041600
    - https://x.com/samami27/status/1223879588519899142

