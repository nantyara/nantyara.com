- id: event-20200225-ottanta-4members-reunion
  slug: 20200225-ottanta-4members-reunion
  date: 2020-02-25 12:00:00 +0900
  time_tbd: true
  title: 元なんちゃらアイドル4人集結DJイベント（蒲田オッタンタ）
  site: 蒲田オッタンタ
  content: |
    蒲田オッタンタでのDJイベント。歴代メンバー4人（まみ・あお・はるか・ぬる）が集結。
    事前告知「2月25日、なんと、元なんちゃらアイドルの4人が集結！来場特典として4人時代の
    音源をカップリングしたスペシャルCDを先着10名様にプレゼント！4人全員のサインを
    入れてエモい気持ちになろう！こうやってまたみんなが揃うのが、ほんとに嬉しい。
    まみ、あお、はるか、ぬる、4人でお待ちしとります！」（nantyaraidol）。当日
    「今日のDJはライブはないけど、限定CDがあったり、元メンバーのはるかとぬるが
    来たりなどするのでオススメです！蒲田オッタンタにて！」（samami27）、「今日は
    DJしまーす！DJのやり方、覚えてるかな。頑張ります！なんちゃらアイドル元メンバーにも
    会えるよ。うれしい」（yokuwakan_nai）。

    ※Xの告知アーカイブから復元。ライブ形式ではなくDJイベント。開始時刻の言及が本文に
    見当たらないため time_tbd とした。history.yml裏取り候補としても末尾コメントに
    記載（脱退済みメンバーはるか・ぬるの合流の一次記録）。
