    （yokuwakan_nai）、「関内わかった！セブンスアベニューライブありがとうございました！
    初めて行ったけれど広くてかっこいい箱だった！」（samami27）。

    ※Xの告知アーカイブから復元。「7th Avenue」「セブンスアベニュー」の表記ゆれが
    本文に混在。venues.yml未登録のため新規候補（末尾参照）。
