  content: |
    下北沢Queでの対バンイベント「ホラー不法集会」。事前告知「本日！歌ったり怖い話し
    ます！下北沢Queにて！」（samami27）。終演後は「ホラー不法集会ありがとう
    ございました！怖い話をするステージの後ろのモニターが、延々とスプラッタ流してて、
    聴覚と視覚奪われてる感じが怖かった。」（samami27）「下北沢Queでのライブ
    ありがとうございました！ライブと怪談の高低差がすごくて目が回る楽しいイベント
    でした怪談こわい。VITAL STATISTICSさんとのお写真です！なんかカニカマを
    沢山くれた。」（yokuwakan_nai、対バン相手としてVITAL STATISTICSの名を確認）。

    ※Xの告知アーカイブから復元。開演・出番の具体的な時刻の言及が見当たらないため
