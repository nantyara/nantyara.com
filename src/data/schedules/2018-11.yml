    …ヘッドパワーライブありがとうございました。」（samami27、21時からのバー出勤の
    ため中抜けした旨）「今日のぽよ、激ヤバでした。会場の空気が完全にぽよのものに
    なって…」（yokuwakan_nai）と感想。

