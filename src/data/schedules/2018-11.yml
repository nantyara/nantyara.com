- id: event-20181121-shimomaruko-photo
  slug: 20181121-shimomaruko-photo
  date: 2018-11-21 18:00:00 +0900
  end: 2018-11-23 21:00:00 +0900
  title: なんちゃらアイドル写真展（下丸子）
  site: 下丸子写真展会場
  content: |
    東京・下丸子で3日間開催された「なんちゃらアイドル写真展」。過去の歴史を振り
    返る写真の展示に加え、メンバー手作りの無料フード（チャーハン・げきからおでん・
    麻婆やきそば・麻婆豆腐等）やワイン飲み放題、チェキ撮影も実施。「今日から3日間
    続くなんちゃら写真展が始まりました！いっぱい貼ったぞ〜」（yokuwakan_nai）
    「私は明日明後日も18時21時で下丸子写真展におりますので」（yokuwakan_nai、
    展示時間帯18:00〜21:00の言及）。会期は11/21（水・初日）〜11/23（金・
    最終日）の3日間、あおはるは毎日在廊、マミは金曜（最終日）在廊。終演後は
    「写真展ありがとうございました！たくさんきてくれてうれしかった〜初日はチャーハン、
    3日目麻婆豆腐作りました！」（samami27）と感想。ライブではなく展示イベントの
    ため対バン形式のacts設定はなし。

    ※Xの告知アーカイブから復元。会場名の具体的な記載（店舗名等）は見当たらず、
    地名「下丸子」のみ判明。11/14のグルメ投稿で言及された「みなも（下丸子）」
    という飲食店が会場の可能性もあるが未確定のため、venues.yml新規候補としては
    会場名不明の企画名で提示（下記コメント参照）。展示時間帯(18:00〜21:00)を
    date/endに採用
  sources:
