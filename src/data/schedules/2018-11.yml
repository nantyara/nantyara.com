  title: 「新宿JAM in 下北沢にて」（下北沢Laguna）
  site: 下北沢Laguna
  content: |
    下北沢のサーキットフェスの一環として開催された「新宿JAM in 下北沢にて」。
    なんちゃらアイドル結成の地とされる新宿JAM（閉店済み）の閉店を偲ぶ企画。事前に
    タイムテーブル判明「11月29日の、「新宿JAM in 下北沢にて」のタイテがでました。
    なんちゃらはLaguna 19時から30分です。何が嬉しいかって、なんちゃらのあとの
    演者が石塚さんのバンドなのであります。この日だけはなんちゃらのゴッドファーザー、
    石塚さんに最高の状態でバトンを渡すためのライブにしたいと思ってます。」
    （nantyaraidol、11/10投稿）。前日「明日は下北沢のサーキットフェス！
    フェスづいてる！なんちゃらは、Lagunaにて19:00より歌います！！」（samami27）。
    当日は「祭りが始まっているよ。なんちゃらアイドルはLagunaにて19時から！」
    （yokuwakan_nai）。終演後は「シモニテ5日目、Lagunaライブありがとうございました！！
    ちょっとケロってしちゃったけど、最近、声がよく出る気がする！！」（samami27）と
    感想。対バン相手として「石塚さんのバンド」の言及があるが、バンド名の具体的な
    記載は見当たらないためactsには含めなかった。

    ※Xの告知アーカイブから復元。下北沢Lagunaはvenues.yml未登録のため新規候補
    として提示（下記コメント参照）。なんちゃらアイドルの出番時刻(19:00)をdateに採用
