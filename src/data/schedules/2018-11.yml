- id: event-20181130-ottanta
  slug: 20181130-ottanta
  date: 2018-11-30 12:00:00 +0900
  time_tbd: true
  title: 大田区蒲田復興協会（OKFK）ディナーショー（蒲田オッタンタ）
  site: 蒲田オッタンタ
  acts:
    - タクミフカヤ
  content: |
    蒲田オッタンタでの「大田区蒲田復興協会（OKFK）」シリーズ、平成最後のOKFK。
    限定カバーシングル「聖母主義」（推定少女のカバー、ハードテクノアレンジで
    ニューレコーディング）を先着30名に配布する特典あり。事前告知「明日は大田区蒲田
    復興協会！蒲田オッタンタでやりますよん！」（samami27）「11月30日、本日の
    ライブの凄いところ。この日だけのスペシャルコラボあり！1曲のためにデモテープ
    作成、そしてスタジオリハまで！限定福袋が買える！」（nantyaraidol）。終演後は
    「大田区蒲田復興協会オッタンタライブありがとうございました！…5.アンダルシアに
    憧れて（タクミフカヤさんコラボ）」（samami27、セットリスト報告よりコラボ相手を
    確認）「本日はOKFKありがとうございました！…タクミフカヤさんとのコラボも
    かっこよかったでしょ。」（yokuwakan_nai）と感想。

    ※Xの告知アーカイブから復元。具体的な開演時刻の言及が見当たらないため
    time_tbd とした
