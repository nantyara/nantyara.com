- id: event-20181002-lamama
  slug: 20181002-lamama
  date: 2018-10-02 20:35:00 +0900
  title: 「ネパールと日本を楽しく仲良くしよう」渋谷La.mamaオールナイトイベント
  site: 渋谷La.mama
  content: |
    渋谷La.mamaでのオールナイトイベント。事前告知「日付変わって本日のライブはこちら
    (情報量が多い)！渋谷ラママにてネパールとジャパンで楽しく仲良くしようねという
    大変平和でグローバルな試みのイベントです。オールナイト！なんちゃらは20:35から
    歌います。よしなに〜」（yokuwakan_nai）「本日！ラママがネパールにな？る？？よ！！
    なんちゃらは20:35〜！！」（samami27）。終演後は「ネパールと日本で仲良くする
    イベントin渋谷ラママありがとうございました！初心を思い出した、あたしの根本は
    アンダーグラウンドだ...たのしかった....。」（yokuwakan_nai）「ラママライブ
    ありがとうございました！ネパールと日本が仲良くなっていく感じがしたね！」
    （samami27）と感想。出演者変更の告知「ちょい出演者変わりました！活休に伴い、
    とのこと！」（nantyaraidol）もあったが変更元・変更先の具体名は特定できない。
    対バン相手の具体名の言及は見当たらない。

    ※Xの告知アーカイブから復元。なんちゃらアイドルの出番時刻(20:35)をdateに採用
