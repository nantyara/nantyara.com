  content: |
    三軒茶屋HEAVEN'S DOORでのハロウィン対バンイベント「Motherfucker Halloween
    Night!」。事前告知「日付変わって本日ライブでち！10/31 三軒茶屋ヘブンズドア
    【Motherfucker Halloween Night!】open18：30/start19:00 前売￥2000/当日
