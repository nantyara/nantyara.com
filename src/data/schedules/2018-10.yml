- id: event-20181013-quinq-bbq
  slug: 20181013-quinq-bbq
  date: 2018-10-13 12:00:00 +0900
  title: QuinQ主催バーベキュー撮影会
  site: QuinQバーベキュー撮影会
  content: |
    QuinQ主催のバーベキュー撮影会。事前告知「なんちゃらアイドルやぽよ、虹色じゃむの
    舞ちゃんが参加するバーベキュー撮影会、なんとあと1枠で完売です！」
    （nantyaraidol、リンク先 studio.quinq.net）「明日はQuinQ主催のバーベキューだねえ。
    天気もそこまで悪くなさそう。」（yokuwakan_nai）。告知本文中のリンク先
    （http://studio.quinq.net/?p=8008&ymd=1539388800）を裏取りしたところ、
    開催日時は10月13日（土）12:00〜15:00（定員20名）、開催場所は「都内某所
    （参加者にメールで通知）」で非公開、料金10,000円（バーベキュー食べ放題・
    撮影し放題）、出演モデルは御茶海マミ・あお・猫屋敷ぽち・ぱぴこ・双葉舞・
    夢花狂子・星野百花ほかとの記載があった。終演後は「バーベキューありがとう
    ございました！肉焼きまくってたのしかったね！」（samami27）「バーベキュー
    楽しかった！！！リア充！！！！」（yokuwakan_nai）と感想。ライブではなく
    モデル複数名参加の撮影会企画のため acts には含めなかった。

