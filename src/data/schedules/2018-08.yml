    - https://x.com/samami27/status/1026067714853367808
    - https://x.com/samami27/status/1026108987693969408
- id: event-20180809-yakiniku
  slug: 20180809-yakiniku
  date: 2018-08-09 19:00:00 +0900
  title: もえぺろ×なんちゃらアイドル共催「焼肉食べ放題と創作料理の宴」
  site: 高田馬場BIGBOX前
  content: |
    もえぺろ（毎日サプリメント）となんちゃらアイドルの共催による焼肉食べ放題オフ会。
    事前告知「もえぺろ（毎日サプリメント）×なんちゃらアイドル 焼肉食べ放題と創作料理の宴」
    2018年8月9日（木）19時〜 場所 高田馬場BIGBOX前 18時50分に集合 参加費 焼肉食べ飲み放題、
    創作料理食べ放題、ヌキ無し5000円ポッキリ ※二次会参加費無料 完全予約制！」
    （nantyaraidol）。業務連絡「8月9日、もえぺろ（毎日サプリメント）となんちゃらの焼肉開始、
    現時点での御予約のかたにはメール返しました。...現在総勢12名。」、「8月9日の創作料理対決、
    ここのホームページの画像が変わるくらい画期的な料理を発明しますけんねー。」（ともに
    nantyaraidol）と創作料理対決企画も告知。当日は「本日、もえぺろなんちゃら焼肉オフ会、
    ご予約のお客様は、18時45、に高田馬場ビッグボックス前に！」「18時50分だね！」
    （nantyaraidol）と再告知。終演後は「食べ放題イベントありがとうございました！！！肉を
    焼きまくったりケーキを全種類食べたりしました。」（yokuwakan_nai）「二次会も無事おわり
    ました！もえぺろとなんちゃら、そしてファンの絆、深まったな！」（nantyaraidol）と感想。

    ※Xの告知アーカイブから復元。ライブではなくファン参加型の食事オフ会（会場は
    高田馬場BIGBOX前集合の飲食店だが店名は明示されずvenues.yml未登録のため新規候補と
    して提示。下記コメント参照）。集合時刻(18:50)ではなく開始予定時刻(19:00)をdateに採用
  sources:
    - https://x.com/nantyaraidol/status/1024308733512376322
    - https://x.com/nantyaraidol/status/1027475786456911873
    - https://x.com/nantyaraidol/status/1028068028397707264
- id: event-20180811-cosholic
  slug: 20180811-cosholic
  date: 2018-08-11 12:00:00 +0900
  time_tbd: true
  title: なんちゃらアイドル物販（コスホリック44）
  site: コスホリック44
  content: |
    コスホリック44、L03-04ブースにて物販。事前告知「本日コスホリ！Ｌ03-04でお待ち
    しております！」（yokuwakan_nai）、「コスホリL03-04にてお待ちしてます！入って左に
    曲がってハジの方です！前半は彼シャツ！」（samami27）。終演後は「コスホリありがとう
    ございました！ROMたくさんお手にとっていただきありがとうございました！有吉観たよ！
    って言っていただけてうれしかった〜」（samami27）「コスホリありがとうございました！
    こういうイベントは、はじめましてやお久しぶりの人にも会えるから楽しいねえ。ROM、
    たくさん手に取って頂けて嬉しいです。」（yokuwakan_nai）と感想。

