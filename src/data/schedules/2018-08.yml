    - https://x.com/yokuwakan_nai/status/1033352412692504576
- id: event-20180827-crossbunny
  slug: 20180827-crossbunny
  date: 2018-08-27 21:00:00 +0900
  title: なんちゃらアイドル感謝祭（中野クロスバニー）
  site: 中野クロスバニー
  content: |
    中野クロスバニーでの「なんちゃらアイドル感謝祭」。ライブというよりバー飲み会形式の
    ファン感謝イベント。事前告知「今夜、なんちゃらアイドル感謝祭が中野クロスバニーで
    開催されるってご存知？なんちゃらファンですって言ったら、上限額（30000円）まで
    お酒飲めるらしいよ！ひゅー！クロスバニーなんちゃらアイドル感謝祭は21時から！」
    （samami27）「なんちゃらファン、集え！」（nantyaraidol）「です！テーブルチャージ500円
    ご負担になります！」（yokuwakan_nai）。終演後は「本日はなんちゃら夏の感謝祭、こんな
    天気なのにたくさん飲みに来てくれてありがとナス！これからもよろしくお願い申し上げます！」
    （nantyaraidol）と感想。

    ※Xの告知アーカイブから復元。開始時刻(21時)をdateに採用
