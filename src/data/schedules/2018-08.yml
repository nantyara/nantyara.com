    生かして、次はもっと輝きます！次は31日、蒲田オッタンタにてOKFKです！」（samami27）
    「三軒茶屋ヘブンスドアありがとーごじゃいました...次のヘブンスドアは9月12日、主催です。」
    （yokuwakan_nai）と感想（9月12日主催回への言及あり。次ウィンドウ<2018-09>で要確認）。
    対バン相手の具体名の言及は見当たらない。

