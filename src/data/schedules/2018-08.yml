- id: event-20180801-firebird
  slug: 20180801-firebird
  date: 2018-08-01 12:00:00 +0900
  time_tbd: true
  title: 新松戸FIREBIRDライブ（浴衣ライブ）
  site: 新松戸FIREBIRD
  content: |
    新松戸FIREBIRDでのライブ。7/29の「中出し少年とのツーデイズ」とは別回。当日告知
    「本日！新松戸ファイヤーバードにて！」（samami27）のみで、事前の出番時刻の告知は
    アーカイブ中に見当たらない。終演後は「なんちゃらアイドル、新松戸ファイヤーバード
    ライブありがとうございました！今年初の浴衣ライブ！おニューの浴衣はいかがっしたか？
    即座な対応力をつけたいと思ったけど、ゆったりじっくり海の家歌えて楽しかった〜！」
    （samami27）「新松戸FIREBIRDありがとうございました！浴衣でした。マミちゃんに髪の毛
    くるくるしてもらったあおはる可愛い〜。今日は落ち着いた感じで歌えたと思います！
    次のライブは大阪よ。」（yokuwakan_nai）と感想。対バン相手の具体名の言及は見当たらない。

    ※Xの告知アーカイブから復元。開演・出番の具体的な時刻の言及が見当たらないため
    time_tbd とした
