- id: event-20180805-misono-benikaku
  slug: 20180805-misono-benikaku
  date: 2018-08-05 20:35:00 +0900
  title: 「Beat Happening！なんちゃらPANIC in大阪！」（大阪初出陣）
  site: 味園紅鶴
  content: |
    大阪・味園ビル内「味園紅鶴」での対バンイベント「Beat Happening！なんちゃらPANIC
    in大阪！」。なんちゃらアイドルにとって大阪初出演（初出陣）。事前告知「ほんじつ！
    ８月５日（日）なんば紅鶴『Beat Happening！なんちゃらPANIC in大阪！』START多分17時
    ＆前売￥2,500+1D なんちゃらアイドルは20:35からめちゃくちゃ歌います。めちゃくちゃ
    歌いたいんだ〜！初大阪、よろしくおねがいします！」（yokuwakan_nai）。当日は
    「味園ビル2階、トナカイのお顔手前を左に曲がると紅鶴があります！（スロープであがるのが
    オススメ！）」（samami27）と道案内も投稿。終演後は「なんちゃらpanic！紅鶴ありがとう
    ございました！！緊張したけど、めっちゃ楽しいライブできました！なんちゃらアイドルの
    名前だけでも覚えてください！支えてくれた東京のみなさん、ついてきてくれたみなさん、
    本当にありがとう！言葉に言い尽くせない！！！写真はオタフクガールズのお二人と！」
    （samami27）と感想。「オタフクガールズ」への言及があるが、対バン相手か単に会場で
    出会った別グループなのか判別できないため acts には含めなかった。

    ※Xの告知アーカイブから復元。味園紅鶴はvenues.yml未登録のため新規候補として提示
    （下記コメント参照）。なんちゃらアイドルの出番時刻(20:35)をdateに採用
  sources:
