- id: event-20180824-nishinagafuku-jam
  slug: 20180824-nishinagafuku-jam
  date: 2018-08-24 12:00:00 +0900
  time_tbd: true
  title: 西永福JAMライブ
  site: 西永福JAM
  content: |
    西永福JAMでのライブ。事前告知「明日は西永福JAMライブ！（トロンボーンはやりません！）」
    （samami27）「おはよ！本日こちらのライブです。JAMで生まれた私たちが初めてJAMに行きます！
    西永福JAM、噂によるとめちゃくちゃ綺麗らしいので楽しみだー。」（yokuwakan_nai、なんちゃら
    アイドル結成の地とされる新宿JAMと同じ「JAM」を冠する会場だが別会場）。当日は「本日西永福
    JAM！たのしみー！写真はタイムテーブルと『あっあおはるだ！』となって、自らをもって
    完成させている写真です。」（samami27）とタイムテーブルの画像付き投稿があるが、本文中に
    具体的な時刻の記載はない。終演後は「西永福JAMライブありがとうございました！元気に
    MCできるようになりたいので、元気な女になります！！」（samami27）「西永福JAMありがとう
    ございました〜！熱い気持ちがそこかしこに溢れている素晴らしいイベントだったと思います。
    やまだださんお疲れ様でした！」（yokuwakan_nai）と感想。事前情報にあった「8/24西永福JAM
    DADAフェス」の「DADAフェス」という名称は、本セッションで参照したテキストアーカイブ中には
    見当たらず、裏取りできなかった（フライヤー画像に記載があった可能性あり、画像は未確認）。
    対バン相手の具体名の言及も見当たらない。

    ※Xの告知アーカイブから復元。西永福JAMはvenues.yml未登録のため新規候補として提示
    （下記コメント参照）。開演・出番の具体的な時刻の言及が見当たらないため time_tbd とした。
    イベント名「DADAフェス」は未確認のためtitleには反映していない
