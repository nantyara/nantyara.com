- id: event-20180825-showboat
  slug: 20180825-showboat
  date: 2018-08-25 21:00:00 +0900
  title: 「さまきゅん☆ぱりないっ」
  site: 高円寺SHOW BOAT
  content: |
    高円寺SHOW BOATでのイベント「さまきゅん☆ぱりないっ」。事前告知「本日8月25日のライブは
    高円寺ショウボート『さまきゅん☆ぱりないっ』開場19:00／開演19:30 前売￥2300／
    当日￥2800（税込・別途ドリンク代￥600）21時〜歌います！夏の終わりを告げます。」
    （samami27）「ほんじつ！高円寺showboat『さまきゅん☆ぱりないっ』...なんちゃら21時から
    歌います。街が阿波踊りらしいので人がやばいかもしれない。」（yokuwakan_nai）。終演後は
    「はーい！夏終わらせましたー！高円寺ショーボートありがとうございました！阿波踊りの
    団体が200人フロアになだれ込んで来た時はどうしようかと思ったね！」（yokuwakan_nai）
    「高円寺ショウボートありがとうございました！はじめましての3マンでしたが、皆さん
    優しいかたで楽しかった！」（samami27）と感想。「はじめましての3マン」とあるが、他の
    出演者の具体名の言及は見当たらない。イベント名「さまきゅん」から御茶海マミ（samami27）
    関連企画とみられるが、なんちゃらアイドルとして全員出演した旨の投稿のため labels は
    付与しなかった。

    ※Xの告知アーカイブから復元。なんちゃらアイドルの出番時刻(21:00)をdateに採用
  sources:
