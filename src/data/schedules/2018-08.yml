    - https://x.com/samami27/status/1029021363330150401
    - https://x.com/yokuwakan_nai/status/1029022772343627776
- id: event-20180817-heavensdoor
  slug: 20180817-heavensdoor
  date: 2018-08-17 21:00:00 +0900
  title: 三軒茶屋HEAVEN'S DOORライブ（もえぺろ対バン）
  site: 三軒茶屋HEAVEN'S DOOR
  acts:
    - 峯田猫未
    - 花井ンジョ美理ーナ
  content: |
    三軒茶屋HEAVEN'S DOORでの対バンイベント。事前告知「本日ヘブンスドアにてライブします
    21時から歌います◎もえぺろと対バン久しぶりだー！」（samami27）「ほんじつ三軒茶屋
    ヘブンスドアです！三茶、なんだかんだ久しぶりな気がします！もえぺろ先生もいるよ！
    なんちゃらの出番は21時から」（yokuwakan_nai）。タイムテーブルは「19:30-20:05 ①峯田猫未
    20:15-20:50 ②花井ンジョ美理ーナ 21:00-21:35 ③なんちゃらアイドル」（nantyaraidol）。
    終演後は「三軒茶屋ヘブンスドアありがとうございました！なんだか久々な三茶でしたが
    今月は29も行きますぜ。」（yokuwakan_nai）と感想。「もえぺろ」がタイムテーブル中の
    どちらの表記に対応するかは本文からは特定できなかった。

    ※Xの告知アーカイブから復元。なんちゃらアイドルの出番時刻(21:00)をdateに採用
  sources:
    - https://x.com/samami27/status/1030327960845209601
    - https://x.com/nantyaraidol/status/1030415909926498304
    - https://x.com/yokuwakan_nai/status/1030464343450705922
