- id: event-20180813-lovetko
  slug: 20180813-lovetko
  date: 2018-08-13 19:30:00 +0900
  title: なんちゃらアイドルバンドワンマン
  site: 東新宿LOVE TKO
  labels:
    - バンドライブ
  content: |
    東新宿LOVE TKOでの「なんちゃらアイドルバンドワンマン」。事前告知「明日、2018年8月13日
    (月) LOVETKO（http://lovetko.net）にて、なんちゃらアイドルのバンドワンマン！19時open
    19時半start 2500円（1ドリンク別）フード無料 出演：なんちゃらアイドル なんちゃら
    バンド are うえりん、林、トコマレオ 撮影、録画、録音、すべて自由！」（samami27）。
    「なんちゃらバンド」は中出し少年のうえりん、林、トコマレオによるサポートバンド編成。
    終演後は「なんちゃらアイドルバンドワンマンありがとうございました！！バンドでやるの
    楽しかった！声の出し方とか、いつもと違って、もっと磨きたいって思いました！」
    （samami27）「東新宿LOVE TKOワンマンありがとうございましたー！バンド楽しー！これから
    もバンドでライブしたいので各位、呼んでください！」（yokuwakan_nai）「バンドデビュー
    ライブ、ありがとうございました。」（nantyaraidol）と感想。事前情報にあった「8/13
    東新宿LOVE TKOバンドワンマン」に対応するイベントと確認できた。

    ※Xの告知アーカイブから復元。開演時刻(19:30)をdateに採用。「なんちゃらバンド」は
    バックバンド編成のため対バン相手ではなく acts には含めなかった
