- id: event-20180831-ottanta
  slug: 20180831-ottanta
  date: 2018-08-31 21:05:00 +0900
  title: 「大田区蒲田復興協会〜ゴジラに焼かれた町から〜」（3rdシングル「海の家」無料配布開始）
  site: 蒲田オッタンタ
  acts:
    - 灯夜
    - 岬たん
    - 香栄
  content: |
    蒲田スタジオ・オッタンタでの対バンイベント「大田区蒲田復興協会〜ゴジラに焼かれた町から〜」。
    事前告知「夜が明けまして、本日8/31(金) 蒲田スタジオ・オッタンタ【http://studio80.org】
    にてライブです！『大田区蒲田復興協会〜ゴジラに焼かれた町から〜』開場19:00/料金2500円
    19:30 灯夜 20:00 岬たん 20:30 香栄 21:05 なんちゃらアイドル よろしくお願いします！
    打ち上げは餃子じゃ〜」（samami27）。当日は同内容を再告知（yokuwakan_nai）。終演後は
    「大田区蒲田復興協会@オッタンタありがとうございました！ライブ終わりの餃子なうだよ！」
    （yokuwakan_nai）「スタジオオッタンタライブありがとうございました！いつもより声が出て、
    いつもより熱が伝わったんじゃないかなって思った夜でした！灯夜さん岬たん香栄さん、
    そして来てくれた皆さんありがとうございました！」（samami27）と感想。

    このライブは3rdシングル「海の家」の無料配布初回日でもあった。8/7の告知「なんちゃら
    アイドルのサードシングル、『海の家』がおかげさまで完売しました。ので、今後はこの
    シングルは無料配布していきます。アルバムには新録バージョンを入れる予定です。初回配布日は
    8月31日、蒲田オッタンタ！こちらのライブ御来場者全員にプレゼントいたします！」
    （nantyaraidol）より。3rdシングル「海の家」はsrc/data/releases.ymlに現時点で登録がない
    （releases.ymlの最古エントリはrelease-001「夜の煙突」2020-01-29で、2018年当時の
    「み〜ちゅう」「さよならOdyssey」「海の家」等の初期シングルは軒並み未登録）。
    音源考古学バックフィル候補としてユーザー確認待ち。

    ※Xの告知アーカイブから復元。なんちゃらアイドルの出番時刻(21:05)をdateに採用
