  content: |
    三軒茶屋HEAVEN'S DOORでのライブ。8/17に続き同月2回目の同会場出演（duplicate_okで
    明示）。事前告知「日付変わってほんじつのライブはこちら！激アツメンバー！...8/29（水）
    三軒茶屋ヘブンズドア op 18:30／st 19:00 ¥2000＋D」（yokuwakan_nai、出演メンバーの
