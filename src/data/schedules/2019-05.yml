  content: |
    渋谷La.mamaで開催された、なんちゃらアイドル運営Q太郎氏の生誕記念ライブ
    「Q太郎生誕記念ライブ 39歳の春だから。」。事前告知「5.29(水)渋谷La.mama
    【Q太郎生誕記念ライブ 39歳の春だから。】2500円(＋1D) 19:30~虹色じゃむ
    19:55~フェッティーズ 20:30~姫乃たま 21:00~佐久間学 21:30~ヒゲと味噌汁
    22:00~なんちゃらバンド 開場19:00/開演19:30」（yokuwakan_nai、
    nantyaraidol、samami27の3アカウントが同一タイムテーブルを重ねて告知）。
    なんちゃらアイドルはバンド編成での出演。終演後は「ラママ、Q太郎生誕
    ありがとうございました！めっちゃ楽しかった……。」（samami27）「大盛況
    ありがとうございました！なんちゃら的には初の動員100オーバーでした！
    お花はめろん畑さんから！電報もいただにました！」（nantyaraidol）と感想。

