- id: event-20190505-lush
  slug: 20190505-lush
  date: 2019-05-05 12:20:00 +0900
  title: なんちゃらアイドル ライブ（渋谷LUSH）
  site: 渋谷LUSH
  content: |
    渋谷LUSHでの昼公演。同日夜には渋谷La.mamaでの「DADAフェス」出演もあり
    （別イベントとして本ドラフト末尾に転記）、samami27の言い方を借りれば
    「渋谷Day」のはしご1本目。事前告知「明日はお昼に渋谷LUSH、夜は渋谷ラママ
    の渋谷Day！LUSHは12:20から、ラママ は21:10からバンド編成です！がんばるぞー！」
    （samami27、5/4）。終演後は「昼LUSHライブありがとうございました！昼のライブは
    終わっても、まだ1日があっていい感じ楽しい！夜は渋谷ラママでライブします
    けんねー！」（samami27）「渋谷LUSHありがとうございました！昼間っから
    アツアツだったね。次は渋谷La.Mama！」（yokuwakan_nai）と感想。イベント名・
    対バン相手の具体名の言及は本文には見当たらない。

    ※Xの告知アーカイブから復元。なんちゃらアイドルの開始時刻(12:20)をdateに採用
