  content: |
    蒲田オッタンタで開催された「大田区蒲田復興協会(OKFK)」。ゲストに恵中瞳氏、
    ザ・アイドルズのへーちゃんがボーカルを務める新バンドのお披露目もあった。
    翌6/1からの東北（青森・秋田）遠征出発前最後のライブでもある。事前告知
    「明日は大田区蒲田復興協会！なんとゲストは恵中瞳さん！と、ザ・アイドルズ、
    へーちゃんがボーカルを務めるニューバンドのお披露目も！ぜひいらしてください！
    蒲田オッタンタ19時！」（nantyaraidol、5/30）。当日は「今日は大田区蒲田
    復興協会ですよー！蒲田オッタンタにて！出番最初です！」（yokuwakan_nai）。
    終演後は「OKFKにてなんちゃらアイドル、レストランインフィッシュ
    ありがとうございました！先に抜けてすみません！私たちはもう青森を見ている」
    （yokuwakan_nai）「今日はありがとうございました！明日からは東北ツアー！
    頑張ります！」（nantyaraidol）と感想。

    ※Xの告知アーカイブから復元。イベント全体の開演時刻(19時)をdateに採用。
    なんちゃらアイドルの出番は「最初」とのみ言及されており厳密な出番時刻では
    ない可能性に留意
