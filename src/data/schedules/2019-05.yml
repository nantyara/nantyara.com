- id: event-20190526-ottanta
  slug: 20190526-ottanta
  date: 2019-05-26 20:15:00 +0900
  title: 蒲田オッタンタ24周年記念イベント
  site: 蒲田オッタンタ
  content: |
    蒲田オッタンタの24周年を祝う記念イベント（通常の「大田区蒲田復興協会
    (OKFK)」企画とは別枠で、周年イベントとして招聘された）。事前告知
    「今日は蒲田オッタンタの24周年を祝うよ！20:15から歌います！」
    （yokuwakan_nai）「本日、蒲田オッタンタにてライブです！今日はOKFKでは
    なく、周年イベントに呼んでいただきました！なんちゃらは20:15〜 歌います
    ので、どうぞよろしくお願いします！」（samami27）。終演後は「蒲田オッタンタ
    24周年おめでとう！会場がハッピーで溢れててマジ最高でした。蒲田いい街すぎ。
    そんなオッタンタ、今週の金曜日31日も出ます。香栄さんと共同主催の大田区
    蒲田復興協会です。」（yokuwakan_nai）「オッタンタライブありがとうございました！
    24周年めでたいな〜！ほぼタメだ！ね！」（samami27）と感想。対バン相手の
    具体名の言及は本文には見当たらない。

    ※Xの告知アーカイブから復元。なんちゃらアイドルの出番時刻(20:15)をdateに採用。
