    - https://x.com/samami27/status/1124579749756456960
    - https://x.com/samami27/status/1124921146212667392
    - https://x.com/yokuwakan_nai/status/1124933541291184128
- id: event-20190505-lamama-dada
  slug: 20190505-lamama-dada
  date: 2019-05-05 21:05:00 +0900
  title: 「DADAフェス」（渋谷La.mama）
  site: 渋谷La.mama
  content: |
    渋谷La.mamaで開催された対バンイベント「DADAフェス」（バンド編成での出演）。
    同日昼の渋谷LUSHとのはしご2本目（LUSH側は別イベントとして本ドラフトに
    転記済み）。事前告知「5/5(日)渋谷ラママ『DADAフェス』なんちゃらアイドル
    (バンドver)で出演します！昼から夜までの盛り沢山なイベント！！なんちゃら
    アイドルバンドは 21:05～」（nantyaraidol、5/1）「夜は渋谷ラママ の渋谷Day！
    ...ラママ は21:10からバンド編成です！」（samami27、5/4。開始時刻の記載が
    21:05/21:10で1件ずつ揺れている）。終演後は「渋谷La.MamaにてDADAフェス
    ありがとう。きもちかった！...ドクちゃん虹色じゃむ卒業おめでとう
    おつかれさまでした！」（yokuwakan_nai）「本日は2本ライブありがとうございました！
    DADAフェス楽しかった〜」（samami27）と感想。フルの対バンラインナップの
    言及は本文には見当たらないが、虹色じゃむのメンバー「ドクちゃん」の卒業回
    だったことが判明している。

    ※Xの告知アーカイブから復元。事前告知時点の出番時刻(21:05)をdateに採用
  sources:
    - https://x.com/nantyaraidol/status/1123725369767596032
    - https://x.com/yokuwakan_nai/status/1125052437243416576
    - https://x.com/samami27/status/1125052620207312896
