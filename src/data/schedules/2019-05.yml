- id: event-20190529-lamama-qtaro
  slug: 20190529-lamama-qtaro
  date: 2019-05-29 22:00:00 +0900
  title: 「Q太郎生誕記念ライブ 39歳の春だから。」（渋谷La.mama）
  site: 渋谷La.mama
  labels:
