  content: |
    渋谷La.mamaでの御茶海マミ生誕祭（#みさみさんじゅっさい）。出演（ぢょにぃとぶるうすばんど・POPPY救済ユニット『期間限定CHIYOPPY』・GARUDA・なんちゃらアイドル・御茶海マミ、open18:30/start19:00）は前月2024-01アーカイブのsamami27 1/10投稿の全文告知で確認済み。終演後「本日は #みさみさんじゅっさい にご来場いただきありがとうございました！
    動画でスクショするといいましたが、動画で載せたほうがいいなって思って動画載せます！
    ちょぴちゃん、GARUDAさん、ぢょにぃとぶるうすばんどの皆さま、そして、ご来場くださった皆さま、本当にありがとうございます！幸せ！」（samami27、2/8深夜0:35、投稿は2/8だが「本日」は前日2/7を指しており実質2/7分の御礼）で有観客開催を確認（「ちょぴちゃん」はCHIYOPPYを指すと見られる）。

