# 今回のアーカイブはgrok CLIで収穫されたもの（画像内容の目視確認は元々未実施）。
# 画像内容からの推測は行わず、本文テキストで検証できる事実のみ転記した。
# 2021年3月も緊急事態宣言下（1都3県は2021-03-21解除）で、配信のみ（無観客）のイベントは
# 転記対象外。実会場・有観客の開催が本文（事後の「ありがとうございました」等）から
# 確認できたもののみ転記した。
#
# 日時はすべて post の time フィールド（UTC）を JST（+9h）に変換した上で「本日/今日/明日/
# 明後日」等の指し示す日付を確定している。
