- id: event-20210304-lamama-giantkilling-special
  slug: 20210304-lamama-giantkilling-special
  date: 2021-03-04 12:00:00 +0900
  time_tbd: true
  title: なんちゃらアイドル主催「giant killing special」（渋谷La.mama）
  site: 渋谷La.mama
  acts:
    - スキップカウズ
  content: |
    渋谷La.mamaでの、なんちゃらアイドル主催「giant killing special」（平日昼間開催の
    予約制企画）。前日告知「明日ほんと来てほしい！なんちゃらのルーツ、新宿JAMと
    スキップカウズがラママでクロスするんよ。そしてなぜか運営はベーシストとしてラママ
    デビューするとのことです（過去の生誕で一瞬歌ったことはある）。」（nantyaraidol）。
    終演後「giant killing special@渋谷La.mamaありがとうございました！なんちゃらの
    ジャイアントキリング企画すごいな…とドキドキしちゃうね…！」（samami27）、
    「感無量ですありがとうございました！」「ライブとしても、商業としても、平日昼間でも
    勝てるんよ！」（nantyaraidol）、「即完売ありがとうございます！こういう新しい試みが
    受け入れられるのほんと嬉しいです！」（nantyaraidol）、「ラママジャイアントキリング
    ありがとうございました！！ふたりスキップカウズさんと共演できて、あと石塚さんとも
    一緒にステージに乗れて、夢みたいな日でしたね。」（yokuwakan_nai）で有観客開催を確認。
    石塚さん（新宿JAM関係者）とも共演したことが読めるが、バンド名等ではないためactsには
    含めていない。3/16の「Giant Killing vol.6」とは別枠の「special」と本文に明記されて
    いる。

    ※Xの告知アーカイブから復元。開演時刻が本文に見当たらないため time_tbd とした。
  sources:
    - https://x.com/samami27/status/1367444569537662981
    - https://x.com/nantyaraidol/status/1367445823902998530
    - https://x.com/nantyaraidol/status/1367485289262891019

