#
# releases.yml裏取り候補（編集は今回しない）:
#   - **「Ivory song 2021」**: 3/7告知「明日は某所にてレコーディング！これはとある
#     コンピに収録します。ネタバラシしちゃいますが、やらせてもらいます、
#     「Ivory song 2021」来月発売予定！」（nantyaraidol）。3/18「ivorysongはどうしても
#     なんか気に入らなくて、こないだ3回目のレコーディングをしてきたのですが、その
#     2021version、はやく聴いてもらいたいなー。」（nantyaraidol）。2017年アーカイブで
#     確認済みの初代「Ivory song」（永久絶盤）の再録・コンピ収録版。4月発売予定のため
#     4月アーカイブでの裏取りが必要
#   - **新曲2曲**: 4/13-14レコーディング決定の新曲について、3/24「明日は新曲2曲歌います！
#     今日れこじんぐしたのではないやつです！春からなんちゃらはいろいろリリースしていく！」
#     （nantyaraidol）。3/25 3/25に披露された2曲の詳細（曲名）は本文に見当たらず
#   - **あんにゅとのコラボシングル**: 3/30「あんにゅちゃんとのコラボが楽しすぎたので、
#     なんと、5月6日、また同じろく夜で、あんにゅちゃんとの対バンが決定！しかも！！！！
#     次回はオリジナル曲でのコラボ！そしてその曲は後日CDとして正式リリースします！」
#     （nantyaraidol）。5月アーカイブでの裏取りが必要
#
# history.yml棚卸し候補（今回は追記しない・発掘完了後にまとめて見直す方針）:
#   - **2021-03-31「なんちゃら解散しないことになりました」**: 「なんちゃら解散しないこと
