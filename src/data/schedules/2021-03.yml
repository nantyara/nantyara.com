- id: event-20210302-lovetko
  slug: 20210302-lovetko
  date: 2021-03-02 17:00:00 +0900
  title: なんちゃら弾き語り百鬼夜行（東新宿LOVE TKO）
  site: 東新宿LOVE TKO
  content: |
    東新宿LOVE TKOでの弾き語りライブ「なんちゃら弾き語り百鬼夜行」。告知「百鬼夜行上手く
    かけた〜！本日、東新宿LOVE TKOにて『なんちゃら弾き語り百鬼夜行』！オープン16:30
    スタート17:00 料金は2500円＋ドリンクです〜！」（samami27）。同日「雨のせいかキャンセル
    多し！当日でも全然大丈夫！前売り料金にします！」（nantyaraidol）という当日案内もあり。
    終演後「なんちゃら弾き語り百鬼夜行ありがとうございました！『夏をあきらめて』を
    アンセムにして極めるゾ…！と思った日でした。」（samami27）で有観客開催を確認。
    共演者は本文に見当たらない。

