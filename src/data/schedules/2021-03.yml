#     ゲストに鼠先輩
#   - 3/17-18 Colorful×Candy鎌倉撮影会: 鎌倉での撮影会企画。両日にまたがる可能性があるが
#     詳細な会場名・時刻は本文に見当たらずtime_tbd。★venues.yml新規候補
#   - 3/20 鶴橋SECTION3(大阪): 大阪遠征1日目・バンドセット。開演時刻は本文に明記されて
#     いないが、YouTubeライブ配信が20:15頃(JST)から投稿されておりその前後と推定
#     （time_tbdとし、参考時刻として20:15を採用）
#   - 3/21 堺ファンダンゴ「酒相撲」: 大阪遠征2日目・なんちゃらトッパー(オープニングアクト)
#     16:50〜。OA食笑は16:30〜
#   - 3/25 不動前TRIO: 開演時刻・詳細不明の簡潔な事後報告のみだが有観客開催を確認できたため
#     time_tbdで転記
#   - 3/26(24:00)〜3/27(4:30) BarS.B.Q(BAR無人島): あおはる(? ゲストバーテンダー名義
#     「土萌まりな」)が一日バーテンダーを担当するバー企画。24時始まりのためdateは
#     2021-03-27 00:00とした。次回開催(5/14)の告知で実施を確認
#   - 3/27 東中野るかち主催「Dreaming Night」: 予約完売。開演時刻不明のためtime_tbd。
#     ★venues.yml新規候補
#   - 3/27 下北沢ろくでもない夜「ろくでもない女達フェス」: 20:15〜。るかちイベントの後に
#     移動して出演
#   - 3/28 渋谷Club Malcolm 無銭ライブ: 料金無料。開演時刻不明のためtime_tbd
#   - 3/29 築地元帥(居酒屋): アコースティックライブ・カラオケ。開演時刻不明のためtime_tbd。
#     ★venues.yml新規候補
#   - 3/30 下北沢ろくでもない夜「あんにゅ祭り」: あんにゅ(mc_annyu)とのコラボ企画・屋台あり。
#     開演時刻不明のためtime_tbd
