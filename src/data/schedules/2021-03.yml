# venues.yml新規候補（今回は編集しない）:
#   - 原宿クロコダイル（3/7 なんちゃらバンド編成ライブ会場）
#   - 東中野るかち（3/27「Dreaming Night」主催会場。ライブスペース/バーと思われるが
