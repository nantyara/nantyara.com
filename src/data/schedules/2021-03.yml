  title: 「あんにゅ祭り」（下北沢ろくでもない夜）
  site: 下北沢ろくでもない夜
  acts:
    - あんにゅ
  content: |
    下北沢ろくでもない夜での、あんにゅ（mc_annyu）とのコラボ企画「あんにゅ祭り」。前日
    「この日は大好きなあんにゅちゃんとコラボ曲やるから来てほしい！あと、屋台もやる。
    ホットサンド屋さんやる。なんでも挟むよっ！」（nantyaraidol）、「明日はキャスから
    下北沢ろくでもない夜にてあんにゅ祭り！なんたらはあっためたパンだすよ」（samami27）。
    終演後「あんにゅ祭りありがとうございました！今日は1日トップギア！」（samami27）、
    「本日は下北沢ろくでもない夜、ありがとうございました！あんにゅちゃんとのコラボが
    楽しすぎたので、なんと、5月6日、また同じろく夜で、あんにゅちゃんとの対バンが決定！
    しかも！！！！次回はオリジナル曲でのコラボ！そしてその曲は後日CDとして正式リリース
    します！」（nantyaraidol）で有観客開催を確認。ライブ配信（キャス）と併用の可能性が
    示唆されているが、終演後の御礼投稿から実会場での有観客開催と判断した。開演時刻は
    本文に見当たらない。

    ※Xの告知アーカイブから復元。開始時刻が本文から確認できないため time_tbd とした。
