- id: event-20210313-katorinu
  slug: 20210313-katorinu
  date: 2021-03-13 12:00:00 +0900
  time_tbd: true
  title: すたじおかとり〜ぬ（Ray'n'Coatとツーマン）
  site: すたじおかとり〜ぬ
  acts:
    - Ray'n'Coat
  content: |
    新検見川のすたじおかとり〜ぬでの、Ray'n'Coatとのツーマンライブ。前日「明日これです！
    レインコートさんとのスペ猿コラボもありんすよ〜。」（nantyaraidol、レインコートは
    Ray'n'Coatの表記ゆれ）。終演後「スタジオかとりーぬ、Ray'n'Coatさんとツーマンでした！
    ご来場くださった皆さまありがとうございます！写真はわたしと素晴らしい配分のビールと
    おいしい職人の天丼です！」（samami27）、「新検見川かとり〜ぬありがとう🐶 今日も最高の
    天丼食べて歌いまくったよ！」（yokuwakan_nai）で有観客開催を確認。本文表記は
    「スタジオかとりーぬ」「新検見川かとり〜ぬ」だが、既存venues.yml登録の
    「すたじおかとり〜ぬ」（id: studio-katorinu、新検見川駅エリアの音楽スタジオ）と
    同一と判断しsiteに採用した。開演時刻は本文に見当たらない。

