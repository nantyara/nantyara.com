- id: event-20190726-okfk-piano
  slug: 20190726-okfk-piano
  date: 2019-07-26 12:00:00 +0900
  time_tbd: true
  title: 大田区蒲田復興協会（OKFK）新会場・とりおろしカバーシングル無料配布
  site: OKFK新会場（蒲田・ピアノのある空間）
  labels:
    - 主催ライブ
  content: |
    「大田区蒲田復興協会（OKFK）」の新会場での開催。事前告知「7月26日はOKFK！今回ははじめての
    会場になります！ピアノを活かした構成でお届け！おしゃれ空間！美味しいカレーも600円！今回
    よりまた、とりおろしカバーシングルの無料配布をします！2曲入！お楽しみに！希望先着10名様！
    あとこの日は無料参加な打ち上げもあり！」（nantyaraidol、7/24）。配布CDについて「配布CDは、
    エロいブロマイド付です！今回はあそびなし、全部エロ！」「カバー音源は過去に配布したものも
    ふくまれます！」（nantyaraidol）。当日は「今日はOKFKですわよ！ピアノとカレーがある箱」
    （yokuwakan_nai）。終演後は「OKFK満席ありがとうございました！全部のライブが本気だけど、
    正直に言うけど、これは来て欲しい！見てもらいたい！という気持ちが一際強いライブはやはり
    ありまして、OKFKはそのひとつです。餃子も美味しかった！」（nantyaraidol）と感想。会場の
    正式名称は本文には見当たらない（「わかりづらいかもですがここの地下」という画像添付投稿は
    あるが、画像内容から推測せず未確認扱いとした）。開演の具体的な時刻・対バン相手の具体名の
    言及も本文には見当たらない。

