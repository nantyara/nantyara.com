- id: event-20190730-firebird
  slug: 20190730-firebird
  date: 2019-07-30 12:00:00 +0900
  time_tbd: true
  title: ロットンさん（ブッキングマネージャー）引退記念イベント（新松戸FIREBIRD）
  site: 新松戸FIREBIRD
  content: |
    新松戸FIREBIRDで開催された、ブッキングマネージャー「ロットン」氏の引退を祝うイベント。
    前日には花束贈呈の言及「なんちゃら、くうがさんさとうさんやんちゃさんゆっきさんゆみたか
    さんかなしきさんやまりんさんだいおうさんずんさん（表明順）より、大好きなロットンさんへ！
    ロットンさんの企画のおかげでほんとに素敵な出会いがたくさんありました。」（nantyaraidol）。
    事前告知「本日！ロットンさんの新しい門出だ！みんな踊れ〜〜〜！！」（samami27）「本日は
    新松戸FIREBIRDだよ。愛すべきロットンさんの門出をお祝いするべく勇んでおりますぞい。対バンも
    最っ強！！！」（yokuwakan_nai）。終演後は「新松戸FIRE BIRDありがとうございました！ロットン
    さんの門出を祝ってまいりました！呼んでくれてありがとう！また対バンしたいなー！」
    （samami27）「新松戸FIREBIRDありがとうございました！そしてロットンさんブッキングマネージャー
    引退お疲れ様です！」（yokuwakan_nai）と感想。開演の具体的な時刻・対バン相手の具体名の
    言及は本文には見当たらない（「対バンも最っ強」とあるが具体名は不明）。

    ※Xの告知アーカイブから復元。開演の具体的な時刻の言及が本文に見当たらないため time_tbd
    とした
