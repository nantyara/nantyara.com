  title: 「SHINZAN presents Jour de muget〜真夏の夜の夢〜」（新宿Livefreak）
  site: 新宿Livefreak
  content: |
    新宿Livefreakで開催された対バンイベント「SHINZAN presents Jour de muget〜真夏の夜の夢〜」。
    事前告知「SHINZAN presents Jour de muget〜真夏の夜の夢〜 2019/7/28 @新宿Livefreak オープン
    15:15 スタート 15:40 チケット2500円+ドリンク なんちゃらは18時50分から30分やりまうす！」
    （nantyaraidol、7/27）。当日は「日付変わって本日！新宿フリークにてライブです！なんちゃらは
    18:50〜歌います！」（samami27）「あつがなついですが、本日新宿フリークにてお待ちしております
    ！来場者特典があるそうな！」（samami27）。終演後は「新宿フリークありがとうございました！
    楽しかった〜！モノマネすごかった！」（samami27）と感想。対バン相手の具体名の言及は本文には
    見当たらない。

    ※Xの告知アーカイブから復元。なんちゃらアイドルの出番時刻(18:50)をdateに採用。新宿Livefreak
    はvenues.yml未登録のため新規候補として提示（下記コメント参照）。事後ポストでの略称「新宿
    フリーク」をaliasesへの追加候補として提示
