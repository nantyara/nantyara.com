  title: 下北沢Breath 9周年
  site: 下北沢Breath
  content: |
    下北沢Breath 9周年を祝うライブ。事前告知「本日のライブはこちら！下北沢ブレスというご飯が
    おいしい箱です！今日もご飯あるのだろうか…！お待ちしておりやす！」（samami27）「控え室に
    プラス外があって、ビアガーデンぽくてここでビール飲みたいなって思った。暑いからちょっと
    やめといたけど。21:30頃から歌います！下北沢ブレスにて待ってるね…！」（samami27）。終演後は
    「下北沢BREATHありがとうございました！9周年おめでとうございます！」（samami27）と感想。
    対バン相手の具体名の言及は本文には見当たらない。

