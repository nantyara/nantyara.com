  title: 第20回LiLee＋phallus定期公演（神保町楽屋）
  site: 神保町楽屋
  content: |
    神保町楽屋への初出演となる「第20回LiLee＋phallus定期公演」。事前告知「第20回LiLee＋phallus
    定期公演 りりたすふぁるすと一緒にやりまShow!そのにじゅう！7/6 土曜日 神保町楽屋 〒101-0051
    東京都千代田区神田神保町１丁目４２−７ 03-3518-9496 Open18:00 Start19:00 料金 前売2500円
    ＋１D 当日3000円＋１D」（nantyaraidol、7/5）。翌日にはソールドアウトの告知「すいません、
    こちらソールドアウトとのことで当日券ありません！」（nantyaraidol）。終演後は「神保町楽屋
    ありがとうございました！はじめての箱でした！ご飯とお酒がおいしくて、お客様みんな優しかった
    …！なんちゃら楽しんでいただけましたでしょうか…！李梨さんと出会って5年くらいか…！」
    （samami27）と感想。なんちゃらアイドル自身の出番時刻の言及は本文には見当たらない。

