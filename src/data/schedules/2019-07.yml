- id: event-20190716-shelter
  slug: 20190716-shelter
  date: 2019-07-16 20:00:00 +0900
  title: 「SHELTER presents. Girls POP」（下北沢SHELTER）
  site: 下北沢SHELTER
  acts:
    - キャンディzooナイトメア
