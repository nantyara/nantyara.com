- id: event-20190723-rokudemonai-yoru
  slug: 20190723-rokudemonai-yoru
  date: 2019-07-23 12:00:00 +0900
  time_tbd: true
  title: トークライブ・飲み会企画（下北沢ろくでもない夜）
  site: 下北沢ろくでもない夜
  content: |
    下北沢ろくでもない夜での企画（リハから飲酒しながら歌とトークを繰り返す、飲み会形式の
    トークライブ）。事前告知「本日こちら！リハから酒を飲みまくり入れ代わり立ち代わりで何度も
    歌ったりトークをしたりするとの事です！飲み会みたいな気持ちで来てください！」
    （yokuwakan_nai）「今日は飲み会のようなライブだそうですぞ！飲み行こうねって言ってた人たち
    と飲み会イベントだ！なんちゃらにしては珍しいトークライブ…！」（samami27）「21時半くらい
    には終わって物販になりそうな流れです！」（yokuwakan_nai）。会場名は当日投稿には明記が
    なかったが、翌日の投稿「昨日はろくでもない夜ありがとうございました！楽しいろくでもない
    夜でした！」（samami27）により下北沢ろくでもない夜での開催と確認できた。開演の具体的な
    時刻・対バン相手の具体名の言及は本文には見当たらない。

