    再告知「出演：なんちゃらアイドル、キャンディzooナイトメア、ゑりかちゃんべいびーと真戸
    しずく、池田朱里 無料イベなので、無料でCDも配ります！『さよならODYSSEY』というシングルを
    みんなにpresent！」（nantyaraidol、7/14）。当日は「本日、下北沢シェルター！無銭ライブです！
    （ドリンク代はあります）なんちゃらは20時から！」（samami27）。終演後は「下北沢シェルター
    ライブありがとうございました！CD足りずごめんなさい！新規の方に譲ってくれた方々に感謝
    …！」（samami27）と感想。

