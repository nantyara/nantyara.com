  content: |
    下北沢SHELTERで開催された無料対バンイベント「SHELTER presents. Girls POP」（急遽決定）。
    事前告知「■7/16(火)下北沢シェルター SHELTER presents. "Girls POP" OPEN 18:30 / START
    19:00 無料（2ドリンク¥1200のみ） 出演：キャンディzooナイトメア、なんちゃらアイドル and
