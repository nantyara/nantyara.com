  content: |
    渋谷La.mamaでのなんちゃらアイドル主催3マンライブ「ビジネス仲良しスリーマン」。
    告知（最終版）「2021年5月29日 なんちゃらアイドル主催 ビジネス仲良しスリーマン！
    in渋谷ラママ！なんちゃら！インモラ！ヒゲ味噌！そしてfoodにはきしぱん先生！16時半
    start！お値段は2500円！コラボとかもあります！なんちゃらはバンド編成でやります！」
    （nantyaraidol、opening actにS.B.Q.アイドル部）。なんちゃらアイドル運営Q太郎の誕生日
    イベントも兼ねる。終演後「ラママライブありがとうございました！バンド楽しいねぇ！」
    （samami27）、「80名限定のところ、70数名というナイスコントロールな満員御礼」
    （nantyaraidol）で有観客開催・盛況を確認。

    ※Xの告知アーカイブから復元。dateは告知記載の開始時刻（16:30）。
