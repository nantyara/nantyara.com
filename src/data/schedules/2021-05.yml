    リスターR）へバトンタッチする構成。なんちゃらバンドの新宿スタジオ練習後の打ち上げ
    会場も兼ねる。正式なチケット制ライブではなくバー営業＋打ち上げ企画のため、通常の
    「ライブ」とは性質が異なる点に留意。

