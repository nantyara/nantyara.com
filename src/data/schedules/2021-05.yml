- id: event-20210501-supercurry-kamui
  slug: 20210501-supercurry-kamui
  date: 2021-05-01 19:00:00 +0900
  title: スープカレーカムイ「1日プロデュース」
  site: スープカレーカムイ
  content: |
    カレー店「スープカレーカムイ」でのコラボ日（1日プロデュース）。告知「今日はカレー記念日
    だわよ〜」に続けて「カレーがとてもうまい…！今日仕込んでくださったスープですって…！
    めちゃうまなのでくる予定をたててくれている方、楽しみにしててねーー！ライブは19:00〜！」
    （samami27）。「開店しましたー！」（nantyaraidol）で開店を確認。終演後「スープカレー
    カムイさんとのコラボ日ありがとうございました！たくさん来てくれて、お客さんみんないい
    方たちだねって褒めてもらって…」（samami27）、「カレーライブありがとうございました。
    こういうイベントはほんと誰にも負けないよあーしたちは。」（nantyaraidol）で有観客開催を
    確認。イベント名・共演者は本文に見当たらない。

    ※Xの告知アーカイブから復元。dateは告知記載のライブ開始時刻（19:00）。
  sources:
    - https://x.com/samami27/status/1388382891877433344
    - https://x.com/nantyaraidol/status/1388470708653592578

