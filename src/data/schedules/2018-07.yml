- id: event-20180730-lamama
  slug: 20180730-lamama
  date: 2018-07-30 12:00:00 +0900
  time_tbd: true
  title: なんちゃらアイドル主催「なんちゃらフェス」（渋谷La.mama）
  site: 渋谷La.mama
  labels:
    - 主催ライブ
  content: |
    渋谷La.mamaでのなんちゃらアイドル主催イベント「なんちゃらフェス」。7/7時点で既に
    「7月30日渋谷ラママで主催ライブです♡」（samami27）と予告されていた。当日は「今日の
    渋谷ラママ、初めての人もおまいつも、どどんと集合してくれー。予約とかなしでふらりと
    来ても大丈夫です！乾杯しよう」（yokuwakan_nai）「明日ラママ主催、超〜〜来てほしい！」
    （yokuwakan_nai）と告知。当日は運営が60人分の焼きそばを自作して振る舞う企画も実施
    （「なんちゃら焼きそば（レシピ御茶海、調理運営、盛り付けあおはる）、60人前完売！」）。
    終演後は「ラママなんちゃらフェスありがとうございました！！激しくて気絶しそうだった！
    楽しかった！！」（samami27）「なんちゃらアイドルフェス渋谷ラママありがとうございました
    ！！！こういうライブがずっと語り継がれていくんだろうなあ、、、」（yokuwakan_nai）と
    感想。イエモン・ミスチル・ジュンスカ・ゴイステら「先人達の呪い」に言及するなど、
    ラママという会場そのものへの思い入れも感じられる回だった。他の出演者（対バン相手）に
    関する具体的な言及はアーカイブ中には見当たらなかった。

    ※Xの告知アーカイブから復元。「なんちゃらフェス」というシリーズ名は2016-11-11の
    初開催（新宿JAM）以来のもの。history.yml への追記（フェスシリーズとしての整理）は
    全期間発掘完了後にまとめて棚卸しする方針のため今回は見送り。開演・出番の具体的な
    時刻の言及が見当たらないため time_tbd とした
