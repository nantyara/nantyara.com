- id: event-20180708-milkyway
  slug: 20180708-milkyway
  date: 2018-07-08 12:00:00 +0900
  time_tbd: true
  title: 星野百花（ぽよ）1周年記念企画コラボライブ
  site: 渋谷Milkyway
  acts:
    - 星野百花
  content: |
    渋谷Milkywayでの、星野百花（愛称「ぽよ」）の企画ライブにコラボ出演。事前告知「明日は
    渋谷ミルキーウェイ！ぽよとコラボするよ！猫も来るとか来ないとか？！」（nantyaraidol、
    7/7昼）、「真夜中告知失礼致します！日付けかわってほんじつ昼間！渋谷Milkywayにでぽよこと
    星野百花さんの企画です！ぽよがぽよになって1周年だって、めでたいからぽよとコラボするぞ！」
    （yokuwakan_nai、7/7深夜=7/8扱い）。終演後は「朝からありがとうございました！！ぽよに
    出会えてよかったなぁ。」（samami27）「ぽよ1周年ライブat渋谷Milkywayありがとうございました！
    星野百花さん、とても美しかったですね。旅講座を一緒に歌ってくれて(しかもスク水で)、感無量
    でした。」（yokuwakan_nai）と感想。「朝から」「汗だくで食事」等の言及から日中〜昼のライブ
    と推測される。

