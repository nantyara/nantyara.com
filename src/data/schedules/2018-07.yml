- id: event-20180701-heavensdoor
  slug: 20180701-heavensdoor
  date: 2018-07-01 19:40:00 +0900
  title: 桂木ヤコブソン（鮭）レコ発ライブ・オープニングアクト
  site: 三軒茶屋HEAVEN'S DOOR
  acts:
    - 桂木ヤコブソン
  content: |
    三軒茶屋HEAVEN'S DOORでの「鮭さんち」桂木ヤコブソンのレコ発ライブに、なんちゃらアイドルが
    オープニングアクトとして出演。事前告知「本日！！！鮭さんちの桂木ヤコブソンさんがレコ発だから
    賑やかしに行きます。なんちゃらはオープニングアクト19:40からと〜！！？？22時くらいになんかを
    やるかもねっ！やらないかもねっ！気合い入れてるのでみんな来ておくれ。」（yokuwakan_nai）。
    「今日の鮭主催レコ発は、なんちゃら主催ライブと思って来てもよいよ。」（nantyaraidol）とも
    投稿し、共催に近い関わりであったことがうかがえる。終演後は「イエーイ三軒茶屋ヘブンスドア
    ありがとうございました！桂木ヤコブソンさんの一味に加えてもらいました。」（yokuwakan_nai）
    「本日は桂木ヤコブソンさんのレコ発ライブのオープニングアクトをつとめさせていただきました！」
    （samami27）と報告。次回（7/7・七夕）も同会場での出演が予告された。

    ※Xの告知アーカイブから復元。オープニングアクトとしての出番時刻(19:40)をdateに採用
