- id: event-20180729-firebird
  slug: 20180729-firebird
  date: 2018-07-29 12:00:00 +0900
  time_tbd: true
  title: 新松戸FIREBIRDライブ（中出し少年とのツーデイズ1日目）
  site: 新松戸FIREBIRD
  acts:
    - 中出し少年
  content: |
    新松戸FIREBIRDでのライブ。「中出し少年」とのツーデイズ企画の1日目。事前告知「明日は
    新松戸FIREBIRDでライブです！画像は、タイテなどがわかりやすい天才フライヤーとスイカ
    です。」（samami27）「明日は新松戸FIREBIRDでこちら！タイテを見るだけで圧倒されるような
    企画ですね...FIREBIRDはご飯も美味しいし長居しやすい空間だと思いますので皆様是非
    最初から！いらしてください！中出し少年さんとのツーデイズ1日目でもある！」
    （yokuwakan_nai）。フライヤー画像にタイムテーブルが記載されていた旨の言及があるが、
    本セッションではテキストアーカイブのみを参照しており画像内容は未確認。終演後は
    「新松戸FIREBIRD、治安が良いですね！」（yokuwakan_nai）「新松戸FIREBIRDありがとう
    ございましたー！最初から最後までずっとアッツアツだったわ、超楽しかった〜〜〜！！」
    （yokuwakan_nai）「新松戸FIREBIRDありがとうございました！アンコール受けるの嬉しい
    な〜」（samami27）と感想。事前情報にあった「7/28〜29新松戸FIREBIRD 2days」のうち、
    アーカイブから確認できたのは7/29のなんちゃら出演分のみで、7/28については同日は
    御茶海マミの個人撮影会（会場不明・台風で一部キャンセル発生）が確認できるのみで
    FIREBIRD出演を示す投稿は見当たらなかった（詳細は末尾コメント「未転記候補」参照）。

    ※Xの告知アーカイブから復元。フライヤーにタイムテーブルがある旨の言及はあるが、
    本文中に具体的な時刻の記載がないため time_tbd とした
