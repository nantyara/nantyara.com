    フルー 各転換のDJ：ハワイ渡辺/テツコ玲子」（samami27）。「なんたらは20:30からうたい
    まっせ〜」（yokuwakan_nai）と出番時刻も告知。「フルー」がユニット表記中と単独表記の
    両方に出てくるため、対バン枠か企画名/コーナー名なのか判別しづらく、acts には
    「ちぇる(tasotokyo)」「パナシズシ(フルー)」の表記のまま含めた。終演後は「本日は
    高円寺ショウボート、ビートハプニングありがとうございました！初心（ういごころ）を
    取り戻すようなライブができたかなと…！」（samami27）と感想。

    ※Xの告知アーカイブから復元。なんちゃらアイドルの出番時刻(20:30)をdateに採用
