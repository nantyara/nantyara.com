  title: 東京砂漠ライブ（1本目）
  site: 東京砂漠
  content: |
    1月27日は東京砂漠と西新宿TOGI Barのはしご2本立て（セットリストかぶりなし）。
    前日の告知で「なんちゃらアイドルは12:15～と18:30～です！」とあるが、
    どちらの時刻がどちらの会場に対応するかは本文からは断定できない。当日朝
    「二部はじまたデス」というツイート（16:40頃JST）があり、これが後述の
    西新宿TOGI Bar（1月23日から続く「雪合戦」企画の第2弾、夜の開催と推測）を
    指すと仮定すると、消去法で本イベント（東京砂漠）は先の12:15〜と推定される。
    終演後（1/28未明）に「久しぶりの東京砂漠さんでした！」との感想ツイートあり。

    ※Xの告知アーカイブから復元。会場と時刻の対応は確度が高くない推定（詳細は
    content参照）ため、裏取りが取れ次第見直すこと
