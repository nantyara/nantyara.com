# 2018年1月（/mine-x による X 告知アーカイブからの発掘。ソース: mining/x-archive/2018-01.json, mining/x-archive/2017-12.json）
- id: event-20180101-jam
  slug: 20180101-jam
  date: 2018-01-01 00:20:00 +0900
  title: 新宿JAM 2018年トップバッター（新宿JAM最後のライブ）
  site: 新宿JAM
  content: |
    大晦日はしごライブの2本目（1本目は三軒茶屋HEAVEN'S DOORで2017-12-31 21:55〜、
    そちらは2017-12として既に転記済み）。年越しをまたいで新宿JAMに移動し、
    「2018年のトップバッター」として出演。事前告知では開演時刻が「24時30分から」
    （12/28のnantyaraidol告知）→「24:20〜」（12/30のsamami27告知、直近の更新）と
    ゆれており、本エントリの開始時刻は後者（より当日に近い更新）を採用した。
    西暦をまたいだ深夜0時台なので、実質的には2018年1月1日 00:20頃の開演。

    終演直後（12/31 21:12 UTC=1/1 6:12 JST頃）のツイートで
    「なんちゃらアイドルが産まれるきっかけとなった新宿JAM。2018年トップバッターを
    務めさせて頂きました。そして、これがなんちゃらアイドルにとって最後のJAMライブ
    となりました。」と明言されており、これが文字通り新宿JAMという箱で演奏した
    最後の日となる。history.yml には既に「2017-10-20 ホーム・新宿JAMでの最後のライブ」
    という記述があるが、それとは別に本イベントが存在する。同店の閉店に伴い、
    「ホームとしての最後」「実際に箱で演奏した最後」など複数回の"最後"イベントが
    あった可能性が高く、矛盾ではなく別イベントとして扱う。

    このあと、大晦日〜元日はしごの3本目として「早稲田あかねで朝くらいまで初詣」との
    告知もあったが、これはライブ出演ではなく「滞在後に初詣に行った」という趣旨に
    読め、2018-01.json内にもライブ出演を裏付ける実況・お礼ツイートが見当たらないため
    転記しない（未転記候補として別途申し送り）。

    ※Xの告知アーカイブから復元。開演時刻は直前更新のツイート（24:20〜）を採用
  sources:
    - https://x.com/yokuwakan_nai/status/946097325864230917
