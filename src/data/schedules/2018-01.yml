- id: event-20180117-lamama
  slug: 20180117-lamama
  date: 2018-01-17 20:20:00 +0900
  title: さすらいの立直一発南南南！～渋谷La.mamaの場合～
  site: 渋谷La.mama
  acts:
    - 工藤ちゃん
    - ザ・アイドルズ
    - ∞処女
  content: |
    『さすらいの立直一発南南南！～渋谷La.mamaの場合～』。会場：渋谷La.mama。
    OPEN 17:45／START 18:00。木戸銭￥2,500（4ドリンク付き）。なんちゃらの出番は
    20時20分から。新宿JAM元店長・石塚さんがLa.mamaでブッキングを始める企画の
    第一弾と位置づけられており、出演には工藤ちゃん、ザ・アイドルズ、
    （初めてライブした時に対バンだったという）∞処女が名前が挙がっている。
    終演後、yokuwakan_naiは「初めての箱だったけどすごくいいところだったな」と
    ツイート（渋谷La.mama初出演）。ノルマも達成できたとのこと。

