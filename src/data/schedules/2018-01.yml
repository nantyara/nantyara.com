- id: event-20180123-heavensdoor
  slug: 20180123-heavensdoor
  date: 2018-01-23 21:20:00 +0900
  title: 三軒茶屋HEAVEN'S DOORライブ（雪合戦企画）
  site: 三軒茶屋HEAVEN'S DOOR
  content: |
    三軒茶屋HEAVEN'S DOORでのライブ。「雪合戦」を絡めた企画で、なんちゃらはトリ。
    前日の告知では「21:20〜！！（21:40という情報もあるけれど、21:20にくれば
    確実です！！）」とあったが、日付が変わって当日（1/23未明）の告知では
    「21:40からがっつり30分間、トリぴよ」、当日朝の告知でも「出番はトリなので
    遅めの21:40からなり」と、直近の情報では21:40に更新されている模様。
    本エントリでは前売り時点の告知（21:20〜）を date に採用しつつ、直前の
    更新（21:40）もこの通り併記する。終演後は「腰が痛すぎて」と苦笑いしつつ
    盛り上がった様子。次回のHEAVEN'S DOORは2月19日と予告。雪合戦企画は
    1月27日、西新宿TOGI Barに続く。

    ※Xの告知アーカイブから復元。開演時刻は21:20（前売り告知）〜21:40（直前更新）で
    ぶれがあるため両方を記載
