- id: event-20180111-otsukameets
  slug: 20180111-otsukameets
  date: 2018-01-11 20:00:00 +0900
  title: さすらいの立直一発南南南！～大塚MEETSの場合～
  site: 大塚MEETS
  content: |
    『さすらいの立直一発南南南！～大塚MEETSの場合～』。会場：大塚MEETS。
    OPEN 18:30／ADV￥2,000。なんちゃらの出番は20時から。「JAMの企画をミーツが
    引き継いだ感じ」との言及あり。御茶海マミはライブ後すぐHAPPY（バー）へ向かう
    との告知も。終演後は「大塚ミーツありがとうございました！ミナミちゃんで
    胸焼けした〜！！」との感想（ミナミちゃんは新宿JAM時代からの知人と思われるが
    出演者かどうか本文からは断定できないため acts には含めていない）。

