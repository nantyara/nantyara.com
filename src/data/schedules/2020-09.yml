- id: event-20200905-outbreak
  slug: 20200905-outbreak
  date: 2020-09-05 13:30:00 +0900
  title: 「じゅんじゅん31周年生誕大宴会〜サーティーワンだよ！全員集合☆〜」（四谷OUTBREAK!）
  site: 四谷アウトブレイク
  acts:
    - 代官山パンク日和
    - ＊FOOD＊ きしぱん
    - さとーさん(回文)
    - 熱海雄一
    - 長倉佳斐
    - 教祖仮面
    - 侍＿崗
    - 吉原悲劇
    - ドラゴン岩村
    - じゅんじゅん
    - ヒゲと味噌汁
    - meDag.
    - 山村茜(インモラリスターR)
    - ケンカオイル
    - にゃんにゃんブーメラン
    - ダムダム団
    - 初咲里奈
  content: |
    四谷OUTBREAK!で開催された、じゅんじゅん（OKFK出演者）の生誕イベント。告知「OKFKに出演
    してくれたじゅんじゅんのお誕生日を祝うよ！ご予約はこちら↓」（samami27、9/2、予約URL付き）、
    「明日、じゅんじゅんの誕生日を祝う！！！アウトブレイクで！！！祝う！！！」（samami27、
    9/5未明）。終演後「じゅんじゅんお誕生日おめでとう！」（samami27）、「じゅんじゅん
    お誕生日おめでとうでした！ライブみてくれた方ありがとー」（yokuwakan_nai）で開催を確認。
    会場イベントページ（現存）によればイベント名は「じゅんじゅん31周年生誕大宴会〜サーティー
    ワンだよ！全員集合☆〜」、OPEN 13:00 / START 13:30、前売当日共に¥3500（2時間飲み放題付）・
    終演まで飲み放題プラン¥5000。出演は代官山パンク日和、＊FOOD＊ きしぱん、さとーさん(回文)、
    熱海雄一、長倉佳斐、教祖仮面、侍＿崗、吉原悲劇、ドラゴン岩村、じゅんじゅん、ヒゲと味噌汁、
    meDag.、なんちゃらアイドル、山村茜(インモラリスターR)、ケンカオイル、にゃんにゃん
    ブーメラン、ダムダム団、初咲里奈。9/3〜9/6の4日間連続ライブの3日目。

    ※Xの告知アーカイブから復元。dateは会場イベントページ記載の開演時刻（13:30。なんちゃらの
    出番時刻は不明）。actsは同ページの出演者欄から（「＊FOOD＊ きしぱん」は出演者欄の表記
    ママ。2組の連名の可能性あり）。
