- id: event-20200903-attic
  slug: 20200903-attic
  date: 2020-09-03 20:15:00 +0900
  title: 「天井裏IDOL LIVE」（川崎LIVE BAR A'TTIC）
  site: 川崎LIVE BAR A'TTIC
  acts:
    - Dream Zone
    - 紅河めぐみ
  content: |
    川崎LIVE BAR A'TTICで開催された15人限定のアイドルライブ。告知「「天井裏IDOL LIVE」
    2020年9月3日(木) 川崎LIVE BAR A'TTIC OPEN19:00/START19:30 前売2500円/当日3000円(D別)
    【出演】なんちゃらアイドル、Dream Zone、紅河めぐみ なんちゃらは20時15分！予約はこちら
    まで！usgf.info@gmail.com 15人限定だそう！」（nantyaraidol、9/2。samami27も同文を再掲）。
    前日「明日です！よろしくお願いします！」（samami27）。出番の時間帯にはツイキャスでの
    配信も実施され（20:23 JST〜「モイ！iPhoneからキャス配信中 - ライブ川崎」）、曲目実況から
    「じゃすともめんと」「放課後のホーリー」「アイボリーソング」「旅講座」等の披露が読める。
    終演後「川崎ATTICありがとうございました！声が広々していた〜！」「売れたなぁ」（samami27）
    で有観客開催（物販あり・配信併用）を確認。9/3〜9/6の4日間連続ライブの初日（9/5の告知に
    「４連ライブ最後！」、9/6の事後報告に「4日間連続ライブの最終日」とある）。

    ※Xの告知アーカイブから復元。dateは告知記載のなんちゃらアイドルの出番時刻（20:15）。
  sources:
    - https://x.com/nantyaraidol/status/1301031547533815808
    - https://x.com/samami27/status/1301142940622884877
    - https://x.com/samami27/status/1301516744813457408

