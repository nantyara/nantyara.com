  content: |
    秋葉原オノデン地下の新星堂エンタバアキバで開催された、The Grateful a MogAAAz「ジャンキー
    ～僕は依存症～」・なんちゃらアイドル「Baby a go go、黒い森」の合同発売記念インストア
    イベント。告知「開催日時：2020年9月8日（火）開催時間：19:00 会場：新星堂エンタバアキバ
    18時から受付開始！」（nantyaraidol、9/7）、「本日、秋葉原オノデン地下にあるエンタバアキバ
    さんにて…19時からスタート！CDのご購入でライブ＋特典会にご参加いただけます！」（samami27、
    9/8）。当日「なんちゃらは19時からライブ！ミニライブといいつつ25分セットなのでわりと
    やります。そのあとモガーズさんのミニライブがあり、そのあとは合同で懇談イベント！シングル
    一枚買ったら全部参加できる」（nantyaraidol）。終演後「エンタバアキバにてリリースイベント
    してきましたのん。新曲買ってくれて＆聞いてくれてありがとう！本日出た2枚のシングルは、
    今後通販等でも買えるようになりまーす」（yokuwakan_nai）、「火曜だのに会いにきてくれた人、
    観てくれた人がいてうれしかったです！」（samami27）で開催を確認。この日発売のシングル
    「baby a gogo / 平穏世代のホーリーキャッツ」「黒い森」の通販は同日夜に開始され、翌日には
    即日完売→追加プレスが告知された。

    ※Xの告知アーカイブから復元。dateは告知記載のイベント開始時刻（19:00。受付開始は18:00）。
