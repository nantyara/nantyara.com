- id: event-20200915-lamama
  slug: 20200915-lamama
  date: 2020-09-15 20:00:00 +0900
  title: 「giant killing vol.004」PANTA（頭脳警察）ツーマン（渋谷La.mama）
  site: 渋谷La.mama
  acts:
    - PANTA（頭脳警察）
  content: |
    渋谷La.mamaで開催された、頭脳警察のPANTAとなんちゃらアイドルのツーマンライブ。告知
    「9.15(火)渋谷ラママ giant killing vol.004 ■PANTA（頭脳警察）■なんちゃらアイドル
    start20:00 ¥3500 予約は nagaokatasuku@gmail.com まで！配信チケットは￥2000」
    （nantyaraidol、9/14未明の駆け込み予約案内。8/20の初出告知では open19:00/start20:00・
    30人限定とも）。当日「本日ラママでPantaさんとツーマン！緊張するー！」（samami27）、
    リハ中には「PANTAさん、リハの熱が凄い。いうたら地下アイドルとの対バンなのに、命が
    かかってる。セトリもめちゃガチだ」（nantyaraidol）。終演後「渋谷ラママライブありがとう
    ございました！緊張してご飯食べられなかったけど、お腹空きました！…来てくれた人、観てくれ
    てた人達のおかげでやり切りました！」（samami27）、「ラママでPANTAさんとツーマンでした。
    今日のこと死ぬまで覚えてると思う！」（yokuwakan_nai）で有観客開催（配信併用）を確認。
    運営は「正直10年早かったです。…本当に感動しました。喉乾くくらい泣いた」とも。ライブの
    アーカイブ配信（2,000円・2週間視聴、PANTAとのコラボも収録）も販売された。

    ※Xの告知アーカイブから復元。dateは告知記載の開演時刻（start20:00）。
