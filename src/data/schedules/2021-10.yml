- id: event-20211011-lamama
  slug: 20211011-lamama
  date: 2021-10-11 18:00:00 +0900
  title: なんちゃらアイドル主催 大人の文化祭！～NEKOちゃんバンドdebut祭！～
  site: 渋谷ラママ
  acts:
    - ラブホテル
    - 中出し少年
    - クリノス革命
    - 盛りたかった千里
  content: |
    なんちゃらアイドル主催イベント「大人の文化祭！～NEKOちゃんバンドdebut祭！～」。
    「2021年10月11日（月）大人の文化祭！～NEKOちゃんバンドdebut祭！～ なんちゃらアイドル、
    ラブホテル（NEKOちゃんバンド）、中出し少年、クリノス革命、盛りたかった千里 food
    床ちゃん at渋谷ラママ 17:30open/18:00start 2500円（drink代別）」（nantyaraidol）。
    告知本文中のTIGET予約リンク（https://tiget.net/events/148312）先を確認したところ、
    会場「La.mama」・開演18:00（開場17:30）・出演者（盛りたかった千里、クリノス革命、
    中出し少年、ラブホテル＝NEKOちゃんバンド、なんちゃらアイドル）で本文と一致。終演後
    「大人の文化祭でした！バンドで初披露の曲やったよ〜！たくさんのご来場、本当に
    ありがとうございました！」（samami27）、「ラママありがとでした！」（yokuwakan_nai）で
    有観客開催を確認。food担当の床ちゃんは演者でないためactsから除外。

    ※Xの告知アーカイブから復元。dateは告知記載の開演時刻（18:00）。
  sources:
    - https://x.com/nantyaraidol/status/1445585065728118796
    - https://x.com/samami27/status/1447539923783864321
    - https://x.com/yokuwakan_nai/status/1447540079346393093

