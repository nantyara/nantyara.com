- id: event-20231209-route14-skipcows
  slug: 20231209-route14-skipcows
  date: 2023-12-09 19:10:00 +0900
  title: 本八幡Route Fourteen「たまには古巣もいいもんだ」（スキップカウズ初対バン）
  site: 本八幡 Route Fourteen
  acts:
    - スキップカウズ
  content: |
    本八幡Route Fourteenでのスキップカウズとの対バンライブ「たまには古巣もいいもんだ」。「明日はいよいよ！いよいよスキップカウズとの対バン！
    良いところ見せたいのでみんな応援しにきてください！数の暴力でいこ！」（nantyaraidol、12/9）、「明日は本八幡ルート14！！
    なんちゃらの出番早いけど、絶対にきてほしい！！！絶対にきてね！！！！」（samami27、12/9）で前日夜（深夜）告知。「遠藤さんにお世話になりまくりのなんちゃらアイドル、実はスキップカウズフルメンバーとは初対バン！！ドキドキですー！」（samami27、12/9）、「ほんじつ本八幡ルート14！」（yokuwakan_nai、12/9）で当日告知。「開場時間は変わらないんですが、開演時間が変わりました！
    18:30から変わりまして、19:10からなんちゃらライブです！」（samami27、12/9）、「BrownCrowさん出演キャンセルになりまして、なんたらの出番19:10からに変わりました！オープンはしてます！」（yokuwakan_nai、12/9）で出番時刻（19:10）を確認。終演後「本八幡RouteFourteen『たまには古巣もいいもんだ』ライブありがとうございました！！
    緊張したけど、絶対来てって言ったからね！父やパパや運営が、そして何より自分自身が誇れるライブをねしたいなという気持ちで挑みました！来てくれたみんなありがとう！！！」（samami27、12/9）で有観客開催を確認。

