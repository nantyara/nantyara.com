- id: event-20231218-lamama-otonabunkasai
  slug: 20231218-lamama-otonabunkasai
  date: 2023-12-18 19:00:00 +0900
  title: 渋谷La.mama「大人の文化祭～なんちゃらレコ発忘年会！～」
  site: 渋谷La.mama
  acts:
    - やわらぎめんま
    - 土萌まりなと師匠
    - MCあんにゅ
    - S.B.Q.アイドル部
    - プロハンバーガー
  content: |
    渋谷La.mamaでのなんちゃらアイドル主催イベント「大人の文化祭～なんちゃらレコ発忘年会！～」。事前告知（nantyaraidol、12/1）で以下のフルタイムテーブルを確認:

    「2023年12月18日（月）
    in渋谷ラママ
    なんちゃらアイドル主催
    大人の文化祭～なんちゃらレコ発忘年会！～
    18時半open　19時start
    2500円（1drink別）

    19:00　やわらぎめんま（25分）
    19:30　土萌まりなと師匠（25分）
    20:00　MCあんにゅ（25分）
    20:30　S.B.Q.アイドル部（25分）
    21:00　プロハンバーガー（40分）
    21:45　なんちゃらアイドル（25分）

    告知遅くなってすいません、
    12月18日、レコ発忘年会ライブやりますちょっぴりクリスマスも！
    この日は、
    ニューアルバムのグッズの初売りもやります。ビッグアクスタとラババン！おそらくどちらもすぐ完売するので（生産量が少ないので）是非このタイミングで！

    なかよしたちと忘年する！」（nantyaraidol、12/1）

    「12月31日、23時から都内某所で年越オフ会やります。蕎麦付き。一緒に年越しして遊んでお参り行って、みたいな流れです。
    そちらのチケットを本日のライブより販売いたします。こちら前売りチケットのみとなり、10枚くらいを予定しております。」（nantyaraidol、12/18）で当日の物販情報（年越オフ会チケット販売開始）を確認。終演後「大人の文化祭忘年会ありがとうございました！！！
    嫌なこと忘れられましたか！私は嫌なことがなくなるように下水管清掃します！！！
    今日、衣装めちゃんこかわいかったんですけど、私服の自撮りしかない！！なんでだろ！！！」（samami27、12/18）で有観客開催を確認。

    ※Xの告知アーカイブから復元。
