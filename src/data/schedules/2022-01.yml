- id: event-20220125-harajuku-crocodile
  slug: 20220125-harajuku-crocodile
  date: 2022-01-25 19:00:00 +0900
  title: 原宿クロコダイル「なんちゃらアイドルloves一色進＆松田信男」vs「東京暮色」ガチンコ2マン
  site: 原宿クロコダイル
  acts:
    - 東京暮色
  content: |
    原宿クロコダイルでの「東京暮色」（和久井光司、窪田晴男、小林伸彦、spicy-marico、
    根本久子）と「なんちゃらアイドルloves一色進＆松田信男」のガチンコ2マン。「2022年1月25日
    原宿クロコダイル「東京暮色（和久井光司、窪田晴男、小林伸彦、spicy-marico、根本久子）」
    「なんちゃらアイドルloves一色進＆松田信男」の、ガチンコ2マン！18時開場、19時開演、
    チケット4000円。なんちゃらが尊敬してやまない和久井光司との2マン！」（nantyaraidol、
    1/24）、前日「明日！M.A.M.I.バンドです！見逃すなかれ！」（yokuwakan_nai）、当日
    「本日です！バンドでやります！」（samami27）。終演後「クロコダイルライブでした！
    わにー！」（samami27）で有観客開催を確認。対バン相手「東京暮色」をactsに追加した
    （なんちゃらアイドル自身のコラボユニット「なんちゃらアイドルloves一色進＆松田信男」は
    actsに含めていない）。

    ※Xの告知アーカイブから復元。dateは告知記載の開演時刻（19:00）。
  sources:
    - https://x.com/nantyaraidol/status/1485486624918339584
    - https://x.com/samami27/status/1485831356236300290
    - https://x.com/samami27/status/1485974592007307264

