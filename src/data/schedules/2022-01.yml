    - S.B.Qアイドル部
  content: |
    代々木LODGEでのイベント「シン・なんちゃら100人組手！in代々木 second」。「2022年1月31日
    （月）@代々木LODGE「シン・なんちゃら100人組手！in代々木　second」18:00open18:30start
    2500円（drink別） 情熱Dream、虹色JAMレインボー、ミコ・トコマレ、御茶海マミ、S.B.Q
    アイドル部、なんちゃらアイドル」（nantyaraidol、1/11予告）、「明日は代々木LODGEで
    ライブ！17:30オープン、18:00スタートです！」（samami27）、当日「本日ですよー！！
    なんたらは19:30からです！！」（yokuwakan_nai）でなんちゃらの出番時刻を確認。終演後
    「そうだ！今日でライブ本数通算800回だ！」（samami27）で有観客開催・通算ライブ本数の
    マイルストーンを確認。対バン出演者（情熱Dream、虹色JAMレインボー、ミコ・トコマレ、
    S.B.Qアイドル部）をactsに追加した（御茶海マミ・なんちゃらアイドルは自ユニットのため
    actsから除外）。

    ※Xの告知アーカイブから復元。dateはなんちゃらアイドルの出番時刻（19:30）。この日、
    なんちゃらアイドルのライブ通算800回目という言及あり（history.yml裏取り候補、詳細は
    本ドラフト冒頭コメント参照）。
