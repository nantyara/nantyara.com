- id: event-20220131-yoyogi-lodge
  slug: 20220131-yoyogi-lodge
  date: 2022-01-31 19:30:00 +0900
  title: 代々木LODGE「シン・なんちゃら100人組手！in代々木 second」
  site: 代々木LODGE
  acts:
    - 情熱Dream
    - 虹色JAMレインボー
