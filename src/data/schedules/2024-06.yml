  time_tbd: true
  content: |
    下北沢ちょ美ひげでのタイマンイベント「なんちゃらアイドルの決戦は金曜日」。「https://t.co/AV0xOr1bYa

    6月27日（木）、
    下北沢ちょ美ひげにて桑原達也さんと2マンライブ！
    限定15席なのでお急ぎあれ！
    めちゃレアなコラボとかやりますよ！」（nantyaraidol、6/7）で告知（会場・対戦相手・日付を確認）。「ちょ美ひげ「なんちゃらアイドルの決戦は金曜日」お越しくださいましてありがとうございました！本日はvs桑原達也さんでした！  
    バンジョーうまいな〜〜〜」（samami27、6/27）で有観客開催・対戦相手（桑原達也）を確認。当日は「フードも充実！
    当日券もでます！

    そして先ほどできた新曲なのですが、
    なんかコラボでやる予定だったのですが運営の勘違いでそんな予定無かったわ！
    まあでもじゃなきゃ書かなかったと思うのでまあよしです！
    なので今日はやるかもしれないしやらないかもしれない！」（nantyaraidol、6/27）にあるとおり、当日新曲「SARAVA愛しき無人島よ」の歌詞が公開され、披露される可能性も言及されていた（実際に披露されたかは本文からは確認できず）。歌詞本文にはBAR無人島が「今年の7月いっぱいで」閉店する旨の一節が含まれており、releases.yml/history.yml転記時の参考情報として別途アーカイブ（mining/x-archive/2024-06.json）を参照のこと（著作権上、本ファイルへの歌詞全文転記は行わない）。

