- id: event-20240621-mujinto-mami-theendof
  slug: 20240621-mujinto-mami-theendof
  date: 2024-06-21 23:59:00 +0900
  title: 新宿無人島「御茶海マミのジエンドオブむじんとう」
  site: BAR無人島
  labels:
    - マミソロ
  content: |
    新宿無人島でのバーイベント「御茶海マミのジエンドオブむじんとう」（23時59分〜翌朝28時半まで）。「6月21日ガチンコラストバーイベします！  
    場所はいつものところ🏝️」（samami27、6/10）で先出し予告。「6月21日（金）の23時59分より、
    新宿無人島にて、翌朝28時半まで！

    御茶海マミのジエンドオブむじんとう、やります！

    無人島、閉店詐欺しまくってますが、
    多分今回で終わりだと思う。ほんとか～？

    しれっと来月くらいまでやりそうな気もしますが、

    まあ、21日で一応終わりということでそういう気持ちで臨みたい。

    いつだって最後のつもりで頑張りたいですよね！

    お待ちしております！料理もがんばる！

    遠隔drinkはこちらから！素敵なお礼動画送ります！へべれけ動画！

    https://t.co/vAlljI9Pk5」（nantyaraidol、6/21）で当日告知（開始時刻・終了時刻・「無人島、閉店詐欺しまくってますが、多分今回で終わりだと思う。ほんとか～？…しれっと来月くらいまでやりそうな気もします」との言及を確認）。「無人島ラスト（？）バーイベありがとうございました！  
    本日の売り上げは、22日に行われるマミ家族会に使用させていただきます！！！」（samami27、6/22）で有観客開催（「無人島ラスト（？）バーイベありがとうございました！」）を確認。

    ※Xの告知アーカイブから復元。5月ウィンドウで転記済みの5/30-31「新宿無人島ラストバーイベ」の続編にあたる。本人が「閉店詐欺」と自称し「今回で終わり」を疑問形（「ほんとか～？」）で語っていることから、本イベントを無人島の確定的な最終回として断定しない。
