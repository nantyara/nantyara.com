- id: event-20240618-lovetko-3days-day1
  slug: 20240618-lovetko-3days-day1
  date: 2024-06-18 19:30:00 +0900
  title: 東新宿LOVE TKO「なんちゃらアイドル3デイズ」1日目 S.B.Q.アイドル部ツーマン
  site: 東新宿LOVE TKO
  acts:
    - S.B.Q.アイドル部
  content: |
    東新宿LOVE TKOでの3日間連続主催イベント「なんちゃらアイドル3デイズ」初日。全国盤デビューが決まったS.B.Q.アイドル部とのツーマン（18時半オープン/19時アイドル部/19時30分なんたら/20時アイドル部/20時半なんたら/21時〜22時物販）。「明日から3連続TKOで主催！
    全部コンプした人には…なんかあげます！

    初日はなんと全国盤デビューが決まったS.B.Q.アイドル部との2マン！なんか今回6人も来るらしいよ。狭い明日じゃなくてラママの時に揃えや…。

    アイドル部はカバー曲も含むなんと既発曲全曲を披露予定。
    多分古いカバーとかもうやらないと思うのでこれを機会に是非！

    撮影自由です！動画も！楽しくやれたらいいなと思います！」（nantyaraidol、6/17）で3日間の告知（初日の対バン相手・全国盤デビュー決定を確認）。「いよいよ明日から始まりますLOVETKOスリーデイズ！
    6/18 S.B.Q.アイドル部とのツーマン詳細！
    18時半オープン
    19時　アイドル部
    19時30分　なんたら
    20時　アイドル部
    20時半　なんたら
    21時〜22時物販」（yokuwakan_nai、6/17）で初日のタイムテーブル詳細を確認。「本日あいにくの雨ですが、
    TKOにてお待ちしておりまする！！！！」（nantyaraidol、6/18）「今日から東新宿LOVETKOにてツーマン3days！！  
    よろしくお願いします！！！！」（samami27、6/18）で当日告知。「ツーマンライブ3デイズ1日目ありがとうございました！S.B.Q.アイドル部とツーマンでした！  
    明日は2日目！じゃむガシャと弾き語りの日です〜！運営対決！血湧き肉躍る！」（samami27、6/19）で有観客開催・S.B.Q.アイドル部とのツーマンであった旨を確認。

    ※Xの告知アーカイブから復元。dateはタイムテーブル記載のなんたら1回目の出番時刻（19:30）を採用。
