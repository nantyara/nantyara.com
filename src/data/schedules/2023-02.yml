  content: |
    渋谷La.mamaでの「大人の文化祭 生誕おめでとライブ！〜今日のうえりんは...！〜」
    （うえりん生誕）。「2023年2月14日（火）渋谷ラママ なんちゃらアイドル主催 大人の文化祭
    生誕おめでとライブ！〜今日のうえりんは...！〜 18時半open19時start 2500円（1drink別）
    中だし少年 / なんちゃらアイドル / S.B.Qアイドル部 / momoka kagamiya / 新宿合流」
    （nantyaraidol、1月アーカイブより1/19告知）でフルスペック告知。「明日はうえりんの
    お誕生日をお祝いします！」（samami27、2/13）「本日渋谷ラママでうえりん誕！」
    （yokuwakan_nai）で予告。終演後「4週連続ラママ生誕、3番目となるうえりん生誕わず…
    最高のイベントになりました。なんちゃらの新カバーは、バブルガムブラザーズのJUST BEGUN
