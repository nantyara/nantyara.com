- id: event-20180402-muzenji
  slug: 20180402-muzenji
  date: 2018-04-02 19:00:00 +0900
  title: なんちゃらアイドルthirdワンマンライブ！in高円寺無力無善寺
  site: 高円寺無力無善寺
  acts:
    - ゆめ
    - あみーびっく
    - 夏
    - ドクガエル
    - 猫屋敷ぽち＆菫
    - 星野百花
    - おりかされい子
    - 岬たん
  content: |
    高円寺無力無善寺での結成後3回目のワンマンライブ。事前告知「4月2日『なんちゃらアイドル
    thirdワンマンライブ！in高円寺無力無善寺』18時30分開場 19時00分開始 1000円（drink別）
    前座のみなさま（出演順）ゆめ、あみーびっく、夏、ドクガエル、猫屋敷ぽち＆菫、星野百花、
    おりかされい子、岬たん＆なんちゃらアイドル」。前座には元メンバーのあみーびっくも含まれる。
    終演後は「本日のなんちゃらアイドルサードワンマン無力無善寺ありがとうございました！」
    「4月2日 なんちゃらアイドルthirdワンマン 満員御礼、ありがとうございました。」と感想。

    ※Xの告知アーカイブから復元
