- id: event-20180425-heavensdoor
  slug: 20180425-heavensdoor
  date: 2018-04-25 18:30:00 +0900
  title: なんちゃらアイドル主催「なんちゃらなヘブン vol.01」〜なんちゃら100人組手〜
  site: 三軒茶屋HEAVEN'S DOOR
  acts:
    - フェッティーズ
    - メロン畑 a go go
    - 鮭オーケストラ
    - ザ・アイドルズ
  content: |
    三軒茶屋HEAVEN'S DOORでのなんちゃらアイドル初主催シリーズ「なんちゃらなヘブン」
    第1回。事前告知「来た方が良い！理由はリプで！4/25（水）三軒茶屋heaven's door
    なんちゃらアイドル主催『なんちゃらなヘブン vol.01』～なんちゃら100人組手～
    open18:30 charge￥2000 なんちゃらアイドル/フェッティーズ/メロン畑 a go go/
    鮭オーケストラ/ザ・アイドルズ」。「150分がっつり楽しいのに2000円なんじゃー！」と
    ボリュームを強調。新聞配達・シール配り・スーパーボールくじなど企画も予告
    （yokuwakan_nai談）。北海道ツアー支援撮影会＆鍋会の特典ROM配布もこの日以降開始と
    案内。終演後は「誰もMCでTOKIOの話しなかったね。それくらい音楽がおもろかったの
    やも。」「昨日はスーパボールくじも大好評でした！」と感想。なんちゃら自身の
    出番時刻の個別告知は見当たらないため、開場時刻(18:30)を date に採用。

    ※Xの告知アーカイブから復元。「なんちゃらなヘブン」は本アーカイブで確認できる
    範囲では初開催（vol.01）。なんちゃらアイドル初の主催イベントは2016-11-11
    「なんちゃらフェス vol.1」（新宿JAM、history.yml登録済み）であり、本イベントは
    それとは別の新規主催シリーズの開始と位置づけられる
  sources:
    - https://x.com/nantyaraidol/status/988806303802834944
    - https://x.com/yokuwakan_nai/status/988809095418269696
    - https://x.com/nantyaraidol/status/988813351286272000
