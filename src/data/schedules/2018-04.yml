- id: event-20180415-ufoclub
  slug: 20180415-ufoclub
  date: 2018-04-15 19:00:00 +0900
  title: 東高円寺U.F.O CLUB 御茶海マミ生誕祭「ミサミノキセキ」
  site: 東高円寺U.F.O CLUB
  labels:
    - マミ生誕祭
  acts:
    - 姫乃たま
    - 工藤ちゃん
    - じどうぽるの砲
    - レイモミンパルメザン
  content: |
    御茶海マミ（当時は活動4年目）の誕生日を記念した本人主催の生誕祭ライブ「ミサミノ
    キセキ」。event.tiget.net（tiget.net/events/24932）の告知ページによれば、開催
    2018年4月15日(日) 開場18:30／開演19:00、会場は東高円寺U.F.O CLUB、チケット
    2,500円（当日ドリンク料金別途）、出演：なんちゃらアイドル・姫乃たま・工藤ちゃん・
    じどうぽるの砲・レイモミンパルメザン、主催：御茶海マミ（ミサミマミ）。
    X告知「あの今週日曜日、15日なんですが、2ヶ月遅れの生誕祭します！（略）物販は
    開場開演までの30分と終演後1時間です！」でチケットリンクを案内。終演後は
    「0415『ミサミノキセキ』無事終わりました！悔しいスタートでしたが、レイモミン
    パルメザン、工藤ちゃん、じどうぽるの砲さん、姫乃たまちゃん、なんちゃらアイドル、
    そして、来てくれたみんなのおかげで、最高の生誕祭ができました！」と感想。

    ※Xの告知アーカイブから復元。開場・開演時刻は告知ポスト本文になく、tiget.netの
    イベントページ（リンク先）から裏取り
