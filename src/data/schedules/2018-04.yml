- id: event-20180414-heavensdoor
  slug: 20180414-heavensdoor
  date: 2018-04-14 21:00:00 +0900
  title: 三軒茶屋HEAVEN'S DOORライブ「涙のBlack day」（生誕前日）
  site: 三軒茶屋HEAVEN'S DOOR
  acts:
    - ヒゲと味噌汁
    - 扇愛奈とkanna
    - ZARIGANI$
    - 妖精達
  content: |
    三軒茶屋HEAVEN'S DOORでの対バンイベント『涙のBlack day』。マミの生誕祭（4/15）
    前日公演。事前告知「4月14日（土）三軒茶屋HEAVEN'S DOOR『涙のBlack day』ヒゲと
    味噌汁/扇愛奈とkanna/なんちゃらアイドル/ZARIGANI$/妖精達 ＜FOOD＞きしぱん
    (唐揚げ＆ジャジャ麺) open/start 18:30/19:00 前売¥2,000 当日¥2,500 なんたらは
    21時からたっぷり30分！」。前日再告知でも同内容・同出番時刻を確認。終演後は
    「涙のブラックデー@ヘブンスドア ありがとうございました！んもーちょー楽しくて
    こういうイベントに呼んでもらえるのってめっちゃ嬉しい」と感想。

