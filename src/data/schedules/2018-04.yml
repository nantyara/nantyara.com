- id: event-20180406-lush
  slug: 20180406-lush
  date: 2018-04-06 20:40:00 +0900
  title: 渋谷LUSH「Beat Happning！春IDLEと金曜PANIC！」（北海道直前ライブ・さよならオデッセイ無料配布）
  site: 渋谷LUSH
  acts:
    - nuance
  content: |
    渋谷LUSHでの「Beat Happning！春IDLEと金曜PANIC！」。翌日からの北海道ツアー直前公演。
    事前告知「4/6(金)『Beat Happning！春IDLEと金曜PANIC！』渋谷LUSH 開場18:30
    2,500／3,000(+1D」に続き、「この日は、『さよならオデッセイ』完売記念として、同CDを
    無料配布いたします！歌詞カードはありませんが、完全版です！なんちゃら目当てじゃない人も
    オッケー！」とシングル無料配布を告知。当日は「北海道直前ライブ！北海道行く人も
    行かない人もいらっしゃってね！なんちゃらは20:40から！」と出番時刻を案内。終演後は
    「今日対バンしてる nuance のほうが凄いかもしれない！めちゃくちゃ尊敬した！絶対にまた
    対バンしたい！」と共演のnuanceに言及。

    ※Xの告知アーカイブから復元。フルの対バンラインナップの言及は見当たらず、nuanceのみ
    acts に採用
