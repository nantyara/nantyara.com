- id: event-20190914-ottanta
  slug: 20190914-ottanta
  date: 2019-09-14 12:00:00 +0900
  time_tbd: true
  title: OKFK 大田区蒲田復興協会 〜ゴジラに焼かれた町から〜 銭湯プロレスコラボ
  site: 蒲田オッタンタ
  labels:
    - 主催ライブ
  content: |
    「大田区蒲田復興協会（OKFK）」の定例企画。今回は銭湯（風呂屋）を舞台にした地下プロレス
    団体「Hプロ」とのコラボ企画。事前告知「明日はこれです！蒲田！蒲田だよ！銭湯でプロレスが
    みれるのはOKFKだけ！（かもしれない！）」（nantyaraidol、9/13）。当日は「今日です！毎月
    恒例の大田区蒲田復興協会、今回は、お風呂屋さんで、プロレス？？！いったいどうなっちゃうの
    〜〜〜！？？！乞うご期待！」（yokuwakan_nai）「HプロがOKFKに殴り込みにくるので、風呂
    入ってかき氷食べた！」（samami27）。終演後は「OKFKありがとうございました！」（samami27）
    「OKFKありがとう！かってえ床でプロレスやってて超痛そうだった。」（yokuwakan_nai）と感想。
