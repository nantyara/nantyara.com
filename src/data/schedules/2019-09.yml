  content: |
    渋谷La.mamaで開催された、なんちゃらアイドル主催「真昼の完全試合!!! vol.01」。新編成の
    なんちゃらバンドのお披露目公演。事前告知「来てね！9月16日（祝）なんちゃらアイドル主催
    真昼の完全試合!!! vol.01 渋谷lamama（http://lamama.net）open 11:00 start 11:30
    price 2500(without1drink) なんちゃらアイドル（新バンド編成）、MMKING＆ヘドロットン
    （２丁拳銃小堀裕之）、夢乃るか、山村茜、武井直紀＋元祖☆令嬢倶楽部」（nantyaraidol、
