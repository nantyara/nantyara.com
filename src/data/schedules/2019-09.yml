- id: event-20190901-jimbochoshichoshitsu
  slug: 20190901-jimbochoshichoshitsu
  date: 2019-09-01 13:50:00 +0900
  title: 「9月の海はクラゲの海 vol.1」（なりすレコードpresents・神保町試聴室）
  site: 神保町試聴室
  acts:
    - WAY WAVE
    - 江ノ島爆走ギャルズ
    - 加納エミリ
    - 桜愛美
    - 真凛
  content: |
    神保町試聴室で開催された「なりすレコードpresents『9月の海はクラゲの海 vol.1』」。事前告知
    「今日のライブはこちら！なりすレコードpresents『9月の海はクラゲの海 vol.1』神保町試聴室
    12：00開場 12：30開演 予約2500円 当日3000円（1ドリンク＆お菓子付）出演：WAY WAVE/
    江ノ島爆走ギャルズ/加納エミリ/桜愛美/なんちゃらアイドル/真凛 なんちゃらアイドルは13:40
    から！」（samami27、9/1）。その後「諸事情により、出番が10分前倒しになり、なんちゃら出番
    13:40からになりました…！」→「相談したところ休憩挟んで、13:50に戻りました！混乱させて
    ごめんよ…！」（いずれもsamami27）「やっぱりオンタイムに出来そうです！」（yokuwakan_nai）
    と出番時刻が数回訂正されており、本文だけでは最終的な確定時刻が13:40・13:50のいずれかを
    完全には断定できないが、最後の訂正投稿（13:50に戻りました）を最終値として採用した。終演後
    は「神保町試聴室ありがとうございました！惑わせてごめんよ…！」（samami27）「神保町視聴室
    ありがとうございました！」（yokuwakan_nai）と感想。

