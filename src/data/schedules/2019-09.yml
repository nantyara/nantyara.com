- id: event-20190916-lamama
  slug: 20190916-lamama
  date: 2019-09-16 11:30:00 +0900
  title: なんちゃらアイドル主催「真昼の完全試合!!! vol.01」（渋谷La.mama）
  site: 渋谷La.mama
  labels:
