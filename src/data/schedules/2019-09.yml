# 今回の転記対象は255告知のうち日付・会場・（可能なら）時刻が本文から確認できる16件。
# ⚠️ 日時はすべて post の time フィールド（UTC）を JST（+9h）に変換した上で「本日/今日/明日/
#   日付変わって」の指し示す日付を確定させている（2019-08で日付境界の変換ミスが一度発生した
#   教訓を踏まえ、各イベントごとに announce/day-of/post-event の3点を突合してJST日付を確定した）。
# 証拠不足・方針により見送ったもの（末尾コメント参照）:
#   9/1「9月の予定です」「（文字見やすくしました）」（samami27、画像添付の月間予定表2件）・
#   9/2「なんちゃらアイドルあおはる令和元年9月の予定」（yokuwakan_nai、同種の画像添付月間予定表）
#   はいずれも画像内容がテキスト本文から確認できないため転記対象外（裏取りの一次情報としては
#   有用だが、画像内容の推測は禁止のため個別イベントとの突合のみに利用）
#   9/13「10月22日、なんちゃらアイドルがDJをやるイベント...スペシャルゲストに、すからべさんが
#   決定」は10月イベント（「なんたってアイドル」DJイベント、2019-08ドラフトで既出）の追加情報。
#   10月ウィンドウで裏取りのこと（今回は転記対象外）
#   9/18「11月はハナワと対バン！」は11月ウィンドウで裏取りのこと（今回は転記対象外）
#   9/6「20:45からだった！！！」単独では会場が特定できないが、直前の9/5予告「9月6日は無銭
#   ライブ！」・当日の御礼ポストと突合し神田Space CUBEの開始時刻補正として転記済み（重複計上
#   ではない）
# 主催イベントシリーズ判断: 9/16「真昼の完全試合!!! vol.01」は「なんちゃらアイドル主催」の
#   明記があり、かつ新バンド編成お披露目のため labels: 主催ライブ・バンドライブ を付した
#   （2019-08ドラフトのなんちゃらバンド関連イベントと同様の扱い）
# releases.yml裏取り候補（編集は今回しない）:
#   - なんちゃらアイドル4thシングル「Ivory song」について「一度絶盤にしちゃった」（9/18
#     nantyaraidol）という言及あり。releases.yml上の扱い（絶盤時期等）を要確認
#   - 7thシングル「東京星へ、行こう。」の増税前キャンペーン（9月1〜30日の注文者にもれなく
#     プレゼント、9/3 nantyaraidol）は2019-08ドラフトで既出の同曲販促の継続
#   - 11月発売予定のちょこ太郎とのコラボシングル「麦ちょこ畑で捕まえて！」のジャケットを
#     漫画家がぁさんが担当することが決定（9/1 nantyaraidol）。2019-07/08ドラフトでも同曲の
#     裏取り候補として既出
# history.ymlへの追記は今回はしない（判断のみ）:
#   - 9/8「なんちゃら新バンド始動するぞー！」（代官山の立花さん・ライリィの鶴見さん・恋慕の
#     くじろうさんによるレゲエパンクバンド、お披露目0916）は「元祖なんちゃらバンド」から
#     「新なんちゃらバンド」への編成交代を示す重要な節目候補だが、全期間発掘完了後にまとめて
