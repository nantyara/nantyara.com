    ました。今から代打を探す！」（nantyaraidol）、代打として「令嬢にかわりに、ペヤング千江子
    が参戦するぞ！いよいよ明日！」（nantyaraidol）と発表された。前日は「明日はお昼にラママで
    主催ライブですわよ！なんちゃらバンド2号初披露！」（samami27）「9月16日（祝）...だよ明日
    新バンドお披露目主催ライブ！真昼から踊りましょう。」（yokuwakan_nai）。終演後は「ラママ、
    なんちゃら主催『真昼の完全試合』ありがとうございました！出演してくれた皆様、ラママの皆様、
    来てくれた皆様ありがとうございました！」（samami27）と感想。

