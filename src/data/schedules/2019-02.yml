- id: event-20190203-heavensdoor
  slug: 20190203-heavensdoor
  date: 2019-02-03 19:00:00 +0900
  title: 節分企画「No problem!?」（三軒茶屋HEAVEN'S DOOR）
  site: 三軒茶屋HEAVEN'S DOOR
  acts:
    - ヒゲと味噌汁
    - 危険物品
    - 東京牛パラダイスオーストリア
    - 代官山パンク日和
  content: |
    三軒茶屋HEAVEN'S DOORでの節分企画「No problem!?」（原文は全角表記
    「【Ｎｏ ｐｒｏｂｌｅｍ!?】」）。事前告知「これ！ヘブンス女子が鬼を嗤う！
    みんなで豆を食べたいものだねえ。2/3(日)三軒茶屋ヘブンスドア【Ｎｏ ｐｒｏｂｌｅｍ!?】
    なんちゃらアイドル ヒゲと味噌汁 危険物品 東京牛パラダイスオーストリア
    代官山パンク日和 前売2000+1D/当日2500+1D 開場1830/開演1900」
    （nantyaraidol、2/2）。終演後は「よいライブでした！でもこんな時間やろ？
    余韻楽しむまもないやん！だからさ！2月10日は昼からライブ！あとは29時まで
    打ち上がるしかないんだって！」（nantyaraidol）「三軒茶屋ヘブンスドア
    ありがとうございました！なんだかヘブンス行くたびに大掃除してるような気が
    しますね！豆まきすぎて積もってました。大人って怖い」（yokuwakan_nai）
    「三軒茶屋ヘヴンスドアライブありがとうございました！大量の豆がきな粉に
    なってたね！今日は昼からついてきてくれた人たちありがとうだし」（samami27）
    と感想。

    ※Xの告知アーカイブから復元。なんちゃらアイドル自身の出番時刻の言及は
    見当たらないため、イベント全体の開演時刻(19:00)をdateに採用。同日昼には
    「抹茶らて利休氏」生誕を祝う別イベントへの出演も示唆されているが会場名の
    言及が本文中に見当たらないため今回は転記対象外とした（下記コメント参照）
