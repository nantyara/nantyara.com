  content: |
    四谷アウトブレイクで開催された御茶海マミの生誕祭「愛され続けて四半世紀」
    （マミは2/6に25歳の誕生日を迎えたばかり）。月初の予定告知「2月の予定です！
    今月は生誕祭があります！2月17日、日曜日『愛され続けて四半世紀』場所
    四谷アウトブレイク 18:00オープン19:00スタート 前売り2500円（おまけ付き）
    当日3000円 各プラスドリンク代 出演者 姫乃たまさん ザ・アイドルズ
    なんちゃらアイドルバンド マミソロ」（samami27、2/2。同日「生誕オープン
    時間変更になりました！チケットでは18:30開場となってますが、18:00オープンに
    変更です！」との補足あり）。直前告知「とうとう明日だ！緊張する！2月17日
    四谷アウトブレイク！18:00開場、19:00開演！当日はチケット3000円となります！」
    （samami27、2/16）「とうとう本日！」（samami27、2/17）。終演後は「マミちゃん
    生誕たのしかった！サプライズも成功したのでよかった！」（yokuwakan_nai）
    と感想。

    ※Xの告知アーカイブから復元。イベント全体の開演時刻(19:00スタート)をdateに
    採用。出演形態は「なんちゃらアイドルバンド」と「マミソロ」の両方を含む
    構成のため、マミの生誕祭という性質からlabelsに「マミソロ」を付与した
