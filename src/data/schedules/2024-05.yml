  site: 代々木公園ケヤキ並木
  time_tbd: true
  content: |
    代々木公園ケヤキ並木での屋外ライブ「東京ナイトマーケット」（入場無料、屋台あり）。「明日は代々木公園ケヤキ並木でライブします！ナイトマーケット！屋台めっちゃ出る。これは、楽しみですね。」（yokuwakan_nai、5/22）で前日告知（会場・イベント名を確認）。「ちな入場無料です！！！ご飯食べたりお酒飲んだりしながらお楽しみください！楽しみます！！」（yokuwakan_nai、5/22）で入場無料を確認。「楽しみすぎなライブ！
