    モガフェスでのBBQ併設イベント。POPPY救済ユニット「期間限定CHIYOPPY」との特大コラボ。「日曜日19日はPOPPY救済ユニット「期間限定CHIYOPPY」と特大コラボ！！こんなにやるの〜？？？？ってくらいやります！下手しいワンマンレベルの尺！」（samami27、5/18）で前日告知（コラボ内容を確認）。「5月19日はこれ！！！！！！初出しの曲もやります！！！！！バーベキューめっちゃ肉もっていきますがみなさんもいろいろ持ってきてくれたらより盛り上がる！！！！！！！来年も呼ばれたいので！！！！！！！いいとこ見せたい！！！！！」（nantyaraidol、5/19深夜0:51投稿。本文中に「5月19日は」と明記されているため実質「本日＝5/19」の予告と判断しマーカーなしで採用）で日付を再確認（BBQ持参の呼びかけ）。「モガフェスありがとうございました！
