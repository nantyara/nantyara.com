- id: event-20240529-lamama-bunkasai-qtaro
  slug: 20240529-lamama-bunkasai-qtaro
  date: 2024-05-29 19:00:00 +0900
  title: 渋谷La.mama「なんちゃらアイドル主催 大人の文化祭～Q太郎生誕祭～」（バンド編成）
  site: 渋谷La.mama
  content: |
    渋谷La.mama主催ライブ「大人の文化祭～Q太郎生誕祭～」（open18時半/start19時、2500円drink別）。なんちゃら運営Q太郎の44歳の誕生日を祝う回で、バンド編成での出演。「2024年5月29日（水）なんちゃらアイドル主催in渋谷ラママ 大人の文化祭～Q太郎生誕祭～ open18時半 start19時 2500円drink別 なんちゃら運営44歳になります。遊びにいらしてくださいませー！仲良しあつめてやります！」（nantyaraidol、5/1）で告知（日時・料金を確認）。「29日は久しぶりのバンド編成！仲良しばかりよんでおもしろおかしくやります！」（nantyaraidol、5/28）でバンド編成を確認。「明日はラママでQ太郎生誕祭！カッコつけで、イジワルで、でもいざというとき守ってくれる運営の誕生を祝います！
    お祝いだ〜いすき！」（samami27、5/28）で前日告知。「明日渋谷ラママ主催！ なんちゃらはバンドで21:30から！よろしう」（yokuwakan_nai、5/29深夜1:23投稿。投稿のJST日付は5/29で、samami27の前日5/28投稿と同一イベントを指しているため実質「本日＝5/29」の予告と判断しマーカーなしで採用）で当日告知（バンド編成での出番時刻21:30〜を確認）。「Q太郎さんおめでとうございます！
    なんちゃらアイドルバンドでした！
    私たちなりのアンサー！」（samami27、5/29）「はりがとねー（誰1人としてちゃんと撮れてない）」（nantyaraidol、5/29）で有観客開催を確認。

    ※Xの告知アーカイブから復元。dateはイベント全体のopen/start時刻（19:00）を採用。なんちゃらのバンド編成での出番は21:30から。
