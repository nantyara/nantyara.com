    お祭りは久しく行っていなかったんだが、行く理由ができて、行く理由になれて、こんな嬉しい楽しいことってあるのか…！って思いました！応援にきてくれた人、なんちゃらをみつけてくれた人、みんなにビッグラブ！」（samami27、5/23）で有観客開催を確認。同日は19時15分頃からの配信も別途実施された（「19時15分くらいからライブ配信しますビール片手にお待ちくださいませ。」nantyaraidol、5/23）が、これは屋外ライブ本体とは別の配信企画。

