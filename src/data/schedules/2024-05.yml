- id: event-20240507-lamama-otonano-bunkasai-adult
  slug: 20240507-lamama-otonano-bunkasai-adult
  date: 2024-05-07 19:00:00 +0900
  title: 渋谷La.mama「なんちゃらアイドル主催 大人の文化祭～アダルト編～」
  site: 渋谷La.mama
  time_tbd: true
  content: |
    渋谷La.mama主催ライブ。前月（4/12）の予告「本日はありがとうございました！大入り！
    そして次回の大人の文化祭は、アダルト編に突入します！
    この日は配信無し！みんながやりたいようにやる！
    なんちゃらもセクシー衣装でいきますのでみんなカメラ持ってきてください！三脚もオッケーです！」（nantyaraidol、4/12、2024-04アーカイブ）で予告されていた回。「本日おとなの文化祭！おとなの とは、おとなの という意味です！配信ありません！」（yokuwakan_nai、5/7）で当日告知（配信無しを確認）。「今日のおとなの文化祭は"おとな”の日！！」（samami27、5/7）でも当日告知。「大人の文化祭ありがとうございました！
    今日はラン痴気騒ぎって感じ！みんなの目がキラキラしていて星空みたいだったな！」（samami27、5/7）で有観客開催を確認。「GW明けの！ド平日！天気もいまいち！なのにめーっちゃくちゃたくさんのお客さん来てくれて本当に嬉しかったです。…なんちゃらアイドルの本日のライブの動画はSNSにはあげないでいただけたら嬉しいです。また半年後くらいにこういうイベントも開催したいと思います。本当に楽しかったですありがとうございました！」（nantyaraidol、5/8深夜1:42投稿。投稿のJST日付は5/8だが「本日のライブ」は直前の5/7を指すと判断しマーカーなしで採用）で平日開催ながら多数来場・SNS非公開方針を確認。

    ※Xの告知アーカイブから復元。イベント名は本文中では「アダルト編」（4月予告）「おとなの文化祭」（当日表記）と揺れているが、前月予告との連続性からタイトルには「アダルト編」を採用した。開演時刻は本文からは判明せずtime_tbdとした（dateは前月開催時と同一の想定start19時を暫定採用）。
