    （nantyaraidol）。終演後は「新検見川はなぞの座さんでのライブありがとうございました。
    お昼からたくさん歌ってたくさん飲んだのとっても楽しかったです。ジャズも素敵だったね！」
    （yokuwakan_nai）「#はなぞの座 ライブありがとうございました！特製ランチおいしかった〜」
    （samami27）。

