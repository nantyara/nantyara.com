  content: |
    千葉・新検見川「はなぞの座」でのランチ付きライブ。ジャズとの共演企画。事前告知
    「23日はこれ！どうぞよろしくお願い申し上げます！ランチ予約いただかいたかたは、
    11時半によろしくお願い申し上げます！」（nantyaraidol、11/22）。なんちゃらアイドル
    feat.ちょこ太郎Tシャツの初売りもこの日に実施（「初売りは23日の千葉ライブにて！」
