- id: event-20191124-hanyu
  slug: 20191124-hanyu
  date: 2019-11-24 10:50:00 +0900
  title: 世界キャラクターさみっとin羽生（羽生水郷公園）
  site: 羽生水郷公園
  content: |
    埼玉県羽生市の羽生水郷公園で開催された「世界キャラクターさみっとin羽生」（動員30万人
    以上の大規模フェス）へのゲスト出演。ちょこ太郎とのコラボ企画。事前告知「世界
    キャラクターさみっとin羽生 24日はこれ！動員30万人以上の超巨大フェス！なんちゃらは
    10時50分から いがまんちゃんステージ にてライブ！あと、11時50分と12時30分に あにっち
    ステージ近辺 にてゲリラライブ！」（nantyaraidol、11/23）「明日は世界キャラクターさみっと
    というものに出演します。」（yokuwakan_nai、11/23）。当日は同内容を再告知（samami27）
    「今日は世界キャラクターさみっとin羽生にでます！」。終演後は「全世界キャラクターさみっと
    ありがとうございました！ゆるキャラがいっぱいおった！」（samami27）「ゆるキャラさみっと
    地面が地獄のようにぬかるんでて凄かったけど長靴履いて歌ったの面白かったなあ！」
    （yokuwakan_nai）。荒天のため会場は「地獄のような環境」と報告されている。

    ※Xの告知アーカイブから復元。dateはメインステージ（いがまんちゃんステージ）の出番時刻
    (10:50)を採用。11:50・12:30にあにっちステージ近辺でのゲリラライブも実施された。羽生水郷
    公園はvenues.yml未登録のため新規候補として提示（末尾コメント参照）
  sources:
    - https://x.com/nantyaraidol/status/1198120656321146880
    - https://x.com/samami27/status/1198184932230623233
