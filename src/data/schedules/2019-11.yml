# 2019年11月（/mine-x による X 告知アーカイブからの発掘。ソース: mining/x-archive/2019-11.json）
# ドラフト（未コミット・レビュー用）。新規会場候補6件あり（末尾コメント参照）。
# 今回の転記対象は259告知のうち日付・会場・（可能なら）時刻が本文から確認できる11件。
# ⚠️ 日時はすべて post の time フィールド（UTC）を JST（+9h）に変換した上で「本日/今日/明日/
#   昨日/○日はこれ」等の指し示す日付を、announce/day-of/事後報告の3点を突合して確定している
#   （過去月で日付境界の変換ミスが発生した教訓を踏まえた運用）。
#
# 証拠不足・方針により見送ったもの:
#   11/1「あおはる撮影会予約開始（17時〜）」「おちゃうみ撮影会予約開始」（11/3）は、いずれも
#   個人撮影会の「予約受付開始」告知であり、撮影会本体の開催日・会場が本文から確定できない
#   ため転記対象外（過去月の運用踏襲：予約開始告知のみでは個別イベントとして採用しない）
#   11/18「明日は久しぶりに中野クロスバニーに20:30〜出勤します！」（samami27）は、マミ個人の
#   バー出勤（ホステス的シフト）であり、なんちゃらアイドルとしてのライブ・グループイベントで
#   はないため転記対象外（2019-08/09ドラフト等での「個人出勤」除外方針を踏襲）
#   12月の先出し予告群（12/1シモキタ「シモニテ」3ステージ出演、12/2新宿LOVE TKO主催対バン
#   「また捕まる前に是非対バンせねばと思ったのだ」、12/8 OKFKクリスマスディナーショウ、
#   12/24めろん畑a go goとのラママクリスマスツーマン）はいずれも将来月のイベントであり11月
#   ウィンドウの転記対象外（下記の「次ウィンドウへの申し送り」に詳細を記録）
#
# 転記した11件の中で判断が難しかった点:
#   - 11/16・11/17「なんちゃらラママ主催2デイズ」: 11/1・11/11の予告では「16日＝1日目
#     （さよならOdyssey無料配布）／17日＝2日目（みーちゅう&海の家無料配布、サエキけんぞう率いる
#     ジョリッツ・東京恋慕との3マン）」と明記されている。11/15夜〜11/16朝の投稿（yokuwakan_nai
#     「今日は昼！ラママ主催！です！」、samami27「本日から2日間ラママでライブ！！」）から
#     1日目＝11/16（昼公演）が確定。一方、11/16 20:17 JST投稿（nantyaraidol）「2日目！バンドで
#     やりまくります！...東京恋慕とスクラム組んでジョリッツに立ち向かいます！」は、時刻だけ見ると
#     11/16中の投稿だが、内容（ジョリッツ・東京恋慕との3マン＝当初予告の17日枠）と、11/17朝の
#     投稿（samami27「おはようございます。ラママ2DAYS2日目です。」）を踏まえ、11/16夜の予告
#     ポスト（前日夜に翌日の見どころを予告する形式。11/15夜の1日目予告ポストと同じパターン）と
#     解釈し、2日目の本体は11/17として転記した。その後、11/11告知に添付された両日のフライヤー
#     から、正式タイトル、出演者、OPEN 11:00／START 11:45、料金を確認して補完した
#   - 11/23・11/24: 事前情報や文脈から「世界キャラクターさみっとin羽生」が2日間開催の可能性を
#     疑ったが、なんちゃらの出演告知（11/23夜・11/24朝の両方で「今日は」「明日は」を突合）は
#     いずれも11/24単日のみを指しており、なんちゃらの出演は11/24のみと判断した。11/23は別会場
#     （新検見川はなぞの座、千葉）でのランチライブが確認でき、11/19投稿の「初売りは23日の
#     千葉ライブにて」（ちょこ太郎Tシャツ）という記述とも整合する（「千葉ライブ」＝11/23
#     はなぞの座、「羽生」＝11/24のさみっと、という2つの別イベントとして矛盾なく説明できる）
#   - 11/22「ボノボ」: 当初の告知（11/21）では出番が20時50分と23時の2枠と案内されていたが、
#     同じ告知内で「多分23時のは出ないでバックれます！」と明言されており、当日の告知
#     （samami27）も「20:50〜」のみに言及。よって実際の出番は20:50枠のみと判断し、23時枠は
#     content内に経緯として記載するに留めた
#   - 11/6大阪鶴橋SECTION3: 11/3の告知（nantyaraidol）はOPEN 18:30、11/5の告知（samami27）は
#     OPEN 19:00／START 19:30と、開場時刻の記載に食い違いがある。より直近かつ開演時刻まで
#     明記された11/5の告知を採用し、11/3の告知内容（サワレレ(広島)の出演）は出演者情報として
#     content内に残した
#
# 次ウィンドウ（2019-12）への申し送り:
#   - 12/1 下北沢シモキタ「シモニテ」: なんちゃらは全会場（3ステージ）に出演予定、ラグーナは
#     カバー曲のみのセットとの予告あり（11/24 nantyaraidol）。詳細な会場・タイムテーブルは
#     12月ウィンドウで裏取りのこと
#   - 12/2 新宿LOVE TKO「また捕まる前に是非対バンせねばと思ったのだ」: なんちゃらアイドル・
#     ハーリー木村の2組対バン（opening act スーサイドザムライワン）、open19:30/start20:00、
#     2000円ドリンク別（11/25 nantyaraidol告知済み・フライヤーあり）。12月ウィンドウで裏取り
#     のこと（アーカイブ収穫は11月ウィンドウ内にすでに告知本体を含む）
#   - 12/8 OKFKクリスマスディナーショウ: 蒲田某所、19時過ぎから、手作りディナーコース付
#     3000円・限定8名（前売りチケットは11/16発売開始・即完売済み、11/13告知）。12月ウィンドウ
#     で裏取りのこと
#   - 12/24 クリスマスイブ: めろん畑a go goとの渋谷La.mamaツーマン（「重大発表」11/25
#     nantyaraidol）。詳細未定、12月ウィンドウで裏取りのこと
#   - 12月前半発売予定のカバー新録音シングル・12/18発売予定アナログ1stシングル「夜の煙突」
#     （なりすレコード）: 11月ウィンドウ内での新規言及なし（10月アーカイブの申し送り事項の
#     ままステータス変わらず）。11/8「夜の煙突」ジャケ撮の投稿はこの既知の12月リリース予告の
#     続報（新情報なし）
#
# releases.yml裏取り候補（編集は今回しない）:
#   - 8thシングル「チョコ麦畑で捕まえて！」表記ゆれ: 2019-10ドラフトからの持ち越し課題は本
#     ウィンドウでは追加の裏取りができず未解決（11/19投稿で「がぁさん描き下ろしなんちゃら
#     ちょこ太郎Tシャツ」という関連グッズの言及はあるが、シングル名自体の表記の言及なし）
#   - 12月前半発売予定のカバー新録音シングル（曲名不明）・12/18発売予定アナログ1stシングル
#     「夜の煙突」（なりすレコード）: 上記「次ウィンドウへの申し送り」のとおり、12月ウィンドウ
#     で裏取りのこと（本ウィンドウでの新規情報なし）
#   - フォロワー5000人突破記念として11/16・11/17ラママで無料配布された廃盤シングル群:
#     「さよならOdyssey」（インストVer.あり）・「み〜ちゅう」（インストVer.あり）・「海の家」
#     （いずれも既存 releases.yml 記載の可能性が高いが、インストバージョンの存在は新情報。
#     releases.yml整備のタイミングで要確認）
#
# venues.yml新規候補（編集は今回しない。下記6件）:
#   - 鶴橋SECTION3（大阪。11/6「SAIKAI」会場。公式サイト http://section3.jp/access.html への
#     言及あり）
#   - 堺ファンダンゴ（大阪府堺市。11/7「SAIKAI THE SAKAI」会場）
#   - 池袋LIVE INN ROSA（11/9会場。「初めての箱だ〜！」との言及あり）
#   - ボノボ（11/22会場。所在地の言及は本文に見当たらず、東京都内と推測されるが未確認）
#   - 羽生水郷公園（埼玉県羽生市。「世界キャラクターさみっとin羽生」の会場。「羽生水郷公園
#     広すぎて迷子になった」との言及あり）
#   - 新検見川はなぞの座（千葉市花見川区・新検見川。11/23会場。「#はなぞの座」タグの言及、
#     「特製ランチおいしかった」との言及あり。同じ新検見川駅圏の既存venues.yml登録
#     「新検見川Swingy」とは名称・文脈が異なる別会場と判断）
#
# history.ymlへの追記は今回はしない（判断のみ、全期間発掘完了後にまとめて棚卸しする方針）:
#   - 特筆すべき新規マイルストーンは見当たらなかった（5000フォロワー達成は11/5に確認できるが
#     マイルストーンとして採用するかは棚卸し時に判断）

