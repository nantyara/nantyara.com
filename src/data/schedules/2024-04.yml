  site: スープカレーカムイ
  content: |
    秋葉原スープカレーカムイ本店でのなんちゃらアイドル来店イベント（カレーオアダイビンゴ超大会併設）。「明日、4月14日は、なんちゃらアイドルがスープカレーカムイをジャック！
    激レア景品があたるカレーオアダイビンゴ超大会は19時から！なんたらも18時くらいにはカレー食べとりますのでみんな来てくれそしてビールを奢って欲しいものです。」（nantyaraidol、4/13）で前日告知（ビンゴ大会開始時刻19時、なんちゃら来店は18時頃を確認）。「本日は16時半からライブ、そして18時過ぎからカムイ本店さんでイベント！超ビンゴ大会やる！豪華景品！ビンゴは19時からを予定しております。」（nantyaraidol、4/14）で当日告知（同日16時半のK&Mミュージック中野店ライブ後に移動する旨を確認）。「夜19時からは秋葉原スープカレーカムイでビンゴ大会やります！たこかにカレー食べよーっと」（yokuwakan_nai、4/14）でも当日告知。「今日ダメダメでベコベコに凹んだけど、タコカニカレー美味しかったナ〜
    あとビンゴ楽しかった！」（samami27、4/14）で有観客開催を確認。

    ※Xの告知アーカイブから復元。dateはなんちゃら来店開始の目安時刻（18:00）を採用（ビンゴ大会本体は19:00〜）。
