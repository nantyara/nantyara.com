    K&Mミュージック中野店での対バンイベント（清美先生の生誕祭）。「清美先生大お祝いの日！
    ビッグラブを伝えにゆこう。
    前売り3000円+ドリンク代」（samami27、4/14深夜0:33）で前日〜当日にかけて告知（前売料金を確認）。「【御茶海マミ】昨日はお花見たくさんの人来ていただいてありがとうございました！楽しかった！本日は16時半からライブ、そして18時過ぎからカムイ本店さんでイベント！超ビンゴ大会やる！豪華景品！ビンゴは19時からを予定しております。ビール飲みたいビール！」（nantyaraidol、4/14）で開演時刻（16時半〜）を確認。「ほんじつK＆Mミュージック中野店にて清美先生の生誕祭です！この対バンは熱いぜ
