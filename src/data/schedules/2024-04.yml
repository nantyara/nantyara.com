- id: event-20240413-motoyawata-route14
  slug: 20240413-motoyawata-route14
  date: 2024-04-13 12:00:00 +0900
  title: 本八幡Route Fourteen「めろん畑a go go SICK×IDOLS×SICK JAPAN TOUR 2024〜PEANUTS&PEAR〜」ゲスト出演
  site: 本八幡Route Fourteen
  acts:
    - めろん畑a go go
  time_tbd: true
  content: |
    めろん畑a go go主催ツアー「SICK×IDOLS×SICK JAPAN TOUR 2024〜PEANUTS&PEAR〜」へのゲスト出演。会場前に花見も実施。「明日の本八幡、お花見から参加します！集まれ〜！」（samami27、4/12深夜）「明日なんたらもお花見参加します 天気とってもいいらしい ワクワク」（yokuwakan_nai、4/12深夜）で前日告知（会場周辺地名「本八幡」を確認）。「【御茶海マミ】本日は念願のお花見！からのライブ！どちらもチバ！お待ちしております！うきうき！ 写真はすっぴん。」（nantyaraidol、4/13）「本日！
    リハからかっこよくて楽しいこと間違いなし！」（samami27、4/13）で当日告知。「めろん畑a go go
    SICK×IDOLS×SICK JAPAN TOUR 2024〜PEANUTS&PEAR〜
    ありがとうございました！
    お花見からお邪魔いたしまして、心からニコニコで過ごしました！」（samami27、4/13）で有観客開催・イベント名（めろん畑a go go主催ツアー）を確認。

