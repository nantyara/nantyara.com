- id: event-20240411-lamama-bunkasai
  slug: 20240411-lamama-bunkasai
  date: 2024-04-11 19:00:00 +0900
  title: 渋谷La.mama「なんちゃらアイドル主催 大人の文化祭」
  site: 渋谷La.mama
  acts:
    - S.B.Q.アイドル部
    - 美広まりな
    - 肩幅ヒロシ
    - 初咲里奈
    - NEKO
  content: |
    渋谷La.mama主催ライブ「大人の文化祭」（open18時半/start19時、2500円drink別）。フルラインナップ・開演時刻は「来月はこれだ！
    春らしくやります！
    なんちゃらも春らしいフードだすよ！

    2024年4月11日
    なんちゃらアイドル主催in渋谷ラママ
    大人の文化祭
    open18時半　start19時
    2500円drink別

    19時　S.B.Q.アイドル部
    19時30分　美広まりな
    20時00分　肩幅ヒロシ&アズサ
    20時30分　初咲里奈
    21時00分　NEKO
    21時30分　なんちゃらアイドル

    （各25分）」（nantyaraidol、3/13、2024-03アーカイブ）で確認済み。「明日はこれ！ラママで主催！
    エンタメ色強めのうららか春に陽気なライブ！
    なんちゃらも気合いれてfoodつくります！
    おなかすかせてカムヒア！」（nantyaraidol、4/10）で前日告知。「明日はラママで大人の文化祭！
    大人だからはしゃげる場所ってあるんだよね。実は」（samami27、4/11）でも前日告知。「本日はソロで！アズサさんにはゆっくり体調を整えていただきたいです！」（nantyaraidol、4/11）で「肩幅ヒロシ&アズサ」の予定がヒロシのソロ出演に変更されたことを確認。「【御茶海マミ】本日はラママ主催！ foodもめっちゃボリュームあるやつ作ります！最近やってなかった曲もやります！新商品、カレーカラビナも本日から通常販売開始いたします！（在庫僅か）こぞってベイビーカムヒア組曲！」（nantyaraidol、4/11）で当日告知。「ほんじつ！年度始めの文化祭でござい。」（yokuwakan_nai、4/11）でも当日告知。「大人の文化祭ありがとうございました！
    平日なのに楽しかったから、今日は開運日！」（samami27、4/12）「本日はありがとうございました！大入り！
    そして次回の大人の文化祭は、アダルト編に突入します！
    この日は配信無し！みんながやりたいようにやる！
    なんちゃらもセクシー衣装でいきますのでみんなカメラ持ってきてください！三脚もオッケーです！」（nantyaraidol、4/12）で有観客開催（大入り）を確認。「【御茶海マミ】ラママ主催ありがとうございました。本日は大森で初ハコ、風に吹かれてで3マン！時間も長めでじっくりこっとりやらせていただきネズミ！」（nantyaraidol、4/12）でも御礼を確認（この投稿は同日開催の大森イベントの告知も兼ねている）。

    ※Xの告知アーカイブから復元。次回「アダルト編」は開催日未定のため次月以降の申し送りとする。
