  date: 2024-04-03 21:00:00 +0900
  title: 三軒茶屋HEAVEN'S DOOR
  site: 三軒茶屋HEAVEN'S DOOR
  content: |
    三軒茶屋HEAVEN'S DOORでのライブ。「2連休を満喫する御茶海そして明日はヘブンス！茜ちゃんもいる！きしぱんさんもいる！なんちゃらの出番は21時からっぽい！」（nantyaraidol、4/2）で前日告知・出番時刻（21時〜）を確認。「明日は三軒茶屋ヘブンスドアでライブ！楽しみ〜！どうだ〜い？！
    きしぱんさんもいる！！」（samami27、4/2）でも前日告知。「本日ヘブンスなんたら21時から！」（yokuwakan_nai、4/3）で当日告知（出番時刻を再確認）。「ヘブンスライブありがとうございました！
    道太郎さんと写真撮ってもらった！！」（samami27、4/3）で有観客開催を確認。

