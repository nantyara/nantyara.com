  slug: 20240412-omori-kazenifukarete
  date: 2024-04-12 12:00:00 +0900
  title: 大森風に吹かれて（3マン、初ハコ）
  site: 大森風に吹かれて
  time_tbd: true
  content: |
    大森風に吹かれてでのライブ（3マン編成、なんちゃらアイドルにとって初出演の会場）。「明日のライブは初めての場所 大森風に吹かれて です！」（yokuwakan_nai、4/12深夜0:01投稿。投稿のJST日付は4/12だが同日昼以降の実況・お礼投稿と一致するためマーカーなしで採用）で前日告知（初出演の会場であることを確認）。「本日のライブはこちら！
    間違えて蒲田まで行かないようにせねば」（samami27、4/12）で当日告知（近隣の蒲田と間違えないよう注意喚起）。「【御茶海マミ】ラママ主催ありがとうございました。本日は大森で初ハコ、風に吹かれてで3マン！時間も長めでじっくりこっとりやらせていただきネズミ！」（nantyaraidol、4/12）で有観客開催・3マン編成・初出演を確認（この投稿は同日開催のラママ主催イベントへの御礼も兼ねている）。

