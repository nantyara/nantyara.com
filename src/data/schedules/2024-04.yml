- id: event-20240409-soupcurry-kamui
  slug: 20240409-soupcurry-kamui
  date: 2024-04-09 12:00:00 +0900
  title: スープカレーカムイ本店 来店イベント
  site: スープカレーカムイ
  time_tbd: true
  content: |
    秋葉原スープカレーカムイ本店でのなんちゃらアイドル来店イベント。3月アーカイブで先出しされていた開催日は当初4月6日・14日だったが、「すんませ！！今日変更するんですけど、スープカレーカムイのイベントは9日と14日です！！」（samami27、4/3）で9日・14日への変更が告知された。「みんなチー牛カレーはもう食べましたか！！チー牛カレー食べられるのは10日までと聞いていますよ〜！
    すでに食べてくれた人たちありがとう！
    9日と14日にはなんちゃらがスープカレーカムイ本店来店イベントあります！
    モリモリ食べよう！」（samami27、4/7）で改めて日程を確認。「明日はスープカレーカムイ本店さんになんちゃらアイドルが行きます！久しぶりに人に会える〜！たくさんきて欲しい！モリモリ食べてほしい！」（samami27、4/8）で前日告知。「チー牛カレーは明日まで！
    今日はなんちゃら来店！スープカレーカムイ本店に集まれ〜！なんちゃらはもういます」（samami27、4/9）で当日告知。「スープカレーカムイ本店イベントありがとうございました！
    チー牛カレーは明日まで！次は14日、17時ごろからなんちゃらおります！」（samami27、4/9）で有観客開催を確認。

    ※Xの告知アーカイブから復元。開催時刻は本文からは判明せずtime_tbdとした。
