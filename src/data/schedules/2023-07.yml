- id: event-20230729-lamama-stayinalive
  slug: 20230729-lamama-stayinalive
  date: 2023-07-29 10:00:00 +0900
  title: 渋谷La.mama「ステインアライヴ」（ワンマンライブ）
  site: 渋谷La.mama
  content: |
    渋谷La.mamaでのなんちゃらアイドル主催ワンマンライブ「ステインアライヴ」。「ステイン
    アライヴ！いきなりのワンマン告知！9時からごはん食べて10時から2ステ（衣装チェンジ
    あり）たっぷりやって12時には解散！2023年7月29日、9時から！」（nantyaraidol、7/7）で
    フルスペック告知（開場9:00・朝ごはん、開演10:00・2ステージ制、12:00解散）。「明日は
    ワンマンライブをします！渋谷ラママです！」（yokuwakan_nai、前日）で会場を再確認。
    当日「え〜！朝なのに暑い！今日は朝ごはんつきワンマンライブ！」（samami27）で告知。
    終演後「早朝ワンマンありがとうございましたたくさん来てくれて嬉しい。」（nantyaraidol）
    「ラママ早朝ライブありがとうございました！」（samami27）「朝のワンマン！ありがとう
    ございました！懐かしい曲やりました。新曲も。」（yokuwakan_nai）で有観客開催を確認。
    6月申し送りにあった「あおはるソロ・マミソロ・なんちゃら本体を1日通し」という段組みは
    本ウィンドウの告知文（7/7付、上記フルスペック告知）では確認できず、「2ステ（衣装
    チェンジあり）」という表現に留まる。推測での段組み復元はしていない。

    ※Xの告知アーカイブから復元。開演時刻10:00は7/7付フルスペック告知記載どおり
    （開場9:00・朝ごはん付き）。
  sources:
