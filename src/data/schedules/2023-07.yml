  content: |
    原宿クロコダイルでのライブ。5月申し送りの「7月クロコ企画」（「中高生の頃から聴いて
    いたバンドのギタリストに、7月、なんちゃらの曲を5曲も演奏していただくことになった」
    なんちゃら運営、5月アーカイブより）に対応。「明日は原宿クロコダイル！なんちゃら
    アイドルはなんと、超豪華なバンドの演奏で歌わせていただきます！」（yokuwakan_nai、
    7/24）「明日は東京暮色さんと原宿クロコダイルでライブします！」（samami27、7/24）で
    予告（対バン相手「東京暮色」を確認）。終演後「原宿クロコダイルありがとうございました！
    帰路です。贅沢なライブをさせて頂きました。感無量です。」（yokuwakan_nai、7/26未明）で
    有観客開催を確認。両予告投稿とも「明日は」との表現でありJST 7/24中の投稿だったため、
    開催日は7/25と判断。5月申し送りにあった具体的なギタリスト名は本文からは特定できなかった
    （画像内容からの推測はしない方針のため保留）。対バン「東京暮色」をactsに追加。

