- id: event-20200127-ogikubo-doctor
  slug: 20200127-ogikubo-doctor
  date: 2020-01-27 19:00:00 +0900
  title: 荻窪club Doctorライブ（マサルさん主催誕生日会）
  site: 荻窪club Doctor
  duplicate_ok: true
  acts:
