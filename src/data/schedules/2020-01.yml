- id: event-20200129-lamama-giantkilling2
  slug: 20200129-lamama-giantkilling2
  date: 2020-01-29 19:30:00 +0900
  title: it's a giant killing!! vol.2「夜の煙突」発売記念ライブ（渋谷La.mama）
  site: 渋谷La.mama
  labels:
    - 主催ライブ
  acts:
    - カーネーション
  content: |
    渋谷La.mamaでのなんちゃらアイドル主催シリーズ「giant killing」第2弾。アナログ
    シングル「夜の煙突」（カーネーション版とのスプリット7インチ、なりすレコード）
    発売記念ライブ。カーネーションとの対バン。事前告知「1/29 at渋谷La.mama it's a
    giant killing!! vol.2「夜の煙突」発売記念ライブ 19:30/¥4000 カーネーション、
    なんちゃらアイドル 明日はレコ発！はじめての全国流通盤！うれしいな〜なんだか今
    泣けている。明日お待ちしております！」（samami27、1/28深夜）。当日「本日、いよいよ
    渋谷ラママにて カーネーションさんとレコ発ツーマンライブです。レコード、とっても
    素敵に出来上がってます！よろしくお願い致します。」（yokuwakan_nai）、「今夜は
    渋谷ラママでジャイアントキリング！アナログシングル『夜の煙突』発売記念ライブです！
    19:00オープン！19:30スタート！」（samami27）。終演後「It's a giant killing！
    ありがとうございました。とんでもなく緊張しましたが…カーネーションさんとコラボも
    させていただけて、ありがとうございました！」（samami27）、「日付変わっちゃいましたが
    渋谷ラママありがとうございました！夢みたいな日でした。」（yokuwakan_nai）。同日
    9thシングル「蛇酢と木綿と」のCD版も同時発売（別途releases.yml裏取り候補として
    末尾コメント参照）。

