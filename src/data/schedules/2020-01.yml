  content: |
    荻窪club Doctorへの2回目の出演。主催者マサル氏の誕生日会企画。事前告知
    「本日！荻窪club Doctor！今日は電車間違えないといいな…」（samami27）、
    「本日こちら！出演19時からとちょっと早めですがぜひ遊びに来てください！対バンが
