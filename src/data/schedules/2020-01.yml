- id: event-20200105-goldenegg-quinqfesta-final
  slug: 20200105-goldenegg-quinqfesta-final
  date: 2020-01-05 12:00:00 +0900
  time_tbd: true
  title: QuinQfesta.final（新宿ゴールデンエッグ・昼の部）
  site: 新宿ゴールデンエッグ
  labels:
    - 主催ライブ
  content: |
    新宿ゴールデンエッグで20回以上続いたシリーズ「QuinQfesta」の最終回。事前告知
    「1月5日は主催2本立て！昼間は新宿ゴールデンエッグ！こちらは20回以上続いた
    シリーズの最終となります！看取りに来て！夕方からは東新宿LOVETKO！近いので
    回せます！セトリも完全に変えて行きます！特に昼間のセトリはいつもやらない
    珍しい曲ばかりなのでお楽しみに！」（nantyaraidol、1/4）。当日
    「今日は昼夜ライブです 正月を終わらせないぞ」（yokuwakan_nai）。終演後
    「本日1日ありがとうございました！昼から夜、長い時間同じ空間にいたのだなぁと
    ぼんやりしております！」（samami27）。

    ※Xの告知アーカイブから復元。開演時刻の言及が本文に見当たらないため time_tbd
    とした（「昼間」との言及のみ）。同日夕方の東新宿LOVETKOと合わせて主催2本立て。
  sources:
    - https://x.com/nantyaraidol/status/1213299459582357504
    - https://x.com/yokuwakan_nai/status/1213621464416415744
    - https://x.com/samami27/status/1213832876698947586

