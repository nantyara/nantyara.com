  slug: 20200128-omori-saizeriya
  date: 2020-01-28 19:00:00 +0900
  title: あおはる生誕サイゼ全メニュー制覇オフ会（大森のサイゼリヤ）
  site: 大森のサイゼリヤ
  content: |
    あおはる生誕祭企画のオフ会。当初「都内某所のサイゼリヤ」「会場が蒲田から大森に
    なりました！」として告知（nantyaraidol、1/12・1/26）:「1月28日、あおはる生誕、
    サイゼのメニュー全部食べつくしパーティ！食べ飲み放題29800円のところ、何かしら
    プレゼントをくれた人（10円のガムでも要らないレシートとかでも可）は3000円で
    ご案内！ありえないと思いますが足がでたらなんちゃら運営がかぶります。」
    当日「再度お知らせです。本日のサイゲ会は、蒲田ではなく、大森です。」
    （nantyaraidol）、「本日のサイゲ会、来てくれる宣言してくれた方、お間違えないように！
    大森のサイゼです！」（yokuwakan_nai）、「19時から！」（yokuwakan_nai）。終演後
    「あおはる先生、サイゼメニュー食べ尽くしてました。みんなが帰った後も食べてた。
    すごい。」（samami27）、「サイゼ会ありがとうございました！全てのメニューをひとくちずつ
    食べました！！！一生自慢します！！」（yokuwakan_nai）。

    ※Xの告知アーカイブから復元。ライブ形式ではなくファンオフ会（食べ放題企画）。
    具体的な店舗名までは本文から特定できず「大森のサイゼリヤ」とした（新規会場候補、
    末尾参照）。
