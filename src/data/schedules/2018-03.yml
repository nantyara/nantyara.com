- id: event-20180313-mifa
  slug: 20180313-mifa
  date: 2018-03-13 18:20:00 +0900
  title: 神田サウンドステージミーファ「三月ウサギノ宴」
  site: 神田サウンドステージミーファ
  acts:
    - マスクメイド
    - フェッティーズ
  content: |
    神田サウンドステージミーファでの対バンイベント『三月ウサギノ宴』。開場17:00／
    開演17:30。予約￥2,500+1D／当日￥3,000+1D。事前告知「マスクメイド観れるの嬉しい！
    フェッティーズともまたあえる！なんたらは18時20分から！」と出番時刻を案内。
    終演後は「三月ウサギノ宴ありがとうございました！マスクメイドさん呼んでくださって
    ありがとうございました！今日本当に楽しかった…！」「楽しい地獄と幸せな天国の高低差が
    凄くて耳キーンなるわ！！！」と感想。

    ※Xの告知アーカイブから復元。会場「神田サウンドステージミーファ」は venues.yml 上の
