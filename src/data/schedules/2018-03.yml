# 2018年3月（/mine-x による X 告知アーカイブからの発掘。ソース: mining/x-archive/2018-03.json）
- id: event-20180301-lush
  slug: 20180301-lush
  date: 2018-03-01 19:35:00 +0900
  title: 渋谷LUSHライブ
  site: 渋谷LUSH
  content: |
    渋谷LUSHでのライブ。samami27の告知「そろそろ渋谷LUSHライブ始まります！なんちゃらは
    3番手！！」に続き、yokuwakan_naiが「LUSHにて待つ！出番は19:35から。」と出番時刻を
    案内。終演後は「渋谷LUSHライブありがとうございました！たのしかったーー！」と感想。
    ライブ中に新曲を初披露したとの言及もあり（yokuwakan_nai談）。この日はライブ後、
    samami27が24時からゴールデン街のバー「HAPPY」で店番も行った（別イベントにつき
    本エントリには含めない）。

    ※Xの告知アーカイブから復元
  sources:
