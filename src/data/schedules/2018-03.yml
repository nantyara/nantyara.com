- id: event-20180314-heavensdoor
  slug: 20180314-heavensdoor
  date: 2018-03-14 21:00:00 +0900
  title: 三軒茶屋HEAVEN'S DOORライブ（ホワイトデー企画）
  site: 三軒茶屋HEAVEN'S DOOR
  acts:
    - ミケ
    - 毎日サプリメント
    - 堕天使プロジェクト
    - 中出し少年
  content: |
    三軒茶屋HEAVEN'S DOORでのライブ。事前告知「お次は三軒茶屋ヘブンズドア！なんたらは
    21時から！またもや中出し少年と対バン！プレゼント用意してます！」。当日朝には
    「18時半オープン2000円！なんちゃらアイドルのライブは21時からです！」と再告知。
    ホワイトデー企画として柿ピーを配布。終演後は「三軒茶屋ヘブンスドアありがとう
    ございました！ジャージは楽なので嬉しい。（略）毎日サプリメントさん今日で解散
    だったけど」「ミケさん、毎サプさん、堕天使プロジェクトさん、中出し少年さん
    ありがとうございました！ホワイトデーということで柿ピー振る舞いました」と感想。
    この日、毎日サプリメントは解散ライブだった模様。

