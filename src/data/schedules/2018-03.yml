- id: event-20180308-club251
  slug: 20180308-club251
  date: 2018-03-08 19:00:00 +0900
  title: 下北沢251「お試しキャストレコ発ツアー」
  site: 下北沢251
  acts:
    - お試しキャスト
    - 残響オーケストラ
    - フェッティーズ
    - 中出し少年
  content: |
    下北沢251にて、お試しキャストのレコ発ツアーに出演。事前告知「次はこれ！下北沢251
    お試しキャストレコ発ツアー！なんちゃらは19時からでます。すごく音が良いとこなので
    思い切り気持ちよく歌ってきます！チケ代も予約いただければ2000円とわりとお安め！」。
    前日には「251は広くてオシャレで良いぞ〜。そして仲良し残響オーケストラさん、
    フェッティーズさん、とにかく名前が気になる中出し少年さんともりだくさん。」と
    同日出演者に言及。終演後は「下北沢251ありがとうございました！お先にHAPPY向かいます」
    「お試しキャストさんレコ発おめでとうございます！熱くてヒリヒリしてて楽しいイベント
    でした。」と感想。下北沢251への出演は「久しぶり2回目」とのこと。

    ※Xの告知アーカイブから復元。会場「下北沢251」は venues.yml 上の既存会場
    「下北沢Club251（id: club251）」と同一と判断（表記ゆれのため alias 追加が必要）
