- id: event-20180303-ryugu
  slug: 20180303-ryugu
  date: 2018-03-03 12:00:00 +0900
  time_tbd: true
  title: 高円寺龍宮ライブ「東京砂漠的桃ノ節句」
  site: 高円寺龍宮
  images:
    - /events/20180303-ryugu.jpeg
  acts:
    - セイ★
    - モモナシ
    - 大月めい
  content: |
    高円寺龍宮でのライブ。3/1の事前告知で「次は3月3日高円寺龍宮〜、おしゃれな場所との
    ことなのでおしゃれな格好してかないとなあ〜。モモナシさん楽しみ。」とあり、モモナシが
    同日出演と思われる。当日は「竜宮ライブ本日！鯛やヒラメまいおどらす！」
    「龍宮すごいかっこいい！赤い！あと金！！」「龍宮超おしゃれ、、、、モモナシさんの
    リハ聞いてるけど超かっこいい」とテンション高めの実況が続いた。終演後は
    「本日、高円寺龍宮でのライブありがとうございました！おっしゃれーな場所で
    キャッキャウフフでした！」「タイもヒラメも舞狂ったライブでした！」と感想。
    翌3/4は同メンバーによる「リーディングライブ（朗読劇）」も予告されているが、
    会場の記載が見当たらないため別イベントとして本アーカイブでは転記していない
    （未転記候補としてレポートに記載）。

    ※Xの告知アーカイブから復元。公式フライヤー「東京砂漠的桃ノ節句」から、
    出演がセイ★（from台湾）・モモナシ・なんちゃらアイドル・大月めいの4組、
    開宮(開場)18:00／開宴(開演)18:30、前売3000縁／当日3500縁+ドリンクと確認できた。
    ただしなんちゃら自身の個別出番時刻の記載はフライヤー内に見当たらないため、
    time_tbd は維持した
  sources:
