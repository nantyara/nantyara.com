- id: event-20180324-rednose
  slug: 20180324-rednose
  date: 2018-03-24 12:30:00 +0900
  title: 新宿レッドノーズ 星野百花主催ライブ（無銭）
  site: 新宿レッドノーズ
  acts:
    - すこやか健康クラブ
    - 信岡ひかる
    - るなっち☆ほし
    - 星野百花
    - 岬たん
    - sommeil sommeil
    - AsH
  content: |
    新宿レッドノーズでの無銭（投げ銭）ライブ。「静岡のオタカラ」こと星野百花の
    主催企画。事前告知「3/24 新宿レッドノーズ OPEN9:30 START10:00 出演/
    なんちゃらアイドル/すこやか健康クラブ/信岡ひかる/るなっち☆ほし/星野百花/岬たん/
    sommeilsommeil/AsH 朝から全力出す！」。会場「新宿レッドノーズ」は新宿ルイードK4の
    入り口から入場する形態だった模様（「レッドノーズ、ルイードK4の入り口から入って
    きてね！」）。なんちゃら自身の出番の明記は見当たらないが、11:57頃（JST）の
    ツイート「なんちゃらまであと30分！間に合うや？間に合わざるや？」から、出番は
    12:27頃（約12:30）と推定される。終演後は「新宿レッドノーズライブありがとう
    ございました！人多くてすげかった。」「昼間のライブは明るくて最高！ライブ終わっても
    まだ1日がたくさんある！」と感想。

    ※Xの告知アーカイブから復元。出番時刻は開演前の実況ツイート（「あと30分」）からの
    推定であり公式な時刻告知ではないため確度は高くない。「新宿レッドノーズ」は
    venues.yml 未登録会場のため新規追加が必要
