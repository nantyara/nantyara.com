- id: event-20180326-heavensdoor
  slug: 20180326-heavensdoor
  date: 2018-03-26 19:40:00 +0900
  title: 三軒茶屋HEAVEN'S DOORライブ
  site: 三軒茶屋HEAVEN'S DOOR
  images:
    - /events/20180326-heavensdoor.jpg
  acts:
    - Virgin Crab Band
    - バイドク
    - Cyclops
    - ヒゲと味噌汁
  content: |
    三軒茶屋HEAVEN'S DOORでのライブ。3/19に「2018年4月25日（水）「なんちゃらなヘブン
    vol.01」」（別イベント、本エントリには含めない）のタイムテーブル更新と共に案内が
    始まり、3/24にこの日のタイムテーブルが確定：
    「1 19:00-19:30 Virgin Crab Band／2 19:40-20:10 なんちゃらアイドル／
    3 20:20-20:50 バイドク／4 21:00-21:30 Cyclops／5 21:40-22:10 ヒゲと味噌汁」。
    チャージ2000円。当日は「このあと19:40から三軒茶屋ヘブンスドアにて、なんちゃら
    アイドルライブです！」と再告知。運営（マネージャー）も久しぶりに会場入りしたとの
    言及あり。終演後は「ヒゲと味噌汁の姐さん方にかわいがってもらってうれしかったな。」
    と感想。

