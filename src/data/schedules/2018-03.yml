- id: event-20180316-firebird
  slug: 20180316-firebird
  date: 2018-03-16 20:10:00 +0900
  title: 新松戸FIREBIRDライブ（月一無料カバーCD配布）
  site: 新松戸FIREBIRD
  acts:
    - 工藤ちゃん
  content: |
    新松戸FIREBIRDでのライブ。事前告知「今月のなんちゃら無料音源配布は16日の新松戸
    FIREBIRD！スパンクハッピーの「フロイドと夜桜」をカバー！もちろんトラックから
    リメイクしました！これをプレゼント！こちらはこの日を逃すとほぼ入手不可能なので
    是非！ちなみになんちゃら目当てでなくても、当日来てくれた人全員にさしあげます！」。
    当日は「本日16日は新松戸ファイアバードにてライブ！なんちゃらは20:10から！
    スタート前に入場すると+1Dプレゼントだよ！」と再告知。「集客勝負デイ」との言及も
    あり、翌日の御礼ツイートで「集客勝負は工藤ちゃんと同率1位でした皆様のおかげです」
    と、工藤ちゃんが同日出演で集客数を競う相手（対バン相手）だったことが分かる。
    「罰ゲームのジュース」企画もあった模様。

    ※Xの告知アーカイブから復元
  sources:
    - https://x.com/nantyaraidol/status/973235085439725568
    - https://x.com/nantyaraidol/status/974009764018495488
    - https://x.com/samami27/status/974404269259411456
    - https://x.com/yokuwakan_nai/status/974878234813767681
- id: event-20180324-rednose
  slug: 20180324-rednose
  date: 2018-03-24 12:40:00 +0900
  title: 新宿レッドノーズ 星野百花主催ライブ（無銭）
  site: 新宿レッドノーズ
  images:
    - /events/20180324-rednose.jpeg
  acts:
    - すこやか健康クラブ
    - 信岡ひかる
    - るなっち☆ほし
    - 星野百花
    - 岬たん
    - sommeil sommeil
    - AsH
  content: |
    新宿レッドノーズでの無銭（投げ銭）ライブ。「静岡のオタカラ」こと星野百花の
    主催企画。事前告知「3/24 新宿レッドノーズ OPEN9:30 START10:00 出演/
    なんちゃらアイドル/すこやか健康クラブ/信岡ひかる/るなっち☆ほし/星野百花/岬たん/
    sommeilsommeil/AsH 朝から全力出す！」。会場「新宿レッドノーズ」は新宿ルイードK4の
    入り口から入場する形態だった模様（「レッドノーズ、ルイードK4の入り口から入って
    きてね！」）。終演後は「新宿レッドノーズライブありがとう
    ございました！人多くてすげかった。」「昼間のライブは明るくて最高！ライブ終わっても
    まだ1日がたくさんある！」と感想。

    ※Xの告知アーカイブから復元。公式フライヤー（タイムテーブル画像）で開場9:30／開演10:00、
