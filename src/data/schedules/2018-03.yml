- id: event-20180308-club251
  slug: 20180308-club251
  date: 2018-03-08 19:05:00 +0900
  title: 251 presents 〜お試しキャストレコ発ツアー〜
  site: 下北沢251
  images:
    - /events/20180308-club251.jpeg
  acts:
    - お試しキャスト
    - 中出し少年
    - PUNiK
    - 残響オーケストラ
    - フェッティーズ
  content: |
    下北沢251にて、お試しキャストのレコ発ツアーに出演。開場18:00／開演18:30、
    前売¥2,000／当日¥2,500（+ドリンク代別途500円）。タイムテーブルは
    ①18:30-18:55 残響オーケストラ／②19:05-19:30 なんちゃらアイドル／
    ③19:40-20:05 中出し少年／④20:15-20:40 フェッティーズ／
    ⑤20:55-21:20 PUNiK／⑥21:35-22:00 お試しキャスト。事前告知「次はこれ！下北沢251
    お試しキャストレコ発ツアー！なんちゃらは19時からでます。すごく音が良いとこなので
    思い切り気持ちよく歌ってきます！チケ代も予約いただければ2000円とわりとお安め！」。
    前日には「251は広くてオシャレで良いぞ〜。そして仲良し残響オーケストラさん、
    フェッティーズさん、とにかく名前が気になる中出し少年さんともりだくさん。」と
    同日出演者に言及。終演後は「下北沢251ありがとうございました！お先にHAPPY向かいます」
    「お試しキャストさんレコ発おめでとうございます！熱くてヒリヒリしてて楽しいイベント
    でした。」と感想。下北沢251への出演は「久しぶり2回目」とのこと。

    ※Xの告知アーカイブから復元。会場「下北沢251」は venues.yml 上の既存会場
    「下北沢Club251（id: club251）」と同一と判断（表記ゆれのため alias 追加が必要）。
    公式フライヤーのタイムテーブルでは、なんちゃらアイドルの出番は19:05-19:30と確認できた
    （事前告知の「19時から」はおおよその案内だった模様）。タイトルもフライヤー記載の
    「251 presents 〜お試しキャストレコ発ツアー〜」に修正
  sources:
