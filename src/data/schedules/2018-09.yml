- id: event-20180905-lamama
  slug: 20180905-lamama
  date: 2018-09-05 15:20:00 +0900
  title: じゅんじゅん誕生日ライブ（渋谷La.mama）
  site: 渋谷La.mama
  content: |
    渋谷La.mamaでの対バンイベント。「じゅんじゅん」の誕生日を祝うライブ。事前告知
    「明日はまず渋谷ラママにてじゅんじゅんの誕生日を盛大に祝い(15:20〜)、その後新宿marble
    に移動、愛でもって半径1メートルを救います(19:45〜)。遊ぼうぜ。」（yokuwakan_nai、
    9/5同日はしごの新宿Marble回の告知も同時に含む。Marble分は別イベントとして転記）。
    終演後は「ラママじゅんじゅん誕生日ライブありがとうございました！お次は新宿マーブル
    にて歌います！19:45〜 ！救うぞ〜〜！！」（samami27）「ほんじつは渋谷ラママからの
    新宿マーブルありがとうございました！人を祝ったり救ったりしたので、今の私は“善”であり
    “陽”です。」（yokuwakan_nai）と感想。「じゅんじゅん」が何者かは本文からは特定できない。
    対バン相手の具体名の言及は見当たらない。

    ※Xの告知アーカイブから復元。なんちゃらアイドルの出番時刻(15:20)をdateに採用
  sources:
    - https://x.com/yokuwakan_nai/status/1036992185432854528
    - https://x.com/samami27/status/1037236168683712512
    - https://x.com/yokuwakan_nai/status/1037351716444725249
- id: event-20180905-marble
  slug: 20180905-marble
  date: 2018-09-05 19:45:00 +0900
  title: 新宿Marbleライブ
  site: 新宿Marble
  content: |
    新宿Marbleでのライブ。同日、渋谷La.mama（15:20〜、event-20180905-lamama）からの
    はしご2本目。事前告知「明日はまず渋谷ラママにてじゅんじゅんの誕生日を盛大に祝い
    (15:20〜)、その後新宿marbleに移動、愛でもって半径1メートルを救います(19:45〜)。
    遊ぼうぜ。」（yokuwakan_nai）。終演後は「新宿マーブルライブありがとうございました！！
    コンプラピーーーッ！！！じゅんじゅんのお誕生日祝えて、好きな人たちと対バンできて、
    今日の占い1位だったんだろうな〜〜」（samami27）と感想。対バン相手の具体名の言及は
    見当たらない。

    ※Xの告知アーカイブから復元。なんちゃらアイドルの出番時刻(19:45)をdateに採用
