- id: event-20180912-heavensdoor
  slug: 20180912-heavensdoor
  date: 2018-09-12 19:00:00 +0900
  title: なんちゃらアイドル主催「なんちゃらなヘブンス！～なんちゃら100人組手～」
  site: 三軒茶屋HEAVEN'S DOOR
  labels:
    - 主催ライブ
  acts:
    - 税金5%
    - 東京恋慕
    - お試しキャスト
    - ヒゲと味噌汁
  content: |
    三軒茶屋HEAVEN'S DOORでのなんちゃらアイドル主催イベント「なんちゃらなヘブンス！
    ～なんちゃら100人組手～」。事前告知「次回 ヒゲと味噌汁 なんちゃらなヘブンス！
    ～なんちゃら100人組手～ 2018年9月12日（水） 三軒茶屋ヘブンスドア 前売り2000
    当日2500 open18時半 start19時 税金5％、東京恋慕、お試しキャスト、ヒゲと味噌汁、
    なんちゃらアイドル」（nantyaraidol）「主催明日か…流石に女子高生にはもう見えないけど、
    …明日三軒茶屋ヘブンスドアに集合ね…なんちゃら主催は対バンが良いのが特徴です。」
    （samami27）。当日の投稿では「なんちゃら運営が佐山の真似してあおはるを怒鳴りちらし、
    バチバチ殴っていたら…」「本日は、なんちゃらの髪の毛入りワラ人形が配られてましたが」
    （ともにnantyaraidol）と会場の様子を投稿。後日「お試しキャスト、みためこえーけど
    ほんと暖かくてでもキレのある演奏がイイんだ！八王子がホームとのことなので、ぜひ今度は
    お呼ばれしたい所存よー！」（nantyaraidol、9/14）と対バン相手への言及あり。

    ※Xの告知アーカイブから復元。会場全体の開演時刻(19:00)をdateに採用（なんちゃら
    個別の出番時刻の記載は見当たらない）
