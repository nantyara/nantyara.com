    - https://x.com/yokuwakan_nai/status/1040956337381793792
    - https://x.com/samami27/status/1040984264014061568
- id: event-20180916-showboat
  slug: 20180916-showboat
  date: 2018-09-16 11:25:00 +0900
  title: 「Beat Happening！＠高円寺IDLE PANIC！最強説！」
  site: 高円寺SHOW BOAT
  content: |
    高円寺SHOW BOATでの対バンイベント「Beat Happening！＠高円寺IDLE PANIC！最強説！」。
    同日2本立ての1本目（2本目は六本木VARIT、event-20180916-roppongi-varit）。事前告知
    「9月16日1本目 高円寺SHOW BOATにて Beat Happening！＠高円寺IDLE PANIC！最強説！に
    出演します！開場10:30、開演11:00 チケット代 前売り2500円、当日3000円 なんちゃらは
    11時25分から最強に歌います！」（samami27）。終演後は「本日ライブ1本目ありがとう
    ございございました！うちら高円寺1猫だったと思います。写真はNaNoMoRaLの未來さんと。
    キスエクさんに写真誘っていただいたのにタイミング合わず…またお会いできたらいいなぁ。
    今日の対バンすごい…。次は六本木VARITです。」（samami27）と感想。写真に写った
    「NaNoMoRaL」「キスエク」は対バン相手の可能性が高いが、共演者として明言されて
    いないため acts には含めなかった。

    ※Xの告知アーカイブから復元。なんちゃらアイドルの出番時刻(11:25)をdateに採用
  sources:
    - https://x.com/samami27/status/1041005876176285697
    - https://x.com/samami27/status/1041202038472761344
