- id: event-20180918-club-malcolm
  slug: 20180918-club-malcolm
  date: 2018-09-18 21:00:00 +0900
  title: 渋谷Club Malcolmライブ
  site: 渋谷Club Malcolm
  content: |
    渋谷Club Malcolmでの対バンイベント（お笑いライブとの併催）。事前告知「明日は渋谷
    Malcolmにてライブ！開場18:00 開始18:30 前売り2500円/当日3000円プラスドリンク代
    なんちゃらは21:00から歌うます〜！仕事帰りなどによろぴこです。」（samami27）。当日は
    「ほんじつこちら！お笑いもみれてお得じゃん！なんちゃらは21時から！ベロ長い」
    （yokuwakan_nai）と再告知。終演後は「遅くなりましたが渋谷まるこむありがとう
    ございました！お笑い見た直後にライブやるの面白いだった。」（yokuwakan_nai）
    「渋谷Malcolmありがとうございました！！るなほしさんの振りがかわいくてすごい。」
    （samami27）と感想。「るなほしさん」への言及があるが、対バン相手か否か表記が
    曖昧なため acts には含めなかった。

