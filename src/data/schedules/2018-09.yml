- id: event-20180925-firebird
  slug: 20180925-firebird
  date: 2018-09-25 12:00:00 +0900
  time_tbd: true
  title: なんちゃらアイドルワンマンライブ
  site: 新松戸FIREBIRD
  content: |
    新松戸FIREBIRDでのワンマンライブ。8/1の同会場ライブとは別回（8月は対バン形式、
    今回はワンマン）。事前告知「明日、9月25日はとうとう新松戸FIRE BIRDでワンマンだぞっ
    予約はお店へ電話かメール、もしくはリプライでも可！あと4名ほど入れますゆえ！」
    （samami27）「日付変わって本日！！！！！！！！ワンマンライブよ！！！！！撮影
    タイムもバータイムもあるしライブも長時間ゴリゴリやるよ！！！！ぽよが体調不良で
    来れなくなってしまったので早く元気になるように新松戸から愛を送ろうね。」
    （yokuwakan_nai）。オープニングアクト予定だった星野百花が体調不良で出演できなく
    なった旨も事前に告知されている（nantyaraidol）。終演後は「新松戸FIREBIRDワンマン
    ライブありがとうございました！！楽しすぎて記憶ない！！今日のわたし大丈夫でした
    か…？」（samami27）「昨日のワンマンライブ、ほんとうにほんとうにありがとう
    ございました！すごく楽しかった、ニコニコです。アイドルは楽しい。」（yokuwakan_nai）
    と感想。今回のなんちゃらアイドルを最初に新松戸FIREBIRDへ紹介した「ジェームス」への
    謝辞投稿もあった（nantyaraidol）。

    ※Xの告知アーカイブから復元。開演・出番の具体的な時刻の言及が見当たらないため
