- id: event-20180915-yucity
  slug: 20180915-yucity
  date: 2018-09-15 12:00:00 +0900
  time_tbd: true
  title: 「大田区蒲田復興協会」（OKFK）
  site: ゆ〜シティ蒲田 YCKホール
  content: |
    ゆ〜シティ蒲田 YCKホールでの「大田区蒲田復興協会」（通称OKFK）シリーズのイベント。
    当日の投稿「もうゆ〜シティーでご飯食べてる」（samami27）に続き、「ゆ〜シティー
    ありがとうございました！！！！！！！！楽しい宴会だった〜」（yokuwakan_nai）、
    「OKFK（大田区蒲田復興協会）ありがとうございました！！ライブで浴衣を着るのは
    最後かな？夏は終わった！OKFKのおかげで蒲田での思い出と、教養が深まっていっている！！
    今日もお集まりいただきありがとうございました！明日は昼と夜の2本ライブ！」
    （samami27）と、宴会とライブ双方への感謝投稿があった。「ゆ〜シティー」での宴会と
    「OKFK」ライブが同一イベント内の別パートなのか別イベントなのか本文からは断定
    できないが、同日・近い時間帯・同じ蒲田エリアの投稿であるため一体のイベントとして
    転記した。対バン相手の具体名の言及は見当たらない（8/31のOKFKは蒲田オッタンタ開催で
    今回とは会場が異なる）。

    ※Xの告知アーカイブから復元。開演・出番の具体的な時刻の言及が見当たらないため
    time_tbd とした
  sources:
