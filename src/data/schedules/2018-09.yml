- id: event-20180929-marble
  slug: 20180929-marble
  date: 2018-09-29 12:00:00 +0900
  time_tbd: true
  title: 「岬たんアイドルフェス」（新宿Marble）
  site: 新宿Marble
  content: |
    新宿Marbleでの対バンイベント「岬たんアイドルフェス（岬たんアイドルフェスティバル）」。
    同日2本立ての1本目（2本目は三軒茶屋HEAVEN'S DOOR、event-20180929-heavensdoor）。
    事前告知「明日はライブ2本ございます！まず新宿マーブルにて岬たんアイドルフェス、
    そしてその後三軒茶屋ヘブンスドア(19:40〜）です！よろしくおねがいいたします！」
    （yokuwakan_nai）。なんちゃら個別の出番時刻の言及はアーカイブ中に見当たらない。
    終演後は「本日1本目ありがとうございました！岬たん呼んでくれてありがとう！！体調
    崩してる方が何人かいて心配…お大事にね…！お写真はくらむずさんと！次の現場は三軒茶屋
    ヘブンスドア！19:40分から歌います！」（samami27）「岬たんアイドルフェスティバル
    ありがとう！岬たん最高！三軒茶屋ヘブンスドアに向かいます！」（yokuwakan_nai）と
    感想。イベント名から「岬たん」（8/31のOKFKにも出演していた岬たん）主催・関連企画と
    みられる。

