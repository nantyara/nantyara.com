- id: event-20180922-lounge-neo
  slug: 20180922-lounge-neo
  date: 2018-09-22 19:30:00 +0900
  title: 「360°ライブJAPAN」
  site: 渋谷lounge neo
  acts:
    - 西村ひよこちゃんX
    - 狂い咲きセンターロード
    - わたわた我爱你
    - ごちゃすと
  content: |
    渋谷lounge neoでの対バンイベント「360°ライブJAPAN」。会場を360度囲んで観られる
    形式のライブ。事前告知「2018/09/22 360°ライブJAPAN @渋谷lounge neo start:1630
    予約2500yen 出演 西村ひよこちゃんX 狂い咲きセンターロード まずいよ脱脂粉乳
    わたわた我爱你 ごちゃすと なんちゃらは19時半くらいから歌います◎」（samami27）の後、
    「わたしが先日から説明していた会場と今日の会場違うわ…。わたしが想像してたのは、
    渋谷グラッドかもしれない…！すまぬ」（samami27）と会場の訂正投稿があり、続けて
    改めて出演者リストを再掲（「まずいよ脱脂粉乳」が抜けた形）「18/09/22 360°ライブ
    JAPAN @渋谷lounge neo start:1630 予約2500yen 出演 西村ひよこちゃんX 狂い咲き
    センターロード わたわた我爱你 ごちゃすと なんちゃらは19時半くらいから歌います◎」
    （samami27）。「まずいよ脱脂粉乳」は直前で出演取り止めになった可能性があるため
    acts には含めなかった。終演後は「渋谷ラウンジネオありがとうございました！360°
    どこからでも観れるライブだったので、ステージにいる時、360°どこを向いてもお客さんが
    いて目が回りました。たのしかったー！」（yokuwakan_nai）「渋谷ラウンジネオありがとう
    ございました！...360度回転しても人の顔があって、世界は丸いと思いました。」
    （samami27）と感想。

