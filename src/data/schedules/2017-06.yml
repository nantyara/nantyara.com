    - アリス氏
    - 相良ましろ
    - 夢花狂子
  images:
    - /events/20170611-goldenegg.jpeg
  content: |
    なんちゃらアイドル主催ライブ「QuinQフェス」。現体制になってから初のオリジナルTシャツ
    （S×5枚/M×10枚/L×10枚、再販・取り置きなし）と缶バッジを限定販売。購入特典は
    「その場にいるなんちゃらアイドル全員とのサイン入りハーレムチェキ」。
    今まで一度もやっていない曲も披露予定とアナウンスされていた。
    フライヤーより、19時〜開催。料金3,000円。

