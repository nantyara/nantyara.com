  content: |
    「盛りだくさんDay」の一本目、四谷OUTBREAKにてなんちゃらアイドルライブ。17:00〜。
    この日は正午の「ななたま会議」（BABA会議室）参加後の出演で、終演後は高円寺サンダーでのライブpart2、
