# 2021年6月（/mine-x による X 告知アーカイブからの発掘。ソース: mining/x-archive/2021-06.json）
# ドラフト（未コミット・レビュー用）。issue #17（/mine-x 2021）の 2021-06 分。
# grok CLIは使用（アーカイブ取得コミット「grok主力収穫で2021年6月のアーカイブを新規作成」参照）。
# 今回の転記対象は238告知のうち19件（8DAYS主催シリーズ8日分＋単発11件）。新規会場候補2件あり（下記参照）。
#
# 日時はすべて post の time フィールド（UTC）を JST（+9h）に変換した上で「本日/今日/明日」等の
#   指し示す日付を確定している（変換はPythonのdatetime/timezoneで機械的に実施、目視の暗算はしていない）。
#
# ⚠️ 【最重要】6月のメインコンテンツは「なんちゃらアイドル主催8DAYS」（6/21〜6/28、東新宿LOVE TKO
#   ×7日間＋渋谷La.mama×1日）。3/31告知（2021-03.ymlの申し送り）で存在が確定していた企画の本体。
#   各日の詳細タイムテーブル・出演者は6月前半に個別告知済みだったが、6/19 20:18 JST
#   （nantyaraidol/status/1406345724611108864）で「【超重要】8days、全日程、タイテ変更あります。」
#   という告知が入り、「一応まとめたスレッドも作ります。【タイムテーブル変更全部】（リプ欄に続く）」
#   と予告された。**このリプライスレッドの内容はアーカイブに保存されていない**（mine-x方針で
#   リプライは収穫対象外のため）。つまり、各日の「当初告知された時刻」は6/19以降に変更された
#   可能性があるが、変更後の正確な時刻は今回のアーカイブから確認できない。
#   → 8DAYS各日は date の時刻をすべて **time_tbd: true** とし、当初告知時刻を content 内に
#     「（当初告知時刻・6/19の変更内容は本文アーカイブに無く未確認）」と明記した上で参考値として残した。
#     time_tbd の date 時刻は、当初告知に明記の「なんちゃら出番時刻」または「開演時刻」を採用
#     （4/25 M3の「11時くらい」採用と同じ運用方針）。1〜3日目は当初告知にも時刻の記載が無いため
#     12:00:00 プレースホルダーとした。
#   → 7月ウィンドウの発掘時に、8DAYS各日の実際の出番時刻（変更後）が判明する後日談ツイート
#     （まとめ・お礼リプライの引用等）が無いか要確認。
