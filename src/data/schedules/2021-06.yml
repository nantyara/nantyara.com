- id: event-20210611-fudomae-trio
  slug: 20210611-fudomae-trio
  date: 2021-06-11 18:30:00 +0900
  end: 2021-06-11 20:00:00 +0900
  title: 不動前TRIO「gear3rd」
  site: 不動前TRIO
  acts:
    - 本間本願寺
    - DJタマキ
    - MCあんにゅ
  content: |
    不動前TRIOでの対バンイベント「gear3rd」。告知「本日！6/11 金 17:00開場〜20:00終了 #gear3rd
    @不動前トリオ 2000円2d付 17:30本間本願寺 18:00DJタマキ 18:30なんちゃらアイドル 19:00MCあんにゅ
    19:30？※本日、なんちゃらライブの動画撮影はご遠慮ください…！」（samami27）。終演後
