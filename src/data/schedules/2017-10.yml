- id: event-20171020-jam
  slug: 20171020-jam
  date: 2017-10-20 12:00:00 +0900
  time_tbd: true
  title: 新宿JAM 最後のライブ（ミナミちゃん生誕）
  site: 新宿JAM
  acts:
    - ミナミトモユキ
  content: |
    ミナミトモユキ（ミナミちゃん）の生誕祭対バンに出演。なんちゃらアイドルにとって
    結成の地・ホームであった新宿JAMでの、（同店閉店に伴う）最後のライブとなった。

    ライブ後、なんちゃらアイドルは「なんちゃらアイドルは最初はただのJAMの客だったんだけど、
    だけど、ふわっとデビューして、いつの間にか3年たって、多分最後のJAMのライブをついさっき終えて、
    これからはどこのライブハウスでも胸を張って言えます。私たちは、東京、新宿、JAMからきた
    なんちゃらアイドルです！」とツイート。最後の1曲はZIGGY「I'm getting blue」のカバーで締めくくった。

    ※Xの告知アーカイブから復元。同日夜の惜別ツイート（19:34）・ZIGGYカバー報告（20:04）から
    10月20日夜の公演と確定（事前告知の「26時〜」表記は実際の開催時刻とはずれた模様）
  sources:
    - https://x.com/nantyaraidol/status/921459550603042816
    - https://x.com/nantyaraidol/status/921467257699557376
