    初代なんちゃらアイドルのラストライブ。10/26の解散発表で予告されていた
    「かずちゃん企画」名義。翌日の事後報告では「進行表カンペ忘れて、ちょっと
    だけグダリましたが、なんだか1番楽しいライブでした！コントを始めるアイドル
    面白いのに解散とかさみしすぎるな！またなんかしようね！」とコメントされている。

    2014年12月31日、なんちゃらアイドル公式アカウントが正式に活動終了を宣言。

