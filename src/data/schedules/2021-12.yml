    井荻チャイナスクエアでのライブ（2021年のライブ納め）。「2021年最後のライブは井荻
    チャイナスクエア！」（samami27）で開催日・会場を確認。終演後「ライブ納めでした！
    ライブ初めは1月4日渋谷ラママです！」（samami27）、「ライブ納めのチャイナスクエア
    ありがとうございました！たなかはなちゃんのマネージャーさんから凧貰ったので揚げながら
    帰ります！」（yokuwakan_nai）で有観客開催を確認。開演時刻は本文に見当たらない。

