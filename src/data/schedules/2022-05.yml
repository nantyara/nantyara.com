  content: |
    渋谷La.mamaでの主催ライブ『なんちゃら運営おたんじょうび会』。「2022年5月29日 なんちゃら
    アイドル主催ライブ「なんちゃら運営おたんじょうび会」 渋谷ラママ 17:30open 18:00start
    charge2500円（drink別） 出演　盛りたかった千里、ヒゲと味噌汁、姫乃たま、GARUDA、
    めろん畑a go go、なんちゃらアイドル」（nantyaraidol、5/6）でフルスペック告知（運営
    Q太郎の誕生日会企画。5/28〜30にかけて「Qたろさんの誕生日」関連投稿多数）。終演後
    「Qたろお誕生日おめでとうございました。愛され運営を見ました。みんなありがとう！」
    （yokuwakan_nai、5/30未明）で有観客開催を確認。対バン（盛りたかった千里、ヒゲと味噌汁、
    姫乃たま、GARUDA、めろん畑a go go）をactsに追加。

