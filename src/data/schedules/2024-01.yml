- id: event-20240128-lamama-10th-anniversary
  slug: 20240128-lamama-10th-anniversary
  date: 2024-01-28 10:00:00 +0900
  title: 渋谷La.mama「なんちゃらアイドル10周年スペシャルありがたビームフェス！」
  site: 渋谷La.mama
  content: |
    渋谷La.mamaでのなんちゃらアイドル10周年記念フェス。「【拡散超希望！】
    いよいよ解禁！なんちゃらアイドル10周年記念ライブ！
    是非遊びにきてもらいたいです！拡散宣伝お願いいたします！

    2024年1月28日（日）
    なんちゃらアイドル主催
    なんちゃらアイドル10周年スペシャルありがたビームフェス！
    inラママ　
    9時半open　10時start
    2500円（drink別）

    10時から23時くらいまでやります。15組くらい出ます。
    値段は据え置きでやります！お待ちしております！」（nantyaraidol、1/2）で開催日時（9時半open・10時start）・料金（2500円）を確認。「明日いろいろやること。

    シャツ発売。
    ブロマイド配布。
    あんにゅコラボ。
    ちよっぴコラボ。
    本間本願寺コラボ。
    初期なんちゃら再結成コラボ（多分）。
    エンドウさん、石塚さん、ダイナマイトナオキさんスペシャルバンドコラボ。
    バンドセット。」（nantyaraidol、1/27）で企画内容を確認。「明日はとうとう10周年ライブ！
    朝から晩まで踊り明かすぞ〜！
    朝9:30からオープンなので、好きなときに来て、好きなときに好きなことをしようね！」（samami27、1/27）で前日告知。終演後「なんちゃらアイドル10周年ありがたビーーーーム！！！
    みなさまのおかげで迎えた10周年フェス無事閉幕！累計1201本目のライブ！これからも日々積み重ねてまいります！
    今日も本当にありがとうございました！！！」（samami27、1/29深夜）で有観客開催と累計1201本目のライブであることを確認。

    ※Xの告知アーカイブから復元。dateは告知記載の開演時刻（10時start）を採用。
