# ドラフト（未コミット・レビュー用）。issue #17（/mine-x 2021）の 2021-11 分。
#
# アーカイブは250件（Chrome収穫+grok併用補完、大きめの月）。期間カバレッジは
#   2021-11-01T11:14:22Z 〜 2021-12-01T01:33:00Z（JST変換で2021-11-01 20:14〜2021-12-01
#   10:33）で月頭〜月末までフルカバー。
#
# 日時はすべて post の time フィールド（UTC）を JST（+9h）に変換した上で「本日/今日/明日」等の
#   指し示す日付を確定している（Pythonのdatetime/timezoneで機械的に変換したJST一覧を作った上で
#   全250件を目視突合）。UTC/JST日付境界の変換ミスは過去複数回発生しているため特に慎重に確認した。
#   「日付が変わって直後（0時台）の『明日』は、投稿者の体感上まだ寝ていない『今日』を指す」という
#   10月ドラフトで確立した読み方（例: 10/22神田SHOJIMARU）を踏襲し、11/14サッセン・Hプロ、
#   11/19の投稿でも同様に適用した。
#
# 緊急事態宣言は解除済み（10月に続き11月もライブ活動が本格的に回復している時期）。方針どおり
#   「配信のみ（無観客）」のイベントは転記せず、実会場・有観客の実績が本文から確認できたものを
#   転記対象とした。本ウィンドウでは配信併用の明記があるイベント（11/13代々木バーバラ、
#   11/26新宿ANTIKNOCK）も、有観客開催であることが本文（当日の様子・終演後お礼投稿）から
#   確認できたため転記対象とした。
