# 2020年3月（/mine-x による X 告知アーカイブからの発掘。ソース: mining/x-archive/2020-03.json、
# 一部は先出し裏取りのため mining/x-archive/2020-02.json も参照）
# ドラフト（未コミット・レビュー用）。新規会場候補5件あり（末尾コメント参照）。
# 今回の転記対象は364告知のうち日付・会場・（可能なら）時刻が本文から確認できる19件
# （単発9件＋「なんちゃらアイドル七日間戦争」全7日分＋DADAフェス/美華飯店の1日2会場を1件ずつ）。
#
# ⚠️ 日時はすべて post の time フィールド（UTC）を JST（+9h）に変換した上で「本日/今日/明日」等の
#   指し示す日付を確定している。今回、日付境界の罠に近い重要なケースを1件発見・修正した:
#   「なんちゃらアイドル七日間戦争」初日の告知ポスト（nantyaraidol/status/1241657114885423107、
#   UTC 2020-03-22T09:24:59=JST 2020-03-22 18:24）本文は「3月22日(月) ...初日は
#   「あおはるプロデュースデイ！」」だが、2020年3月22日は実カレンダーでは日曜日で「(月)」の
#   曜日表記と矛盾する（実際の月曜日は3/23）。当日組の別の2投稿
#   （yokuwakan_nai/status/1242083986026848256「今日はなんちゃらアイドル7日間戦争1日目、
#   あおはるプロデュースデイでした！」＝JST 2020-03-23 22:41投稿、
#   samami27/status/1242086020159393796「本日、3月23日、なんちゃらアイドル 7日間戦争が
#   始まったことをご報告いたします。1日目ありがとうございました！」＝JST 2020-03-23 22:49投稿）
#   が「初日＝3月23日」を独立に2件で明記しており、かつ3/23は実カレンダーで月曜日と一致するため、
#   告知ポストの「3月22日」は日付の書き間違い（正しくは23日）と判断し、初日の date は
#   2020-03-23 とした。以降の2〜7日目は本文中の日付表記と実曜日が全て一致しており矛盾なし。
#
# 特記事項（ユーザー提示の裏取り候補との照合結果、および2020-02ドラフトからの先出し予告の裏取り）:
#   - 「3/1 「ハイプリplus」@西荻窪PITBAR」: テキスト本文には会場名・タイトルの言及がなく
#     （「今日はこちらー！！素敵DJの方々が沢山出ますよー！」のみ）。添付フライヤー画像には
#     詳細情報が含まれると見られるが、画像内容からの推測は禁止方針のため転記対象外とした
#     （本文だけでは会場名・イベント名とも確認不可）
#   - 「3/2 主催『giant killing!!! vol.003』ジャック達とのツーマン@渋谷La.mama（新メンバー
#     一色進発表という重要な情報あり）」: 開催・会場・時刻（開場19:45開演20:15、
#     http://lamama.net/article/s-20200302-n/）とも本文で確認。新メンバー「一色進」発表も
#     yokuwakan_nai の事後報告「なんちゃらアイドル新メンバー発表もありましたね！！」で確認
#     （3/4の告知でも「なんちゃら新メンバーの一色進ちゃんも来るとか？！」と言及あり）。
#     history.yml への追記は今回はしない（末尾コメント参照、全期間発掘完了後にまとめて棚卸し）
#   - 「3/4 BarQuinQ@新宿bar無人島（元メンバー「ぬる」が数年ぶりに合流のスペシャルゲスト出演）」:
#     開催・会場・時刻（19時〜、charge2500円）とも確認。スペシャルゲスト「ぬる」も
#     nantyaraidol/status/1235067858427580416「スペシャルゲストとして、元なんちゃらアイドルの
#     ぬる ちゃんが来ます！今回はおそらく来る！」、事後 status/1235254375360024576
#     「なんちゃら、数年ぶりのフルメンバー。」で確認
#   - 「3/11 「Over the Sun」@新宿Live freak（既存venues.yml登録済み、alias「新宿フリーク」あり）」:
#     完全に本文で確認（Open18:00 Start19:00、ADV¥2500+1D DOOR¥3000+1D、
#     act あすけ/フジノ/我羅/愛ちゃん/なんちゃらアイドル/SHINZAN）
#   - 「3/14 「血塗れホワイトデイ」@東大和CafeBAR COO」: 会場名・URL（cafebar-coo.com）・
#     時刻（open18:30 start19:00）は本文で確認。「東大和」という地名自体は同日の別投稿
#     （nantyaraidol「雨です！遠いです東大和市！でもプロレスやる！」）で確認でき、COO会場との
#     地理的な整合は取れている。スペシャルゲスト「ヘドRockin'ブキ(2丁拳銃小堀裕之・M.M.King)」も
#     追加告知で確認
#   - 「3/18 「天井裏IDOL LIVE」@川崎LIVE BAR A'TTIC」: 完全に本文で確認（OPEN19:00/START19:30、
#     前売2500円/当日3000円(D別)、出演: なんちゃらアイドル、宇佐美ゆめ、紅河めぐみ、駿河たお）。
#     なんちゃらの出番時刻は告知（20時半くらいから）と当日（20:45から）で微妙に食い違うため、
#     より具体的な当日投稿の20:45を採用
#   - 「3/21 ワンマンライブ「茨城 土浦編」@土浦LEO'S BAR」: 完全に本文で確認（開場18:00開演18:30、
#     前売2500円、限定Tシャツ販売、最初の1時間は撮影タイムあり）。会場名の表記ゆれあり
#     （「レオズライブバー」「LEO's LIVE BAR」）、新規会場候補として末尾参照
#   - 「3/23〜3/29 「なんちゃらアイドル七日間戦争」@東新宿LOVE TKO（7日間連続主催、日替わりテーマ）」:
#     全7日を個別イベントとして転記（詳細は各エントリ参照）。3/23「7日通し券は本日、明日で
#     販売終了となります」との言及があり、通しチケット販売の実施も確認（2020-02ドラフトの
#     「3月 なんちゃらアイドル主催「7連ライブ」通しチケット販売開始の言及あり」を裏取り完了）
#   - 「3/20 「うたうたいの夕べ」@三軒茶屋Heaven's Door」: 会場（「ヘブンズ」表記）・なんちゃらの
#     出番時刻（19:40から）は本文で確認できたが、「うたうたいの夕べ」というイベントタイトル自体は
#     本ウィンドウの本文には見当たらなかった（ユーザー提示の候補タイトルの出典は本アーカイブ外と
#     思われる）。タイトルは確定できなかったため、ドラフトでは汎用的な見出しにして転記した
#   - 2020-02ドラフト申し送りの先出し予告のうち「3月7日 下北沢のイベント（中止確定済み）」は
#     元々転記不要とされていたため今回も対象外のまま
#   - 2020-02ドラフト申し送りの「3月 あおはる個人の3月予定まとめフライヤー投稿」は本ウィンドウの
