  content: |
    新宿bar無人島で開催されたQuinQ主催のバーイベント「BarQuinQ」。事前告知「2020年5月
    13日（水）BarQuinQ 新宿bar無人島（http://mujinto.tokyo）にて、QuinQモデルさん多数
    参加！開始時間:19時～Charge:2500円参加予定モデル:なんちゃらアイドル、夢乃るか、
    真白ゆう、他 この日はキャストさんによるカラオケライブもあります！」（nantyaraidol、
    5/3）、後日参加モデル追記版「...実愛、シウ病みこ、他。この日は女の子のカラオケも
    楽しめちゃいます！ライブに飢えている方は是非！」（nantyaraidol、5/10）。当日
    「本日新宿BAR無人島19:00～」（yokuwakan_nai）、終演後「無人島ありがとうございました！
    楽しかったし嬉しかったです。」（yokuwakan_nai）で開催を確認。なんちゃらアイドル
    自身の歌唱スロット時刻の言及は本文に見当たらない。

