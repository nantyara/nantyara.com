- id: event-20200524-kunihouse
  slug: 20200524-kunihouse
  date: 2020-05-24 19:00:00 +0900
  title: なんちゃらONE-MANショウ「君はGANなのだ！」
  site: 南浦和KUNIHOUSE
  content: |
    南浦和KUNIHOUSEで開催された限定5名のなんちゃらアイドルワンマンショウ。事前告知
    「5月24日にone-manショウやります。場所や値段などは添付画面。詳細、タイムテーブルは
    リプでツイートします。」（nantyaraidol、5/6）に続くリプライで詳細が判明:
    「(5/24 なんちゃらONE-MANショウ「君はGANなのだ！」@南浦和KUNIHOUSE、埼玉県さいたま
    市南区南浦和２丁目３３−２、1830 open&start charge2000円ドリンク別、限定5人、収益は
    全額ライブ会場様に還元。TT: 18時半yukky DJ20分/19時なんちゃらアイドルライブ20分/
    19時半yukky DJ25分+未発表新曲試聴会/20時なんちゃらアイドルライブ25分/20時半yukky
    DJ+お客様参加型打ち上げ＆物販60分。5/6 23:00応募締切、当日0時までに当落メール。
    ツイキャス配信あり)」。前日「明日は南浦和クニハウスで5人限定ライブ。久しぶりに
    ちゃんとライブ。one-manなので長時間やります。あと、新曲（なんと5曲！）の選考視聴会
    もやります！」（nantyaraidol）。当日「19時からライブ配信します！ツイキャスです！」
    に続き実況ツイート多数、終演後「ライブありがとうございました！キャス見てくれた人も
    ほんとありがたビーム」（nantyaraidol）、「撮影会&人数限定イベントありがとうございました！
    飲んだ〜！未発表曲も聞いてもらえて良かったです！」（yokuwakan_nai）で開催を確認。
    ツイキャス同時配信もあったが、限定5名の物理会場・有観客イベントとして実施された。

    ※Xの告知アーカイブから復元。dateはタイムテーブル記載のなんちゃらアイドル自身の
    最初の出番時刻（19:00）を採用。
  sources:
    - https://x.com/nantyaraidol/status/1257906607716839424
    - https://x.com/nantyaraidol/status/1257907578656354305
    - https://x.com/nantyaraidol/status/1264534416325349377

- id: event-20200529-ottanta
  slug: 20200529-ottanta
  date: 2020-05-29 12:00:00 +0900
  time_tbd: true
  title: なんちゃら運営Q太郎誕生日ライブ
  site: 蒲田オッタンタ
  content: |
    蒲田オッタンタで開催された、なんちゃらアイドル運営Q太郎の誕生日ライブ。急遽開催が
    決定し、5/25付で「【緊急】5月29日（金）に、蒲田オッタンタにて、なんちゃら運営Q太郎の
    誕生日ライブをやることになりました。なので、演者さんとお客さんを募集します。演者
    さんは、一度は共演したことある人がいいかも。ギャラはチケットバック1枚目から1250円
    です。お客さんは限定15人です。」（nantyaraidol）と告知。当日「モイ！iPhoneから
    キャス配信中 - おたんた」「モイ！iPhoneからキャス配信中 - 2部！」（nantyaraidol、
    2部制で実施）、終演後「めでたかったなあ」（yokuwakan_nai）、「お誕生日おめでとうの
    日でした！」（samami27）で開催を確認。具体的な開演・出番時刻の言及は本文に見当たらない。

    ※Xの告知アーカイブから復元。開演時刻の言及が本文に見当たらないため time_tbd とした。
  sources:
    - https://x.com/nantyaraidol/status/1264947383290310656
    - https://x.com/yokuwakan_nai/status/1266359908649152512
    - https://x.com/samami27/status/1266364614087831555
