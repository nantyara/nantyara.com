- id: event-20230831-antiknock-aoharu-solo
  slug: 20230831-antiknock-aoharu-solo
  date: 2023-08-31 12:00:00 +0900
  time_tbd: true
  title: 新宿ANTIKNOCK（あおはる初ソロ）
  site: 新宿ANTIKNOCK
  labels:
    - あおはるソロ
  content: |
    新宿ANTIKNOCKでのライブ。御茶海マミがインフルエンザにかかったため欠席し、
    あおはるが急遽ソロで出演した回。「なんちゃらアイドルの御茶海マミが、インフルエンザに
    かかってしまいました。明日のアンチノックはおやすみさせていただき、あおはるがソロ
    ライブを頑張ります。9年間、無遅刻無欠席。10年を目前にインフルエンザなっちゃうの、
    非常に御茶海マミだなあという感じ。多分すごく落ち込んでると思います。体調はかなり
    もう落ちついたみたいなので、みんなで完全回復を祈ってあげてください。そして明日、
    急遽爆誕したあおはる初ソロの応援もよろしくお願い申し上げます！」（nantyaraidol、
    前日）で予告（あおはる初のソロ出演と明記）。「明日はアンチノック！あおぱるソロででますよろしくお願いします！でれなくて
    めちゃくちゃくやしい！！」（samami27、欠席するマミ本人）で告知。当日「せっかくなので
    あおはる初ソロを見守りたい気持ちもあったのですが体力限界を感じたので離脱しました。
    頑張っちくり。」（nantyaraidol）で有観客開催・あおはるの単独出演を確認。開演時刻は
    本文からは確認できなかった。

    ※Xの告知アーカイブから復元。開演時刻は本文からは特定できずtime_tbd。あおはる初ソロ
    という活動史上のマイルストーンでもある（history.yml裏取り候補）。
  sources:
