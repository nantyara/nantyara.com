- id: event-20220322-lamama
  slug: 20220322-lamama
  date: 2022-03-22 21:25:00 +0900
  title: 渋谷La.mama『卒業式は、ラママで』
  site: 渋谷La.mama
  acts:
    - POPPY
    - 仲田シンヤband
    - 税金５％
    - じゅんじゅん
  content: |
    渋谷La.mama主催『卒業式は、ラママで』。2022年2月アーカイブより2/24にフルスペック告知
    （open18:30/start19:00 出演：POPPY なんちゃらアイドル 仲田シンヤband 税金5％ みゆゆん
    from春日井アイドル）。3月ウィンドウで詳細タイムテーブルを確認: 「19時00分 仲田シンヤ
    band(なんちゃら歌う) / 19時20分 みゆゆんfrom春日井アイドル / 20時05分 税金5％ / 20時45分
    POPPY / 21時25分 なんちゃらアイドル / 21時55分 物販 / 22時45分完全撤収」（yokuwakan_nai、
    3/22未明）。ただし当日朝「【緊急】本日のラママライブ、19時20分から出演予定だったみゆゆん
    さんが体調不良のためキャンセルとなりました。」（nantyaraidol）でみゆゆん欠席、その後
    「じゅんじゅんさんにご出演いただけることとなりました！19時から25分、熱いステージを
    お届けいたします！」（nantyaraidol）で代打じゅんじゅんの出演が決定（「タイテちょっと変更
    あるぽい」yokuwakan_nai）。また前日「この日はなんと、「パズルの雫」、「日曜にあったら」、
    「ルイ―ド」、「屁で空中ウクライナ！」の、4曲を一気に初披露いたします！パズルと日曜は、
    なんとこの日にシングルとして発売！これは会場のみでの（しかもかなり限定された会場）販売と
    なります！」（nantyaraidol、3/21）で会場限定シングル発売も判明。終演後「ラママライブ
    でした！新曲お披露目で緊張したけど、みんなが楽しんでくれたおかげで乗り切れました！ありが
    とう！」（samami27）で有観客開催を確認。欠席したみゆゆんはactsから除外した。

    ※Xの告知アーカイブから復元。dateはなんちゃらアイドルの出番時刻（21:25、当初タイムテーブル
    より。じゅんじゅん代打によるタイテ変更が具体的になんちゃらの時刻にどう影響したかは本文
    からは特定できず、確認できる最も具体的な時刻を採用）。
  sources:
    - https://x.com/yokuwakan_nai/status/1505924709208457216
