  content: |
    四谷アウトブレイクでのライブ（「72時間ライブ」という長時間企画への出演）。2月ドラフトの
    申し送りでは「深夜バーイベント（会場未確定、ホットサンド食べ放題＋SASSEN無料体験会予定）」
    と推測されていたが、本ウィンドウでは「7日下北沢シャングリラ / ... / 25 四谷アウトブレイク」
    （yokuwakan_nai、3/1）および「明日は四谷アウトブレイクでライブでし！」（samami27、3/24）で
    四谷アウトブレイクでのライブと確認（2月の「深夜バーイベント」詳細に対応する投稿は本
    ウィンドウ内には見当たらなかった）。終演後「四谷アウトブレイクライブありがとうございました！
    72時間ライブってすごいよな〜終わっても終わっても寂しくなくてすごい！」（samami27）で
    有観客開催・「72時間ライブ」企画への出演を確認。開演時刻・対バンは本文からは特定できず。

