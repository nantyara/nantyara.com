  content: |
    代々木LODGEでの『シン・なんちゃら100人組手third！in代々木』。「2022 年3月28日（月）
    @代々木LODGE「シン・なんちゃら100人組手third！in代々木」18:00open18:30start 2500円
    （drink別） なんちゃらアイドルloves大高ジャッキー、盛りたかった千里、アラレ王X、天乃
    みくる、S.B.Qアイドル部」（nantyaraidol、3/8）でフルスペック告知（初出）。3/25に
    「なんちゃらアイドル、天乃みくる、盛りたかった千里、アラレ王X、S.B.Qアイドル部」と出演
    表記が更新（再掲）。終演後「ジャッキーバンド良かったね！ / 7年ぶりのライブ！だったらしい
    よ！」「今日のライブはなんだか良かった。ジャッキーの笑顔が最高だった。」（nantyaraidol）で
    有観客開催・大高ジャッキーバンドの7年ぶり出演を確認。「なんちゃらアイドルloves大高
    ジャッキー」は自ユニットのためactsから除外した。

