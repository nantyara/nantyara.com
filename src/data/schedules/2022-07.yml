# ドラフト（未コミット・レビュー用）。issue #18（/mine-x 2022）の 2022-07 分。
#
# アーカイブ件数: mining/x-archive/2022-07.json は285件（タスク指示の件数と一致。grok CLI主力収穫、
#   @nantyaraidol 187 / @samami27 72 / @yokuwakan_nai 26。詳細は .claude/skills/mine-x/SKILL.md の
#   実績メモ参照）。期間カバレッジは全件が2022-07-01〜07-31 UTC範囲内（JSTでは6/30夜〜8/1早朝まで
#   ずれ込む投稿があるため、日付は下記の通り個別にJST変換のうえ「今日/明日/本日」等の指し示す日付を
#   確定している）。
#
# 日時はすべて post の time フィールド（UTC）を JST（+9h）に変換した上で、全285件のJST変換済み
#   リストを作った上で目視確認している。特に深夜0〜3時台の投稿は前日/当日どちらの話題かを
#   同一イベントに対する複数投稿（予告→当日→事後報告）の整合性で個別に確認した。
#   例: 7/17 00:50 samami27「明日はろくでもない夜で集会ヤ！」は投稿時刻が日付境界直後だが、
#   同日7/17 11:06「本日のライブはこちら！」・22:41「ろくでもない夜ありがとうございました！」と
#   同一暦日（7/17）で一貫しているため、開催日は7/17と確定した（「明日」という言葉自体は
#   日付境界をまたいだ体感的表現とみなし、投稿群全体の整合性を優先した）。
#   もう一例: 7/27 18:52 の「大田区蒲田復興協会 episode36」フルスペック告知は、投稿と同時刻に
#   Open19:00と書かれているため一見7/27当日の告知に見えるが、掲載されている出演者
#   （みんなモンキー等）が実際には7/29の事後投稿（7/29 20:36「みんなモンキー、よいね！」、
#   7/29 23:00「本日蒲田オッタンタありがとうございました。大田区蒲田復興協会も36回目」）と
#   一致するため、この告知は7/29開催回を2日前倒しで告知したものと判断し、開催日は7/29とした
#   （7/27自体には対応する開催確認投稿が存在しない）。
#
# 配信のみ（無観客）のイベントは転記対象外。今回転記した18件はいずれも本文中の「ありがとう
#   ございました」系の事後投稿・当日の「本日は〜」等の記述、または開催直前の同日投稿
#   （新宿無人島バーイベのみ、後述）から有観客開催が確認できるもの。
