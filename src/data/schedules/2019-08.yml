  title: 「Hプロ」ミット打ち・ラウンドガール・ミニライブ（地下闘技場）
  site: 地下闘技場
  content: |
    新宿の「地下闘技場」で開催された、地下プロレス団体「Hプロ」主催のイベントにミット打ち・
    ラウンドガール・ミニライブという形で参加。事前告知「日付変わって本日！Hプロは本当に
    最高なのかを探るため、我々はミット打ち、ラウンドガール、ミニライブなどをさせて
    いただきます！探れるかなー」（yokuwakan_nai）「今日わたしミット打ちするらしいので
    『百円の恋』と『ミリオンダラー・ベイビー』でイメトレしてきたっす。」（samami27）
    「地下闘技場は区役所通りを恐れずまっすぐ行って、餃子専科LEEのところ（森みたいなビルと
    普通のビルの間の道）を曲がると、右手にあるからね！」（samami27）。終演後は「地下闘技場
    ありがとうございました！プロレスってバチーンってなってすごいなぁ。来てくれた人
    ありがとう！リングの上にあがるとテンションあがるねぇ。」（samami27）と感想。
    通常のライブ形式とは異なる複合イベント（プロレス興行内でのミニライブ）のため、
    開演の具体的な時刻の言及は本文には見当たらない。

