# 2019年8月（/mine-x による X 告知アーカイブからの発掘。ソース: mining/x-archive/2019-08.json）
# ドラフト（未コミット・レビュー用）。新規会場候補4件あり（末尾コメント参照）。
# 今回の転記対象は309告知のうち日付・会場・（可能なら）時刻が本文から確認できる19件。
# ⚠️ 日時はすべて post の time フィールド（UTC）を JST（+9h）に変換した上で「本日/今日/明日」の
#   指し示す日付を確定させている（UTC のまま読むと日付が1日ズレる。例: 8/12 16:15 UTC の
#   「本日、御茶海マミ参戦！」は JST では 8/13 01:15 で「本日」=8/13）。
# 証拠不足・方針により見送ったもの（末尾コメント参照）:
#   8/3・8/6 samami27「バニー出勤します」（会場名の言及が本文に見当たらないため転記対象外。
#   8/22分は「中野クロスバニー」と明記されているため転記済み）
#   8/5「なんちゃらは21時20分から！」（会場名の言及が本文に見当たらないため転記対象外）
#   8/15 QuinQ cafe alternative（もえぺろ・ユカ参戦と明記されており、なんちゃらアイドル
#   自身の出演が本文から確認できないため転記対象外）
#   8/15-16 早乙女らぶちゃんオフ会（銀座→新宿無人島に変更）は早乙女らぶ名義のイベントで
#   なんちゃらアイドル自身の出演が本文から確認できないため転記対象外
#   8/19 サンリオピューロランド（私的な休日の外出であり興行イベントではないため転記対象外）
#   8/28 児童発達支援デイサービスでの慰問ライブ（施設名・住所とも非公開の私的訪問企画のため
#   公開スケジュールとしての転記対象外とした。「養護学校」「児童発達支援デイサービス」という
#   記述はあるが特定の施設名は本文に見当たらない）
# 主催イベントシリーズ判断: 8/30 OKFK（大田区蒲田復興協会）はなんちゃら運営が主催に関わる
#   定例企画のため labels: 主催ライブ を付した（2019-07分の既存ドラフトと同様の扱い）。
#   8/18 東新宿LOVE TKOは「なんちゃら主催ありがとうございました」の言及がありなんちゃらバンド
#   1周年企画のため labels: バンドライブ・主催ライブ を付した
# releases.yml裏取り候補（編集は今回しない）:
#   - なんちゃらアイドル7thシングル「東京星へ、行こう。」（2019年8月30日発売・価格0円・
#     蒲田オッタンタOKFKにて無料配布開始。releases.yml未登録）
#   - 「麦ちょこ畑で捕まえて」ジャケット公開（2019年8月8日、漫画家がぁさんによるラフ画公開。
#     11月24日発売予定と告知。2019-07ドラフトでも同曲のレコーディングを候補として挙げ済み）
# history.ymlへの追記は今回はしない（判断のみ）:
#   - 8/18 なんちゃらバンド1周年、8/28 児童福祉施設への慰問ライブは活動の節目候補だが、
#     全期間発掘完了後にまとめて棚卸しする方針のため見送り
