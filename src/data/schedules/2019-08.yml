- id: event-20190830-ottantaokfk
  slug: 20190830-ottantaokfk
  date: 2019-08-30 19:00:00 +0900
  title: OKFK 大田区蒲田復興協会 〜ゴジラに焼かれた町から〜 レコ発「東京星へ、行こう。」無料配布
  site: 蒲田オッタンタ
  labels:
    - 主催ライブ
  acts:
    - じゅんじゅん
    - FUZU
  content: |
    「大田区蒲田復興協会（OKFK）」でのレコード発売記念企画。なんちゃらアイドル7thシングル
    「東京星へ、行こう。」を0円で無料配布。事前告知「明日は19時に蒲田オッタンタ！CD無料
    配布します！」（nantyaraidol）「8月30日 金曜日 大田区蒲田復興協会！今回はなんと
    なんちゃら7枚目のシングル、東京星へ、行こう。を、0円で販売！お買い逃しなきよう！
    じゅんじゅんと久しぶりの対バン！あと、FUZUさんは、某有名AV女優さんの闇営業用の名前
    です。きて確認ぜひ！蒲田をもりあげましょう！」（nantyaraidol）。当日は「本日はOKFK！
    蒲田オッタンタにて！今日はレコ発ですよー！『東京星へ、いこう』無料を販売とはこれ
    いかに！手に入れるべしー！」（samami27）。終演後は「OKFKありがとうございました！
    今日は声がすごくでて、感情が昂りすぎて今死にかけてます。」（samami27）と感想。
    ニューシングルは共演者や会場側にも気に入られ完売した旨の言及あり（次回配布は
    9月4日）。

