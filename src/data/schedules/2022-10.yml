    （nantyaraidol）で当日開催を確認。本ウィンドウ内に明示的な事後「ありがとうございました」
    投稿は見当たらないが、完売＋追加完売という詳細な事前情報と当日複数回の言及が揃って
    いるため有観客開催と判断。「From Hawaii To Hell」は同日発売のなんちゃらアイドル
    lovesMCあんにゅのセカンドシングルでもある（releases.yml裏取り候補）。

