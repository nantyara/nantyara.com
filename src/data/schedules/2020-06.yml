# 2020年6月（/mine-x による X 告知アーカイブからの発掘。ソース: mining/x-archive/2020-06.json）
# ドラフト（未コミット・レビュー用）。新規会場候補1件あり（末尾コメント参照）。
# 今回の転記対象は270告知のうち10件。
#
# ⚠️ 2020年6月は緊急事態宣言全面解除（5/25）後のライブ活動再開期。人数制限（「本来60人
#   以上余裕で入る場所ですが…25%程度に人数を制限」6/10付）・配信併用等のコロナ対応
#   イベントが混在する。**配信のみ（無観客）のイベントは転記対象外**、実会場・有観客の
#   開催が本文から確認できたもののみ転記（配信「併用」で有観客実績が確認できるものは対象）。
#
# 日時はすべて post の time フィールド（UTC）を JST（+9h）に変換した上で「本日/今日/明日」等の
#   指し示す日付を確定している。
