- id: event-20200626-barbara
  slug: 20200626-barbara
  date: 2020-06-26 18:30:00 +0900
  title: なんちゃらアイドル主催「～30人限定！美味しいカレーと美味しい女たちで免疫力アップなライブ～」
  site: 代々木バーバラ
  labels:
    - 主催ライブ
  acts:
    - 虹色じゃむ2020
    - 毎日サプリメント
    - インモラリスターR
    - 鮭オーケストラ
  content: |
    代々木バーバラでの30人限定主催ライブ。**新曲「parallel line」のライブ初披露**の日。
    予告「6月26日に、代々木バーバラで30人限定主催ライブやります。先月配布できなかった
    なんちゃらアイドル限定バッヂの配布や、新曲発表などいろいろ企画してます」（nantyaraidol、
    5/19）、本告知「2020年6月26日（金）～30人限定！美味しいカレーと美味しい女たちで免疫力
    アップなライブ～代々木バーバラ18時open18時半start2500円出演 なんちゃらアイドル、
    虹色じゃむ2020、毎日サプリメント、インモラリスターR、鮭オーケストラ、他」（nantyaraidol、
    6/11）。「この日、カレー頼んでくれたらなんちゃら限定バッヂあげますけんね。」当日
    「本日代々木Barbaraにて主催ライブ！ソーシャルディスタンスのソールドアウトとなって
    おります！配信か動画撮影を予定しておりますので〜！新曲の振り付け気に入ってもらえるか、
    失敗しないか不安がいっぱいだ〜」（samami27）。前日予告どおり「明日は、なんちゃら
    アイドルの新曲、「parallel line」の初披露となります。…自宅で応援してくれるかたがたの
    ために、配信もやります！」（nantyaraidol、6/25）、当日夜はツイキャス中継（本編＋
    アンコール）を実施。終演後「今日は新曲のお披露目でした！今までで1番失敗してなくて
    なんかドキドキした！」（samami27）、「無事に新曲お披露目できて良かった〜！」
    （yokuwakan_nai）、「新曲、「parallel line」初披露でした。これからもたくさん歌って
    いきます！」（nantyaraidol）で有観客開催を確認。

    ※Xの告知アーカイブから復元。dateは告知記載の開演時刻（18:30）。
