#     人数制限もないし、別にマスクつけてこなくてもいいです。」（nantyaraidol、6/4）、
#     事後「新衣装きてインモラに特攻卍みんなに会えて嬉しいでした！」（samami27、6/5夜）で
#     有観客開催を確認。※2020-05ドラフト申し送りの「6/5 ライブ『かもしれん』（5/18付・
#     日程未確定の仮予告）」はこのヘブンスライブとして実現したとみられる（仮予告に会場の
#     記載はなかったため断定はしない）
#   - 6/16 「BarQuinQ」@新宿bar無人島: 5月に続くQuinQバーイベント第2回。フライヤー同文
#     告知（6/10、19時〜・Charge2500円・モデル多数）、前日「カイさんが久々に復活して
#     激うまカレー作る」、当日・事後ポストで開催確認
#   - 6/20 すたじおかとり〜ぬ（千葉・新検見川）: 6/10告知「20日こちらでライブやります！
#     予約制…1500円はお安い！広い会場でキープディスタンス！」、6/12「来週のライブは、
#     20.21とともにsold out！」、事後「千葉県は新検見川すたじおかとり〜ぬさんで蜜避け
#     おギグでした」（yokuwakan_nai）で開催確認。★venues.yml新規候補（末尾）
#   - 6/21 南浦和KUNIHOUSE 5人限定リベンジライブ: 2020-05申し送りの突合OK。5/18予告
#     「前回は1秒完売だった激レアライブ！」→5/22予約開始・1分完売→当日キャス中継併用で
#     開催、事後「今日は南浦和クニハウスで人数限定ライブでした！」「ゲストにDJタマキ！」
#   - 6/23 「なんたってアイドル」@蒲田オッタンタ: 事後報告「蒲田オッタンタ“なんたって
#     アイドル”ありがとうございました！DJ陣の中、なんちゃら1人参戦で…」（samami27）で
#     開催確認。あおはる不在（「今回、あおはるはおりませんが、元同僚のはるかと、
#     まりなちゃんがゐる！」6/22）
