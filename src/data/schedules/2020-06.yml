- id: event-20200605-heavensdoor
  slug: 20200605-heavensdoor
  date: 2020-06-05 21:00:00 +0900
  title: 三軒茶屋HEAVEN'S DOORライブ
  site: 三軒茶屋HEAVEN'S DOOR
  content: |
    緊急事態宣言全面解除（5/25）後、最初に確認できる対バン形式のライブ。前日告知
    「明日は、ヘブンスでライブです。出番は21時から。人数制限もないし、別にマスク
    つけてこなくてもいいです。こちらは全力で、声がなくなるまで歌いますので、そちらも
    全力で名前を呼んでください！」（nantyaraidol、6/4）。当日夜「今日はカラコンし忘れの
    日でした！なんで忘れたんだろうー！新衣装きてインモラに特攻卍みんなに会えて嬉しい
    でした！」（samami27）で有観客開催を確認（「インモラ」はインモラリスターR関連の
    企画を指すとみられるが、イベント名・共演者の明示は本文に見当たらない）。

    ※Xの告知アーカイブから復元。dateは告知記載のなんちゃらアイドルの出番時刻（21:00）。
  sources:
    - https://x.com/nantyaraidol/status/1268456323735105536
    - https://x.com/samami27/status/1268919821766291458

- id: event-20200616-mujinto-barquinq
  slug: 20200616-mujinto-barquinq
  date: 2020-06-16 19:00:00 +0900
  time_tbd: true
  title: 「BarQuinQ」（新宿bar無人島）
  site: BAR無人島
  acts:
    - 夢乃るか
    - 真白ゆう
    - 月夜野りん
  content: |
    新宿bar無人島で開催されたQuinQ主催のバーイベント「BarQuinQ」（5/13回に続く開催）。
    告知「2020年6月16日（火）BarQuinQ 新宿bar無人島（http://mujinto.tokyo）にて、QuinQ
    モデルさん多数参加！開始時間:19時～Charge:2500円 参加予定モデル:なんちゃらアイドル、
    夢乃るか、真白ゆう、月夜野りん、他この日はキャストさんによるカラオケライブもあります！」
    （nantyaraidol、6/10）。前日「明日です！カイさんが久々に復活して激うまカレー作ると
    のこと。あと、ゲストで、おもちちゃんという可愛い子もくる！あと歌も歌います！限定
    グッズもお持ちいたします！」（nantyaraidol）。当日「今日、無人島でBar QuinQなんです
    けど、髪の毛ふわふわ（ケープでカチカチ）にしたので見においでよ。カレーもあるよ！」
    （samami27）、終演後「無人島ありがとうございました！うがい手洗いおきをつけて！」
    （nantyaraidol）、「Bar QuinQありがとうございました！」（samami27）で開催を確認。
    ソールドアウト済みの「なんちゃら新曲入りのドネーションCD、ヘブンスとのコラボシャツ」
    の希望者取り置き分もこの日持参された。

    ※Xの告知アーカイブから復元。フライヤー記載の開始時刻(19:00)をdateに採用したが、
    なんちゃらアイドル自身の出番時刻の言及は本文に見当たらないため time_tbd とした。
  sources:
    - https://x.com/nantyaraidol/status/1270567063715627008
    - https://x.com/nantyaraidol/status/1272528604354625537
    - https://x.com/samami27/status/1272803628504346624
    - https://x.com/nantyaraidol/status/1272888640386084865

- id: event-20200620-katorinu
  slug: 20200620-katorinu
  date: 2020-06-20 12:00:00 +0900
  time_tbd: true
  title: すたじおかとり〜ぬライブ（千葉・新検見川）
  site: すたじおかとり〜ぬ
  content: |
    千葉県・新検見川の「すたじおかとり〜ぬ」で開催された予約制ライブ。告知「20日こちらで
    ライブやります！予約制なので、リプでもdmでもお知らせくださいませ！1500円はお安い！
    広い会場でキープディスタンス！」（nantyaraidol、6/10）、6/12には「来週のライブは、
    20.21とともにsold out！まあたんに人数制限のせいなんだけど、今までsold outとかなかった
    から新鮮さはあるな？」と完売報告。当日は道案内「目印は“スウィングさき”のでっかい看板！」
    「千葉県だからマックスコーヒー」（samami27）。終演後「かとり〜ぬライブありがとう
    ございました！ソーシャルディスタンス守ってたのに、自撮り忘れてて密な自撮りになりました。」
    （samami27）、「千葉県は新検見川すたじおかとり〜ぬさんで蜜避けおギグでした。美味しい
    ご飯食べてお酒飲んで歌ったら3大欲求みたされました充★実」（yokuwakan_nai）で開催を確認。

    ※Xの告知アーカイブから復元。開演・出番時刻の言及が本文に見当たらないため time_tbd とした。
  sources:
    - https://x.com/nantyaraidol/status/1270420573852626946
    - https://x.com/nantyaraidol/status/1271135154556203008
    - https://x.com/samami27/status/1274358319327539200
    - https://x.com/yokuwakan_nai/status/1274368336718004224

- id: event-20200621-kunihouse
  slug: 20200621-kunihouse
  date: 2020-06-21 12:00:00 +0900
  time_tbd: true
  title: なんちゃらアイドル5人限定ライブ（リベンジ）
  site: 南浦和KUNIHOUSE
  acts:
    - DJタマキ
  content: |
    5/24の限定5名ワンマン「君はGANなのだ！」に続く、南浦和KUNIHOUSEでの5人限定ライブ第2弾。
    予告「6月21日にまた5人限定ライブやります。前回は1秒完売だった激レアライブ！…もし
    6月21日までに状況が変わり、ライブハウス側が判断をした場合は、限定解除をし、通常の
    ライブを行わせていただきます。」（nantyaraidol、5/18）、5/22の20時予約開始（チケット
    2000円）で「1分完売でした！…次回は7月！」。当日「タマキさんとのスペシャルコラボ
    あるとかないとか！」「本日のライブキャス中継しますけんね」（nantyaraidol）とツイキャス
    配信を併用。終演後「今日は南浦和クニハウスで人数限定ライブでした！必殺・フェイスガード
    あとマミヨガ」（yokuwakan_nai）、「クニハウスありがとうございました！持ち寄り差し入れ
    ありがとうございました！フェイスシールドゲットだぜ！…ゲストにDJタマキ！パーティだ〜！」
    （samami27）で開催を確認。

    ※Xの告知アーカイブから復元。開演・出番時刻の言及が本文に見当たらないため time_tbd とした。
  sources:
    - https://x.com/nantyaraidol/status/1262192649978540033
    - https://x.com/nantyaraidol/status/1263759957544980480
    - https://x.com/yokuwakan_nai/status/1274691714687459329
    - https://x.com/samami27/status/1274716164791234561

- id: event-20200623-ottanta
  slug: 20200623-ottanta
  date: 2020-06-23 12:00:00 +0900
  time_tbd: true
  title: 「なんたってアイドル」（蒲田オッタンタ）
  site: 蒲田オッタンタ
  content: |
    蒲田オッタンタで開催されたDJイベント「なんたってアイドル」。事後報告「蒲田オッタンタ
    “なんたってアイドル”ありがとうございました！DJ陣の中、なんちゃら1人参戦ではちゃめちゃに
    不安でしたが、駆けつけてくれたみんなと、まりなちゃんはるかさんのおかげで楽しかった
    です！」（samami27）で開催を確認。前日の「今回、あおはるはおりませんが、元同僚の
    はるかと、まりなちゃんがゐる！」（nantyaraidol、6/22）はこのイベントを指すとみられ、
    あおはるは不参加（同日は撮影会ツーデイズ期間）。はるか（元なんちゃらアイドル）・
    まりなちゃん（土萌まりな）の具体的な出演形態（DJ等）は本文に明示がないため acts には
    含めていない。

    ※Xの告知アーカイブから復元。事前の告知ポスト・開演時刻が本文に見当たらないため
    time_tbd とした。
