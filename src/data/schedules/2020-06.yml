#     6月アーカイブ中に追加言及なし（開催された形跡もなし）
#
# releases.yml裏取り候補（編集は今回しない。issue #21 の候補リストに関わる）:
#   - **新曲「parallel line」（表記は本文ママ・小文字）: 2020-06-26 代々木バーバラで
