    有言実行！ルカタマさんのお店、 cafe宙を3ヵ月連続でなんちゃらが（ついでに運営も）ジャックさせていただくことになりました！
     9月17日と10月22日は、1部2部の予約優先制となります（当日枠があるかどうかも随時告知いたします）。 ご予約はnagaokatasuku@gmail.comまで。 3ヵ月コンプした人には、なんと、 完売してしまったcurry or dieTシャツのDIY復刻版（白いTシャツになんちゃらが直接既存のものを模したイラストを描く）をプレゼントいたします！」（nantyaraidol、9/5深夜2:07投稿。投稿のJST日付は9/5）で会場・企画名・日程（3ヵ月連続開催）を確認。「９月17日1部満席となりましたありがたビームヾ( ˃̶᷇ ‧̫ ˂̶᷆ )ノ」（nantyaraidol、9/5）・「ちなみに全日程ルカタマさんもおられます！」（nantyaraidol、9/5）で予約状況・出演者を確認。「キャンセル入りまして満席だった17日1部に空きが出ました。」（nantyaraidol、9/14）で直前の予約状況を確認。「めちゃ楽しかった！
    次回は10月22日！
    残席数わずか！」（nantyaraidol、9/17）で終演後の言及・次回開催日（10月22日）を確認。

    ※Xの告知アーカイブから復元。開演時刻は本文からは判明せずtime_tbdとした。
