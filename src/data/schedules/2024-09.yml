- id: event-20240930-lovetko-mami
  slug: 20240930-lovetko-mami
  date: 2024-09-30 23:59:00 +0900
  title: 東新宿LOVE TKO「なんちゃらinLoveTko」御茶海マミソロバーイベ
  site: 東新宿LOVE TKO
  content: |
    東新宿LOVE TKOでのバーイベント「なんちゃらinLoveTko」月例企画の御茶海マミソロ回。「9月30日、平日ですが、
    ひっさしぶりに御茶海マミがソロバーイベやります！
    場所は東新宿LOVETKO！
    酔いどれ弾き語りとかもあるかも！
    遠隔drinkはこちらから！

    https://t.co/OhN2dJc8UN
    https://t.co/tfPI2GxeoP」（nantyaraidol、9/25）で先出し告知（会場・ソロ企画である旨を確認）。「バーイベやっぞ！！つまみは気分が乗ってたら味玉作ろうかな
    （引用: @nantyaraidol 1840220140409106870「こちらいよいよ明日！平日深夜ですがよろしく頼ま入れ」）」（samami27、9/29）で前日の言及を確認。「23時59分から！29時まで！
    charge1000円（1h）
    drink600円〜

    東新宿の駅から徒歩1分！」（nantyaraidol、9/29）・「東新宿LOVE TKOでのバーイベは
    23時59分から29時まで
    charge1000円（1h）
    drink600円〜

    映画や小説・漫画、みんながマミに教えたいこと、全部知りたいからオリジナリティ0フライヤー作った！教えたいことなくても来てね！」（samami27、9/29）で開始時刻23時59分・料金の詳細を確認。

    ※Xの告知アーカイブから復元。8月時点の先出し予告表では18時〜23時とされていたが、直前の告知では8/30初日と同様「23時59分から29時まで」に変更されていることを確認した（「23時59分から29時まで」はnantyaraidol・samami27いずれも9/29投稿で用いている表現）。深夜帯にまたがるイベントのため、9/30 23:59開始・10/1 04:59終了と解釈した。
