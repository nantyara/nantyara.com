- id: event-20190401-club251
  slug: 20190401-club251
  date: 2019-04-01 12:00:00 +0900
  time_tbd: true
  title: なんちゃらアイドル ライブ（下北沢251）
  site: 下北沢251
  content: |
    下北沢251でのライブ。事前告知ポストは本文中に見当たらず、いずれも終演後の
    お礼ポスト（3件）のみで裏取り。「下北沢251ありがとうございました！今日も
    すごいイベントだったな。ライブ楽しかった！新曲褒めてもらえて嬉しいし
    令和も響きが可愛いので嬉しいしさくらも咲いてるから嬉しい。」
    （yokuwakan_nai）「下北沢251ありがとうございました！打ち上げで（ライブを
    すっぽかして飲んでいた）運営Q太郎と合流！踊ってばかりの国の谷山くんと、
    ゴーイングアンダーグラウンドの松本さんとパチリコ！」（nantyaraidol）
    「本日、下北沢251ライブありがとうございました！フロアライブめっちゃ
    楽しかったー！！これが花見ってことか〜！」（samami27）と感想。開演時刻・
    対バン相手の具体名の言及は本文には見当たらない。

    ※Xの告知アーカイブから復元。開演の具体的な時刻の言及が本文に見当たらない
    ため time_tbd とした。事後ポストに登場する「谷山くん」「松本さん」は
    打ち上げで会った人物であり、対バン出演者としての明記ではないため acts には
    含めていない
