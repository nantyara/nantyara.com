  title: 「襖祭」（三軒茶屋HEAVEN'S DOOR）
  site: 三軒茶屋HEAVEN'S DOOR
  content: |
    三軒茶屋HEAVEN'S DOORでの夜の対バンイベント「襖祭」（同日昼の「詩音の奏〜
    vol.74」とは別会場・別イベント）。事前の言及「K&Mライブありがとうございま
    した！...夜は誰も理解してない襖祭です！三軒茶屋ヘヴンスドアで待ってる
    ネ」（samami27）。終演後は「夜はヘブンスにて襖祭ありがとう！テンション
    上がったからたくさんタトゥー彫った！」（yokuwakan_nai）「なんちゃらアイドル
    夜、ヘヴンスドアライブありがとうございました！入りにもらったデコポンが
    おいしかったです！襖祭よくわからなかったけど楽しかった！」（samami27）と
    感想。開演時刻・対バン相手の具体名の言及は本文には見当たらない。

    ※Xの告知アーカイブから復元。開演の具体的な時刻の言及が本文に見当たらない
    ため time_tbd とした
