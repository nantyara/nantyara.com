- id: event-20190429-bumb
  slug: 20190429-bumb
  date: 2019-04-29 12:00:00 +0900
  title: プロレスイベント ゲスト出演（夢の島BumB）
  site: 夢の島BumB
  content: |
    夢の島BumBで開催されたプロレスイベントへのゲスト出演。事前告知「本日、
    夢の島BumBにてライブします！リングの塵にならないようにがんばるゾ！
    全席自由席で3500円、11:45開場、12:00開演。なんちゃらは第5試合のあとに
    歌います！」（samami27）「BumB入って、受付の右横を道なりに進んで、
    突き当たりにイベント受付があります！」（samami27）。終演後は「夢の島BumB
    ライブありがとうございました！リングの上でのライブ楽しかったー！」
    （samami27）「夢の島Bumbにてなんちゃらアイドルライブみてくれてありがとう
    ございました！プロレスめっちゃ面白くてかっこよかったし」（yokuwakan_nai）
    「プロレス楽しかった！男ばかりの現場だとこんなに蝶よ花よとされるのかと！」
    （nantyaraidol）と感想。

    ※Xの告知アーカイブから復元。イベント全体の開演時刻(12:00)をdateに採用。
    なんちゃらアイドル自身の出番は「第5試合のあと」とのみ言及されており
    具体的な時刻ではないため厳密な出番時刻は不明。夢の島BumBはvenues.yml
