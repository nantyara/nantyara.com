    開場19:00、開演19:30 2500円（1drink別）なんちゃらアイドル(バンドver.)
    破滅ロマンス（梅星えあバンド) 工藤ちゃんのピンクローターズ なんちゃら
    アイドルは19:30から！バンド編成ぜひ見て欲しい！新曲あり〼！」（samami27、
