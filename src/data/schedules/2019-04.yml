    新宿ヘッドパワーでのなんちゃらアイドル主催バンド編成ライブ「バンドだもん！
    （仮）」。事前告知「あした！4月4日 なんちゃらアイドル主催「バンドだもん！
    （仮）」新宿ヘッドパワー（https://headpower.tokyo）19:00open19:30start
