# なんちゃらアイドル結成初月。4/14が初練習日、4/28が「なんちゃらキカク」初回
- id: event-20140428-nantyarakikaku
  slug: 20140428-nantyarakikaku
  date: 2014-04-28 12:00:00 +0900
  time_tbd: true
  title: なんちゃらキカク（初回）
  site: なんちゃらキカク
  content: |
    「なんちゃらキカク」（#ロー協）初回。当時のはるか本人の告知では「ライブは4/28、なんちゃら
    キカクにて」と明言されているが、2014年7月の後継回（新なんちゃらキカク）の告知内容から、
    同シリーズが緊縛師・ローブル撮影会を軸にした内輪向けコンテンツ企画である可能性が高いことが
    判明したため、「初ライブ」の断定は避け企画名ベースの記述に訂正した（4/28自体が同種の
    撮影企画だったと確定したわけではない）。自主企画名義（主催: 魔ゼルな規犬）で、同日発売の
    オムニバスCDと連動していたとみられる。開催時刻・実際の会場（物理的な場所）はXの告知本文
    からは確認できていない。

    ※Xの告知アーカイブから復元。2014-07分の発掘で企画の性質が判明し記述を訂正（2026-07-13）
