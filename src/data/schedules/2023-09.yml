- id: event-20230904-sarusho
  slug: 20230904-sarusho
  date: 2023-09-04 12:00:00 +0900
  end: 2023-09-06 12:00:00 +0900
  time_tbd: true
  title: 栃木さる小（撮影会・キャンプ、3日間）
  site: 栃木さる小
  content: |
    廃校を活用した貸切イベント施設「栃木さる小」（旧猿ヶ京小学校）での3日間の撮影会・
    キャンプイベント。「さる小の準備するぞー するったらするぞー」「明日から一緒の人は
    よろしくです。食材やお酒等の差し入れ、大歓迎です。タオルと着替えは多めが良いと思い
    まーす！雨っぽいし！」（yokuwakan_nai、9/3）で予告。「気を取り直して、さる小の撮影会、
    1日目デニムコーデ（ちょっとえち）2日目制服×競泳水着（廃校で制服最高）、3日目私服
    （ナチュラルでえち）って感じにする！」（samami27、9/4未明）で日替わりコーディネートを
    告知。「ライブの順番くじ引きあるからライブのタイテは仮のものっぽいです！」
    （yokuwakan_nai、9/3）から撮影会だけでなくライブも実施されたことが確認できる。
    ファンティア投稿タイトル「さる小1日目」（9/4）「さる小２日目」（9/5）
    「さる小３日目最終日」（9/6）で3日間の開催を確認。終演後「さる小楽しかったなー。」
    （yokuwakan_nai、9/6・9/8）と感想。

