    3日間と判断。venues.ymlには既存の`sarusho`（name: 栃木さる小、address: 群馬県
    利根郡みなかみ町相俣1744-15）が登録されているためsiteは正式名称を採用。各日の
    開始・終了時刻は本文からは特定できずtime_tbd。
