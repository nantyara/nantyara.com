  content: |
    下北沢ちょ美ひげでのレコ発ライブ「S.B.Q.アイドル部＆太宰ちゃんCD（全国流通盤）デビュー記念レコ発ライブ！」。「2024年07月10日(水)S.B.Q.アイドル部＆太宰ちゃんCD（全国流通盤）デビュー記念レコ発ライブ！ | イベント情報、予約購入はこちら  https://tiget.net/events/322661 #TIGET 

    ありがたいことにチケット完売いたしました！
    当日券の予定はございません。
    チケットご購入いただけたかた、お楽しみに！」（nantyaraidol、7/9夜19:24投稿）で告知。本文には会場名・時刻の記載が無かったため、告知に含まれるtiget.net/events/322661のリンク先を実際に開いて確認したところ、会場「下北沢ちょ美ひげ」・開場18:45/開演19:15・なんちゃらアイドルが30分のオープニングアクトを務めることが判明した。「今日はS.B.Q.アイドル部のレコ発O.A（お祝いアクト）しま！隊長ご飯もたっぷり！」（samami27、7/10）で当日告知（お祝いアクトとして出演する旨を確認）。「S.B.Q.アイドル部レコ発ありがとうございました！デビューレコ発おめでとう！アイドル部は女子校みを感じる。イツメンじゃないけど仲良い感じ。女の子がわちゃわちゃしてるの好き癖！！！！！」（samami27、7/10）で有観客開催・S.B.Q.アイドル部と太宰ちゃんのデビューレコ発である旨を確認。

