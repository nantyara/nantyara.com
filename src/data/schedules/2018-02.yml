    - https://x.com/samami27/status/965608505871708160
    - https://x.com/yokuwakan_nai/status/965659434780262400
- id: event-20180223-vespa
  slug: 20180223-vespa
  date: 2018-02-23 20:00:00 +0900
  title: Beat Happening！中野カラオケPANIC！～なんちゃらカムバックの巻～
  site: ベスパ
  acts:
    - 岬たん
  content: |
    中野Music bar BESPAでのカラオケイベント『Beat Happening！中野カラオケPANIC！
    ～なんちゃらカムバックの巻～』。通常のライブ形式ではなくカラオケ企画で、
    ガチンコゲストとして岬たんが参加。開場・開演20:00／終演22:30予定。
    前売￥2,500+1ドリンク。「リクエストは受けない！なんちゃらの歌いたい歌を聴きに恋！」
    と案内。終演後、yokuwakan_naiは「ベスパカラオケ楽しかった〜営業JPOP縛りでやろうと
    計画してたのに結局自分の好きな曲ぱかぱか歌ったりしてしまった〜」と感想。

    ※Xの告知アーカイブから復元。会場「Music bar BESPA」は venues.yml 上の既存会場
    「ベスパ（id: vespa、2017-10のカラオケ企画で使用実績あり）」と同一と判断
  sources:
