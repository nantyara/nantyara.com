# 2018年2月（/mine-x による X 告知アーカイブからの発掘。ソース: mining/x-archive/2018-02.json）
- id: event-20180205-muzenji
  slug: 20180205-muzenji
  date: 2018-02-05 20:00:00 +0900
  title: 高円寺無力無善寺 初ライブ初ワンマン
  site: 高円寺無力無善寺
  images:
    - /events/20180205-muzenji.jpeg
  content: |
    高円寺無力無善寺での「初ライブ初ワンマン」。前日までの告知では「20時から！遅めスタート！
    料金はなんと1000円！」（2/4朝）とあったが、同日夕方に「ちなみに前座はなくなりました！
    20時30分くらいから本編はじまりますぞ！」と更新されており、本編の開演は20:30頃だった
    可能性が高い（本エントリの date は前売り時点の告知20:00を採用）。久しぶりのJAMワンマン
    DVDを無料配布。yokuwakan_naiは「5年前、私がまだあおはるではなかった頃に初めて1人で
    ライブというものを見たのが無善寺でした」と、無善寺が原点の地であることに言及。

    同日、会場では1000円の個人撮影会（マミ・あおはる）も並行開催され、いずれも早々に
    完売した。終演後は「無善寺御礼！思い入れが強いあおはる、喉の調子がよき御茶海、良い
    意味でリラックスしたライブが出来ました！」「心と体と喉の調子よくてライブ楽しーーー！！」
    と両者から感想。来場25人、打ち上げ16人（「さすがにかつてない」）とのこと。

    ※Xの告知アーカイブから復元。開演時刻は前売り告知（20:00〜）と直前更新（前座なし・
    20:30〜本編）でぶれがあるため date は前者を採用しつつ、直前更新も content に記載
  sources:
    - https://x.com/nantyaraidol/status/960072804975624192
    - https://x.com/yokuwakan_nai/status/960131230283935744
    - https://x.com/nantyaraidol/status/960198673815674880
    - https://x.com/nantyaraidol/status/960542474006491137
    - https://x.com/samami27/status/960547629150060544
- id: event-20180210-ottanta
  slug: 20180210-ottanta
  date: 2018-02-10 20:30:00 +0900
  title: OKFK 大田区蒲田復興協会 〜ゴジラに焼かれた町から〜 episode 0
  site: スタジオ・オッタンタ
  images:
    - /events/20180210-ottanta.jpeg
  acts:
    - ささみ。
    - Takumi Fukaya
    - 香栄
  content: |
    フライヤーが見つかり、開催名・タイムテーブルが判明した：
    『大田区蒲田復興協会』～ゴジラに焼かれた町から～ episode 0。
    2018年2月10日（土）。開場19:00／開演19:30。
    場所：スタジオ・オッタンタ（http://studio80.org/）。料金：2,500円（1ドリンク付）。
    タイムテーブル：19:30 ささみ。／20:00 Takumi Fukaya／20:30 なんちゃらアイドル／
    21:00 香栄。なんちゃらの出番はタイムテーブル記載の20:30を採用（従来
    time_tbd としていたが、フライヤー確認により確定できたため time_tbd を解除）。

    当日限定でムーンライダーズ・鈴木慶一のカバー曲「クールダイナモ ライトオン」の限定
    シングルCDを配布（「再配布、販売の予定はありません」と明言。releases.yml への
    正式収録候補としては要検討＝非売品の限定配布物）。同日、ライブのたびにスタンプを
    押す「大田区蒲田復興協会スタンプカード」も配布開始（10個で香栄とのコラボ音源を
    プレゼントする企画）。JAMワンマンDVDやCDも配布。

    ※Xの告知アーカイブおよびフライヤー画像から復元
  sources:
    - https://x.com/nantyaraidol/status/962390873907408896
    - https://x.com/nantyaraidol/status/962393539530260480
    - https://x.com/nantyaraidol/status/962395169566806021
- id: event-20180214-firebird
  slug: 20180214-firebird
  date: 2018-02-14 21:05:00 +0900
  title: 新松戸FIREBIRD「HYSTERIC GIRLS PANIC -バレンタインだよ。篇」
  site: 新松戸FIREBIRD
  acts:
    - 梅星えあ
  content: |
    『FIREBIRD presents HYSTERIC GIRLS PANIC -バレンタインだよ。篇』。
    OPEN 17:30／START 18:00。前売￥2,500／当日￥3,000（+1ドリンク）。
    事前告知のタイムテーブルでは「21:05-21:30 （元）なんちゃらアイドル」と表記されて
    いた。「（元）なんちゃらアイドル」は解散ネタに由来する自称（過去のmine-x発掘で
    2016年末〜2017年頭のフェスボルタ期にも使用例あり）で、脱退や別体制を意味する
    ものではない。実際、終演後にはsamami27（御茶海マミ）が「#新松戸FIREBIRDライブ
    ありがとうございました！」、yokuwakan_nai（あおはる）が「新松戸FIREBIRDありがとう
    ございました〜！チョコもらってくれて嬉しかった！ぎゃぎゃっと歌えて気持ちが良かった
    です。」とそれぞれ本人名義で御礼投稿しており、現体制（マミ・あおはる）の出演で
    間違いない。同日出演の梅星えあについて「大好きなアーティストさんたくさん出るの
    ですが、梅星えあさん久しぶりで特に嬉しみあるな」と言及あり。バレンタイン企画として
    手作りマフィンを配布。

    ※Xの告知アーカイブから復元。開演時刻は事前告知のタイムテーブル記載（21:05〜）を採用
  sources:
    - https://x.com/nantyaraidol/status/962395808992653312
    - https://x.com/samami27/status/965608505871708160
    - https://x.com/yokuwakan_nai/status/965659434780262400
- id: event-20180219-heavensdoor
  slug: 20180219-heavensdoor
  date: 2018-02-19 19:00:00 +0900
  title: 三軒茶屋HEAVEN'S DOORライブ
  site: 三軒茶屋HEAVEN'S DOOR
  content: |
    三軒茶屋HEAVEN'S DOORでのライブ。前売￥2,000／当日￥2,300、OPEN/START 18:30/19:00。
    「中村リドさんのバンドがトリ」と案内されており、なんちゃらの出番はトリではない模様
    （出番の具体的な時刻の言及は見当たらず、date は開演時刻を採用）。終演後、samami27は
    「三軒茶屋ヘヴンスドア（今日、ヘヴンズドアではなくヘヴンスドアだと知りました）来て
    くれて、観てくれてありがとうございました！」、yokuwakan_naiも「三軒茶屋ヘブンスドア
    でのおライブありがとうございました！調子が良かったのでみんなの顔を見ながらギャーと
    歌えました。」と感想。同日、4月25日にヘブンズドアで初主催ライブを行うことも発表された
    （別イベントにつき本エントリには含めない）。

    ※Xの告知アーカイブから復元。なんちゃら自身の出番時刻の記載が見当たらないため、
    date は開演時刻(19:00)を採用
  sources:
