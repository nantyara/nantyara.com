- id: event-20180225-goldenegg
  slug: 20180225-goldenegg
  date: 2018-02-25 19:00:00 +0900
  title: 新宿ゴールデンエッグ 無銭ツーマン（4th/5thシングル同時発売レコ発）
  site: 新宿GOLDENEGG
  acts:
    - ザ・アイドルズ
    - ハイヅカ
  content: |
    新宿ゴールデンエッグ（歌舞伎町ドンキ裏）にて、ザ・アイドルズとの完全無銭ツーマン。
    オープニングアクトはハイヅカ。バンド編成での演奏。「ドリンク代を握りしめてきてね！
    なんちゃらレコ発だよー！CD代も握りしめてきてくれるとうれしぴ！19:00オープンです！」
    と告知。ニューシングル2枚同時発売のレコ発ライブで、「アイボリーソング」
    （デモバージョンは既に「永久絶盤」と言及されている旧盤とは別物、今回は正式な
    4th/5thシングルとしての発売とみられる）と「なんちゃら旅講座」が対象。前日24日夕方に
    通販ページが公開され「発売15分で15枚売れた」との報告あり。終演後、yokuwakan_naiは
    「いいライブだったな！ハイヅカもアイドルズも最高にかっけーや」と感想。

    ※Xの告知アーカイブから復元。開演時刻の明記が見当たらないため date はオープン時刻
    （19:00）を採用。「アイボリーソング」「なんちゃら旅講座」は releases.yml への
    登録候補としてレポートに詳細を記載
