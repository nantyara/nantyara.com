  content: |
    BAR無人島でのあおはる単独バーイベント（遠隔ドリンク付き）。「2023年1月6日、深夜23時半
    より、あおはるが無人島にてバーイベいたします！3900円でなんと朝（4時半）まで飲み放題！
    …遠隔drinkを販売いたします！」（nantyaraidol、1/3告知。※本文中は「23時半」だが同日の
    別告知・当日告知では開始は「24時」と記載）「本日24時から無人島にてあおはるバーイベ！
    28時半まで飲み放題で3900円！」（nantyaraidol、1/6）「今日の24時から28時半まで新宿
    無人島でバーイベントあります！…今回から遠隔ドリンクシステムも実装されました！」
    （yokuwakan_nai、1/6）で予告。あおはる（yokuwakan_nai）単独でのバー営業のため
    labelsにあおはるソロを付与。

