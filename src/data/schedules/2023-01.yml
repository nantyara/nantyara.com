  content: |
    高円寺ウーハでのライブ。同日昼の渋谷La.mamaからのはしご（上記参照）。通算1000回目の
    ライブであり、長年主要会場のひとつだった高円寺ウーハでの最終出演でもある。「明日は
    昼過ぎ渋谷ラママからの高円寺ウーハ(出演ラスト！なんたらライブ1000回目！)でござんす。」
    （yokuwakan_nai、1/4告知）「明日はなんちゃらラストウーハ！」（samami27、1/5未明告知）
    で予告。終演後「なんちゃらアイドル、本日のウーハでのライブをもちまして、ライブ1000回目
    を達成いたしました！千のポーズです！」（nantyaraidol）「渋谷ラママからの出演ラスト
    高円寺ウーハ(1000回目ライブ！)でしたありがとうございました！…したっきーさん
    (ウーハ店長)…伊豆に移住するらしい！超いいじゃん！押しかけようね。」（yokuwakan_nai）
    で有観客開催・通算1000回目達成・高円寺ウーハでの最終出演を確認。二重の節目のため
