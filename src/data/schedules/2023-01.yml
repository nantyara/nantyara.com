    あおはるは...！〜 18時半open19時start 2500円（1drink別） なんちゃらアイドル、
    あおはるソロ、土萌まりなwithスマイルアカデミー、盛りたかった千里、MCあんにゅ、
    そして教祖仮面」（nantyaraidol、1/9告知）でフルスペック告知。終演後「渋谷ラママ
    ありがとうございました！！2月7日はラママでマミ誕です！よしなに！」（yokuwakan_nai）
    「あおはるのお誕生日だった！めでたかったし、いい生誕ライブだったねー！」（samami27）
    で有観客開催・あおはる（yokuwakan_nai）の生誕祭であることを確認。あおはるの生誕祭
    という性質からlabelsにあおはるソロを付与。MCあんにゅはMC枠のためactsから除外した。

