    （yokuwakan_nai）で有観客開催を確認。フルスペック告知どおり出演したダイナマイト☆ナオキ
    ・桑原達也・万能ビニール・土萌まりなwithスマイルアカデミー・POPPYをactsに追加。
    「なんちゃらPOPPY」はなんちゃらアイドル＋POPPYによる当日限定の合体編成名（自ユニット
    単独名義ではないためacts自体には含めず、共演者POPPYのみをactsに計上）。

