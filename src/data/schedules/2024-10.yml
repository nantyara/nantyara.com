- id: event-20241011-okinawa-cyberbox
  slug: 20241011-okinawa-cyberbox
  date: 2024-10-11 12:00:00 +0900
  title: 沖縄Cyber-Boxライブ
  site: Cyber-Box
  time_tbd: true
  content: |
    沖縄遠征、Cyber-Boxでのライブ。「10月11日に新しくライブが決まりました！
    2000円！安い！まあでも沖縄だが！
    是非遊びにいらして！」（nantyaraidol、10/5深夜1:49投稿）でライブ決定を確認。「10月12日、昼頃からバーベキューやります。貸し切りbeachだよ。
    新鮮海鮮とか肉付きで参加費5000円ですこれはマジで原価！
    参加希望者はDMかLINEください。
    場所は沖縄です。ざっくり。」（nantyaraidol、9/22投稿、2024-09.jsonより）で貸切ビーチバーベキューを告知したのち、同日中に「ごめんめちゃ嘘だわ。11日です！」（nantyaraidol、9/22投稿、2024-09.jsonより）で開催日が10/11に訂正されている。「10月10、11日と沖縄でライブ！
    そして10はポトレ撮影会！
    11はバーベキューやります！
    ポトレ撮影会のご予約はこちらから！バーベキューはもう締めきりました！

    御茶海マミ
    https://studio.quinq.net/?p=16961&ymd=1728518400
    あおはる
    https://studio.quinq.net/?p=17361&ymd=1728518400」（nantyaraidol、10/8）で改めて日程を告知（御茶海マミ・あおはるの個人撮影会予約リンクを含む。バーベキューは既に締切済みと言及）。「おやすみ！明日はCyber-Boxでお待ちしております！」（samami27、10/11深夜1:36投稿。投稿のJST日付は既に10/11でイベント当日にあたる）で会場名を確認。「ビーパしたら右手のネイルが超なくなってる！いつの間になくなったんだろう！」（samami27、10/11）で当日のビーチパーティー（ビーパ）実施後の投稿を確認。

    ※Xの告知アーカイブから復元。開演時刻は本文からは判明せずtime_tbdとした。貸切ビーチバーベキュー自体はDM/LINE参加登録制で公開の会場名が無いため、本イベント（Cyber-Boxライブ）に統合して記載している。
