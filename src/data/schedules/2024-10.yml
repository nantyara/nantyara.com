- id: event-20241015-lamama-otonanobunkasai
  slug: 20241015-lamama-otonanobunkasai
  date: 2024-10-15 18:30:00 +0900
  title: 渋谷La.mama「大人の文化祭～今年最後の海の家special～」
  site: 渋谷La.mama
  acts:
    - いろはニホヘト
    - S.B.Q.アイドル部
    - NEKO
    - 中出し少年
    - ルカタマ
  content: |
    渋谷La.mamaでの主催イベント「大人の文化祭～今年最後の海の家special～」。「10/15(火)渋谷La.mama

    なんちゃらアイドル主催
    『大人の文化祭～今年最後の海の家special～』

    o18:30/s19:00
    2500円+1D

    この日はNEKOさんルカタマさんいるのでfoodが充実していそう！
    お腹空かせてきて！

    今回のテーマは、
    今年最後の海の家！
    いろはにさん、なんたら、アイドル部、ルカタマさんが鮮やかに水着で夏を終わらせます！NEKOちゃんもきっと着てくれるさ！うえりんもね！

    19:00～いろはニホヘト
    19:30～S.B.Q.アイドル部
    20:00～NEKO
    20:30～中出し少年
    21:00～ルカタマ
    21:30～なんちゃらアイドル
    22:00～22:45物販」（nantyaraidol、9/19投稿、2024-09.jsonより）でフルタイムテーブル・料金を確認。「本日大人の文化祭！
    まだ暑いから水着かまします！
    新曲やるので、みんなきてねー！」（samami27、10/15）・「ほんじつ！」（yokuwakan_nai、10/15）で当日告知。「なんちゃらソーミンチャンプルー、完売しましたありがたビームヾ( ˃̶᷇ ‧̫ ˂̶᷆ )ノさー！」（nantyaraidol、10/15）でfood出店の盛況を確認。「大人の文化祭ありがとうございました！
    新曲発表でした！これからもっとよくしていきます！！！聴いてくれてありがとう！
    写真は大人じゃないときと大人のマミ！」（samami27、10/15）で終演後のお礼投稿・新曲発表を確認。

    ※Xの告知アーカイブから復元。
