# 2020年7月（/mine-x による X 告知アーカイブからの発掘。ソース: mining/x-archive/2020-07.json）
# ドラフト（未コミット・レビュー用）。issue #16（/mine-x 2020後半）の 2020-07 分。
# 今回の転記対象は322告知のうち16件。新規会場候補2件あり（末尾コメント参照）。
#
# ⚠️ 2020年7月はコロナ禍のライブ再開期（人数制限・配信併用が多い）。6月と同じく
#   **配信のみ（無観客）のイベントは転記対象外**、実会場・有観客の開催が本文から確認
#   できたもののみ転記（配信「併用」で有観客実績が確認できるものは対象）。7月は6月と
#   異なり無観客配信ライブは確認されず（6/12付で「配信ライブシリーズがひと段落」済み）、
#   ライブは全て実会場開催だった。
#
# 日時はすべて post の time フィールド（UTC）を JST（+9h）に変換した上で「本日/今日/明日」等の
#   指し示す日付を確定している。
