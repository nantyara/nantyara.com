- id: event-20200702-nishieifuku-jam
  slug: 20200702-nishieifuku-jam
  date: 2020-07-02 19:55:00 +0900
  title: 「ビーハプ」（西永福JAM）
  site: 西永福JAM
  content: |
    西永福JAMで開催されたビーハプ（Beat Happening！）シリーズのライブ。当日告知「本日は
    西永福JAMでビーハプ！なんちゃらは19:55〜！」（samami27）。終演後「ビーハプライブ
    ありがとうございました！久しぶりのJAM！広くてキレイで、酒がうまい！というツイートを
    し損ね今の時間。」（samami27）で現地開催を確認。6/11の同シリーズ（渋谷HOME）は無観客
    生配信だったが、この回には無観客・配信の言及はない。共演者・料金は本文に見当たらない。

    ※Xの告知アーカイブから復元。dateは告知記載のなんちゃらアイドルの出番時刻（19:55）。
  sources:
    - https://x.com/samami27/status/1278595695373500416
    - https://x.com/samami27/status/1278778439894355969

- id: event-20200705-lamama
  slug: 20200705-lamama
  date: 2020-07-05 11:30:00 +0900
  title: なんちゃらアイドル主催「～帰ってきたぜ！ラママに！（バンドで）～」（30名限定）
  site: 渋谷La.mama
  labels:
    - 主催ライブ
  acts:
    - 東京恋慕
    - 夢乃るか
    - ヌルオthe部族
    - ロマニス
  content: |
    渋谷La.mamaでの30名限定・バンド編成の主催昼ライブ。告知「7月5日（日）なんちゃら
    アイドル主催ライブ（30名限定）～帰ってきたぜ！ラママに！（バンドで）～11時open
    11時半start 2500円（drink別）なんちゃらアイドル（バンド編成）、東京恋慕、夢乃るか、
    部族とロマニス 久々のバンド！ラママを贅沢に使います！」（nantyaraidol、6/20）、前日
    リマインド「なんちゃらアイドル（バンド）、夢乃るか、ヌルオTHE部族、東京恋慕」
    （samami27、7/4）。前夜「明日は久しぶりにバンドでライブです。新曲もやります。マミ
    トレカも配布します。」（nantyaraidol）。当日は13時すぎからツイキャス配信も併用。
    終演後「完売しましたありがとうございます！」（nantyaraidol）、「ラママお昼ライブ！
    ご出演いただいた皆様、ご来場いただいた皆様ありがとうございました！」（samami27）で
    有観客開催を確認。事後には「東京恋慕、ロマニス、夢乃るかさんと一緒に歌った『夜の煙突』」
    の動画も公開された（みどころは「マミが尺を間違えて間奏中にサビに突入してしまうのに
    みんながオロオロついていくところ」）。

    ※Xの告知アーカイブから復元。dateは告知記載の開演時刻（11:30）。actsの「ヌルオthe部族」
    「ロマニス」は、6/20告知の「部族とロマニス」を7/4告知（ヌルオTHE部族）と事後ポスト
    （ロマニス）で個別に確認できた2組として記載（表記は既存イベントの表記に合わせた）。
  sources:
    - https://x.com/nantyaraidol/status/1274275084442628096
    - https://x.com/samami27/status/1279386373347135489
    - https://x.com/nantyaraidol/status/1279740087278821385
    - https://x.com/nantyaraidol/status/1279740272616697856

- id: event-20200708-mami-satsueikai
  slug: 20200708-mami-satsueikai
  date: 2020-07-08 12:00:00 +0900
  time_tbd: true
  title: 御茶海マミ撮影会（青森秋田遠征支援撮影会）
  site: なんちゃら運営自宅
  labels:
    - マミソロ
  content: |
    もともと「【青森秋田遠征支援撮影会】7月8日 場所 下丸子運営宅 御茶海マミ 18時
    あおはる 17時、18時45分 10000円」（nantyaraidol、6/11）として告知された撮影会。
    遠征そのものは「7月の秋田青森遠征、ライブハウス側の事情により中止となりました」
    （nantyaraidol、6/14）と中止になったが、撮影会は開催され、「撮影会ありがとございました！
    今日はロングver.相変わらず猫と写真撮るの下手。」（samami27、7/9未明）で御茶海マミ分の
    開催を確認。あおはる枠（17時・18時45分）の開催確認ポストは本文に見当たらないため、
    マミソロ扱いで転記している。

    ※Xの告知アーカイブから復元。遠征中止後も告知どおりの時間（マミ18時）で行われたかは
    本文から確認できないため time_tbd とした。
  sources:
    - https://x.com/nantyaraidol/status/1270997703917330432
    - https://x.com/samami27/status/1280898584410337281

- id: event-20200711-lovetko
  slug: 20200711-lovetko
  date: 2020-07-11 19:00:00 +0900
  title: なんちゃらアイドル主催「～帰って来たぜloveTKO！～」（限定10名）
  site: 東新宿LOVE TKO
  labels:
    - 主催ライブ
  acts:
    - オニオンシュテン
  content: |
    東新宿LOVE TKOでの限定10名の主催ライブ。告知「7月11日(土) なんちゃらアイドル主催
    ～帰って来たぜloveTKO！～東新宿loveTKO 18時半開場 19時開演 2500円（1ドリンク別）
    限定10名のレアライブ！」（nantyaraidol、6/24）。開催2日前には「きゅうぼ 明後日11日、
    東新宿lovetkoでライブしたいかたおられますでしょうか。もう満席のため、チケットバックが
    だせません。…コロナ対策として総人数を減らしたいため、ソロのかたにお願いしたく思います。」
    と出演者を追加募集し、当日「オニオンシュテンなうなんだけど、そいえばオニオンシュテンに
    持ち時間とかまったく伝えてなかった（でももうやっとる）」（nantyaraidol）とオニオン
    シュテンが出演。当日はツイキャスで主催配信も実施し、配信中に新シャツの披露・新曲披露・
    「なんちゃらアイドル旅講座」などが行われた。終演後「LOVE TKOありがとうございました！」
    （samami27）、「TKOありがとでした！TシャツかわE」（yokuwakan_nai）で開催を確認。

    ※Xの告知アーカイブから復元。dateは告知記載の開演時刻（19:00）。
  sources:
    - https://x.com/nantyaraidol/status/1275738559576567810
    - https://x.com/nantyaraidol/status/1281140456294772736
    - https://x.com/nantyaraidol/status/1281925887923941376
    - https://x.com/samami27/status/1281953755311661057

