- id: event-20200724-shichoshitsu
  slug: 20200724-shichoshitsu
  date: 2020-07-24 18:30:00 +0900
  title: 「一色エレキの緊急大売り出し」（日ノ出町試聴室）
  site: 日ノ出町 試聴室その3
  content: |
    なんちゃらアイドル新メンバー・一色進（2020年3月加入発表）の名義ライブに、なんちゃら
    アイドルがゲスト出演。告知「この日のための新曲を用意しました（方向性が狂った贅沢）！
    7/24(祝)｢一色エレキの緊急大売り出し｣出演:一色進 ゲスト:なんちゃらアイドル 開場18:00/
    開演18:30 予約前売り3000円＋1ドリンクオーダー(500円) 試聴室のホームページにて受付中！
    限定20名！」（nantyaraidol、7/15）、「一色さんとのライブ。これはほんとスペシャルな
    ライブです。書き下ろし新曲もやります！」（nantyaraidol、7/19）。当日「明日、7月24日の
    ライブは『一色エレキの緊急大売り出し』！一色さんとたくさん歌います！初披露の曲もある
    のでぜひ！」（samami27、7/24未明）。終演後「日の出町試聴室『一色エレキの緊急大売り出し』
    ゲストで呼んでいただきました！駆けつけてくれた皆さまありがとうございました！」
    （samami27）で開催を確認。

    ※Xの告知アーカイブから復元。dateは告知記載の開演時刻（18:30）。一色進はなんちゃら
    アイドルのメンバー名義のため acts には含めていない。
