  time_tbd: true
  title: すたじおかとり〜ぬ限定ライブ（バンドセット）
  site: すたじおかとり〜ぬ
  content: |
    千葉・新検見川のすたじおかとり〜ぬで開催された限定ライブ（バンドセット・ヘアメイク付き）。
    前日「これあと2.3人入れます！撮影タイムなどもあり、この日だけのスペシャルバンドセット
    なのでお見逃しなきよう！」（nantyaraidol、7/13）。当日未明「ヘアメイクさんに髪可愛く
    してもらって、バンドで演奏してもらって、いつもよりちょっとアダルティーにうたいますの。
    そういうイベントですの。ちばしんけみがわ」（yokuwakan_nai）、「14日は新検見川のすたじお
    かとり〜ぬさんで限定ライブです〜いつもと少し違うし、ヘアメイクさん入るので特別かわいく
    なるよ！」（samami27）。**この日、新曲「baby a gogo！」をライブ初披露**。「ふわっと新曲
    初披露でした。「baby a gogo！」という曲です。9月8日に発売予定です。お楽しみに～。」
    （nantyaraidol）。終演後「キラキラ！かとり〜ぬライブありがとうございました。髪の毛
    くるくるキラキラにしてもらいました！新曲の初お披露目いかがだったでしょうか〜」
    （samami27）、「新検見川かとり〜ぬありがとう 髪の毛もりもり キラキラ」（yokuwakan_nai）で
    開催を確認。

    ※Xの告知アーカイブから復元。開演・出番時刻の言及が本文に見当たらないため time_tbd とした。
