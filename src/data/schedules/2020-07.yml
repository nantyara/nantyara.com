#   - 7/14 すたじおかとり〜ぬ限定ライブ（バンドセット・ヘアメイク付き）:
#     **新曲「baby a gogo！」ライブ初披露・9月8日発売予定の公式言及**（releases裏取り候補）
#   - 7/16 「BarQuinQ」@新宿bar無人島: 5月・6月に続く第3回。モデル陣に水野ふぁんた・たまきが追加
