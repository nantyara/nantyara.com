- id: event-20200731-ottanta
  slug: 20200731-ottanta
  date: 2020-07-31 12:00:00 +0900
  time_tbd: true
  title: OKFK 大田区蒲田復興協会 〜ゴジラに焼かれた町から〜 蒲田オッタンタ復活ライブ
  site: 蒲田オッタンタ
  content: |
    水没から復活した蒲田オッタンタでのライブ。告知「7月31日はコレ！こないだの雨で水没した
    オッタンタが華麗に復活絵里！正直このライブにはきて欲しいです。みんなでオッタンタを
    復興させたい。この日は初だしの新曲もやります！」（nantyaraidol、7/29）。当日「日付
    変わって本日7月31日、OKFKでし！待っておりますゆえ〜」（samami27）、「中止や配信ライブを
    乗り越えて、ひさびさに会えるOKFK今日です！」（yokuwakan_nai）。当日夜はツイキャス配信
    （本編＋アンコール）も併用。終演後「OKFK大田区蒲田復興協会ありがとうございました！
    新曲披露の日でした。聴いてくれてありがとうございました。」（samami27）で有観客開催を
    確認。披露された新曲の曲名は本文に明示されていない。

