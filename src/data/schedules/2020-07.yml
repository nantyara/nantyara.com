#     19:55〜！」、事後「久しぶりのJAM！広くてキレイで、酒がうまい！」で現地開催を確認
#     （6/11のビーハプは無観客配信だったが、今回は無観客・配信の言及なし）
#   - 7/5 渋谷La.mama主催「～帰ってきたぜ！ラママに！（バンドで）～」（30名限定・バンド編成）:
#     2020-06申し送りの突合OK。完売・マミトレカ配布・「夜の煙突」共演動画あり
#   - 7/8 御茶海マミ撮影会: 2020-06申し送り「7/8青森秋田遠征支援撮影会（遠征自体は6/14中止）」
#     の開催有無確認 → **撮影会自体は開催された**（7/9 01:16 JST「撮影会ありがとございました！
#     今日はロングver.」）。ただし確認できたのはマミ分のみ（あおはる枠17時/18時45分の開催
#     確認ポストは本文に見当たらない）ため、マミソロとして転記
