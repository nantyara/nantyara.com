  time_tbd: true
  title: 新宿LIVEFREAK一日店長
  site: 新宿LIVEFREAK
  content: |
    新宿LIVEFREAKでの一日店長イベント（ライブではないバーイベント）。「予定が抜けて
    いました…申し訳ありません！28日は新宿ライブフリークでバーの店長さんします…！」
    （samami27、7/26）、「明日 新宿のライブフリークで店長さんするわよ、ライブはやらんけど、
    ゆっくり話せると思うので是非ともね〜」（yokuwakan_nai、7/27）。当日「今日です！ライブ
    ではないので、ゆっくりお話ししましょ」（samami27）、「定期バーイベしばらくやらないので
    なんちゃらの飲めるのはこの夏最後！」（nantyaraidol）。終了後「LIVEFREAKにて一日店長
    ありがとございました！」（yokuwakan_nai）、「ライブフリーク1日店長でした！これから
    履歴書にはライブフリーク店長って書いちゃおっと！」（samami27）で開催を確認。

