- id: event-20200729-chukagai-offkai
  slug: 20200729-chukagai-offkai
  date: 2020-07-29 19:00:00 +0900
  title: なんちゃらアイドル夏のオフ会【in横浜中華街】～現役レスラーは食べ放題だとどれくらい食べられるのか検証～
  site: 横浜中華街
  content: |
    横浜中華街での食べ放題オフ会。告知「なんちゃらアイドル、夏のオフ会【in横浜中華街】
    ～現役レスラーは食べ放題だとどれくらい食べられるのか検証～2020年7月29日なんちゃら
    アイドル＆Hプロ 19時に横浜中華街某所に集合。写真撮り放題中華街ポトレ＆食べ放題料金込み
    6000円 限定10人」（nantyaraidol、6/18）。前日には「19時に、中華街への入り口『善隣門
    （ぜんりんもん）』前にお願いいたします。…当日の会費は6000円となります。」と集合案内、
    当日「こちらふたりキャンセルでました！参加希望のかたはDMくださいませ。」（nantyaraidol）。
    終了後「中華街でHプロの人達と食べ放題するオフ会でした。めっっっちゃ食べたしみんな
    めっっっっっちゃ食べてた。楽しかったのでまたみんなでご飯会したいね。」（yokuwakan_nai）、
    「レスラー軍団の箸は最後まで止まってなかったです。」（samami27）で開催を確認。
    会場の店舗名は本文に見当たらない（集合場所は善隣門前）。

    ※Xの告知アーカイブから復元。dateは告知記載の集合時刻（19:00）。
