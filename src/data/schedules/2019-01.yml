- id: event-20190104-ryogoku-sunrise
  slug: 20190104-ryogoku-sunrise
  date: 2019-01-04 12:00:00 +0900
  time_tbd: true
  title: 「DADAフェス」（両国サンライズ、バンド編成）
  site: 両国サンライズ
  content: |
    両国サンライズでの対バンイベント「DADAフェス」。2019年ライブ初め、なんちゃら
    アイドルとしては珍しいバンド編成セットでの出演。事前告知「1月4日は、なんちゃら
    新年初ライブ！バンド編成！しかも初出しの新曲（ニーネのカバーだが）あり！
    シャンパンもあけてもらいますのでみんなで遊びに恋！」（nantyaraidol、1/3）
    「本日DADAフェス！両国サンライズにて！祭りじゃ〜〜！！！」（samami27）。終演後は
    「新年初ライブでした！DADAフェスありがとうございました！楽しかったーーー！！」
    （samami27）「なんちゃらアイドルバンド編成ライブ両国サンライズDADAフェスにて
    ありがとうございました！！バンド、めちゃくちゃ楽しいので、もっと楽器上手に
    なりたいなあ、頑張ります！」（yokuwakan_nai、ドラム林さんへの言及あり）と感想。
    対バン相手の具体名の言及は見当たらない。

    ※Xの告知アーカイブから復元。開演・出番の具体的な時刻の言及が見当たらないため
