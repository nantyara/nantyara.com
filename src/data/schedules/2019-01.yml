- id: event-20190118-starwoods
  slug: 20190118-starwoods
  date: 2019-01-18 12:00:00 +0900
  time_tbd: true
  title: 大田区蒲田復興協会（OKFK）（牛かつ スターウッズスペース）
  site: 牛かつ スターウッズスペース
  labels:
    - 主催ライブ
  acts:
    - オニオンシュテン
  content: |
    蒲田の牛カツ屋「スターウッズスペース」で開催された「大田区蒲田復興協会
    （OKFK、香栄となんちゃらアイドル共同主催）」。事前告知「1月18日(金)
    なんちゃらアイドル主催「大田区蒲田復興協会」オニオンシュテンもでるぞ！
    なんと牛カツ食べながら観れます！場所は、蒲田のスターウッズスペース！」
    （nantyaraidol、1/15）「本日、1月18日はOKFK！スターウッズスペースでやります！
    牛カツ食べられます！」（samami27、1/17夜）「明日は主催！みんな大好き大田区
    蒲田復興協会だよ！今回は蒲田の牛カツ屋さんにて。」（yokuwakan_nai）。当日は
    「本日のアンコール、オニオンシュテンと一緒に、「夜の煙突」！」（nantyaraidol、
    出演者オニオンシュテンとのコラボを確認）。終演後は「OKFKありがとうございました！
    牛カツおいしかった〜！！」（samami27）「大田区蒲田復興協会ありがとうございました！！
    牛カツめちゃうまだった('ω')」（yokuwakan_nai）と感想。

