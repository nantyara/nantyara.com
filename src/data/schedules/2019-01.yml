  content: |
    代々木Barbaraでの対バンイベント「美味しい音楽～持ち寄り鍋パーティー～」（闇鍋
    ライブ、鍋の具材持ち寄り形式）。事前告知「明日は代々木バーバラにて、闇鍋ライブ！
    開場18:15、開演18:45 予約2500円、当日3000円です！」（samami27、1/8夜）
    「日付変わって本日！「美味しい音楽～持ち寄り鍋パーティー～」OPEN/START
    18:15/18:45 ADV/DOOR 2500/3000(1D別) ＠代々木Barbara 鈴木伸明、石川浩司、
    なんちゃらアイドル(19:55〜)、島崎智子、蜂鳥あみ太＝４号with大和田千弘(pf)
    すごいメンツだ。」（yokuwakan_nai）。終演後は「美味しい音楽〜持ち寄り鍋
    パーティー〜代々木バーバラにて！ありがとうございました！闇鍋的な良いダシが
    効いた感じだなぁと思いました！」（samami27）「代々木バーバラありがとうございました！
    持ち寄り鍋、結果めちゃくちゃ豪華になってて笑っちゃった。すごくイイ身体のあみ太
    さんと皆様の今年の抱負(？)」（yokuwakan_nai）と感想。

