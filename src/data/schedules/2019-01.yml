- id: event-20190130-heavensdoor
  slug: 20190130-heavensdoor
  date: 2019-01-30 20:20:00 +0900
  title: 「三茶流ハッピーテイストイベント」（三軒茶屋HEAVEN'S DOOR）
  site: 三軒茶屋HEAVEN'S DOOR
  content: |
    三軒茶屋HEAVEN'S DOORでの対バンイベント「三茶流ハッピーテイストイベント」。
    事前告知「今日はこれ！！！！三茶流ハッピーテイストイベントです。三茶流ハッピー
    テイスト、めちゃめちゃ怖いんですけど大丈夫ですか？なかよぴヒゲ味噌のこんちゃんは
    インフルエンザなので来れませんが何故かメンバーが増えるみたいです。」
    （yokuwakan_nai）「ビタミンCチャージ！本日三軒茶屋ヘヴンスドア！3番目の20:20頃
    （多分）歌います！！」（samami27）。終演後は「三軒茶屋ヘブンスドアありがとう
    ございました。カバー多めの日でした！」（yokuwakan_nai、あおはる誕生日祝いの
    言及あり）「三軒茶屋ヘヴンスドアありがとうございました！あおちゃんお誕生日
    おめでとう〜〜！！」（samami27）と感想。「ヒゲと味噌汁」のメンバー「こんちゃん」は
    インフルエンザで欠席との言及があるが、ユニットとしての出演有無は本文からは
    断定できないためactsには含めなかった。対バン相手の具体名（こんちゃん以外）の
    言及も見当たらない。

    ※Xの告知アーカイブから復元。事前告知の出番時刻「3番目の20:20頃（多分）」を
    dateに採用したが、投稿者自身が「多分」と留保しているため確度は高くない
