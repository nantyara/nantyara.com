  content: |
    四谷アウトブレイクでのライブ。当日「本日のライブは四谷アウトブレイク！今日の四谷はめっちゃ夏！」
    （samami27）、終演後「四谷アウトブレイクライブありがとうございました！スジに釘付けになったり、
