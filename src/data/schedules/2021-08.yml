- id: event-20210805-kawaiiya-harajuku
  slug: 20210805-kawaiiya-harajuku
  date: 2021-08-05 17:00:00 +0900
  title: 原宿カワイーヤ「なんちゃらジャック」
  site: 原宿カワイーヤ
  content: |
    原宿のカフェ「カワイーヤ」を、なんちゃらアイドルがジャックする企画。「8月5日、原宿カワイーヤ
    カフェをなんちゃらがジャック！します！16時から19時まで！17時くらいから結構長めのライブも
    やります！」（nantyaraidol）。当日「なんちゃらは16時から19時までいます！ミニライブ（20分）は
    17時過ぎくらいから！」（nantyaraidol）、「16時からいます〜 / ライブは17時から！」（samami27）、
    「入場料的なものは無いみたいなので普通のカフェ感覚で来て貰えれば！ライブは17時から。」
    （yokuwakan_nai）で開演時刻17時を確認。チャージ・入場料なし。終演後「原宿カワイーヤありがとう
    ございました！会いにきてくれてうれしいでした！次は19日にいます！」（samami27）、「原宿カワ
    イーヤたのしかった！ありがとうございました！19日にまたやります！」（yokuwakan_nai）で有観客
    開催を確認。

    ※Xの告知アーカイブから復元。dateは告知記載のライブ開始時刻（17:00）。8/19の続編開催は
    本ウィンドウ中に確認ポストが見当たらず未転記（9月への申し送り参照）。
