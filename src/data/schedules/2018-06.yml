- id: event-20180623-akiba-anjo
  slug: 20180623-akiba-anjo
  date: 2018-06-23 13:00:00 +0900
  title: あきば書店安城1号店 ライブ＆イベント
  site: あきば書店安城1号店
  images:
    - /events/20180623-akiba-anjo.jpeg
  content: |
    愛知・あきば書店でのミニライブと個人撮影会。事前告知「23日、愛知ミニライブ、
    楽しみにしてますけんねー。来てくれた人全員になんちゃら運営が食事をごちそうします！」
    （6/18）。前日には「そして明日は愛知ですかわいいとセクスィーをやりまくる。あと
    アダルトビデオ実況とかもする。広くて楽しいエロやさんでライブと撮影できるの
    嬉しいな〜。」（yokuwakan_nai）、当日朝には「明日は愛知でがんばる！有難いことに
    個人撮影は完売！15時から間違いなく1時間暇なんでみんなでラーメン食べに行きましょねー！」
    （nantyaraidol、投稿は前日6/22）と告知。終演後は「愛知あきば書店でのイベント無事
    終了しました！至れり尽くせりでありがたい限り....。」（yokuwakan_nai）「愛知までついて
    きてくれる人がいて、愛知で出会ってきてくれる人がいて」（samami27）と感想。個人撮影会は
    事前完売の人気であったことが分かる。

    【フライヤー画像からの追記】
    料金メニュー:
    一日参加チケット（レジにて） 2000円
    タイムテーブル:
    13:00 ライヴ（かわいいコス）
    13:20 サイン＆物販
    14:00 大人のお茶会＆ゲスゲーム改
    15:00-16:00 休憩
    16:00 ライヴ（セクスィーコス）
    16:20 物販＆プチ動画撮影
    17:00 1:1個別撮影
    19:30 終了

    ※Xの告知アーカイブから復元。フライヤー画像から判明した開演時刻(13:00)などを
    追記した。
