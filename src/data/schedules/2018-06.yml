- id: event-20180627-heavensdoor
  slug: 20180627-heavensdoor
  date: 2018-06-27 20:20:00 +0900
  title: 三軒茶屋HEAVEN'S DOORライブ
  site: 三軒茶屋HEAVEN'S DOOR
  acts:
    - 毎日サプリメント
    - ひつじちゃん
    - BAD TASTE CABARET
    - PUNiK
  content: |
    三軒茶屋HEAVEN'S DOORでの対バンイベント。タイムテーブル事前告知（6/23）「おつぎは
    これ！ヘブンス、毎回オモロいブッキングするよなー！ちゅき！1 19:00-19:30
    毎日サプリメント / 2 19:40-20:10 ひつじちゃん / 3 20:20-20:50 なんちゃらアイドル /
    4 21:00-21:30 BAD TASTE CABARET / 5 21:40-22:10 PUNiK / 三軒茶屋ヘブンスドア！」。
    この時点では開催日の明示はなかったが、6/26に「明日は三軒茶屋ヘブンスドアでライブ
    ですよー！毎日サプリメント、ひつじちゃんなどなど、楽しみなメンツですね。なんちゃらは
    20:20から歌います！」（yokuwakan_nai）「明日は三茶ヘヴンスドア！危ない女と危ない男感
    ある（バンド名をみて勝手に想像）毎サプ、ひつじちゃん、なんちゃらは野良犬だから！
    なんちゃらは20:20から！オリンピック時刻！」（samami27）と再告知され、同一ラインナップ・
    同一出番時刻(20:20)であることから6/27開催と確定できる。

    ※Xの告知アーカイブから復元。タイムテーブル告知ポスト単体には開催日の記載がなく、
    6/26の「明日」告知（同一ラインナップ・同一時刻）と突合して日付(6/27)を確定した。
    終演後の御礼ポストはアーカイブ期間内には見当たらない
  sources:
