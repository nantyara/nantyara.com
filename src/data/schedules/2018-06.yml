- id: event-20180617-goldenegg
  slug: 20180617-goldenegg
  date: 2018-06-17 18:30:00 +0900
  title: なんちゃらアイドル主催「QuinQfesta vol.007」（新宿GOLDENEGG・写真撮り放題live）
  site: 新宿GOLDENEGG
  labels:
    - 主催ライブ
  acts:
    - 猫屋敷ぽち
    - 双葉舞
    - メンヘラアイドル
    - 星野百花
    - 早乙女らぶ
    - 東京恋慕
    - Queen of Rose
  content: |
    新宿GOLDENEGG（本文中の表記は「新宿ゴールデンエッグ」）でのなんちゃらアイドル主催
    イベント『QuinQfesta vol.007』。写真撮り放題ライブとして企画。事前告知「明日の
    ライブはこちら！6月17日（日）QuinQfesta vol.007 新宿ゴールデンエッグ！なんちゃら
    アイドル主催、写真撮り放題live！18：00open 18:30start charge2000円（＋drink）
    出演者 猫屋敷ぽち、双葉舞、メンヘラアイドル、星野百花、早乙女らぶ、東京恋慕、
    Queen of Rose、なんちゃらアイドル」。前日には「明日は昼間Studio QuinQで撮影会、夜は
    新宿ゴールデンエッグで主催ライブです」（yokuwakan_nai）とも告知。当日朝には
    御茶海マミが「夜の煙突」を「不思議な声」で歌う企画も予告。終演後は「金卵ライブ、
    ほんと毎回しょうもないんだけど、いつだって笑いすぎて寝る前アゴが痛いんよ。
    ありがとうございました！」「合唱した！」（『夜の煙突』大合唱企画と思われる）と感想。
    後日「6月17日、ゴールデンエッグでのライブにて、ソフトケースに入ったカラフルなCD‐Rを
    間違えてお持ち帰りになられてしまったかた」への呼びかけも投稿。

    ※Xの告知アーカイブから復元。「QuinQfesta」はなんちゃらアイドル主催の写真撮り放題
    ライブシリーズと思われ、vol.007の番号から継続開催されているシリーズと推測されるが、
    history.yml への追記は全期間発掘完了後にまとめて棚卸しする方針のため今回は見送り。
    なんちゃら自身の個別出番時刻の告知は見当たらないため、イベント開演時刻(18:30)を
    dateに採用
  sources:
    - https://x.com/samami27/status/1008023649981378560
    - https://x.com/yokuwakan_nai/status/1008025610680086528
    - https://x.com/nantyaraidol/status/1008396124590260224
- id: event-20180622-firebird
  slug: 20180622-firebird
  date: 2018-06-22 21:10:00 +0900
  title: HYSTERIC GIRLS PANIC! 手相占い大公開スペシャル編
  site: 新松戸FIREBIRD
  images:
    - /events/20180622-firebird.jpeg
  acts:
    - 衿衣
    - 伴野あやめ
    - 岬たん
    - おかありな
    - 工藤ちゃん
  content: |
    新松戸FIREBIRDでのライブ。会場企画で占いを受けられるイベント。事前告知「今日は
    新松戸FIREBIRDで占いされちゃうぞ！今爪でグリグリして生命線を伸ばしてます！もちろん
    ライブもガンガンやります。対バンも豪華！トリですが最初から来たらおまけあるよ、
    FIREBIRDご飯も美味しいよ。」（yokuwakan_nai）。なんちゃらアイドルは「トリ」（最後の
    出演）であったことが分かる。終演後は「新松戸FIRE BIRDライブありがとうございました！
    前回占ってもらったとき、60歳で死ぬって言われたけど、寿命5年伸びました！」（samami27）
    と感想。

    【フライヤー画像からの追記】
