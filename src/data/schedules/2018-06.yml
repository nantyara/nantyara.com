  title: 三軒茶屋HEAVEN'S DOORライブ
  site: 三軒茶屋HEAVEN'S DOOR
  acts:
    - オニオンシュテン
    - バイドク佐藤
    - 堕天使Project
    - BAD TASTE CABARET
  content: |
    三軒茶屋HEAVEN'S DOORでの対バンイベント。事前告知「お次はこれ！6月13日（水）三軒茶屋
    ヘブンスドア 開場18:30 2000円くらい オニオンシュテン なんちゃらアイドル バイドク佐藤
    堕天使Project BAD TASTE CABARET なんちゃらは21時から！」。前日にも同内容で再告知
    （「明日、6月13日（水）は三軒茶屋ヘブンスドアにてライブ！」）。当日は「完売！」と
    報告。終演後は「三軒茶屋ヘヴンスドアありがとうございました！！君のダイナモ僕の
    レインボー！！」（samami27）「ヘブンスドアありがとうございました！」（yokuwakan_nai）
    と感想。

    ※Xの告知アーカイブから復元
  sources:
