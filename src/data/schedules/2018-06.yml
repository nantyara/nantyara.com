- id: event-20180602-akita-loud-affection
  slug: 20180602-akita-loud-affection
  date: 2018-06-02 14:15:00 +0900
  title: 「AKITA IDOL PARK 1部」
  site: 秋田LOUD AFFECTION
  acts:
    - あきてん！
    - 工藤ちゃん
    - EARNEST
    - あやたん
    - るしゅけ
  content: |
    秋田LOUD AFFECTIONでの対バンイベント『AKITA IDOL PARK 1部』（秋田遠征）。事前告知
    （5月archiveより、2018-05-11）「きたぞ！『AKITA IDOL PARK 1部』2018年6月2日（土）
    秋田LOUD AFFECTION(秋田) OPEN14：00/START14：15（予定）前売2000円/当日2500円（D別）
    出演：あきてん！、なんちゃらアイドル(東京)、工藤ちゃん(東京)、EARNEST、あやたん
    (Copy⇨DOLL)、るしゅけ(青森)、他」。「ぶっちゃけ、このライブ、去年から決まってたんです。
    ほんと、ずっと秋田はまた行きたくて」と再訪であることに言及。前日（5/30）には秋田遠征
    支援カレーパーティも開催（収益25000円、交通費・食費に充当）。6/1深夜には秋田到着を
    示す投稿（なまはげ・たんぼの写真）、6/2 17時頃には「宮城なう！焼きおにぎり食べたよ！」
    と秋田公演後に宮城へ移動していたことが分かるが、宮城での公演・会場に関する言及は
    見当たらない（同日23時台には東京帰着済み）。6/3には「昨日はありがとうございました！」
    と事後の御礼、「夜の煙突」「アイボリーソング」を披露した旨にも言及。

    ※Xの告知アーカイブから復元。個別の出番時刻の言及がないため、START予定時刻(14:15)を
    dateに採用。イベント名に「1部」とあるが「2部」に相当する言及・宮城での公演の裏取りは
    できず、宮城については移動・立ち寄りの記録のみで別イベントとしての転記は見送った
  sources:
    - https://x.com/nantyaraidol/status/994972809221685248
    - https://x.com/yokuwakan_nai/status/1002958688972255234
    - https://x.com/nantyaraidol/status/1003323989001887744
- id: event-20180604-muzenji
  slug: 20180604-muzenji
  date: 2018-06-04 20:15:00 +0900
  title: なんちゃら夢のツーマン！ vol.001
  site: 高円寺無力無善寺
  images:
    - /events/20180604-muzenji.jpeg
  acts:
    - MAD-DOG
  content: |
    高円寺無力無善寺でのMAD-DOGとの対バンライブ。事後報告のみで確認：「無力無善寺タイマン
    ありがとうございました！長尺はたくさん色々できてダンスダンスダンスだね！かみつき！
    運営に噛み付いたけど、メンバーはかわいくて噛み付けなかったね。」（samami27）
    「にゃおー。ねこだよ。かみつき！MAD－DOGさんとタイマンだったのでねこになりました。
    地下アイドルイキリ運営二大巨頭が集うレアな回だったとおもいます草 無善寺はおうち感が
    強すぎてテキトーにふざけまくってしまうけど反省はしてないよ！」（yokuwakan_nai）。
    「タイマン」（1対1の対バン形式）であったことが分かる。

    【フライヤー画像からの追記】
    イベント名: なんちゃら夢のツーマン！ vol.001
    19:00 かみつき！MAD-DOG
    20:15 なんちゃらアイドル
    料金: 1500price (without drink)

    ※Xの告知アーカイブから復元。過去セッションの引き継ぎメモにあった正式タイトル
    「夢のツーマンvol.001」はフライヤー画像から事実確認できたため title に反映し、
    出番時刻(20:15)をdateに設定した。
  sources:
    - https://x.com/samami27/status/1003651561510223872
    - https://x.com/yokuwakan_nai/status/1003658615071260673
- id: event-20180613-heavensdoor
  slug: 20180613-heavensdoor
