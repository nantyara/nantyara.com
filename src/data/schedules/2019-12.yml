# 2019年12月（/mine-x による X 告知アーカイブからの発掘。ソース: mining/x-archive/2019-12.json）
# ドラフト（未コミット・レビュー用）。新規会場候補3件＋確度の低い会場推定1件あり（末尾コメント参照）。
