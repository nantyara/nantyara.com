- id: event-20191210-lush-beehap
  slug: 20191210-lush-beehap
  date: 2019-12-10 20:40:00 +0900
  title: ビーハプ（渋谷LUSH）
  site: 渋谷LUSH
  content: |
    渋谷LUSHでのライブイベント「ビーハプ（ビートハプニング）」。前日告知「明日はビーハプ！
    渋谷LUSHにて、18:30オープン！なんちゃらは20:40からでし！歌うぞ〜」（samami27、12/9
