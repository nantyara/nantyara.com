- id: event-20191201-shimonite-laguna
  slug: 20191201-shimonite-laguna
  date: 2019-12-01 17:45:00 +0900
  title: 下北沢「シモニテ」（下北沢Laguna枠）
  site: 下北沢Laguna
  content: |
    下北沢内の複数会場を回るサーキット企画「シモニテ」。なんちゃらは同日中に3ステージ
    出演したが、本文中で会場名・時刻まで確認できたのは下北沢Laguna枠のみ（他2ステージは
    会場名が本文に見当たらず未確定）。当日「アドベントカレンダーをいただいて、もう今日から
    ワクワクで最高だな。って思って起きたよ。シモニテ始まってます！」（samami27、12:51）に
    続き「次はラグーナサブステ！17:45頃から歌います！きたれ！」（samami27、16:08）と告知。
    同日「今日ライブ3本回しすごいなーと思うが、でもいうても下北沢内だし清算も一箇所だし。
    31日の、全部違うイベントで4本回しにくらべたらね！」（nantyaraidol）と3ステージ出演の
    事実が確認できる。終演後は「シモニテ1日中ありがとうございました！ゆっくり休んでね！
    すったもんだ踊り狂って楽しかった〜！」（samami27）、「下北沢ニテ、ありがとうございました！
    朝から晩まで3ステージ、全部違う場所、違う雰囲気、(ほぼ)違う曲でした。」（yokuwakan_nai）。

    ※Xの告知アーカイブから復元。他2ステージの会場は本文からは確定できず未転記。
  sources:
    - https://x.com/samami27/status/1201035335330697218
    - https://x.com/nantyaraidol/status/1201081655898755073
    - https://x.com/yokuwakan_nai/status/1201147371335274496

- id: event-20191202-lovetko
  slug: 20191202-lovetko
  date: 2019-12-02 20:00:00 +0900
  title: なんちゃらアイドル主催対バン（東新宿LOVE TKO）
  site: 東新宿LOVE TKO
  labels:
    - 主催ライブ
  acts:
    - ハーリー木村
    - スーサイドザムライワン
  content: |
    東新宿LOVE TKOでのなんちゃらアイドル主催対バン。前日「本日主催です！様々な理由により
    実現が難しかった奇跡の対バンなので、来ておいた方が良い」（yokuwakan_nai、12/1深夜）。
    当日は「手違いでもうオープンしてます！きて！」「オープンは早まりましたがスタートは
    同じですので！」と、予定より開場が早まったことを告知。タイムテーブルも投稿:
    「20時 スーサイドワン 15分／20時25分 ハーリー木村 20分／21時5分 なんちゃらアイドル
    35分／21時50分 ハーリー木村 20分」（nantyaraidol、19:25）。終演後は「ハーリーすごかった
    でしょ？なんちゃらの主催にハズレなし！」（nantyaraidol）。

    ※Xの告知アーカイブから復元。dateはタイムテーブル上の開演時刻(20:00)を採用（実際の開場は
    予定より早まった旨は本文参照）。「スーサイドザムライワン」は当日投稿では「スーサイドワン」
    と略記されている。
  sources:
    - https://x.com/nantyaraidol/status/1201447183540580353
    - https://x.com/yokuwakan_nai/status/1201396271182778369
    - https://x.com/nantyaraidol/status/1201512758719565827

