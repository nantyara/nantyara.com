# ⚠️ 日時はすべて post の time フィールド（UTC）を JST（+9h）に変換した上で「本日/今日/明日/
#   昨日/○日はこれ」等の指し示す日付を、announce/day-of/事後報告の3点を突合して確定している
#   （過去月で日付境界の変換ミスが発生した教訓を踏まえた運用）。
#   本ウィンドウでも実際に日付境界の罠を1件踏んだ: samami27の投稿
#   （status/1210978373838618624、UTC 2019-12-28T17:38:37=JST 2019-12-29 02:38）は
#   本文「明日は2現場！」だが、直前0:50 JSTのyokuwakan_naiの投稿「日付変わって本日2本
#   ライブ」および同日14:16 JST・17:16 JSTの当日進行/事後ポストと突合すると、指しているのは
#   投稿当日である12/29（未明にまだ寝ていない状態で「明日」と表現したとみられる）。
#   3点の日付表現が食い違う場合は「本日」明言＋日中の進行ポストを優先して確定した
#
# 特記事項（ユーザー提示の候補との照合結果）:
