- id: event-20180529-flat
  slug: 20180529-flat
  date: 2018-05-29 21:30:00 +0900
  title: なんちゃらアイドル主催「Ｑ太郎さん生誕祭」（西荻窪flat）
  site: 西荻窪flat
  labels:
    - 主催ライブ
  acts:
    - ドミンゴの塔
    - スキップカウズ
    - オセロケッツ
    - ザ・アイドルズ
  content: |
    西荻窪flatでのなんちゃらアイドル主催ライブ。運営Q太郎の誕生日を祝う企画。事前告知
    「5月29日の主催ライブ、井垣宏章&石塚明彦（太陽の塔）にミツゴロー（ドミンゴス）
    さんが加わり、ドミンゴの塔として出演していただけることに！加えて、スキップ
    カウズから遠藤さん、オセロケッツから森山さん！」。当日は「なんちゃらアイドル
    さんの運営のＱ太郎は今日が誕生日か〜。（略）なんちゃらアイドルさんはトリなので
    21:30から歌います」（yokuwakan_nai）と出番時刻を告知。イベント限定Tシャツ
    （中国製、S/M/L/XL）も販売。終演後は「打ち上げなうですがひとまずＱ太郎さん
    生誕祭@西荻窪flatありがとうございました！」（yokuwakan_nai）「本日の動員は
    91人！なんちゃら主催史上最多！」（nantyaraidol）と報告。

    ※Xの告知アーカイブから復元。事前情報にあった「5/29 西荻窪flat『Ｑ太郎さん生誕祭』」
    に該当。告知ポスト本文・事後報告から会場（西荻窪flat）・出番時刻（21:30・トリ）
