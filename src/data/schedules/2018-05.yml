  content: |
    三軒茶屋HEAVEN'S DOORでの対バンイベント『爆音サミット』（5/3・木・祝）。事前告知
    「５月３日(木祝)【爆音サミット】OPEN/START 14:30 adv./door 共￥2000(+2drink￥1000)
    16:50-17:20 なんちゃらアイドル みんな大好ききしぱんフードあるよ！かみつきマッド・
    ドッグとも初共演！」。当日朝にも「本日のライブはこちら！きしぱんさんがいるとのことで、
