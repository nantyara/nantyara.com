  title: 渋谷7th floor トークライブ「Beat Happening！緊急tasoミーティング！りのたそブレイク計画！」
  site: 渋谷7th floor
  content: |
    渋谷7th floorでのトークイベント「Beat Happening！『緊急tasoミーティング！りのたそ
    ブレイク計画！』」。事前告知「2018年5月8日（木）渋谷7th floor公演概要☆Beat
    Happening！『緊急tasoミーティング！りのたそブレイク計画！』なんちゃらは19時過ぎの
    トークショーにで出ます！」。楽曲パフォーマンスではなくトークショーへの出演。
    終演後は「本日は渋谷7th Floorにてトークしてきました！闇とか知らんし、病んでない
    ので、健やかなトークした！」（samami27）「渋谷7th floorありがとうございました！
    資本主義という病について5時間論じたりして楽しかったです。」（yokuwakan_nai）と感想。

    ※Xの告知アーカイブから復元。ライブ（楽曲披露）ではなくトークショー出演。出番時刻は
