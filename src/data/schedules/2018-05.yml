- id: event-20180512-nihonkai
  slug: 20180512-nihonkai
  date: 2018-05-12 12:00:00 +0900
  time_tbd: true
  title: 蒲田 寿司屋日本海「寿司ライブ」（毎日寿司チャレンジ50食達成）
  site: 寿司屋日本海
  content: |
    蒲田の寿司屋「日本海」を会場にした「寿司ライブ」（大田区蒲田復興協会関連企画）。
    前日告知「3月末から始まった、なんちゃらアイドル毎日寿司チャレンジ！寿司ライブ前日、
    つい先ほど、49食目を終えました。50食達成は明日みんなとしたい！」。当日は
    「蒲田日本海でのお寿司ライブありがとうございました！ピアノ弾いたよ！」
    （yokuwakan_nai）「OKFK寿司ライブありがとうございました！今日まで寿司づくし！
    初めてのピアノ伴奏ライブでした！ #大田区蒲田復興協会」（samami27）「0512 50食目！
    ライブ、ほんと大成功でした。満席！」（nantyaraidol）と事後報告。ピアノ伴奏形式の
    ライブで、3月末から続いた「毎日寿司チャレンジ」（連日寿司を食べる企画）が本イベントで
    50食に到達し、ひと区切りとなった。

    ※Xの告知アーカイブから復元。開演時刻の明示的な告知が見当たらないため time_tbd とした
